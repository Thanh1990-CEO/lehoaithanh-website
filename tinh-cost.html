<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tính cost chuyến xe – KHG</title><meta name="theme-color" content="#0F4C3A"><meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cost chuyến">
<link rel="manifest" href="/tinh-cost.webmanifest"><link rel="apple-touch-icon" href="/icons/cost-180.png"><link rel="icon" href="/icons/cost-192.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#C8102E;--ink:#141414;--ink2:#3A3A3A;--muted:#6B6B6B;--bg:#F4F4F2;--card:#fff;--line:#E4E1DE;--green:#1E7A4C;--amber:#B5651D;--blue:#1C5FA8;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.hidden{display:none!important}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:50}
.hd{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.hd img{width:38px;height:38px;border-radius:10px;flex:none}
.hd .nm{line-height:1.15;min-width:0}.hd .nm b{display:block;font-size:15px}.hd .nm span{font-size:12px;color:#C9C9C9;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.hd .sp{flex:1}
.hb{background:#2A2A2A;color:#fff;border:0;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.hb.a{background:var(--acc)}
.tabs{display:none}
nav.bot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{flex:1;background:none;border:0;padding:8px 2px 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;position:relative;cursor:pointer}
nav.bot button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bot button.on{color:var(--acc)}
nav.bot .dot{position:absolute;top:4px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
@media(min-width:900px){body{padding-bottom:24px}nav.bot{position:sticky;top:58px;bottom:auto;max-width:1100px;margin:0 auto;border:1px solid var(--line);border-radius:0 0 14px 14px}nav.bot button{flex-direction:row;justify-content:center;font-size:13.5px;padding:11px 6px}}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16.5px}
.card h3{margin:0 0 8px;font-size:15px}
h1.pg{font-size:20px;margin:2px 0 12px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
.i{width:100%;border:1px solid var(--line);background:#FBFAF9;border-radius:10px;padding:10px 12px;outline:none;min-height:44px}
.i:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px var(--soft)}
textarea.i{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.row.s1{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;min-height:44px;text-decoration:none;font-size:14.5px}
.btn.p{background:var(--acc);color:#fff}.btn.p:disabled{opacity:.55;cursor:not-allowed}
.btn.g{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.r{background:#FDECEC;color:#9B1C1C}
.btn.k{background:var(--green);color:#fff}
.btn.s{min-height:36px;padding:7px 11px;font-size:13px;border-radius:10px}
.btn.w{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.seg{display:flex;background:#ECE9E6;border-radius:10px;padding:3px;gap:3px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;font-weight:600;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex}.chips input{display:none}
.chips span{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;user-select:none}
.chips input:checked+span{border-color:var(--acc);background:var(--soft);color:var(--acc);font-weight:700}
.grp{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.3px}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.kp{grid-template-columns:repeat(4,1fr)}}
.kp div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kp small{display:block;color:var(--muted);font-size:12px}.kp b{font-size:19px;display:block;margin-top:2px}.kp em{font-style:normal;font-size:11.5px;color:var(--muted)}
.kp .hl{background:var(--soft);border-color:transparent}.kp .hl b{color:var(--acc)}
.list{display:grid;gap:10px}
@media(min-width:900px){.list.two{grid-template-columns:1fr 1fr}}
.it{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.it .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.it .t b{font-size:15px}
.it .m{font-size:13px;color:var(--ink2);margin-top:4px}
.it .m div{margin-top:2px}
.it .pr{font-size:18px;font-weight:800;color:var(--acc);white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:#EFEFEF;color:#555;white-space:nowrap}
.pill.green{background:#E5F4EC;color:var(--green)}.pill.amber{background:#FBEFE3;color:var(--amber)}.pill.red{background:#FDECEC;color:#B42318}.pill.blue{background:#E6EEF8;color:var(--blue)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.warn{background:#FFF7E8;border:1px solid #F3D9A8;border-radius:12px;padding:12px;font-size:13.5px;margin-bottom:14px}
.err{background:#FDECEC;color:#9B1C1C;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:200;max-width:92vw;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.sheet .bx{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .bx{border-radius:18px}}
.sheet h3{margin:0 0 8px;font-size:17px}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th,table.t td{padding:7px 6px;border-bottom:1px solid #EFECE9;text-align:left}table.t .n{text-align:right;white-space:nowrap}
.tw{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:8px}
.bars i{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.files a{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--ink2);font-size:11px;background:#FAFAFA}
.files img{width:100%;height:76px;object-fit:cover;display:block}.files span{display:block;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files .x{height:76px;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.doc .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.doc .ic.ok{background:#E5F4EC;color:var(--green)}.doc .ic.no{background:#F1EFEE;color:var(--muted)}
.doc div{flex:1;min-width:0}.doc small{display:block;color:var(--muted);font-size:12px}
.steps{display:flex;gap:4px;margin:8px 0 4px}.steps i{flex:1;height:6px;border-radius:3px;background:#E4E0DD}.steps i.on{background:var(--acc)}
.stl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);gap:4px}.stl span{flex:1;text-align:center}
.auth{max-width:460px;margin:0 auto}
.hp{position:absolute;left:-5000px;width:1px;height:1px;opacity:0}
.foot{max-width:1100px;margin:6px auto 0;padding:0 16px 22px;color:var(--muted);font-size:12px;text-align:center}
#nl-badge-frame{bottom:calc(70px + env(safe-area-inset-bottom))!important}
/* chuông */
.kring{position:fixed;inset:0;z-index:400;background:rgba(200,16,46,.92);display:grid;place-items:center;padding:20px;animation:krp 1s infinite}
@keyframes krp{0%,100%{background:rgba(200,16,46,.92)}50%{background:rgba(120,0,20,.95)}}
.kr-bx{background:#fff;border-radius:20px;padding:22px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.kr-bx b{display:block;font-size:19px;margin:6px 0}.kr-bx p{margin:0 0 14px;color:var(--ink2)}
.kr-ic{font-size:54px;animation:krs .5s infinite alternate}@keyframes krs{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
/* điện thoại: chống iOS phóng to khi nhập, nút to dễ bấm */
@media(max-width:900px){.i,select.i,textarea.i,input,select,textarea{font-size:16px!important}.btn{min-height:46px}.btn.s{min-height:40px}}
.next{background:linear-gradient(120deg,var(--acc),#0b3b6b);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.next small{opacity:.85;display:block}.next b{display:block;font-size:18px;margin:4px 0 10px}.next .btn{background:#fff;color:var(--acc)}

/* ===== Hồ sơ xác thực (KYC) ===== */
.kst{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13.5px}
.kst b{display:block;font-size:15px}.kst.amber{background:#FFF7E8;border:1px solid #F3D9A8}.kst.green{background:#E5F4EC;border:1px solid #BFE3CF}.kst.red{background:#FDECEC;border:1px solid #F5C2C2}.kst.blue{background:var(--soft);border:1px solid transparent}
.kbar{height:8px;background:#EEE;border-radius:99px;overflow:hidden;margin:8px 0 2px}.kbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.kg{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:14px 0 6px}
.ki{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0EEEC}
.ki .c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.ki .c.ok{background:#E5F4EC;color:var(--green)}.ki .c.no{background:#FDECEC;color:var(--red)}
.ki .t{flex:1;min-width:0}.ki .t b{display:block;font-size:14px}.ki .t small{color:var(--muted);font-size:12px}
.ki .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kthumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.kthumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
/* camera */
.kcam{position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column;color:#fff}
.kcam-top{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}.kcam-top b{flex:1;font-size:15px}
.kcam-top button{background:#333;color:#fff;border:0;border-radius:999px;width:36px;height:36px;font-size:16px}
.kcam-v{flex:1;position:relative;overflow:hidden;display:grid;place-items:center}
.kcam-v video{width:100%;height:100%;object-fit:cover}.kcam-v video.mir{transform:scaleX(-1)}
.kcam-oval{position:absolute;width:64vmin;height:82vmin;max-width:340px;max-height:430px;border:3px dashed rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.kcam-oval.doc{border-radius:14px;width:86vmin;height:56vmin;max-width:520px;max-height:340px}
.kcam-msg{position:absolute;top:16px;left:12px;right:12px;text-align:center;font-size:19px;font-weight:800;text-shadow:0 2px 8px #000}
.kcam-cd{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:52px;font-weight:800;text-shadow:0 2px 10px #000}
.kcam-bot{padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;background:#111}
.kcam-bot .btn{min-width:150px}
.kcam-shots{display:flex;gap:6px;position:absolute;bottom:90px;left:10px}.kcam-shots img{width:48px;height:60px;object-fit:cover;border-radius:6px;border:2px solid #fff}
/* chữ ký */
.ksig{position:fixed;inset:0;background:#fff;z-index:300;display:flex;flex-direction:column}
.ksig .hd2{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line);font-weight:700}
.ksig .pad{flex:1;position:relative;margin:12px;border:2px dashed #C9C4BF;border-radius:14px;touch-action:none;background:#FFFEFB}
.ksig canvas{position:absolute;inset:0;width:100%;height:100%}
.ksig .ln{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1.5px solid #D5D0CA;pointer-events:none}
.ksig .ln span{position:absolute;left:0;top:6px;font-size:12px;color:#A39E98}
.ksig .ft{display:flex;gap:10px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.kdoc{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:#FBFAF9;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:46vh;overflow:auto}
.kchk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13.5px}.kchk input{width:20px;height:20px;margin-top:2px;flex:none}
.khash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all;color:var(--muted)}
.nt{border-left:4px solid var(--acc)}.nt.unread{background:#F5F9FF}.nt.vp{border-left-color:var(--red)}
.locbar{background:#FFF7E8;border:1px solid #F3D9A8;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center}

:root{--acc:#0F4C3A;--soft:#ECF5F1}
main{max-width:980px}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.sec h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}.sec h3 small{font-weight:500;color:var(--muted);font-size:12px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 10px}
.fld label{display:block;font-size:12px;color:#4B5563;font-weight:600;margin-bottom:3px}.fld input,.fld select{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-size:15px;background:#fff;box-sizing:border-box}
.fld .hint{font-size:11.5px;color:var(--muted);margin-top:2px;min-height:14px}.fld input.auto{background:#F6FBF8;color:#0F4C3A}
.vt{display:flex;gap:6px;flex-wrap:wrap}.vt label{cursor:pointer}.vt input{display:none}.vt span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px;background:#fff}.vt input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.xrow{display:grid;grid-template-columns:1.4fr 1fr 34px;gap:6px;margin:5px 0}.xrow input{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 9px;font:inherit;font-size:14px;min-width:0}.xrow button{border:0;background:transparent;color:#B91C1C;font-size:18px}
.res{position:sticky;top:8px}.ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}.ln b{font-variant-numeric:tabular-nums}.ln span small{color:var(--muted)}
.ln.t{font-size:16px;border-bottom:0;padding-top:9px}.ln.big{font-size:20px;color:var(--acc)}
.pr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.pr div{border-radius:12px;padding:10px;text-align:center;border:1px solid var(--line)}.pr div small{display:block;font-size:11.5px;color:var(--muted)}.pr div b{font-size:17px;font-variant-numeric:tabular-nums}
.pr .lo{background:#FEF2F2}.pr .md{background:#ECF5F1;border-color:#0F4C3A}.pr .hi{background:#EFF6FF}
.mg{display:flex;align-items:center;gap:10px;margin:8px 0}.mg input[type=range]{flex:1;accent-color:#0F4C3A}.mg input[type=number]{width:80px;height:40px;border:1px solid var(--line);border-radius:10px;text-align:center;font:inherit;font-size:16px;font-weight:700}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}@media(max-width:820px){.two{grid-template-columns:1fr}.res{position:static}}
.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts2 .btn{flex:1}
.his{font-size:13px}.his div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
.quick{border:2px solid var(--acc);background:linear-gradient(180deg,#F3FAF6,#fff)}
.big2{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}.kp>div{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff}.kp>div small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}.kp>div b{font-size:18px;font-variant-numeric:tabular-nums}
.kp .ok{background:#ECF5F1;border-color:#0F4C3A}.kp .ok b{color:#0F4C3A}.kp .dn b{color:#B91C1C}.kp .ref b{color:#1D4ED8}
.advice{border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55;margin:8px 0}.advice.g{background:#ECF5F1;color:#0F4C3A}.advice.w{background:#FFF4E5;color:#8a4b00}.advice.r{background:#FEF2F2;color:#991B1B}
details.sec>summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}details.sec>summary::-webkit-details-marker{display:none}details.sec>summary:after{content:'▾';margin-left:auto;color:var(--muted)}details.sec[open]>summary{margin-bottom:8px}
.dep{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.dep div{background:#F6FBF8;border-radius:10px;padding:8px;text-align:center}.dep div small{display:block;font-size:11px;color:var(--muted)}.dep div b{font-size:14.5px;font-variant-numeric:tabular-nums}
.closeP{display:flex;gap:8px;align-items:center;margin:8px 0}.closeP>span{flex:0 0 150px;line-height:1.3}.closeP input{flex:1;height:44px;border:2px solid var(--acc);border-radius:10px;padding:0 12px;font:inherit;font-size:18px;font-weight:800;text-align:right}

async function shrink(file,max=1600){
  if(!/^image\//.test(file.type)||/gif|svg/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file}catch(e){return file}}
const safeName=n=>String(n||'file').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w.-]+/g,'-').slice(-60);
async function putFile(prefix,file){const f=await shrink(file);const path=`${prefix}/${Date.now()}-${safeName(f.name)}`;
  const {error}=await sb.storage.from('khg-files').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(error)throw new Error(error.message);return {path,name:f.name,mime:f.type,size:f.size}}
async function signedMap(paths){if(!paths.length)return {};const {data}=await sb.storage.from('khg-files').createSignedUrls(paths,3600);const m={};(data||[]).forEach(x=>{if(x.signedUrl)m[x.path]=x.signedUrl});return m}
async function fileGrid(files){const u=await signedMap(files.map(f=>f.file_path));return `<div class="files">${files.map(f=>{const url=u[f.file_path]||'#';return `<a href="${url}" target="_blank" rel="noopener">${/^image/.test(f.mime||'')||/\.(jpe?g|png|webp)$/i.test(f.file_path)?`<img src="${url}" alt="" loading="lazy">`:`<div class="x">${esc((f.file_path.split('.').pop()||'').toUpperCase())}</div>`}<span>${esc(DOCT[f.doc_type]||f.doc_type)}</span></a>`}).join('')}</div>`}

// ================= Chuông báo lớn, kêu lặp + rung + thông báo hệ thống =================
const KRing=(()=>{let ac=null,timer=null,el=null,cnt=0;
  const unlock=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}};
  ['touchstart','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
  const beep=()=>{if(!ac)return;try{const t=ac.currentTime;[[988,0],[740,.2],[988,.4],[740,.6],[1175,.8]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.7,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.19)})}catch(e){}};
  function stop(){clearInterval(timer);timer=null;if(el){el.remove();el=null}try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
  function start(title,body,onOpen){stop();unlock();el=document.createElement('div');el.className='kring';
    el.innerHTML=`<div class="kr-bx"><div class="kr-ic">🔔</div><b>${esc(title||'Có thông báo mới')}</b><p>${esc(body||'')}</p><button class="btn p w" data-o>Xem ngay</button><button class="btn g w" data-x style="margin-top:8px">Tắt chuông</button></div>`;
    document.body.appendChild(el);el.querySelector('[data-o]').onclick=()=>{stop();onOpen&&onOpen()};el.querySelector('[data-x]').onclick=stop;
    cnt=0;beep();try{navigator.vibrate&&navigator.vibrate([500,200,500,200,900])}catch(e){}
    timer=setInterval(()=>{beep();cnt++;if(cnt%2===0)try{navigator.vibrate&&navigator.vibrate([500,200,500])}catch(e){}if(cnt>80)stop()},1500);
    try{if('Notification' in window&&Notification.permission==='granted'&&document.visibilityState!=='visible'){const o={body:body||'',vibrate:[500,200,500],requireInteraction:true,tag:'khg-ring',renotify:true};
      (navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration():Promise.resolve(null)).then(r=>r?r.showNotification(title,o):new Notification(title,o)).catch(()=>{})}}catch(e){}}
  function askNotif(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
  // theo dõi tín hiệu mới (khg_ping) và rung chuông khi có thay đổi
  function watch(onOpen,onCount,ms=20000){let last=null;const key='kring_k_'+location.pathname;try{const v=localStorage.getItem(key);last=v?Number(v):null}catch(e){}
    const tick=async()=>{try{const {data:p}=await sb.rpc('khg_ping');if(!p)return;onCount&&onCount(p.n||0);
      if(last!==null&&Number(p.k)>last)start(p.msg||'Có thông báo mới',p.n?('Bạn có '+p.n+' mục cần xem'):'',onOpen);
      last=Number(p.k);try{localStorage.setItem(key,String(last))}catch(e){}}catch(e){}};
    tick();setInterval(tick,ms);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick()});
    document.addEventListener('pointerdown',function f(){askNotif();document.removeEventListener('pointerdown',f)},{once:true})}
  return {start,stop,watch,askNotif,unlock}})();

}

  return [ty?ty.toLocaleString('vi-VN')+' tỷ':'',tr?tr+' triệu':'',ng?ng+' nghìn':'',d?d+' đồng':''].filter(Boolean).join(' ')}
function parse(v){let s=String(v||'').trim().toLowerCase().replace(/\s/g,'');if(!s)return null;
  let m=s.match(/^(\d+)(?:tr|trieu|m)(\d{0,3})$/);if(m)return +m[1]*1e6+(m[2]?+(m[2]+'00').slice(0,3)*1e3:0);

  m=s.match(/^(\d+(?:[.,]\d+)?)(ty|tỷ|b)$/);if(m)return Math.round(parseFloat(m[1].replace(',','.'))*1e9);
  const d=s.replace(/[.,](?=\d{3}(\D|$))/g,'').replace(',','.');const x=parseFloat(d);return isNaN(x)?null:x}

  inp.addEventListener('input',upd);upd()}
const RE=/(amount|price|cost|fee_|revenue|salary|budget|value_est|target)|(^|[_\s])(gia|tien|cuoc|luong)([_\s]|$)/i;

window.KMONEY={attach,parse,words};
})();

const getPos=(ms=8000)=>new Promise(r=>{if(!navigator.geolocation)return r(null);let done=false;const t=setTimeout(()=>{if(!done){done=true;r(null)}},ms);

function camSession({facing='user',title='',oval='face'}){
  return new Promise(async(res,rej)=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return rej(new Error(camErr));
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false})}catch(e){return rej(new Error(camErr))}
    const d=document.createElement('div');d.className='kcam';
    d.innerHTML=`<div class="kcam-top"><b>${esc(title)}</b><button class="kx" aria-label="Đóng">✕</button></div><div class="kcam-v"><video playsinline autoplay muted class="${facing==='user'?'mir':''}"></video><div class="kcam-oval ${oval==='doc'?'doc':''}"></div><div class="kcam-msg"></div><div class="kcam-cd"></div><div class="kcam-shots"></div></div><div class="kcam-bot"></div>`;
    document.body.appendChild(d);const video=d.querySelector('video');video.srcObject=stream;
    const close=()=>{stream.getTracks().forEach(t=>t.stop());d.remove()};
    d.querySelector('.kx').onclick=()=>{close();d._cancel&&d._cancel()};
    await new Promise(r=>{video.onloadedmetadata=()=>r();setTimeout(r,2500)});try{await video.play()}catch(e){}
    res({d,video,close,mirror:facing==='user',msg:t=>d.querySelector('.kcam-msg').textContent=t,cd:t=>d.querySelector('.kcam-cd').textContent=t,bot:h=>{d.querySelector('.kcam-bot').innerHTML=h;return d.querySelector('.kcam-bot')}});
  });
}
function grab(S,label){const v=S.video,w=v.videoWidth||640,h=v.videoHeight||480,k=Math.min(1,1280/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  const g=c.getContext('2d');if(S.mirror){g.translate(c.width,0);g.scale(-1,1)}g.drawImage(v,0,0,c.width,c.height);g.setTransform(1,0,0,1,0,0);
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,c.height-30,c.width,30);g.fillStyle='#fff';g.font='15px sans-serif';g.fillText('KHG · '+(label||'')+' · '+new Date().toLocaleString('vi-VN'),10,c.height-10);
  return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.86))}

function signPad(name){return new Promise(res=>{const d=document.createElement('div');d.className='ksig';

  document.body.appendChild(d);const pad=d.querySelector('.pad'),c=d.querySelector('canvas');const dpr=window.devicePixelRatio||1;
  const fit=()=>{c.width=pad.clientWidth*dpr;c.height=pad.clientHeight*dpr;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)};fit();
  const g=c.getContext('2d');let drawing=false,last=null,len=0,minX=1e9,minY=1e9,maxX=0,maxY=0;
  const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]};
  c.onpointerdown=e=>{drawing=true;last=pt(e);c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!drawing)return;const p=pt(e);g.strokeStyle='#0B2A6B';g.lineWidth=2.6*dpr;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();
    len+=Math.hypot(p[0]-last[0],p[1]-last[1]);minX=Math.min(minX,p[0]);minY=Math.min(minY,p[1]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1]);last=p};
  c.onpointerup=c.onpointercancel=()=>{drawing=false};
  d.querySelector('[data-c]').onclick=()=>{fit();len=0;minX=minY=1e9;maxX=maxY=0};
  d.querySelector('[data-x]').onclick=()=>{d.remove();res(null)};
  d.querySelector('[data-ok]').onclick=()=>{if(len<120*dpr)return toast('Chữ ký quá ngắn – ký rõ họ tên hoặc chữ ký thường dùng');
    const pd=16*dpr,x=Math.max(0,minX-pd),y=Math.max(0,minY-pd),w=Math.min(c.width,maxX+pd)-x,h=Math.min(c.height,maxY+pd)-y;const o=document.createElement('canvas');o.width=w;o.height=h+26*dpr;
    const og=o.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,o.width,o.height);og.drawImage(c,x,y,w,h,0,0,w,h);og.fillStyle='#555';og.font=(11*dpr)+'px sans-serif';og.fillText((name||'')+' · '+new Date().toLocaleString('vi-VN'),6*dpr,h+18*dpr);

  if(dA!=null&&tot&&dA/tot>X.cap+0.0005)adv+=`<div class="advice r">👷 Lương tài xế thực tế ${fmtN(dA)} = ${vn(dA/tot*100)}% cost – vượt trần ${vn(X.cap*100)}%.</div>`;
  if(big.length)adv+=`<div class="advice w">📌 Lệch trên 15%: <b>${big.map(esc).join(', ')}</b> → nên chỉnh lại định mức/biểu phí trong CRM để lần sau tạm tính sát hơn.</div>`;
  if(any&&price&&l1/price*100<(Number(S.mmin)||5))adv+=`<div class="advice r">Lãi thực tế ${vn(l1/price*100)}% thấp hơn lãi tối thiểu – tuyến này cần báo giá cao hơn: <b>${fmtN(r10(tot/(1-(X.m||15)/100)))}</b> để đạt lãi ${vn(X.m||15)}%.</div>`;
  $('#aAdv').innerHTML=adv}
async function saveTC(){const X=LAST;if(!X||!X.km1)return toast('Nhập tuyến hoặc km trước khi lưu');const c=X.c;const lines=[...X.L,{k:'over',l:'Chi phí chung',v:X.ovA}].map(x=>({k:x.k,l:x.l,est:R(x.v),act:N(S.act[x.k]),d:x.d||null}));
  const actT=lines.some(x=>x.act!=null)?lines.reduce((s,x)=>s+(x.act??x.est),0):null;let order_id=null;
  if(S.ocode){const {data:o}=await sb.from('khg_orders').select('id,customer_id').ilike('code',S.ocode).maybeSingle();if(o)order_id=o.id;else toast('Không thấy đơn '+S.ocode+' – vẫn lưu phiếu')}
  const row={origin:S._a||null,dest:S._b||null,km_one:X.km1,km_total:X.kmT,ret:S.ret,vehicle_code:c.code,vehicle_id:S.veh||null,fuel_type:X.fuel,tolls:TOLL_INFO?{g:X.tl.g,v:X.tollV,L:X.tl.L}:null,lines,
    compare:{km:X.km1,rows:CP.filter(x=>S.cat==='all'||x.category===S.cat).map(x=>{const Y=x.code===S.vt?X:core(x,false);return {code:x.code,cost:R(Y.cost1)}})},cost_est:R(X.cost1),cost_act:actT==null?null:R(actT),margin_pct:X.m,price:X.close||null,price_act:N(S.actPrice),order_id,
    note:JSON.stringify({S:{...S,act:undefined,extra:S.extra},route:ROUTE})};
  const q=S.tcId?sb.from('khg_trip_costs').update({...row,updated_at:new Date().toISOString()}).eq('id',S.tcId).select('id,code').single():sb.from('khg_trip_costs').insert(row).select('id,code').single();
  const {data,error}=await q;if(error)return toast('Lỗi lưu: '+error.message);if(!data)return toast('Đã lưu');S.tcId=data.id;S.tcCode=data.code;toast('Đã lưu phiếu '+data.code);await loadDBH();act();his()}
async function loadDBH(){try{const {data}=await sb.from('khg_trip_costs').select('id,code,origin,dest,km_one,vehicle_code,cost_est,cost_act,price,price_act,lines,note,created_at').is('archived_at',null).order('created_at',{ascending:false}).limit(30);DBH=data||[]}catch(e){DBH=[]}}
function his(){const el=$('#his');if(!el)return;
  el.innerHTML=DBH.length?DBH.map((h,i)=>{const lb=(CP.find(x=>x.code===h.vehicle_code)||{}).label||h.vehicle_code;const d=h.cost_act!=null?h.cost_act-h.cost_est:null;return `<div data-h="${i}"><span><b>${esc(h.code||'')}</b> · ${esc(lb)} · ${esc(String(h.origin||'?').split(',')[0])} → ${esc(String(h.dest||'?').split(',')[0])} · ${fmtN(h.km_one)} km<br><small class="mut">${new Date(h.created_at).toLocaleString('vi-VN')}${h.cost_act!=null?' · đã nhập thực tế':''}</small></span><span style="text-align:right">cost ${fmtN(h.cost_est)}${d!=null?`<br><small style="color:${d>0?'#B91C1C':'#15803D'}">thực tế ${d>0?'+':''}${fmtN(d)}</small>`:''}<br><b>${fmtN(h.price_act||h.price)}</b></span></div>`}).join(''):'<span class="mut">Chưa có. Bấm “Lưu phiếu” sau khi tính.</span>';
  $$('[data-h]').forEach(d=>d.onclick=()=>{const h=DBH[+d.dataset.h];let n={};try{n=JSON.parse(h.note||'{}')}catch(e){}if(n.S)Object.assign(S,n.S);S.act={};(h.lines||[]).forEach(x=>{if(x.act!=null)S.act[x.k]=fmtN(x.act)});S.actPrice=h.price_act?fmtN(h.price_act):'';S.tcId=h.id;S.tcCode=h.code;ROUTE=n.route||null;TOLL_INFO=null;
    if(h.lines){const t=h.lines.find(x=>x.k==='toll');if(t&&n.route&&S.toll==='')S.toll=fmtN(t.est)}QTK='';draw();window.scrollTo({top:0,behavior:'smooth'})})}
boot();
