async function shrink(file,max=1600){
  if(!/^image\//.test(file.type)||/gif|svg/.test(file.type))return file;

async function signedMap(paths){if(!paths.length)return {};const {data}=await sb.storage.from('khg-files').createSignedUrls(paths,3600);const m={};(data||[]).forEach(x=>{if(x.signedUrl)m[x.path]=x.signedUrl});return m}
async function fileGrid(files){const u=await signedMap(files.map(f=>f.file_path));return `<div class="files">${files.map(f=>{const url=u[f.file_path]||'#';return `<a href="${url}" target="_blank" rel="noopener">${/^image/.test(f.mime||'')||/\.(jpe?g|png|webp)$/i.test(f.file_path)?`<img src="${url}" alt="" loading="lazy">`:`<div class="x">${esc((f.file_path.split('.').pop()||'').toUpperCase())}</div>`}<span>${esc(DOCT[f.doc_type]||f.doc_type)}</span></a>`}).join('')}</div>`}

function authBox(mode){const reg=mode==='up';
  $('#authBox').innerHTML=`<div class="seg"><button data-m="in" class="${reg?'':'on'}">Tài xế đăng nhập</button><button data-m="up" class="${reg?'on':''}">Tài xế đăng ký</button></div>

    <label class="f">Mật khẩu *</label><input class="i" type="password" id="aPw" minlength="6" required autocomplete="${reg?'new-password':'current-password'}" placeholder="Tối thiểu 6 ký tự">
    ${reg?`<label class="f">Hạng bằng lái đang có *</label>${chips('aLic',LIC)}<details style="margin-top:6px"><summary class="note">Bằng cấp trước 2025 (B2, C, E, FC…)</summary>${chips('aLic',LIC_OLD)}</details>
     <label class="f">Khu vực muốn nhận việc</label>${chips('aProv',PROV)}<label class="f">Hình thức muốn nhận</label>${chips('aMode',MODE)}`:''}
    <button class="btn p w" style="margin-top:14px" id="aGo">${reg?'Đăng ký tài xế':'Đăng nhập'}</button><div id="aErr"></div><p class="note" style="margin-top:8px">Quên mật khẩu? Gọi 0399 831 228.</p></form>`;
  $$('#authBox .seg button').forEach(b=>b.onclick=()=>authBox(b.dataset.m));
  $('#af').onsubmit=async e=>{e.preventDefault();$('#aErr').innerHTML='';const phone=normPhone($('#aPhone').value),pw=$('#aPw').value;
    if(phone.length<9)return $('#aErr').innerHTML='<div class="err">Số điện thoại không hợp lệ</div>';
    await busy($('#aGo'),async()=>{
      if(reg){const lic=picked($('#af'),'aLic');if(!lic.length){$('#aErr').innerHTML='<div class="err">Chọn hạng bằng lái</div>';return}
        const r=await fetch(SUPABASE_URL+'/functions/v1/khg-public',{method:'POST',headers:{'content-type':'application/json',apikey:SUPABASE_ANON_KEY},body:JSON.stringify({action:'fd_register',hp:$('#aHp').value,phone,password:pw,name:$('#aName').value,license_class:lic,province:picked($('#af'),'aProv')[0]||'',modes:picked($('#af'),'aMode'),ref:qs('ref')})});
        const j=await r.json();if(!r.ok||j.error){$('#aErr').innerHTML=`<div class="err">${esc(j.error||'Không đăng ký được')}</div>`;return}}

      await boot(reg)})};
}

async function boot(fresh){
  try{D=await rpc('khg_fd_me')}catch(e){await sb.auth.signOut();landing('in');toast('Tài khoản này không phải tài khoản tài xế Fast Driver.',5000);return}
  $('#hName').textContent=`${D.code} · ${D.full_name}`;$('#nav').classList.remove('hidden');$('#hOut').classList.remove('hidden');
  $('#hOut').onclick=async()=>{await sb.auth.signOut();D=null;location.hash='';landing()};
  await loadVT();const h=location.hash.slice(1);if(!fresh&&route())return;go(fresh||D.status==='cho_ho_so'?'profile':(TABS.some(t=>t[0]===h)?h:'jobs'));
}

const TOPIC={nghe:'Trách nhiệm nghề',giao_nhan:'Giao nhận – chứng từ',xep_do:'Xếp dỡ – tải trọng',an_toan:'An toàn – biển báo',su_co:'Xử lý sự cố',hanh_khach:'Vận tải hành khách',quy_trinh:'Quy trình KHG'};
const LINK=(h,q='')=>location.origin+location.pathname+q+(h?'#'+h:'');
async function shareLink(url,text){try{if(navigator.share){await navigator.share({title:'Fast Driver – KIM HOÀNG GIA',text,url});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text+' '+url);toast('Đã sao chép link – dán vào Zalo/Facebook')}catch(e){prompt('Sao chép link:',url)}}
let QZ=null;
async function quiz(mode,kind){ // mode: 'practice' | 'exam'
  kind=kind||'hang';
  let qs,exam=null;
  if(mode==='exam'){exam=await rpc('khg_fd_exam_start',{p_kind:kind});qs=exam.questions}
  else qs=await rpc('khg_quiz_practice',{p_kind:kind,p_n:20});
  QZ={mode,kind,exam,qs,ans:new Array(qs.length).fill(null),i:0,done:false,end:exam?new Date(exam.expires_at).getTime():0};
  $('#nav').classList.add('hidden');drawQ();
  if(exam){clearInterval(window._qt);window._qt=setInterval(()=>{const s=Math.max(0,Math.round((QZ.end-Date.now())/1000));const t=$('#qTime');if(t)t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(!s&&!QZ.done){clearInterval(window._qt);submitQ(true)}},1000)}
}
function drawQ(){const Z=QZ,q=Z.qs[Z.i],a=Z.ans[Z.i],ex=Z.mode==='exam',show=!ex&&a!=null;
  $('#main').innerHTML=`<div class="card" style="position:sticky;top:58px;z-index:5;padding:10px 14px;display:flex;align-items:center;gap:10px"><b style="flex:1">${ex?'Bài thi chính thức':'Ôn tập'} · Câu ${Z.i+1}/${Z.qs.length}</b>${ex?'⏱ <b id="qTime" style="color:var(--red)">30:00</b>':''}<button class="btn g s" id="qQuit">Thoát</button></div>
   <div class="card">${q.critical?'<span class="pill red">Câu điểm liệt – sai là trượt</span>':''}${!ex&&q.topic?` <span class="pill">${esc(TOPIC[q.topic]||'')}</span>`:''}
    ${q.image_svg?`<div style="max-width:420px;margin:10px auto">${q.image_svg}</div>`:''}<h3 style="font-size:17px;line-height:1.4;margin:10px 0">${esc(q.question)}</h3>
    <div class="list">${q.options.map((o,k)=>{let st='';if(show){if(k===q.correct)st='background:#E5F4EC;border-color:var(--green)';else if(k===a)st='background:#FDECEC;border-color:#B42318'}else if(a===k)st='background:var(--soft);border-color:var(--acc)';
      return `<button class="it" data-k="${k}" style="text-align:left;cursor:pointer;font:inherit;${st}"><b>${String.fromCharCode(65+k)}.</b> ${esc(o)}</button>`}).join('')}</div>
    ${show?`<div class="${a===q.correct?'warn':'err'}" style="margin-top:10px"><b>${a===q.correct?'✓ Chính xác':'✗ Chưa đúng – đáp án '+String.fromCharCode(65+q.correct)}</b><br>${esc(q.explanation||'')}</div>`:''}
    <div class="btns"><button class="btn g" id="qPrev" ${Z.i?'':'disabled'}>← Câu trước</button>${Z.i<Z.qs.length-1?'<button class="btn p" id="qNext" style="flex:1">Câu tiếp →</button>':`<button class="btn p" id="qSub" style="flex:1">${ex?'Nộp bài':'Xem kết quả'}</button>`}</div></div>
   <div class="card"><div class="note" style="margin-bottom:6px">Đã trả lời ${Z.ans.filter(x=>x!=null).length}/${Z.qs.length}</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px">${Z.qs.map((x,k)=>`<button data-j="${k}" class="btn s ${Z.ans[k]!=null?'p':'g'}" style="min-height:34px;padding:0;${k===Z.i?'outline:2px solid var(--ink)':''}">${k+1}</button>`).join('')}</div>
    ${ex?'':`<button class="btn g w" style="margin-top:10px" id="qSub2">Kết thúc & xem kết quả</button>`}</div>`;
  $$('[data-k]').forEach(b=>b.onclick=()=>{if(show)return;Z.ans[Z.i]=+b.dataset.k;if(ex&&Z.i<Z.qs.length-1){Z.i++};drawQ()});
  $$('[data-j]').forEach(b=>b.onclick=()=>{Z.i=+b.dataset.j;drawQ()});
  $('#qPrev').onclick=()=>{Z.i--;drawQ()};if($('#qNext'))$('#qNext').onclick=()=>{Z.i++;drawQ()};
  const sub=()=>{const left=Z.ans.filter(x=>x==null).length;if(left&&!confirm(`Còn ${left} câu chưa trả lời. ${ex?'Nộp bài':'Kết thúc'}?`))return;submitQ()};
  if($('#qSub'))$('#qSub').onclick=sub;if($('#qSub2'))$('#qSub2').onclick=sub;
  $('#qQuit').onclick=()=>{if(confirm(ex?'Thoát sẽ hủy lượt thi này (vẫn tính 1 lượt). Thoát?':'Thoát ôn tập?')){clearInterval(window._qt);QZ=null;afterQuiz()}};
  window.scrollTo(0,0);
}
async function submitQ(auto){const Z=QZ;Z.done=true;clearInterval(window._qt);let r;
  if(Z.mode==='exam'){r=await rpc('khg_fd_exam_submit',{p_exam:Z.exam.exam_id,p_answers:Z.ans.map(x=>x==null?-1:x)})}
  else{const rev=Z.qs.map((q,k)=>({...q,chosen:Z.ans[k]}));r={score:rev.filter(x=>x.chosen===x.correct).length,total:rev.length,critical_wrong:rev.filter(x=>x.critical&&x.chosen!==x.correct).length,review:rev};r.passed=!r.critical_wrong&&r.score>=Math.ceil(r.total*.9)}
  const wrong=r.review.filter(x=>x.chosen!==x.correct);
  $('#main').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">${r.passed?'🎉':'📘'}</div><h2 style="margin:4px 0">${r.score}/${r.total} câu đúng</h2>
    <div class="${r.passed?'warn':'err'}" style="text-align:left">${Z.mode==='exam'?(r.passed?'<b>ĐẠT bài thi lý thuyết.</b> '+(D&&D.status==='cho_xet_duyet'?'KHG sẽ hoàn tất duyệt hồ sơ cho bạn.':'Bạn đã có thể nhận việc phù hợp hạng bằng.'):`<b>CHƯA ĐẠT.</b> Cần đúng tối thiểu ${r.total-3}/${r.total} câu và không sai câu điểm liệt${r.critical_wrong?` (bạn sai ${r.critical_wrong} câu điểm liệt)`:''}${r.late?' – nộp bài quá giờ':''}. Hãy ôn tập rồi thi lại (tối đa 3 lượt/24 giờ).`):(r.passed?'Kết quả ôn tập tốt! Sẵn sàng thi chính thức.':'Hãy xem lại các câu sai bên dưới và ôn thêm.')}</div>
    <div class="btns" style="justify-content:center"><button class="btn p" id="rAgain">${Z.mode==='exam'?'Ôn tập thêm':'Ôn tiếp 20 câu'}</button><button class="btn g" id="rBack">Về trang chính</button></div></div>
   ${wrong.length?`<h3 style="margin:14px 0 8px">Câu trả lời sai (${wrong.length})</h3>`:''}<div class="list">${wrong.map(q=>`<div class="it">${q.critical?'<span class="pill red">Điểm liệt</span>':''}${q.image_svg?`<div style="max-width:300px;margin:6px 0">${q.image_svg}</div>`:''}<b>${esc(q.question)}</b>
     <div class="m">${q.chosen!=null&&q.chosen>=0?`<div style="color:#B42318">✗ Bạn chọn: ${esc(q.options[q.chosen])}</div>`:'<div style="color:#B42318">✗ Chưa trả lời</div>'}<div style="color:var(--green)">✓ Đáp án: ${esc(q.options[q.correct])}</div><div class="note">${esc(q.explanation||'')}</div></div></div>`).join('')}</div>`;
  $('#rAgain').onclick=()=>busy($('#rAgain'),()=>quiz('practice',Z.kind));$('#rBack').onclick=()=>{QZ=null;afterQuiz()};
  if(Z.mode==='exam'&&D){try{D=await rpc('khg_fd_me')}catch(e){}}
}
function afterQuiz(){location.hash='';if(D){$('#nav').classList.remove('hidden');go('train')}else landing()}
function examCard(){const ex=(D&&D.exams)||[];const best=ex.find(e=>e.passed);
  return `<div class="card"><h2>📝 Bài thi lý thuyết tài xế</h2><p class="note">35 câu trắc nghiệm có hình minh họa, 30 phút – giống thi sát hạch. Nội dung: trách nhiệm nghề, giao nhận & chứng từ, xếp dỡ & tải trọng, an toàn & biển báo, xử lý sự cố, vận tải hành khách. <b>Đạt: đúng từ 32/35 câu và không sai câu điểm liệt.</b> Tối đa 3 lượt/24 giờ.</p>
   ${best?`<div class="warn">✅ Bạn đã đạt ${best.score}/${best.total} (${fmtDT(best.at)})</div>`:''}
   <label class="f">Loại bài thi</label>${radios('qK',{hang:'Tài xế xe hàng (tải, đầu kéo, cẩu…)',khach:'Tài xế xe khách / đưa đón'},'hang')}
   <div class="btns"><button class="btn g" id="qPr">📖 Ôn tập 20 câu</button><button class="btn p" id="qEx" ${D&&['cho_ho_so','tu_choi','tam_khoa'].includes(D.status)?'disabled title="Nộp đủ hồ sơ trước khi thi"':''}>🎯 Thi chính thức</button><button class="btn g" id="qSh">🔗 Chia sẻ link ôn thi</button></div>
   ${ex.length?`<div class="note" style="margin-top:8px">Lịch sử: ${ex.slice(0,5).map(e=>`${e.score}/${e.total} ${e.passed?'✅':'❌'}`).join(' · ')}</div>`:''}</div>`}
function bindExam(){const k=()=>picked(document,'qK')[0]||'hang';
  $('#qPr').onclick=()=>busy($('#qPr'),()=>quiz('practice',k()));
  $('#qEx').onclick=()=>{if(confirm('Bắt đầu thi 35 câu trong 30 phút? Thoát giữa chừng vẫn tính 1 lượt.'))busy($('#qEx'),()=>quiz('exam',k()))};
  $('#qSh').onclick=()=>shareLink(LINK('onthi'),'Ôn thi tài xế miễn phí – Fast Driver KIM HOÀNG GIA:')}

function route(){const h=location.hash.slice(1);if(QZ)return false;
  if(h==='onthi'){quiz('practice','hang').catch(e=>toast(e.message));return true}
  if(h==='thi'&&D){go('train');return true}
  if(h.startsWith('viec/')&&D){window._focusJob=decodeURIComponent(h.slice(5));go('jobs');return true}
  if(D&&h!==CUR&&TABS.some(t=>t[0]===h)){go(h);return true}return false}
window.addEventListener('hashchange',route);
// ===== KInstall: cài app lên màn hình chính (Android, iPhone, máy tính) =====
(function(){
  const ua=navigator.userAgent||'';
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const inApp=/Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|TikTok|musical_ly|ZaloTheme/i.test(ua);
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  let deferred=null;
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/khg-sw.js',{scope:'/'}).catch(()=>{}));
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;show()});
  window.addEventListener('appinstalled',()=>{try{localStorage.setItem('khg_installed','1')}catch(e){}hide()});
  const css=`#kins{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:120;background:#111827;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:520px;margin:0 auto}
#kins img{width:40px;height:40px;border-radius:10px}#kins b{display:block;font-size:15px}#kins .x{background:none;border:0;color:#9CA3AF;font-size:20px;padding:4px}
#kins .go{background:#C8102E;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;white-space:nowrap}
#kinsg{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#kinsg .bx{background:#fff;color:#111;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#kinsg ol{padding-left:20px;margin:8px 0}#kinsg li{margin:8px 0}#kinsg .k{display:inline-block;border:1px solid #ddd;border-radius:6px;padding:0 6px;background:#f6f6f6}
#kinsg button{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;margin-top:8px}#kinsg .p{background:#C8102E;color:#fff}#kinsg .o{background:#f1f1f1}`;
  const icon=(document.querySelector('link[rel=apple-touch-icon]')||{}).href||'';
  const name=(document.querySelector('meta[name=apple-mobile-web-app-title]')||{}).content||'KHG';
  function ensureCss(){if(!document.getElementById('kins-css')){const s=document.createElement('style');s.id='kins-css';s.textContent=css;document.head.appendChild(s)}}
  function hide(){document.getElementById('kins')?.remove()}
  function show(force){
    if(standalone)return;
    try{if(!force&&(localStorage.getItem('khg_ins_hide')>Date.now()||localStorage.getItem('khg_installed')))return}catch(e){}
    ensureCss();
    hide();const d=document.createElement('div');d.id='kins';
    d.innerHTML=`${icon?`<img src="${icon}" alt="">`:''}<div style="flex:1"><b>Cài “${name}” lên màn hình chính</b>${inApp?'Đang mở trong Zalo/Facebook – mở bằng trình duyệt để cài':'Mở nhanh như app, nhận chuông báo'}</div><button class="go">Cài app</button><button class="x" aria-label="Đóng">✕</button>`;
    document.body.appendChild(d);
    d.querySelector('.x').onclick=()=>{try{localStorage.setItem('khg_ins_hide',Date.now()+3*864e5)}catch(e){}hide()};
    d.querySelector('.go').onclick=()=>KInstall.open();
  }
  function guide(html){ensureCss();document.getElementById('kinsg')?.remove();const g=document.createElement('div');g.id='kinsg';g.innerHTML=`<div class="bx">${html}<button class="o" id="kgc">Đóng</button></div>`;
    document.body.appendChild(g);g.onclick=e=>{if(e.target.id==='kinsg')g.remove()};document.getElementById('kgc').onclick=()=>g.remove()}
  window.KInstall={
    standalone,isIOS,isAndroid,inApp,show:()=>show(true),
    async open(){
      const url=location.href.split('#')[0];
      if(inApp){
        const intent=`intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;end`;
        guide(`<h3 style="margin:0 0 6px">Mở bằng trình duyệt để cài app</h3><p>Zalo / Facebook không cho cài app. Hãy mở link này bằng ${isIOS?'<b>Safari</b>':'<b>Chrome</b>'}:</p>
          <ol><li>Bấm nút <span class="k">⋯</span> hoặc <span class="k">⋮</span> ở góc trên.</li><li>Chọn <b>Mở bằng trình duyệt</b> / <b>Open in ${isIOS?'Safari':'Chrome'}</b>.</li><li>Trong trình duyệt, bấm lại <b>Cài app</b>.</li></ol>
          ${isAndroid?`<a href="${intent}"><button class="p">Mở bằng Chrome</button></a>`:''}<button class="o" id="kcp">📋 Sao chép link</button>`);
        document.getElementById('kcp').onclick=()=>{navigator.clipboard?.writeText(url);document.getElementById('kcp').textContent='Đã sao chép – dán vào '+(isIOS?'Safari':'Chrome')};return}
      if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==='accepted')hide();return}
      if(isIOS){guide(`<h3 style="margin:0 0 6px">Cài lên iPhone / iPad</h3><ol><li>Mở trang này bằng <b>Safari</b>.</li><li>Bấm nút <b>Chia sẻ</b> <span class="k">⬆︎</span> ở thanh dưới (hoặc trên).</li><li>Kéo xuống, chọn <b>Thêm vào MH chính</b> (Add to Home Screen).</li><li>Bấm <b>Thêm</b>. Biểu tượng ${name} xuất hiện trên màn hình chính.</li></ol><p style="font-size:13px;color:#666">Mở app từ biểu tượng để nhận thông báo (iOS 16.4 trở lên).</p>`);return}
      guide(`<h3 style="margin:0 0 6px">Cài lên ${isAndroid?'điện thoại Android':'máy tính'}</h3><ol>${isAndroid?'<li>Mở bằng <b>Chrome</b>.</li><li>Bấm <span class="k">⋮</span> góc phải trên.</li><li>Chọn <b>Cài đặt ứng dụng</b> / <b>Thêm vào màn hình chính</b>.</li><li>Bấm <b>Cài đặt</b>.</li>':'<li>Mở bằng Chrome hoặc Edge.</li><li>Bấm biểu tượng <b>Cài đặt</b> ⊕ ở cuối thanh địa chỉ.</li><li>Bấm <b>Cài đặt</b> – app mở thành cửa sổ riêng, ghim vào thanh tác vụ.</li>'}</ol>`);
    }
  };
  // hiện gợi ý sau 4 giây trên điện thoại
  if(/[?&]install=1/.test(location.search)&&!standalone)setTimeout(()=>KInstall.open(),900);
  else if(!standalone&&(isIOS||isAndroid||inApp))setTimeout(()=>show(false),4000);
})();

// Bắt buộc đổi mật khẩu tạm do KHG cấp
(function(){function chk(){sb.auth.getSession().then(({data})=>{const u=data&&data.session&&data.session.user;if(!u||!(u.user_metadata||{}).must_change||document.getElementById('mcpw'))return;
  const d=document.createElement('div');d.id='mcpw';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px';
  const st='width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px;font:inherit;box-sizing:border-box';
  d.innerHTML=`<div style="background:#fff;color:#111;border-radius:16px;padding:18px;max-width:380px;width:100%;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><h3 style="margin:0 0 6px">🔐 Đặt mật khẩu mới</h3><p style="margin:0 0 12px;color:#666;font-size:13px">Bạn đang dùng mật khẩu tạm do KHG cấp. Hãy đặt mật khẩu riêng để tiếp tục.</p><input id="mc1" type="password" autocomplete="new-password" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" style="${st}"><input id="mc2" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" style="${st}"><button id="mcok" style="width:100%;padding:12px;border:0;border-radius:10px;background:#C8102E;color:#fff;font-weight:800;font-size:15px">Lưu mật khẩu</button><div id="mce" style="color:#B42318;font-size:13px;margin-top:6px"></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#mcok').onclick=async()=>{const a=d.querySelector('#mc1').value,b=d.querySelector('#mc2').value,e=d.querySelector('#mce');if(a.length<6)return e.textContent='Tối thiểu 6 ký tự';if(a!==b)return e.textContent='Hai mật khẩu chưa khớp';
    const r=await sb.auth.updateUser({password:a,data:{must_change:false}});if(r.error)return e.textContent=r.error.message;d.remove()}})}
  try{sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION')setTimeout(chk,400)})}catch(e){}setTimeout(chk,1200)})();

(async()=>{const {data:{session}}=await sb.auth.getSession();
  if(session&&String(session.user.email||'').endsWith(DOMAIN))boot();else{if(session)await sb.auth.signOut();if(location.hash==='#onthi'){landing('in');route()}else landing(location.hash==='#thue'?'thue':qs('ref')||location.hash==='#thi'?'up':'in')}})();
</script></body></html>
