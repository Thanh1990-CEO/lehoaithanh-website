<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Báo cáo HĐKD KHG LOGISTICS</title><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<link rel="icon" href="/icons/cost-192.png">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2F1;--card:#fff;--ink:#1B1616;--mut:#6B6464;--line:#E7DCDA;--red:#C8102E;--dark:#7A0C1F;--green:#15803D;--amber:#B45309;--blue:#1D4ED8;--soft:#FBF6F5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(120deg,#1B1616,#3B0A13 60%,#7A0C1F);color:#fff;padding:18px 16px 16px}
.hw{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.logo{width:42px;height:42px;border-radius:11px;background:var(--red);display:grid;place-items:center;font-weight:800;letter-spacing:.5px;font-size:13px;flex:none}
.ht b{display:block;font-size:17px;letter-spacing:.3px}.ht span{font-size:12.5px;opacity:.75}.sp{flex:1}
.btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}.btn.p{background:var(--red);border-color:var(--red)}.btn:disabled{opacity:.6}
main{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
.per{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:2px 0 12px}.per button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}.per button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.per input{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:inherit;font-size:13px;background:#fff}
.lbl{font-size:12.5px;color:var(--mut);margin:-6px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k{background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line);border-top:3px solid var(--c,var(--red))}
.k small{display:block;font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.4px;text-transform:uppercase}.k b{display:block;font-size:22px;font-weight:800;margin:3px 0 1px;font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}.k span{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.card.w{grid-column:1/-1}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}.card h3 small{font-weight:500;color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--mut);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:7px 6px;border-bottom:1px solid #F1EAE8;vertical-align:top}.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}.bar{height:8px;border-radius:9px;background:#F1E6E4;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--red);border-radius:9px}.bar.g i{background:var(--green)}.bar.gr i{background:#9CA3AF}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding:6px 0 0;border-bottom:1px solid var(--line)}.chart{justify-content:center}.chart div{flex:1;max-width:56px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:4px;position:relative}.chart .r{background:var(--red);border-radius:3px 3px 0 0}.chart .c{background:#9CA3AF;border-radius:3px 3px 0 0}
.cl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}.lg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.al{border-radius:10px;padding:9px 12px;margin:6px 0;font-size:13px}.al.r{background:#FEF2F2;color:#991B1B}.al.a{background:#FFF7ED;color:#9A3412}.al.g{background:#ECF5F1;color:#14532D}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:#F3F4F6}.pill.r{background:#FEE2E2;color:#991B1B}.pill.g{background:#DCFCE7;color:#166534}.pill.a{background:#FEF3C7;color:#92400E}
.empty{color:var(--mut);padding:30px;text-align:center}.err{max-width:520px;margin:60px auto;background:#fff;border-radius:16px;padding:24px;text-align:center;border:1px solid var(--line)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:20px}
@media(max-width:860px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.k b{font-size:19px}}
</style></head><body>
<header><div class="hw"><div class="logo">KHG</div><div class="ht"><b>BÁO CÁO HĐKD KHG LOGISTICS</b><span id="sub">Công ty TNHH Kim Hoàng Gia · cập nhật trực tiếp từ CRM</span></div><div class="sp"></div>
 <button class="btn" id="rf">↻ Cập nhật</button><button class="btn p" id="dl">⬇ Tải báo cáo Excel</button></div></header>
<main id="m"><div class="empty">Đang tải số liệu…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient('https://kbpcmifwplbtggfcnfrx.supabase.co','sb_publishable_buS_4Iky59zQlMME9dn2NQ_1FqIwlVt',{auth:{persistSession:false}});
const TOK=new URLSearchParams(location.search).get('k')||(location.hash.match(/k=([\w]+)/)||[])[1]||'';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fN=n=>Math.round(Number(n)||0).toLocaleString('vi-VN');const fTr=n=>{n=Number(n)||0;const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2).replace('.',',')+' tỷ':a>=1e6?(n/1e6).toFixed(a>=1e8?0:1).replace('.',',')+' tr':fN(n)};
const fD=d=>{if(!d)return '';const m=String(d).match(/(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:d};const pct=(a,b)=>b?(a/b*100).toFixed(1).replace('.',',')+'%':'—';
const VN=()=>new Date(Date.now()+7*3600e3).toISOString().slice(0,10);const add=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const SV={van_chuyen:'Vận chuyển',phan_phoi:'Phân phối',boc_xep:'Bốc xếp',xe_cau:'Xe cẩu',xe_nang:'Xe nâng',kho:'Kho bãi',tron_goi:'Trọn gói'};
const OS={moi:'Mới',xac_nhan:'Đã xác nhận',dang_chay:'Đang chạy',da_giao:'Đã giao',doi_soat:'Đối soát',xuat_hd:'Đã xuất HĐ',da_thu:'Đã thu tiền',huy:'Hủy'};
const EI={nhien_lieu:'Nhiên liệu',cau_duong:'Vé cầu đường',phi_cong:'Phí ra vào cổng',bao_tri:'Bảo trì, bảo dưỡng',sua_chua:'Sửa chữa',bao_hiem:'Bảo hiểm xe',dang_kiem:'Đăng kiểm',phi_duong_bo:'Phí đường bộ',thue_kho:'Thuê kho',dien_nuoc:'Điện nước',luong:'Lương (ghi tay)',tra_gop_xe:'Trả góp xe',xe_lien_ket:'Trả xe liên kết',mua_hang:'Mua hàng',boc_xep_thue:'Thuê bốc xếp',van_phong:'Văn phòng',thue_phi:'Thuế, phí',thue_xe_ngoai:'Thuê xác xe / xe NCC',khac:'Khác'};
const PM={tien_mat:'Tiền mặt',chuyen_khoan:'Chuyển khoản',cong_no:'Ghi công nợ'};const RL={admin:'Quản trị',dieu_phoi:'Điều phối',ke_toan:'Kế toán',kinh_doanh:'Kinh doanh',tai_xe:'Tài xế',boc_xep:'Bốc xếp',kho:'Thủ kho',khac:'Khác'};
const DS={chua_thu:'Chưa thu',da_thu:'Đã thu',that_lac:'Thất lạc',da_tra_khach:'Đã trả khách',khong_can:'Không cần'};const ES={ung_vien:'Ứng viên',thu_viec:'Thử việc',chinh_thuc:'Chính thức',tam_nghi:'Tạm nghỉ',nghi_viec:'Nghỉ việc',dang_lam:'Đang làm'};
const AT={co_mat:'X',nua_ngay:'½',vang:'V',nghi_phep:'P'};
let P={k:'thang'},D=null;
function range(k){const t=VN();const y=+t.slice(0,4),mo=+t.slice(5,7);const p2=n=>String(n).padStart(2,'0');const last=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
  if(k==='nay')return {from:t,to:t,label:'Hôm nay '+fD(t)};if(k==='qua')return {from:add(t,-1),to:add(t,-1),label:'Hôm qua '+fD(add(t,-1))};
  if(k==='tuan'){const dw=(new Date(t+'T12:00:00Z').getUTCDay()+6)%7;const f=add(t,-dw);return {from:f,to:add(f,6),label:`Tuần ${fD(f)} – ${fD(add(f,6))}`}}
  if(k==='thang')return {from:`${y}-${p2(mo)}-01`,to:`${y}-${p2(mo)}-${last(y,mo)}`,label:`Tháng ${p2(mo)}/${y}`};
  if(k==='thangtruoc'){const yy=mo===1?y-1:y,mm=mo===1?12:mo-1;return {from:`${yy}-${p2(mm)}-01`,to:`${yy}-${p2(mm)}-${last(yy,mm)}`,label:`Tháng ${p2(mm)}/${yy}`}}
  if(k==='quy'){const q=Math.floor((mo-1)/3);const f=`${y}-${p2(q*3+1)}-01`;return {from:f,to:`${y}-${p2(q*3+3)}-${last(y,q*3+3)}`,label:`Quý ${q+1}/${y}`}}
  if(k==='nam')return {from:`${y}-01-01`,to:`${y}-12-31`,label:`Năm ${y}`};
  return {from:P.from||t,to:P.to||t,label:`${fD(P.from)} – ${fD(P.to)}`}}
async function load(){const r=range(P.k);P.r=r;$('#m').innerHTML=bar()+'<div class="empty">Đang tải số liệu…</div>';bindBar();
  const {data,error}=await sb.rpc('khg_board_public',{p_token:TOK,p_from:r.from,p_to:r.to,p_detail:false});
  if(error){$('#m').innerHTML=`<div class="err"><h2>Không mở được báo cáo</h2><p>${esc(error.message)}</p><p style="color:var(--mut);font-size:13px">Link có thể đã được đổi. Liên hệ quản trị CRM để nhận link mới.</p></div>`;return}
  D=data;draw()}
function bar(){const B=[['nay','Hôm nay'],['qua','Hôm qua'],['tuan','Tuần này'],['thang','Tháng này'],['thangtruoc','Tháng trước'],['quy','Quý này'],['nam','Năm nay'],['tuy','Tùy chọn']];
  return `<div class="per">${B.map(([k,l])=>`<button data-k="${k}" class="${P.k===k?'on':''}">${l}</button>`).join('')}${P.k==='tuy'?`<input type="date" id="f1" value="${P.from||VN()}"> → <input type="date" id="f2" value="${P.to||VN()}"> <button id="fGo" class="on">Xem</button>`:''}</div><div class="lbl" id="lbl">${esc(P.r?P.r.label:'')}</div>`}
function bindBar(){document.querySelectorAll('.per [data-k]').forEach(b=>b.onclick=()=>{P.k=b.dataset.k;if(P.k==='tuy'){P.from=P.from||add(VN(),-30);P.to=P.to||VN();$('#m').innerHTML=bar();bindBar();return}load()});const g=$('#fGo');if(g)g.onclick=()=>{P.from=$('#f1').value;P.to=$('#f2').value;load()}}
function calc(d){const O=d.orders||[],E=(d.expenses||[]);const rev=O.reduce((s,o)=>s+ +o.revenue,0),paid=O.reduce((s,o)=>s+ +o.paid,0),open=O.reduce((s,o)=>s+ +o.open,0),pc=O.reduce((s,o)=>s+ +o.partner_cost,0);
  const opE=E.filter(e=>!['xe_lien_ket','luong'].includes(e.item));const op=opE.reduce((s,e)=>s+ +e.amount,0);const lab=+d.labour||0;const cost=pc+op+lab;return {O,E,opE,rev,paid,open,pc,op,lab,cost,gp:rev-cost,trips:O.reduce((s,o)=>s+(+o.trips||1),0)}}
function draw(){const d=D,c=calc(d),F=d.fin||{},fu=F.fund||{},AR=F.ar||{},AP=F.ap||{},f30=(F.forecast||[]).find(x=>x.days===30)||{};const apT=['vay','ncc','xe','luong','khac'].reduce((s,k)=>s+Number((AP[k]||{}).total||0),0);
  const K=(l,v,s,col,fmt)=>`<div class="k" style="--c:${col||'var(--ink)'}"><small>${l}</small><b>${fmt?fmt(v):fTr(v)}</b><span>${s||''}</span></div>`;
  // theo ngày / tháng
  const days=(new Date(d.to)-new Date(d.from))/864e5;const key=x=>days<=62?x:x.slice(0,7);const T={};const tk=k=>T[k]=T[k]||{r:0,c:0};
  c.O.forEach(o=>{const x=tk(key(o.d));x.r+=+o.revenue;x.c+=+o.partner_cost});c.opE.forEach(e=>{tk(key(e.d)).c+=+e.amount});
  const ks=Object.keys(T).sort();const mx=Math.max(1,...ks.map(k=>Math.max(T[k].r,T[k].c)));
  const BC={};c.O.forEach(o=>{const x=BC[o.customer]=BC[o.customer]||{n:0,r:0,o:0};x.n++;x.r+=+o.revenue;x.o+=+o.open});const top=Object.entries(BC).sort((a,b)=>b[1].r-a[1].r).slice(0,8);
  const BI={};c.opE.forEach(e=>{const k=EI[e.item]||e.item||'Khác';BI[k]=(BI[k]||0)+ +e.amount});if(c.pc)BI['Xe liên kết / thuê ngoài']=c.pc;if(c.lab)BI['Nhân công (chấm công)']=c.lab;const bi=Object.entries(BI).sort((a,b)=>b[1]-a[1]);
  const BV={};c.O.forEach(o=>{if(!o.vehicle)return;const x=BV[o.vehicle]=BV[o.vehicle]||{n:0,r:0,c:0};x.n+=+o.trips||1;x.r+=+o.revenue;x.c+=+o.partner_cost});c.opE.forEach(e=>{if(!e.vehicle)return;const x=BV[e.vehicle]=BV[e.vehicle]||{n:0,r:0,c:0};x.c+=+e.amount});
  const fuel=(d.fuel&&d.fuel.vehicles)||[];
  const alerts=[];if(c.gp<0&&c.rev)alerts.push(['r',`Kỳ này đang <b>lỗ ${fTr(-c.gp)}</b> (doanh thu ${fTr(c.rev)} < chi phí ${fTr(c.cost)}).`]);
  if(+AR.overdue>0)alerts.push(['r',`Khách nợ quá hạn <b>${fTr(AR.overdue)}</b> – cần đốc thu.`]);if(f30.borrow)alerts.push(['a',`30 ngày tới dự kiến thiếu tiền, đề xuất vay <b>${fTr(f30.borrow)}</b>${f30.repay_in_days!=null?` (trả sau ~${f30.repay_in_days} ngày)`:''}.`]);
  (F.salary_plan||[]).filter(s=>s.borrow).slice(0,1).forEach(s=>alerts.push(['a',`Đợt lương ${fD(s.pay_on)} (${fTr(s.amount)}) thiếu ${fTr(s.shortfall)} – cần chuẩn bị tiền.`]));
  fuel.filter(v=>v.pct!=null&&v.pct<20).forEach(v=>alerts.push(['a',`Xe ${esc(v.plate)} sắp hết dầu (còn ~${fN(v.level_l)} lít, chạy ~${fN(v.range_km)} km).`]));
  if(!alerts.length)alerts.push(['g','Không có cảnh báo lớn trong kỳ.']);
  $('#m').innerHTML=bar()+`
  <div class="kpis">${K('Doanh thu',c.rev,`${c.O.length} đơn · ${c.trips} chuyến`,'var(--red)')}${K('Đã thu',c.paid,pct(c.paid,c.rev)+' doanh thu','var(--green)')}${K('Còn phải thu',c.open,`Tổng phải thu: ${fTr(AR.total)}`,'var(--amber)')}${K('Tổng chi phí',c.cost,`Vận hành ${fTr(c.op)} · nhân công ${fTr(c.lab)}`)}
   ${K('Lợi nhuận gộp',c.gp,'Biên '+pct(c.gp,c.rev),c.gp>=0?'var(--green)':'var(--red)')}${K('Tồn quỹ hiện tại',fu.total,`TM ${fTr(fu.tm)} · NH ${fTr(fu.nh)}`,'var(--blue)')}${K('Nợ vay',fu.loan_debt,`Phải trả khác: ${fTr(apT-Number(fu.loan_debt||0))}`,'var(--amber)')}${K('Dòng tiền 30 ngày',f30.borrow?-f30.borrow:f30.net,f30.borrow?'Cần vay thêm':'Dư sau khi chi',f30.borrow?'var(--red)':'var(--green)')}</div>
  <div class="grid"><div class="card w"><h3>⚠ Cảnh báo cho lãnh đạo</h3>${alerts.map(a=>`<div class="al ${a[0]}">${a[1]}</div>`).join('')}</div>
   <div class="card w"><h3>📈 Doanh thu – chi phí ${days<=62?'theo ngày':'theo tháng'} <small>(chi phí: vận hành + xe ngoài; chưa gồm nhân công)</small></h3>${ks.length?`<div class="chart">${ks.map(k=>`<div title="${fD(k)}: DT ${fN(T[k].r)} · CP ${fN(T[k].c)}" style="flex-direction:row;align-items:flex-end;gap:1px"><span class="r" style="flex:1;height:${T[k].r/mx*140}px"></span><span class="c" style="flex:1;height:${T[k].c/mx*140}px"></span></div>`).join('')}</div><div class="cl"><span>${fD(ks[0])}</span><span>${fD(ks[ks.length-1])}</span></div><div class="lg"><span><i style="background:var(--red)"></i>Doanh thu</span><span><i style="background:#9CA3AF"></i>Chi phí</span></div>`:'<div class="empty">Chưa có phát sinh.</div>'}</div>
   <div class="card"><h3>💼 Kết quả kinh doanh</h3><table><tbody>
     <tr><td>Doanh thu</td><td class="n"><b>${fN(c.rev)}</b></td></tr><tr><td>− Xe liên kết / thuê ngoài</td><td class="n">${fN(c.pc)}</td></tr><tr><td>− Chi phí vận hành</td><td class="n">${fN(c.op)}</td></tr><tr><td>− Nhân công (lương theo chấm công)</td><td class="n">${fN(c.lab)}</td></tr>
     <tr><td><b>Lợi nhuận gộp</b></td><td class="n"><b style="color:${c.gp<0?'var(--red)':'var(--green)'}">${fN(c.gp)}</b></td></tr><tr><td>Biên lợi nhuận</td><td class="n">${pct(c.gp,c.rev)}</td></tr></tbody></table></div>
   <div class="card"><h3>🧾 Chi phí theo khoản</h3>${bi.length?bi.map(([k,v])=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><b class="n">${fN(v)}</b></div><div class="bar gr"><i style="width:${v/bi[0][1]*100}%"></i></div></div>`).join(''):'<div class="empty">Chưa có chi phí.</div>'}</div>
