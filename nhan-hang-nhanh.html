<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Nhận Hàng Nhanh – App đối tác xe KHG</title>
<meta name="description" content="Nhận Hàng Nhanh – ứng dụng nhận đơn vận chuyển cho chủ xe, nhà xe, doanh nghiệp vận tải liên kết với Kim Hoàng Gia.">
<meta name="theme-color" content="#064E43">
<meta name="robots" content="noindex">
<link rel="manifest" href="/nhan-hang-nhanh.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2716%27%20fill%3D%27%230A6E5C%27/%3E%3Cpath%20d%3D%27M16%2046V18h7l15%2018V18h8v28h-7L24%2028v18z%27%20fill%3D%27%23fff%27/%3E%3Cpath%20d%3D%27M38%2036l8-9v9z%27%20fill%3D%27%230A6E5C%27%20opacity%3D%27.0%27/%3E%3Crect%20x%3D%2744%27%20y%3D%2710%27%20width%3D%2710%27%20height%3D%2710%27%20rx%3D%272.5%27%20fill%3D%27%23FFB020%27/%3E%3Cpath%20d%3D%27M8%2052h22%27%20stroke%3D%27%23FFB020%27%20stroke-width%3D%274%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="/icons/nhn-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--o:#0A6E5C;--o2:#12A087;--od:#064E43;--ol:#E6F4F1;--a:#FFB020;--al:#FFF4DC;--ink:#14211E;--mut:#5F6B68;--line:#E3EAE8;--bg:#F2F6F5;--g:#16A34A;--r:#DC2626;--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(74px + var(--safe-b))}
.top{position:sticky;top:0;z-index:30;background:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.top .row1{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff;font-weight:600;font-size:14px}
.pill i{width:8px;height:8px;border-radius:50%;background:#9CA3AF;display:inline-block}
.pill.on i{background:#22C55E}
.ib{border:0;background:none;padding:6px;position:relative;color:var(--ink)}
.ib b{position:absolute;top:0;right:0;background:var(--r);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
.sp{flex:1}
.tabs{display:flex;gap:18px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 0;color:var(--mut);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--o)}
.tabs.full{gap:0}.tabs.full button{flex:1;color:#9CA3AF}.tabs.full button.on{color:var(--o)}
main{padding:10px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--safe-b));z-index:40}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#4B5563;padding:6px 0;border-radius:18px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--o);background:var(--ol)}
.nav button b{position:absolute;top:2px;right:22%;background:var(--r);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
.card{background:#fff;border-radius:12px;margin:0 0 10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card .bd{padding:12px 14px}
.oh{background:var(--o);color:#fff;font-weight:700;padding:10px 14px;display:flex;align-items:center;gap:8px}
.oh small{font-weight:500;opacity:.9;margin-left:auto}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:12px;border-radius:6px;padding:3px 8px;background:#F3F4F6;color:#374151}
.tag.g{background:#ECFDF3;color:#15803D}.tag.o{background:var(--ol);color:#C2410C}.tag.r{background:#FEF2F2;color:#B91C1C}
.rt{position:relative;padding-left:22px;margin:4px 0}
.rt .p{position:relative;padding:3px 0}
.rt .p:before{content:"";position:absolute;left:-19px;top:9px;width:9px;height:9px;border:2.5px solid var(--o);border-radius:50%;background:#fff}
.rt .p.d:before{border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--o);border-color:var(--o)}
.rt .p+.p:after{content:"";position:absolute;left:-14px;top:-10px;height:16px;border-left:2px dotted #CBD5E1}
.rt small{display:block;color:var(--mut);font-size:13px}
.price{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 14px;font-size:20px;font-weight:700}
.price .ic{color:var(--o)}
.mut{color:var(--mut)}.sm{font-size:13px}
.btn{border:0;border-radius:10px;padding:13px 16px;font-weight:700;background:var(--o);color:#fff;width:100%}
.btn.g{background:#F3F4F6;color:var(--ink)}.btn.w{background:#fff;color:var(--o);border:1px solid var(--o)}.btn.r{background:#fff;color:var(--r);border:1px solid #FCA5A5}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;margin-top:10px}
.empty{text-align:center;padding:60px 24px;color:var(--mut)}
.empty h3{color:var(--ink);margin:14px 0 6px}
.empty svg{width:130px;height:110px}
.i{width:100%;border:1px solid #D1D5DB;border-radius:10px;padding:13px 12px;font:inherit;background:#fff}
label.f{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90%;font-size:14px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--safe-b));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 8px}
.page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;max-width:520px;margin:0 auto}
.phead{background:var(--o);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px}
.phead .back{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:20px}
.phead h2{margin:10px 0 2px;font-size:22px}
.phead.w{background:#fff;color:var(--ink);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.phead.w .back{background:#F3F4F6;color:var(--ink)}
.phead.w h2{margin:0;font-size:17px;flex:1;text-align:center;padding-right:38px}
#map,.map{height:260px;background:#e5e7eb}
.swipe{position:relative;height:58px;border-radius:12px;background:var(--o);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;user-select:none;overflow:hidden;touch-action:none}
.swipe .k{position:absolute;left:5px;top:5px;width:48px;height:48px;border-radius:9px;background:#fff;color:var(--o);display:flex;align-items:center;justify-content:center;font-size:22px;transition:left .2s}
.swipe .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0}
.steps{display:flex;gap:4px;margin:6px 0 12px}
.steps i{flex:1;height:5px;border-radius:3px;background:#E5E7EB}.steps i.on{background:var(--o)}
.wallet{background:linear-gradient(135deg,var(--o),#064E43);color:#fff;border-radius:12px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden}
.wallet .big{font-size:34px;font-weight:800;margin:2px 0 10px}
.wallet .row{display:flex;gap:18px;font-size:13px}
.wallet .row b{display:block;font-size:16px}
.li{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line);background:#fff}
.li:first-child{border-top:0}
.li .t{flex:1}.li .t small{display:block;color:var(--mut)}
.stars{color:#F59E0B;font-size:22px;letter-spacing:2px}
.bar{height:8px;border-radius:5px;background:#F3F4F6;overflow:hidden}.bar i{display:block;height:100%;background:var(--o)}
.warn{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.err{background:#FEF2F2;color:#B91C1C;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.ok{background:#ECFDF3;color:#166534;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid #D1D5DB;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px}.chips button.on{border-color:var(--o);color:var(--o);background:var(--ol)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eee}
.hero{background:linear-gradient(160deg,#12A087,var(--o));height:200px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero svg{position:absolute;bottom:-4px;left:0;width:100%}
.logo{width:52px;height:52px;border-radius:14px;background:var(--o);display:flex;align-items:center;justify-content:center}
.cd{font-variant-numeric:tabular-nums}
.done-ic{width:84px;height:84px;border-radius:50%;background:#ECFDF3;color:var(--g);display:flex;align-items:center;justify-content:center;font-size:44px;margin:30px auto 10px}

/* ===== Nhận Hàng Nhanh – nhận diện riêng ===== */
.brand{display:flex;align-items:center;gap:9px}.brand .lg{width:34px;height:34px;flex:0 0 34px}.brand b{font-size:16px;letter-spacing:-.2px;line-height:1.1}.brand b em{font-style:normal;color:var(--a)}.brand small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.top{background:#fff;border-bottom:1px solid var(--line);padding-bottom:8px}
.sw2{display:inline-flex;align-items:center;gap:8px;border:0;background:#EEF2F1;border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:13px;color:var(--mut);transition:background .25s,color .25s}
.sw2 i{width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;transition:transform .25s}
.sw2.on{background:var(--o);color:#fff}.sw2.on i{color:var(--o)}
.seg{display:flex;background:#EEF2F1;border-radius:12px;padding:3px;margin-top:8px;gap:3px}.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;color:var(--mut);font-size:13.5px;transition:background .2s,color .2s}.seg button.on{background:#fff;color:var(--od);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nav{border-top:0;box-shadow:0 -4px 18px rgba(6,78,67,.08);border-radius:18px 18px 0 0;padding-top:8px}
.nav button.on{background:transparent;color:var(--o)}.nav button.on svg{transform:translateY(-1px)}
.nav .fab{flex:0 0 74px;position:relative;top:-22px;padding:0}.nav .fab span.k{width:62px;height:62px;margin:0 auto;border-radius:50%;background:#9AA8A5;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(6,78,67,.28);border:4px solid #fff;transition:background .25s,transform .15s}
.nav .fab.live span.k{background:var(--o)}.nav .fab.live span.k:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--o);opacity:.5;animation:pulse 1.8s infinite}
.nav .fab span.l{display:block;font-size:11px;margin-top:2px;color:var(--ink);font-weight:700}
.nav .fab:active span.k{transform:scale(.94)}
@keyframes pulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.25);opacity:0}}
.today{display:flex;gap:8px;margin:0 0 10px}.today div{flex:1;background:#fff;border-radius:14px;padding:10px 12px;border:1px solid var(--line)}.today small{display:block;color:var(--mut);font-size:12px}.today b{font-size:17px}
.oc{background:#fff;border-radius:16px;margin:0 0 10px;padding:12px 14px 12px 18px;position:relative;border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03);transition:transform .12s}
.oc:active{transform:scale(.985)}.oc:before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 5px 5px 0;background:var(--o)}
.oc.hot:before{background:var(--a)}
.oc .r1{display:flex;align-items:center;gap:8px}.oc .vh{font-weight:700;font-size:13px;color:var(--od);background:var(--ol);border-radius:8px;padding:3px 8px}
.oc .pr{margin-left:auto;font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.oc .ab{display:grid;grid-template-columns:22px 1fr;gap:2px 8px;margin:10px 0 6px;align-items:start}
.oc .ab i{width:20px;height:20px;border-radius:6px;background:var(--o);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}.oc .ab i.b{background:var(--a);color:#3D2A00}
.oc .ab .ln{grid-column:1;justify-self:center;width:2px;height:10px;background:repeating-linear-gradient(var(--line) 0 3px,transparent 3px 6px)}
.oc .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}.oc .ft .go{margin-left:auto;font-weight:700;color:var(--o)}
.ring{--p:100;width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--o) calc(var(--p)*1%),#E3EAE8 0);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--od);flex:0 0 34px}.ring span{width:27px;height:27px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.ring.low{background:conic-gradient(#E5484D calc(var(--p)*1%),#F3E3E3 0);color:#B42318}
.hold{position:relative;overflow:hidden;width:100%;height:60px;border:0;border-radius:16px;background:var(--od);color:#fff;font-weight:800;font-size:16px;letter-spacing:.2px;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--o2)}.hold span{position:relative}
.hold.go i{width:100%;transition:width .85s linear}.hold.ok{background:var(--o2)}
.bsheet{position:relative;margin-top:-18px;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 10px 10px;z-index:2}
.bsheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:#C9D3D1;margin:-4px auto 10px}
.page{animation:slin .22s ease-out}@keyframes slin{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
.sk{background:linear-gradient(90deg,#E8EEEC 25%,#F3F7F6 50%,#E8EEEC 75%);background-size:200% 100%;animation:sk 1.1s infinite;border-radius:16px;height:118px;margin-bottom:10px}@keyframes sk{to{background-position:-200% 0}}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}.qa a,.qa button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--ink);text-decoration:none;font-weight:600}.qa b{display:block;font-size:20px;margin-bottom:2px}
.tl{list-style:none;margin:4px 0 0;padding:0 0 0 4px}.tl li{position:relative;padding:0 0 12px 22px;font-size:13.5px;color:var(--mut)}.tl li:before{content:"";position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:50%;background:#C9D3D1}.tl li:after{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:#E3EAE8}.tl li:last-child:after{display:none}
.tl li.on{color:var(--ink);font-weight:600}.tl li.on:before{background:var(--o)}.tl li.cur:before{background:var(--a);box-shadow:0 0 0 4px var(--al)}
.brand>div{min-width:0}.brand b,.sw2{white-space:nowrap}
#app{padding-bottom:calc(104px + var(--safe-b))}
@media (max-width:420px){.brand b{font-size:15px}.sw2{padding-right:10px;font-size:12.5px}.sw2 .x{display:none}}
.fixb{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:14px 0 calc(6px + var(--safe-b))}

/* ===== Dùng tốt trên cả điện thoại và PC ===== */
button,[role=button],.oc,.card[data-od],.li[id]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hold{-webkit-touch-callout:none}
.oc:focus-visible,.card:focus-visible,button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.ocg{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (hover:hover) and (pointer:fine){
 .oc:hover,.card[data-od]:hover{border-color:var(--o2);box-shadow:0 4px 14px rgba(6,78,67,.10)}
 .nav button:not(.fab):hover{color:var(--o)}
 .btn:hover{filter:brightness(1.06)} .seg button:not(.on):hover{color:var(--ink)}
}
@media (min-width:900px){
 body{padding-left:232px}
 .nav{left:0;top:0;bottom:0;transform:none;width:232px;max-width:none;flex-direction:column;justify-content:flex-start;gap:4px;border-radius:0;box-shadow:1px 0 0 var(--line);padding:84px 12px 16px}
 .nav:before{content:"Menu";font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:0 12px 6px}
 .nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;font-weight:600;padding:11px 14px;border-radius:12px}
 .nav button.on{background:var(--ol)}
 .nav button b{position:static;margin-left:auto;font-size:11px;padding:1px 7px}
 .nav .fab{display:none}
 #app{max-width:none;padding-bottom:0}
 .top{padding:14px 28px 10px;z-index:45}
 .top .row1,.top .seg{max-width:1064px;margin-left:auto;margin-right:auto}
 .top .seg{max-width:1064px}
 main{max-width:1120px;margin:0 auto;padding:18px 28px 40px}
 .ocg{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
 #main>.card[data-od]{display:inline-block;width:calc(50% - 6px);vertical-align:top;margin-right:8px}
 #main>.card[data-od]:nth-of-type(2n){margin-right:0}
 .today{max-width:640px}
 .page{left:232px;margin:0;max-width:none;box-shadow:-1px 0 0 var(--line)}
 .page>*{max-width:820px;margin-left:auto;margin-right:auto}
 .page .phead{max-width:none}
 .page .map{height:360px!important}
 .bsheet{margin-top:-24px}
 .sheetbg{align-items:center}
 .sheet{border-radius:18px;max-width:560px;padding-bottom:18px}
 .fixb{position:static;background:none}
 .hold{max-width:420px;display:block;margin:0 auto}
}

.pk{display:inline-block;font-size:12.5px;font-weight:700;color:var(--od);background:var(--ol);border-radius:8px;padding:3px 8px;margin:2px 0 6px}.pk.n{background:#DCFCE7;color:#166534}.pk.f{background:var(--al);color:#7A4B00}
.setup{background:#fff;border:1px solid var(--line);border-left:5px solid var(--a);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.setup .srow{display:flex;align-items:center;gap:10px;margin-top:10px}.setup .srow>span{font-size:20px}.setup .srow>div{flex:1}.setup small{display:block;color:var(--mut);font-size:12px}
.setup .btn.s,.btn.s{width:auto;padding:8px 14px;font-size:13px}.setup .ok{color:var(--g);font-size:13px;white-space:nowrap}
#snd{position:relative}#snd[data-n]:not([data-n=""]):after{content:attr(data-n);position:absolute;top:-2px;right:-4px;background:var(--r);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px}
.nt.unr{background:#F3FBF9}.nt.unr b:before{content:"● ";color:var(--a)}
.geob{display:flex;align-items:center;gap:8px;background:#FFF4DC;color:#7A4B00;border-radius:12px;padding:8px 12px;font-size:13px;margin:0 0 10px}

.oc.t-nhanh:before{background:#DC2626}.oc.t-gio:before{background:#2563EB}.oc.t-ngay:before{background:#7C3AED}
.otag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px;color:#fff}
.otag.nhanh{background:#DC2626}.otag.gio{background:#2563EB}.otag.ngay{background:#7C3AED}

<script>

async function busy(btn,fn){if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message||String(e),4000)}finally{if(btn)btn.disabled=false}}
function sheet(html){closeSheet();const d=document.createElement('div');d.className='sheetbg';d.id='sheet';d.innerHTML=`<div class="sheet">${html}</div>`;d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d)}

// luồng giao hàng: [trạng thái kế tiếp, nút, ảnh bắt buộc (loại chứng từ), ghi chú]
const FLOW=[['dang_den_lay','🚚 Bắt đầu đi lấy hàng',null],['cho_boc_hang','📍 Đã đến điểm lấy hàng','khac','Chụp ảnh xe tại điểm lấy'],['da_lay_hang','📦 Đã lấy hàng xong','hinh_hang','Chụp ảnh hàng đã xếp lên xe'],
  ['dang_giao','➡️ Bắt đầu đi giao',null],['den_diem_giao','📍 Đã đến điểm giao','khac','Chụp ảnh tại điểm giao'],['da_giao','✅ Giao hàng thành công','pod','Chụp chứng từ / biên bản giao nhận có ký nhận']];
const SEQ=['da_nhan','da_xac_nhan','dang_den_lay','cho_boc_hang','da_lay_hang','dang_giao','den_diem_giao','da_giao'];
let P=null,TAB='nhan',SUB={nhan:'all',don:'run'},OFFERS=[],ORD=[],VEH=[],DRV=[],POLL=null,SEEN=new Set(),SOUND=true;

// ============== ĐĂNG NHẬP ==============
function authView(step,phone){
  $('#top').classList.add('hidden');$('#nav').classList.add('hidden');
  const ph=phone||normPhone(qs('sdt')||qs('u'));const reg=step==='reg';
  $('#main').innerHTML=`<div style="margin:-10px">
   <div class="hero" style="background:linear-gradient(150deg,#0A6E5C,#064E43)"><svg viewBox="0 0 400 200" style="height:100%"><g opacity=".25" fill="none" stroke="#fff" stroke-width="2"><path d="M-10 160 C80 160 90 70 190 80 S320 20 420 40" stroke-dasharray="3 9" stroke-linecap="round"/><circle cx="330" cy="40" r="46"/><circle cx="330" cy="40" r="80"/></g><circle cx="190" cy="80" r="7" fill="#FFB020"/><circle cx="60" cy="150" r="6" fill="#fff"/></svg>
     <div style="position:absolute;left:18px;top:calc(22px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;color:#fff">${LOGO(46)}<div><b style="font-size:20px">Nhận Hàng <span style="color:#FFB020">Nhanh</span></b><div style="font-size:12px;opacity:.85">Đối tác vận tải liên kết · KHG</div></div></div></div>
   <div style="padding:20px 18px"><h2 style="font-size:24px;margin:0 0 4px">${reg?'Đăng ký đối tác xe':'Nhận Hàng Nhanh xin chào'}</h2><div class="mut">${reg?'Chỉ cần thông tin cơ bản và số điện thoại. Nhân viên KHG sẽ liên hệ để thỏa thuận và ký hợp đồng hợp tác.':'Ứng dụng nhận đơn cho chủ xe, nhà xe và doanh nghiệp vận tải liên kết với Kim Hoàng Gia.'}</div>
   <div class="tabs full" style="margin-top:14px;border-bottom:1px solid var(--line)"><button data-m="ph" class="${reg?'':'on'}">Đăng nhập</button><button data-m="reg" class="${reg?'on':''}">Đăng ký mới</button></div>
   <form id="af"><input type="text" id="aHp" style="display:none" tabindex="-1" autocomplete="off">
   <input class="i" style="margin-top:14px" id="aPh" inputmode="tel" autocomplete="tel" placeholder="Số điện thoại" value="${esc(ph)}">
   ${reg||step==='pw'?`<input class="i" style="margin-top:10px" id="aPw" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="${reg?'Đặt mật khẩu (tối thiểu 6 ký tự)':'Mật khẩu'}">`:''}
   ${reg?`<input class="i" style="margin-top:10px" id="aPw2" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu">
     <input class="i" style="margin-top:10px" id="aNm" placeholder="Tên chủ xe / nhà xe">
     <input class="i" style="margin-top:10px" id="aVt" placeholder="Loại xe đang có (VD: 2 xe 1,9T thùng kín, 1 xe 8T) – không bắt buộc">
     <input class="i" style="margin-top:10px" id="aAr" placeholder="Khu vực hoạt động (VD: TP.HCM, Bình Dương) – không bắt buộc">`:''}
   <button class="btn" style="margin-top:14px" id="aGo">${reg?'Đăng ký':step==='pw'?'Đăng nhập':'Tiếp tục'}</button><div id="aErr"></div></form>
   ${reg?'<p class="sm mut" style="margin-top:14px">Sau khi đăng ký: nhân viên KHG gọi điện trao đổi, thỏa thuận và ký hợp đồng hợp tác. Hồ sơ giấy tờ do KHG cập nhật. CEO KHG duyệt tài khoản là bạn nhận được đơn ngay trên app.</p>':''}
   <p class="sm mut">Cần hỗ trợ / quên mật khẩu: điều phối KHG – hotline <a href="tel:0399831228" style="color:var(--o)">0399 831 228</a>.</p></div></div>`;
  $$('#main .tabs button').forEach(b=>b.onclick=()=>authView(b.dataset.m,normPhone($('#aPh').value)));
  $('#af').onsubmit=async e=>{e.preventDefault();const p=normPhone($('#aPh').value);const err=m=>{$('#aErr').innerHTML=`<div class="err">${esc(m)}</div>`};$('#aErr').innerHTML='';
    if(p.length<9||p.length>11)return err('Số điện thoại không hợp lệ');
    if(!reg&&step!=='pw'){authView('pw',p);setTimeout(()=>$('#aPw')&&$('#aPw').focus(),50);return}
    const pw=$('#aPw').value;if(pw.length<6)return err('Mật khẩu tối thiểu 6 ký tự');
    await busy($('#aGo'),async()=>{
      if(reg){if(pw!==$('#aPw2').value)return err('Hai lần nhập mật khẩu không khớp');
        const r=await fetch(SUPABASE_URL+'/functions/v1/khg-public',{method:'POST',headers:{'content-type':'application/json',apikey:SUPABASE_ANON_KEY},body:JSON.stringify({action:'partner_register',hp:$('#aHp').value,phone:p,password:pw,name:$('#aNm').value.trim()||('Đối tác '+p),vehicle_types:$('#aVt').value.trim(),areas:$('#aAr').value.trim(),kind:'ca_nhan',ref:qs('ref')})});
        const j=await r.json().catch(()=>({}));if(!r.ok||j.error)return err(j.error||'Không đăng ký được');}
      const {error}=await sb.auth.signInWithPassword({email:p+DOMAIN,password:pw});
      if(error)return err(/Invalid/i.test(error.message)?'Sai số điện thoại hoặc mật khẩu':error.message);
      if(reg)toast('Đăng ký thành công – chờ CEO KHG duyệt tài khoản',5000);await boot()})};
  if(step==='pw'&&ph)setTimeout(()=>$('#aPw')&&$('#aPw').focus(),50);
}
async function mustChange(){const {data}=await sb.auth.getUser();if(!data?.user?.user_metadata?.must_change)return;
  await new Promise(res=>{sheet(`<h3>🔐 Đặt mật khẩu mới</h3><p class="mut sm">Bạn đang dùng mật khẩu tạm do KHG cấp. Đặt mật khẩu riêng (tối thiểu 6 ký tự).</p><input class="i" id="m1" type="password" placeholder="Mật khẩu mới"><input class="i" style="margin-top:8px" id="m2" type="password" placeholder="Nhập lại"><button class="btn" style="margin-top:12px" id="mGo">Lưu mật khẩu</button>`);
    $('#sheet').onclick=null;$('#mGo').onclick=()=>busy($('#mGo'),async()=>{const a=$('#m1').value,b=$('#m2').value;if(a.length<6)return toast('Tối thiểu 6 ký tự');if(a!==b)return toast('Hai lần nhập không khớp');
      const {error}=await sb.auth.updateUser({password:a,data:{must_change:false}});if(error)throw error;closeSheet();toast('Đã đổi mật khẩu');res()})})}

// ============== KHUNG APP ==============
const NAV=[['nhan','Đơn mới',IC('<path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>')],['don','Chuyến',IC('<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/>')],['@','',''],
 ['quy','Thu nhập',IC('<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2"/><path d="M3 10h18"/>')],['me','Tôi',IC('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>')]];
function navDraw(){const n=OFFERS.filter(o=>o.status==='moi').length,r=ORD.filter(o=>!['da_giao','huy_chuyen','giao_that_bai'].includes(o.trip_status)&&o.status!=='huy').length;
  $('#nav').innerHTML=NAV.map(([k,l,ic])=>k==='@'?`<button class="fab ${P&&P.online?'live':''}" id="fab" aria-label="Bật / tắt nhận đơn"><span class="k">${IC('<path d="M12 3v8"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/>').replace('<svg','<svg style="width:28px;height:28px"')}</span><span class="l">${P&&P.online?'Đang nhận':'Bật nhận'}</span></button>`:`<button data-t="${k}" class="${k===TAB||(k==='me'&&TAB==='kpi')?'on':''}">${ic}<span>${l}</span>${k==='nhan'&&n?`<b>${n}</b>`:''}${k==='don'&&r?`<b>${r}</b>`:''}</button>`).join('');
  $$('#nav button[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));const fb=$('#fab');if(fb)fb.onclick=()=>{if(navigator.vibrate)navigator.vibrate(15);toggleOnline()}}
function topDraw(){const on=!!P.online;const o=$('#onl');o.classList.toggle('on',on);o.querySelector('span').innerHTML=on?'Đang nhận<span class="x"> đơn</span>':'Đang nghỉ';$('#snd').textContent=SOUND?'🔔':'🔕';$('#snd').title='Thông báo';$('#lgTop').innerHTML=LOGO(34);$('#hiName').textContent=P.short_name||P.name||'Đối tác vận tải KHG';
  const S={nhan:[['all','Tất cả'],['near','Gần tôi'],['far','Đường dài']],don:[['run','Đang chạy'],['done','Hoàn thành'],['cancel','Đã hủy']]}[TAB];
  const sub=$('#sub');sub.className='seg';sub.innerHTML=S?S.map(([k,l])=>`<button data-s="${k}" class="${SUB[TAB]===k?'on':''}">${l}</button>`).join(''):'';sub.classList.toggle('hidden',!S);
  $$('#sub button').forEach(b=>b.onclick=()=>{SUB[TAB]=b.dataset.s;go(TAB)})}
async function go(t){TAB=t;closePage();navDraw();topDraw();window.scrollTo(0,0);const m=$('#main');
  try{await ({nhan:viewNhan,don:viewDon,quy:viewQuy,kpi:viewKpi,me:viewMe})[t](m)}catch(e){m.innerHTML=`<div class="empty">Lỗi: ${esc(e.message)}</div>`}}
async function boot(){
  try{P=await rpc('khg_partner_me')}catch(e){await sb.auth.signOut();authView('ph');toast('Tài khoản này không phải tài khoản đối tác. '+e.message,5000);return}
  await mustChange();
  $('#top').classList.remove('hidden');$('#nav').classList.remove('hidden');
  $('#onl').onclick=()=>toggleOnline();$('#snd').onclick=()=>noticesPage();
  await Promise.all([loadOffers(true),loadOrders()]);
  geoStart();swReg().then(()=>pushSync(false));noticeCount();
  const h=location.hash.slice(1);go(['nhan','don','quy','kpi','me'].includes(h)?h:(ORD.some(o=>isRun(o))?'don':'nhan'));
  if(h.startsWith('of=')||h.startsWith('od='))setTimeout(()=>routeUrl(location.href),300);
  clearInterval(POLL);POLL=setInterval(()=>{if(document.visibilityState==='visible'&&P?.online){loadOffers().then(()=>{navDraw();if(TAB==='nhan'&&!$('#page'))viewNhan($('#main'),true)});geoSend()}},20000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&P)loadOffers().then(navDraw)});
  if('Notification' in window&&Notification.permission==='default'&&pushOK())document.addEventListener('click',()=>pushSync(true),{once:true});
}
async function toggleOnline(){if(P.status!=='dang_hop_tac'&&!P.online)return toast('Tài khoản đang chờ KHG duyệt – chưa bật làm việc được',4000);
  if(!P.online&&GEO_ST!=='ok'){toast('Đang lấy vị trí của bạn…',2500);const r=await geoOnce(12000);

    $('#irok').onclick=()=>{const r=[($('#ir .on')||{}).textContent,$('#irn').value].filter(Boolean).join(' – ');if(!r)return toast('Chọn hoặc nhập sự cố');closeSheet();setSt('su_co',r,null,ic)}}}
function cancelSheet(o){sheet(`<h3>Hủy chuyến ${esc(o.code)}?</h3><div class="warn">Hủy sau khi đã nhận sẽ <b>trừ 0,2 sao</b> và ghi vào KPI đối tác. Bắt buộc nêu lý do.</div>
  <div class="chips" id="cr">${['Xe hỏng đột xuất','Tài xế có việc gấp','Không liên lạc được người gửi','Hàng không đúng mô tả','Điểm lấy cấm tải / không vào được','Khác'].map(x=>`<button>${x}</button>`).join('')}</div>
  <textarea class="i" style="margin-top:10px" id="crn" rows="2" placeholder="Mô tả lý do (bắt buộc)"></textarea><div class="btns"><button class="btn g" onclick="closeSheet()">Không hủy</button><button class="btn" style="background:var(--r)" id="crok">Xác nhận hủy</button></div>`);
  $$('#cr button').forEach(b=>b.onclick=()=>{$$('#cr button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  $('#crok').onclick=()=>busy($('#crok'),async()=>{const r=[($('#cr .on')||{}).textContent,$('#crn').value.trim()].filter(Boolean).join(' – ');if(r.length<5)return toast('Chọn và mô tả lý do hủy');
    await rpc('khg_partner_cancel',{p_order:o.id,p_reason:r});closeSheet();closePage();toast('Đã hủy chuyến – điều phối KHG đã nhận thông báo',4000);P=await rpc('khg_partner_me');go('don')})}

// ============== THU NHẬP ==============
async function viewQuy(m){const now=new Date(Date.now()+7*36e5);const mf=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),1));
  const st=viewQuy.st=viewQuy.st||{from:iso(mf),to:today()};m.innerHTML='<div class="empty">Đang tính…</div>';
  const r=await rpc('khg_partner_report',{p_from:st.from,p_to:st.to});const t=r.tot||{};const com=r.mode==='pct'&&t.gross!=null?Math.max(0,(+t.gross||0)-(+t.income||0)):null;
  m.innerHTML=`<div class="wallet"><div class="sm">Thu nhập ${fmtD(st.from)} – ${fmtD(st.to)}</div><div class="big">${fmtM(t.income)}</div>
    <div class="row"><div>Chuyến hoàn thành<b>${fmtN(t.n)}</b></div><div>Chờ KHG thanh toán<b>${fmtM(r.unpaid)}</b></div>${com!=null?`<div>Hoa hồng KHG<b>${fmtM(com)}</b></div>`:''}</div></div>
   <div class="card"><div class="bd" style="display:flex;gap:8px;align-items:center"><input class="i" type="date" id="qf" value="${st.from}"><span>–</span><input class="i" type="date" id="qt" value="${st.to}"></div></div>
   <div class="card"><div class="li"><div class="t"><b>Cách tính tiền chuyến</b><small>${r.mode==='pct'?`Bạn nhận ${100-(+r.pct||0)}% giá cước · hoa hồng KHG ${+r.pct||0}%${com!=null?` · tổng cước ${fmtM(t.gross)}`:''}`:'Theo bảng giá dịch vụ đã ký với KHG'}</small></div></div>
    <a class="li" href="/doi-tac.html#settle" style="text-decoration:none;color:inherit"><div class="t"><b>Đối soát & thanh toán</b><small>Xác nhận bảng kê từng kỳ, xem lịch thanh toán</small></div>›</a></div>
   <h4 style="margin:14px 4px 6px">Thống kê thu nhập theo ngày</h4>
   <div class="card">${(r.days||[]).length?(r.days||[]).map(d=>`<div class="li"><div class="t"><b>${fmtD(d.d)}</b><small>${d.n} chuyến</small></div><b>${fmtM(d.income)}</b></div>`).join(''):'<div class="empty" style="padding:30px">Chưa có chuyến hoàn thành trong kỳ</div>'}</div>`;
  const ch=()=>{st.from=$('#qf').value||st.from;st.to=$('#qt').value||st.to;viewQuy(m)};$('#qf').onchange=ch;$('#qt').onchange=ch}

// ============== ĐÁNH GIÁ / KPI ==============
async function viewKpi(m){m.innerHTML='<div class="empty">Đang tải…</div>';const r=await rpc('khg_partner_report',{p_from:iso(new Date(Date.now()-30*864e5)),p_to:today()});
  const s=+r.rating||5,lv=s>=4.7?'Xuất sắc':s>=4.3?'Tốt':s>=3.8?'Trung bình':'Cần cải thiện';const K={huy:'Hủy chuyến',tre:'Trễ hẹn',hong_hang:'Hư hỏng hàng',mat_hang:'Mất/thiếu hàng',khieu_nai:'Khách khiếu nại',phat:'Bị phạt',khen:'Khách khen',danh_gia:'Đánh giá'};
  m.innerHTML=`<div class="card"><div class="bd" style="text-align:center"><div class="stars">${'★'.repeat(Math.round(s))}${'☆'.repeat(5-Math.round(s))}</div><div style="font-size:26px;font-weight:800">${s.toFixed(1).replace('.',',')}</div><div class="pill" style="margin-top:4px">⭐ ${lv}</div>
    <div class="bar" style="margin-top:12px"><i style="width:${Math.round(s/5*100)}%"></i></div></div></div>
   <div class="card">${[['Tổng chuyến đã chạy cho KHG',fmtN(r.trips_done||0)],['Chuyến hoàn thành 30 ngày',fmtN(r.tot?.n||0)],['Hủy chuyến 30 ngày',fmtN(r.cancels||0)]].map(([a,b])=>`<div class="li"><div class="t">${a}</div><b>${b}</b></div>`).join('')}</div>
   <h4 style="margin:14px 4px 6px">Cách KHG đánh giá đối tác</h4>
   <div class="card"><div class="bd sm">Điểm 100: <b>Đúng hẹn 30</b> · <b>Không hủy/nhả đơn 20</b> · <b>Chứng từ đúng hạn 20</b> · <b>Không sự cố 15</b> · <b>Sao đánh giá 15</b>. Hạng A ≥ 85 được ưu tiên phát đơn sớm và đơn giá tốt; mỗi lần hủy sau khi nhận trừ 0,2 sao.</div></div>
   <h4 style="margin:14px 4px 6px">Ghi nhận gần đây</h4>
   <div class="card">${(r.events||[]).length?(r.events||[]).map(e=>`<div class="li"><div class="t"><b>${esc(K[e.kind]||e.kind)}${e.stars?' '+e.stars+'★':''}</b><small>${esc(e.reason||'')}</small></div><span class="sm mut">${fmtD(e.at)}</span></div>`).join(''):'<div class="empty" style="padding:30px">Chưa có ghi nhận – tiếp tục giữ phong độ!</div>'}</div>`}


// ============== HỒ SƠ & GIẤY TỜ (tải lên dần: ảnh, scan PDF, video) ==============
const DOCS=[['cccd','🪪 CCCD người đại diện (2 mặt)'],['bang_lai','🚦 GPLX tài xế'],['dang_ky_xe','📄 Đăng ký xe'],['dang_kiem','🔧 Đăng kiểm xe'],['bao_hiem','🛡 Bảo hiểm xe'],['hinh_xe','🚛 Ảnh xe, bãi xe (thấy rõ biển số)'],
  ['phu_hieu','🏷 Phù hiệu / Giấy phép KD vận tải'],['giay_phep_kd','🏢 Giấy phép kinh doanh (nếu có)'],['hop_dong','📝 Hợp đồng hợp tác đã ký (chụp / scan)'],['video','🎬 Video (ký hợp đồng, xe, bãi…)'],['khac','📎 Giấy tờ khác']];
async function docsPage(){const L=await rpc('khg_partner_my_files').catch(e=>{toast(e.message);return []});const by={};L.forEach(f=>(by[f.doc]=by[f.doc]||[]).push(f));
  let urls={};const img=L.filter(f=>/^image\//.test(f.mime||''));if(img.length){const {data}=await sb.storage.from('khg-files').createSignedUrls(img.map(f=>f.path),3600);(data||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl})}
  page(`<div class="phead w"><button class="back" id="pb">←</button><h2>Hồ sơ & giấy tờ</h2></div><div style="padding:10px">
    <div class="card"><div class="bd sm">Tải dần từng mục – chụp ảnh, chọn file scan (PDF) hoặc quay video đều được. KHG xem và xác nhận; giấy tờ còn thiếu không ảnh hưởng việc nhận đơn khi CEO đã duyệt tài khoản.</div></div>
    ${DOCS.map(([k,l])=>{const fs=by[k]||[];return `<div class="card"><div class="li" style="border:0"><div class="t"><b>${l}</b><small>${fs.length?`<span style="color:var(--g)">✓ đã tải ${fs.length} tệp</span>`:'Chưa có'}</small></div><button class="btn w" style="width:auto;padding:8px 12px" data-up="${k}">⬆ Tải lên</button></div>
      ${fs.length?`<div class="photos" style="padding:0 14px 12px">${fs.map(f=>/^image\//.test(f.mime||'')&&urls[f.path]?`<img src="${urls[f.path]}" alt="" loading="lazy">`:`<div style="aspect-ratio:1;border-radius:8px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;padding:4px">${/video/.test(f.mime||'')?'🎬':'📄'}<br>${esc(String(f.name||'').slice(0,18))}</div>`).join('')}</div>`:''}</div>`}).join('')}</div>`);
  $('#pb').onclick=()=>{closePage();go(TAB)};
  $$('[data-up]').forEach(b=>b.onclick=()=>{const k=b.dataset.up;const i=document.createElement('input');i.type='file';i.multiple=true;i.accept=k==='video'?'video/*':'image/*,application/pdf,video/*';
    i.onchange=()=>busy(b,async()=>{const fs=[...i.files];if(!fs.length)return;for(const file of fs){if(file.size>80*1024*1024)throw new Error(file.name+' lớn hơn 80MB – quay ngắn lại hoặc gửi qua Zalo cho KHG');
      const f=/^image\//.test(file.type)?await shrink(file,2000):file;const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'bin';
      const path=`partner/${P.id}/hoso/${Date.now()}-${k}.${/^image\//.test(file.type)?'jpg':ext}`;b.textContent='Đang tải…';
      const {error}=await sb.storage.from('khg-files').upload(path,f,{contentType:f.type||file.type||'application/octet-stream',upsert:false});if(error)throw new Error(error.message);
      await rpc('khg_partner_add_file',{p_type:'partner',p_id:P.id,p_doc:k,p_path:path,p_name:file.name,p_mime:f.type||file.type,p_size:f.size,p_lat:null,p_lng:null})}
      toast('Đã tải lên '+fs.length+' tệp');docsPage()});i.click()})}

// ============== TÀI KHOẢN ==============
async function viewMe(m){P=await rpc('khg_partner_me');const ok=P.status==='dang_hop_tac';
  m.innerHTML=`<div class="card"><div class="bd" style="text-align:center"><div class="logo" style="margin:4px auto 8px;width:64px;height:64px;border-radius:50%;font-size:26px;color:#fff;font-weight:800;background:linear-gradient(150deg,#0A6E5C,#12A087)">${esc((P.short_name||P.name||'?').trim().charAt(0).toUpperCase())}</div>
    <b style="font-size:18px">${esc(P.short_name||P.name)}</b><div class="sm mut">${esc(P.code||'')} · ${esc(P.phone||'')}</div>
    <div style="margin-top:8px"><span class="tag ${ok?'g':'o'}">${ok?'✓ Đã duyệt hợp tác':'⏳ Chờ CEO KHG duyệt'}</span> <span class="tag">${P.vehicles_ready||0}/${P.vehicles||0} xe sẵn sàng</span> <span class="tag">${P.drivers||0} tài xế</span></div></div></div>
   <div class="card">${[['/doi-tac.html#fleet','🚛 Đội xe & tài xế','Thêm xe, tài xế – xe mới cần KHG duyệt'],['/doi-tac.html#settle','🧾 Đối soát','Bảng kê và thanh toán từng kỳ'],['/doi-tac.html#money','📒 Sổ thu chi xe','Chi phí, lãi từng xe mỗi tháng']].map(([h,a,b])=>`<a class="li" href="${h}" style="text-decoration:none;color:inherit"><div class="t"><b>${a}</b><small>${b}</small></div>›</a>`).join('')}
    <div class="li" id="ntL" style="cursor:pointer"><div class="t"><b>🔔 Thông báo & định vị</b><small>${PUSH_ST==='ok'?'Thông báo: đã bật':'Thông báo: chưa bật'} · ${GEO_ST==='ok'?'Định vị: đã bật':'Định vị: chưa bật'}</small></div>›</div><div class="li" id="kpiL" style="cursor:pointer"><div class="t"><b>⭐ Đánh giá & KPI</b><small>Sao, tỷ lệ hủy, ghi nhận của KHG</small></div>›</div><div class="li"><div class="t"><b>💹 Cách tính tiền chuyến</b><small>${P.commission_mode==='bang_gia'?'Theo bảng giá dịch vụ đã ký':`Hoa hồng KHG ${+P.commission_pct||0}% · bạn nhận ${100-(+P.commission_pct||0)}% giá cước`}</small></div></div>
    <a class="li" href="tel:0399831228" style="text-decoration:none;color:inherit"><div class="t"><b>☎️ Trợ giúp – điều phối KHG</b><small>0399 831 228</small></div>›</a>
    <div class="li" id="ins" style="cursor:pointer"><div class="t"><b>📲 Cài app lên màn hình chính</b><small>Mở nhanh như ứng dụng, nhận chuông đơn mới</small></div>›</div></div>
   <button class="btn g" id="out">Đăng xuất</button><div style="text-align:center;margin:14px 0 4px">${LOGO(40)}</div><p class="sm mut" style="text-align:center;margin-top:4px">Nhận Hàng Nhanh · nền tảng nhận đơn vận tải của Công ty TNHH Kim Hoàng Gia</p>`;
  $('#kpiL').onclick=()=>go('kpi');$('#ntL').onclick=()=>noticesPage();
  $('#out').onclick=async()=>{try{if(P.online)await rpc('khg_partner_online',{p_on:false})}catch(e){}try{if(GEO_W!=null)navigator.geolocation.clearWatch(GEO_W)}catch(e){}GEO_W=null;try{const r=SWR||await swReg();const sub=r&&await r.pushManager.getSubscription();if(sub)await sub.unsubscribe()}catch(e){}PUSH_ST='?';await sb.auth.signOut();P=null;clearInterval(POLL);authView('ph')};
  $('#ins').onclick=()=>{if(window._bip){window._bip.prompt();window._bip=null}else toast(/iPhone|iPad/.test(navigator.userAgent)?'Safari: bấm Chia sẻ → Thêm vào MH chính':'Trình duyệt: menu ⋮ → Cài đặt ứng dụng / Thêm vào màn hình chính',5000)}}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._bip=e});
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistration('/').then(r=>{}).catch(()=>{});

(async()=>{const {data}=await sb.auth.getSession();const s=data?.session;
  if(s&&String(s.user.email||'').endsWith(DOMAIN)&&!(qs('sdt')&&normPhone(qs('sdt'))+DOMAIN!==s.user.email))boot();else{if(s)await sb.auth.signOut();authView(qs('sdt')||qs('u')?'pw':'ph')}})();
</script>
