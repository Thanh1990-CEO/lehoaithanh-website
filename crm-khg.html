async function kycReview(type,id,after){
  modal('<div class="empty">Đang tải hồ sơ…</div>',true);
  const {data:X,error}=await sb.rpc('khg_kyc_detail',{p_type:type,p_id:id});if(error){modal('<div class="empty">'+esc(error.message)+'</div><div class="acts"><button class="btn" onclick="closeModal()">Đóng</button></div>');return}
  const r=X.rec,K=X.kyc,files=X.files||[],ag=(X.agreements||[]).find(a=>a.status==='hieu_luc')||(X.agreements||[])[0];
  const paths=[...files.map(f=>f.file_path),...(ag?[ag.signature_path,ag.portrait_path]:[]),...(X.violations||[]).flatMap(v=>v.evidence_paths||[])];
  const {data:su}=paths.length?await sb.storage.from(BUCKET).createSignedUrls([...new Set(paths)],1800):{data:[]};const U={};(su||[]).forEach(x=>{if(x.signedUrl)U[x.path]=x.signedUrl});
  const by={};files.forEach(f=>(by[f.doc_type]=by[f.doc_type]||[]).push(f));
  const img=(p,cap,big)=>U[p]?`<a href="${U[p]}" target="_blank" class="kimg ${big?'big':''}">${/\.pdf$/i.test(p)?'<div class="pdf">PDF</div>':`<img src="${U[p]}" loading="lazy">`}<span>${esc(cap||'')}</span></a>`:'';
  const first=k=>(by[k]||[])[0];const cmp=[[first('cccd_truoc')||first('cccd'),'CCCD mặt trước'],[(by.selfie_xac_thuc||[])[0],'Khuôn mặt (nhìn thẳng)'],[ag?{file_path:ag.portrait_path}:null,'Chân dung khi ký']].filter(x=>x[0]);
  const isP=type==='partner';const map=(a,b)=>a&&b?` · <a target="_blank" href="https://www.google.com/maps?q=${a},${b}">📍 bản đồ</a>`:'';
  const info=isP?[['Mã',r.code],['Tên',r.name],['Loại hình',O.partner_kind?.[r.kind]||r.kind],['Người đại diện',r.rep_name],['CCCD',r.id_number],['Ngày cấp / nơi cấp',[fmtD(r.rep_id_issued_on),r.rep_id_issued_place].filter(Boolean).join(' · ')],['Ngày sinh',fmtD(r.rep_dob)],['MST / ĐKKD',r.tax_code],
      ['GP KD vận tải',[r.transport_license_no,fmtD(r.transport_license_date)].filter(Boolean).join(' · ')],['SĐT',r.phone],['Địa chỉ',r.address],['Ngân hàng',[r.bank_name,r.bank_no,r.bank_holder].filter(Boolean).join(' · ')],['Đăng ký lúc',fmtDT(r.created_at)]]
    :[['Mã',r.code],['Họ tên',r.full_name],['Ngày sinh',fmtD(r.dob)||r.birth_year],['CCCD',r.id_number],['Ngày cấp / nơi cấp',[fmtD(r.id_issued_on),r.id_issued_place].filter(Boolean).join(' · ')],['GPLX',[(r.license_class||[]).join('/'),r.license_no,r.license_until?'đến '+fmtD(r.license_until):''].filter(Boolean).join(' · ')],
      ['MST cá nhân',r.tax_code],['Ngân hàng',[r.bank_name,r.bank_no,r.bank_holder].filter(Boolean).join(' · ')],['SĐT',r.phone],['Địa chỉ',[r.address,r.province].filter(Boolean).join(', ')],['Vị trí gần nhất',r.last_loc_at?ago(r.last_loc_at)+map(r.last_lat,r.last_lng):(r.loc_denied_at?'Tài xế từ chối chia sẻ vị trí':'–')],['Đăng ký lúc',fmtDT(r.created_at)]];
  const nameOk=!isP&&r.bank_holder&&r.full_name&&r.bank_holder.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toUpperCase().trim()!==r.full_name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toUpperCase().trim();
  modal(`<h3>🛡️ Hồ sơ ${tName(type)} · ${esc(isP?r.name:r.full_name)} ${pill('kyc_status',r.kyc_status)} ${isP?pill('partner_status',r.status):pill('fd_status',r.status)}</h3>
   ${r.kyc_note?`<div class="warn" style="margin:8px 0">${esc(r.kyc_note)}</div>`:''}
   <div class="grid2" style="align-items:start"><div class="card"><h3>Thông tin khai báo</h3><table class="kv">${info.map(([k,v])=>`<tr><td>${k}</td><td>${v||'<span style="color:var(--red)">thiếu</span>'}</td></tr>`).join('')}</table>
      ${nameOk?'<div class="warn" style="margin-top:8px">⚠️ Tên chủ tài khoản ngân hàng khác họ tên tài xế.</div>':''}</div>
    <div class="card"><h3>Danh mục hồ sơ · ${K.items.length-K.missing}/${K.items.length}</h3>${K.items.map(x=>`<div style="padding:4px 0">${x.ok?'✅':'❌'} ${esc(x.l)}</div>`).join('')}
      ${X.exams?`<h3 style="margin-top:12px">Bài thi</h3>${X.exams.map(e=>`<div>${e.passed?'✅':'❌'} ${e.score}/${e.total} · sai điểm liệt ${e.critical_wrong} · ${fmtDT(e.at)}</div>`).join('')||'<div class="sub">Chưa thi</div>'}`:''}</div></div>
   ${cmp.length?`<h3 style="margin-top:14px">Đối chiếu khuôn mặt</h3><p class="sub">So sánh ảnh CCCD với ảnh chụp trực tiếp và chân dung khi ký – phải là cùng một người.</p><div class="kgrid">${cmp.map(([f,c])=>img(f.file_path,c,true)).join('')}</div>`:''}
   ${(by.selfie_xac_thuc||[]).length?`<h3 style="margin-top:14px">Các khung hình xác thực (${by.selfie_xac_thuc.length})</h3><div class="kgrid">${by.selfie_xac_thuc.map(f=>img(f.file_path,f.file_name.replace(/^\d+-/,'').replace(/\.jpg$/,'')+' · '+fmtDT(f.created_at))).join('')}</div>`:''}
   <h3 style="margin-top:14px">Giấy tờ & hình ảnh</h3>${Object.entries(by).filter(([k])=>!['selfie_xac_thuc','chu_ky','anh_ky_cam_ket'].includes(k)).map(([k,a])=>`<div class="sub" style="margin-top:8px"><b>${esc(O.doc_kyc[k]||k)}</b> (${a.length})</div><div class="kgrid">${a.map(f=>img(f.file_path,fmtDT(f.created_at)+(f.lat?' · có GPS':''))).join('')}</div>`).join('')||'<div class="sub">Chưa có.</div>'}
   ${ag?`<h3 style="margin-top:14px">Văn bản ký điện tử</h3><div class="card"><b>${esc(ag.title)}</b> · v${esc(ag.template_version)} ${pill('x',ag.status==='hieu_luc'?'Hiệu lực':ag.status)}<div class="sub">Người ký: ${esc(ag.signer_name)} · CCCD ${esc(ag.signer_id_number||'')} · ${fmtDT(ag.signed_at)}${ag.ip?' · IP '+esc(ag.ip):''}${map(ag.lat,ag.lng)}</div>
      <div class="kgrid" style="margin-top:8px">${img(ag.signature_path,'Chữ ký',true)}${img(ag.portrait_path,'Chân dung khi ký',true)}</div><div class="sub" style="margin-top:6px">SHA-256: <code style="word-break:break-all">${esc(ag.doc_hash)}</code></div>
      <details style="margin-top:6px"><summary>Xem toàn văn</summary><div style="white-space:pre-wrap;font-size:13px;margin-top:6px">${esc(ag.body)}</div></details></div>`:''}
   ${isP?`<h3 style="margin-top:14px">Xe (${(X.vehicles||[]).length}) · Tài xế (${(X.drivers||[]).length})</h3><div class="sub">${(X.vehicles||[]).map(v=>esc(v.plate)+' '+(v.load_t?v.load_t+'t':'')+(v.inspection_until?' · ĐK '+fmtD(v.inspection_until):'')).join(' · ')||'–'}</div><div class="sub">${(X.drivers||[]).map(d=>esc(d.full_name)+' ('+esc((d.license_class||[]).join('/'))+(d.license_until?' đến '+fmtD(d.license_until):'')+')').join(' · ')||'–'}</div>`:''}
   ${(X.violations||[]).length?`<h3 style="margin-top:14px">Vi phạm (${X.violations.length})</h3>${X.violations.map(v=>`<div class="sub">${esc(v.code)} · ${esc(O.vio_kind[v.kind]||v.kind)} · ${esc(O.vio_sev[v.severity]||'')} ${v.amount>0?'· '+fmtM(v.amount):''} · ${esc(O.vio_status[v.status]||v.status)}</div>`).join('')}`:''}

   try{
    if(n==='q'){await loadA();const ext=A.filter(a=>['doi_tac','fast_driver'].includes(a.kind));const c=(f)=>A.filter(f).length;const wk=Date.now()-7*864e5;
      const [{data:pk},{data:fk}]=await Promise.all([sb.from('khg_partners').select('id,kyc_submitted_at').is('archived_at',null),sb.from('khg_fd_drivers').select('id,kyc_submitted_at').is('archived_at',null)]);

        <div class="kpi ${c(a=>a.kyc_status==='cho_duyet')?'hot':''}"><div class="l">Chờ duyệt hồ sơ</div><div class="v">${c(a=>a.kyc_status==='cho_duyet')}</div><div class="h">Cần bổ sung ${c(a=>a.kyc_status==='bo_sung')} · Chưa nộp ${c(a=>a.kyc_status==='chua_nop')}</div></div>

        $$('#aT [data-rv]').forEach(b=>b.onclick=()=>{const a=rows[+b.dataset.rv];kycReview(a.kind==='doi_tac'?'partner':'fd',a.id,()=>sw('all'))});

        $$('#aT [data-lk]').forEach(b=>b.onclick=async()=>{const a=rows[+b.dataset.lk];const why=a.banned?'':prompt('Lý do khóa tài khoản '+a.name+':');if(!a.banned&&why===null)return;

const CRing=(()=>{let ac=null,timer=null,el=null,n=0;
  const on=()=>{try{return localStorage.getItem('khg_ring')!=='0'}catch(e){return true}};
  const unlock=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}};
  ['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
  const beep=()=>{if(!ac)return;try{const t=ac.currentTime;[[988,0],[740,.2],[988,.4],[740,.6],[1175,.8]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.7,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.19)})}catch(e){}};
  const stop=()=>{clearInterval(timer);timer=null;if(el){el.remove();el=null}try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}};
  const start=(title,body,onOpen)=>{if(!on())return;stop();unlock();el=document.createElement('div');el.className='cring';
    el.innerHTML=`<div class="cr-bx"><div class="cr-ic">🔔</div><b>${esc(title)}</b><p>${esc(body||'')}</p><div class="acts" style="justify-content:center"><button class="btn" data-x>Tắt chuông</button><button class="btn p" data-o>Xem ngay</button></div></div>`;
    document.body.appendChild(el);el.querySelector('[data-x]').onclick=stop;el.querySelector('[data-o]').onclick=()=>{stop();onOpen&&onOpen()};
    n=0;beep();try{navigator.vibrate&&navigator.vibrate([500,200,500])}catch(e){}timer=setInterval(()=>{beep();if(++n>60)stop()},1500);
    try{if('Notification' in window&&Notification.permission==='granted'&&document.visibilityState!=='visible')new Notification(title,{body:body||'',requireInteraction:true,tag:'khg-crm'})}catch(e){}};
  return {start,stop,on,set:v=>{try{localStorage.setItem('khg_ring',v?'1':'0')}catch(e){}}}})();

VIEWS.trash=async m=>{
  const T=Object.entries(E).filter(([k,c])=>c.table).map(([k,c])=>[k,c.title]);
  const st=STATE.trash=STATE.trash||{t:'orders'};
  m.innerHTML=`<h2>Thùng lưu trữ</h2><p class="sub">Dữ liệu đã “lưu trữ” (thay cho xóa) – không mất, không hiện trong danh sách và báo cáo. Chỉ quản trị xem và khôi phục. Chọn nhiều dòng để khôi phục cùng lúc.</p>
   <div class="bar"><select id="tt">${T.map(([k,l])=>`<option value="${k}" ${st.t===k?'selected':''}>${esc(l)}</option>`).join('')}</select><span class="srch"><input type="search" id="tq" placeholder="Lọc nhanh…"></span><span style="flex:1"></span><button class="btn" id="tall">Chọn tất cả</button><button class="btn p" id="tres">↩ Khôi phục đã chọn</button></div><div class="tw" id="tw"><div class="empty">Đang tải…</div></div>`;
  let rows=[];
  const load=async()=>{const cfg=E[st.t];await ensureRefs(cfg);const {data,error}=await sb.rpc('khg_archived',{p_table:cfg.table});if(error){$('#tw').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}
    rows=(data||[]);const cols=fields(cfg).filter(x=>x.list).slice(0,6);const q=$('#tq').value.toLowerCase();
    const vis=rows.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));
    $('#tw').innerHTML=vis.length?`<table><thead><tr><th class="ck"><input type="checkbox" id="tck"></th><th>Lưu trữ lúc</th><th>Người lưu trữ</th>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th></th></tr></thead><tbody>${vis.map(r=>`<tr class="rw"><td class="ck"><input type="checkbox" data-id="${r.id}"></td><td>${fmtDT(r.archived_at)}</td><td>${esc((REF.people||{})[r.archived_by]||'')}</td>${cols.map(c=>`<td>${cell(c,r[c.k],r,cfg)}</td>`).join('')}<td><button class="btn s" data-r="${r.id}">↩ Khôi phục</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Không có dữ liệu lưu trữ.</div>';
    $('#tck')&&($('#tck').onchange=e=>$$('#tw [data-id]').forEach(c=>c.checked=e.target.checked));
    $$('#tw [data-r]').forEach(b=>b.onclick=()=>restore([b.dataset.r]))};
  const restore=async ids=>{if(!ids.length)return toast('Chọn dòng cần khôi phục');let ok=0,err='';for(const id of ids){const {error}=await sb.rpc('khg_archive',{p_table:E[st.t].table,p_id:id,p_restore:true});if(error)err=error.message;else ok++}toast(`Đã khôi phục ${ok}`+(err?' · '+err:''));delete REF[st.t];load()};
  await ensureRef('people');
  $('#tt').onchange=e=>{st.t=e.target.value;load()};let tq;$('#tq').oninput=()=>{clearTimeout(tq);tq=setTimeout(load,250)};
  $('#tall').onclick=()=>$$('#tw [data-id]').forEach(c=>c.checked=true);$('#tres').onclick=()=>restore($$('#tw [data-id]').filter(c=>c.checked).map(c=>c.dataset.id));
  load();
};

    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿',doc],{type:'application/msword'}));a.download=XP.fname(title)+'.doc';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);

    for(const b of blocks){

      else if(b.p)content.push({text:b.p,fontSize:9.5,margin:[0,0,0,4]});

        content.push({table:{headerRows:1,widths:a[0].map(()=>'auto'),body:[a[0].map(c=>({text:String(c),bold:true,color:'#fff',fillColor:'#1F3864',fontSize:fs})),...a.slice(1).map(r=>r.map(c=>({text:XP.val(c),fontSize:fs,alignment:typeof c==='number'?'right':'left'})))]},layout:{hLineColor:'#bbb',vLineColor:'#bbb',hLineWidth:()=>.5,vLineWidth:()=>.5},margin:[0,0,0,8]})}
    }
    pdfMake.createPdf({pageSize:'A4',pageOrientation:opt.landscape||maxCols>7?'landscape':'portrait',pageMargins:[28,28,28,32],content,defaultStyle:{font:'Roboto'},

// ===================== v12 · BÁO GIÁ CHUẨN KHG 2026 (địa chỉ → km → giá) =====================
const QADDR={
  attach(inp){KADDR.attach(inp)},
  async geocode(q){return KADDR.geocode(q)},
  async route(inputs){ // inputs: các ô địa chỉ theo thứ tự
    const pts=[];for(const i of inputs){if(!i.value.trim())return null;if(!i._geo)i._geo=await QADDR.geocode(i.value.trim());if(!i._geo)return {error:'Không định vị được: '+i.value}; pts.push(i._geo)}
    try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>p.lng+','+p.lat).join(';')}?overview=false`);const j=await r.json();const rt=j.routes&&j.routes[0];if(rt)return {km:Math.ceil(rt.distance/1000),min:Math.round(rt.duration/60),src:'OSRM'}}catch(e){}
    try{const {data}=await sb.functions.invoke('khg-route',{body:{from:inputs[0].value,via:inputs.slice(1,-1).map(i=>i.value),to:inputs[inputs.length-1].value}});if(data&&data.km)return {km:data.km,min:data.minutes,src:'máy chủ KHG'}}catch(e){}
    return {error:'Không tính được tuyến – nhập km thủ công'};
  }
};

VIEWS.backup=async m=>{
  m.innerHTML=`<h2>Sao lưu & xuất dữ liệu</h2><p class="sub">Xuất toàn bộ dữ liệu ra file để lưu trữ an toàn ngoài hệ thống (máy tính, ổ đĩa, Google Drive). Khuyến nghị: <b>sao lưu Excel mỗi tuần</b> và <b>bản JSON mỗi tháng</b>. Mỗi danh sách trong CRM cũng có nút ⬇ Excel · Word · PDF.</p>

  const fetchAll=async(t)=>{const out=[];for(let from=0;from<50000;from+=1000){const {data,error}=await sb.from(t).select('*').range(from,from+999);if(error)return {error,rows:out};out.push(...(data||[]));if(!data||data.length<1000)break}return {rows:out}};

    for(const [t,l] of ts){st.textContent=`Đang đọc ${l}…`;const r=await fetchAll(t);res[t]={label:l,rows:r.rows,err:r.error?.message};counts.push({'Bảng':l,'Mã bảng':t,'Số dòng':r.rows.length,'Ghi chú':r.error?'Không có quyền đọc / lỗi: '+r.error.message:''})}
    st.textContent='Đang tạo file…';

    else{const bl=[{p:'Bản tóm tắt số lượng bản ghi theo từng bảng tại thời điểm xuất. Dữ liệu chi tiết xem file Excel/JSON sao lưu.'},{name:'Mục lục',rows:counts}];kind==='doc'?XP.word('Bao cao sao luu du lieu KHG',bl):await XP.pdf('Bao cao sao luu du lieu KHG',bl)}
    st.textContent=`Xong: ${counts.length} bảng, ${fmtN(sum(counts,c=>c['Số dòng']))} dòng. Bảng nằm ngoài quyền của bạn sẽ ghi chú trong mục lục.`};
  $('#bkX').onclick=()=>run('xls');$('#bkJ').onclick=()=>run('json');$('#bkW').onclick=()=>run('doc');$('#bkP').onclick=()=>run('pdf');
};

const svcQtyable=c=>c.price!=null&&Number(c.price)>0&&!c.price_max&&!/%|tháng tiền thuê|USD/.test(c.unit);
async function svcQuote(host,req){
  const {data:C}=await sb.from('khg_service_catalog').select('*').eq('active',true).order('sort');const CAT=C||[];
  const Q={};let grp=req?.grp||'kho';(req?.quote?.lines||[]).forEach(l=>Q[l.code]=l.qty);
  const st={ot:0,disc:0,vat:8};
  const draw=()=>{const rows=CAT.filter(c=>c.grp===grp);
    host.innerHTML=`<div class="bar"><label>Nhóm dịch vụ <select id="sqG">${Object.entries(O.svc_grp).map(([k,l])=>`<option value="${k}" ${k===grp?'selected':''}>${l}</option>`).join('')}</select></label>
      <label>Phụ phí ngoài giờ <select id="sqOt"><option value="0">Không</option><option value="50">17h–22h +50% (nhân công, thiết bị)</option><option value="100">Chủ nhật +100%</option><option value="200">Ngày lễ +200%</option></select></label>
      <label>Giảm giá % <input id="sqD" type="number" min="0" max="30" value="${st.disc}" style="width:70px"></label><label>VAT % <input id="sqV" type="number" value="${st.vat}" style="width:60px"></label>
      <span style="flex:1"></span>${XP.bar('sqXp')}</div>
     ${req?`<p class="sub">Báo giá cho yêu cầu <b>${esc(req.code)}</b> – ${esc(req.contact_name||'')} · ${esc(req.phone||'')} · ${esc(req.site_name||'')}${req.detail?'<br>'+esc(req.detail):''}</p><div id="sqMed"></div>`:''}
     <div class="tw"><table><thead><tr><th>Hạng mục</th><th class="n">Đơn giá</th><th>Đơn vị</th><th class="n">Số lượng</th><th class="n">Thành tiền</th></tr></thead><tbody>
      ${rows.map(c=>`<tr><td>${esc(c.name)} <span class="pill ${PILL[c.basis]||''}">${O.svc_basis[c.basis]||''}</span>${c.spec?`<div class="sub" style="margin:2px 0 0">${esc(c.spec)}</div>`:''}</td><td class="n">${svcPrice(c)}</td><td>${esc(c.unit)}</td>
        <td class="n">${svcQtyable(c)?`<input data-sq="${c.code}" value="${Q[c.code]||''}" style="width:80px;text-align:right">`:''}</td><td class="n" id="sa-${c.code}"></td></tr>`).join('')}
     </tbody></table></div><div class="kpis" id="sqK"></div>
     <div class="acts" style="justify-content:flex-start"><button class="btn" id="sqCp">📋 Sao chép nội dung báo giá</button>${req?'<button class="btn p" id="sqSv">💾 Lưu báo giá vào yêu cầu</button>':''}<a class="btn" href="dich-vu.html#${grp}" target="_blank" rel="noopener">🌐 Xem trang khách hàng</a></div>`;
    $('#sqG').onchange=e=>{grp=e.target.value;draw()};$('#sqOt').value=String(st.ot);$('#sqOt').onchange=e=>{st.ot=+e.target.value;calc()};$('#sqD').oninput=e=>{st.disc=+e.target.value||0;calc()};$('#sqV').oninput=e=>{st.vat=+e.target.value||0;calc()};
    host.querySelectorAll('[data-sq]').forEach(i=>i.oninput=()=>{Q[i.dataset.sq]=i.value;calc()});
    XP.bind('sqXp','Bao gia dich vu KHG',()=>{const r=calc();return [{kv:[['Khách hàng',req?.contact_name||''],['Địa điểm',req?.site_name||''],['Nhóm dịch vụ',O.svc_grp[grp]],['Tạm tính',fmtM(r.sub)],['Phụ phí ngoài giờ',fmtM(r.ot)],['Giảm giá',fmtM(r.dc)],['Cộng trước thuế',fmtM(r.net)],['VAT',fmtM(r.vt)],['Tổng thanh toán',fmtM(r.tot)]]},{h:'Chi tiết'},{name:'Báo giá',rows:r.L.map(l=>({'Hạng mục':l.name,'Đơn vị':l.unit,'Đơn giá':l.price,'Số lượng':l.qty,'Thành tiền':l.amount}))}]});
    $('#sqCp').onclick=()=>{const r=calc();const t=`BÁO GIÁ DỊCH VỤ – CÔNG TY TNHH KIM HOÀNG GIA\n${O.svc_grp[grp]}${req?'\nKhách hàng: '+(req.contact_name||'')+' · '+(req.site_name||''):''}\n`+r.L.map((l,i)=>`${i+1}. ${l.name}: ${fmtN(l.qty)} × ${fmtN(l.price)} đ (${l.unit}) = ${fmtM(l.amount)}`).join('\n')+
      `\nCộng: ${fmtM(r.sub)}${r.ot?'\nPhụ phí ngoài giờ: '+fmtM(r.ot):''}${r.dc?'\nGiảm giá: −'+fmtM(r.dc):''}\nTrước thuế: ${fmtM(r.net)} · VAT ${st.vat}%: ${fmtM(r.vt)}\nTỔNG: ${fmtM(r.tot)}\nGiá có hiệu lực 30 ngày. Hotline 0399 831 228.`;navigator.clipboard?.writeText(t).then(()=>toast('Đã sao chép'),()=>toast('Không sao chép được'))};
    const sv=$('#sqSv');if(sv)sv.onclick=async()=>{const r=calc();const {error}=await sb.from('khg_service_requests').update({quote:{lines:r.L,sub:r.sub,ot:r.ot,disc:r.dc,vat:r.vt,total:r.tot,grp},est_amount:Math.round(r.net),status:'bao_gia',updated_at:new Date().toISOString()}).eq('id',req.id);toast(error?error.message:'Đã lưu báo giá, chuyển trạng thái “Đã báo giá”')};
    calc();if(req?.media?.length&&typeof svcMedia==='function')svcMedia(req.media).then(h=>{const e=$('#sqMed');if(e)e.innerHTML='<b>Ảnh, video khách gửi</b>'+h})};
  const calc=()=>{const L=[];CAT.filter(c=>c.grp===grp&&svcQtyable(c)).forEach(c=>{const q=parseFloat(String(Q[c.code]||'').replace(',','.'))||0;const el=$('#sa-'+c.code);
      if(q>0){const a=Math.round(Math.max(q*Number(c.price),Number(c.min_charge)||0));L.push({code:c.code,name:c.name,unit:c.unit,qty:q,price:Number(c.price),amount:a,ot:['boc_xep','gtgt','xe_nang_thue','cau'].includes(c.grp)||/lượt|tấn/.test(c.unit)});if(el)el.textContent=fmtN(a)}else if(el)el.textContent=''});
    const sub=L.reduce((s,x)=>s+x.amount,0),ot=Math.round(L.filter(x=>x.ot).reduce((s,x)=>s+x.amount,0)*st.ot/100),dc=Math.round((sub+ot)*st.disc/100),net=sub+ot-dc,vt=Math.round(net*st.vat/100),tot=net+vt;
    const k=$('#sqK');if(k)k.innerHTML=`<div class="kpi"><div class="l">Cộng hạng mục</div><div class="v">${fmtTr(sub)}</div><div class="h">${L.length} dòng</div></div><div class="kpi"><div class="l">Trước thuế</div><div class="v">${fmtTr(net)}</div><div class="h">Ngoài giờ ${fmtTr(ot)} · giảm ${fmtTr(dc)}</div></div><div class="kpi hot"><div class="l">Tổng thanh toán</div><div class="v">${fmtM(tot)}</div><div class="h">VAT ${st.vat}%: ${fmtM(vt)}</div></div>`;
    return {L,sub,ot,dc,net,vt,tot}};
  draw();
}

async function crmReport(host){

    <div class="card"><h3>Lead theo mảng kinh doanh</h3>${bars(rows(grp(l,'business_line')),'v',x=>O.biz_line[x.name]||x.name,fmtN)}</div>

}

const DOC_SEED={"t": [{"object_type": "kh_van_tai", "code": "KHVT-HDNT", "kind": "hop_dong", "title": "HỢP ĐỒNG NGUYÊN TẮC DỊCH VỤ VẬN CHUYỂN HÀNG HÓA BẰNG XE Ô TÔ", "body": "Căn cứ Bộ luật Dân sự 2015; Luật Thương mại 2005; Luật Đường bộ 2024; Luật Trật tự, an toàn giao thông đường bộ 2024; Nghị định 158/2024/NĐ-CP về hoạt động vận tải đường bộ và nhu cầu của hai bên.\n[[BEN]]\n## Điều 1. Phạm vi dịch vụ\nBên A (KHG) nhận vận chuyển hàng hóa nguyên chuyến và/hoặc hàng ghép cho Bên B theo từng yêu cầu đặt xe. Yêu cầu đặt xe được gửi qua nhóm điều phối chung, email hoặc ứng dụng KHG, ghi rõ điểm nhận, điểm giao, loại hàng, khối lượng, thời gian. Yêu cầu được KHG xác nhận là căn cứ thực hiện và đối soát.\n## Điều 2. Giá cước và điều chỉnh\n- Giá cước theo Phụ lục bảng giá ký kèm hợp đồng này; giá chưa gồm thuế GTGT.\n- Khi giá dầu DO 0,05S do Liên Bộ Công Thương – Tài chính công bố thay đổi từ 5% trở lên so với giá cơ sở ghi tại phụ lục, đơn giá được điều chỉnh theo công thức tại phụ lục. KHG thông báo bằng văn bản trước khi áp dụng.\n## Điều 3. Chứng từ giao nhận\nTrước khi vận hành, Bên B thông báo bằng văn bản cho KHG yêu cầu về chứng từ: loại chứng từ, số liên, hình thức ký nhận, cách thức và thời hạn hoàn trả. KHG thực hiện theo yêu cầu đã được thông báo. Yêu cầu bổ sung, thay đổi sau đó được áp dụng khi hai bên đã thống nhất; chi phí phát sinh (nếu có) theo thỏa thuận.\n## Điều 4. Quyền và nghĩa vụ của KHG\n- Bố trí xe đúng tải trọng, đúng giờ, có đủ giấy tờ hợp lệ, phù hiệu, thiết bị giám sát hành trình; tài xế có giấy phép lái xe phù hợp.\n- Giao nhận theo số kiện, nguyên đai, nguyên kiện, niêm phong; thông báo ngay cho Bên B khi có sự cố.\n- Cập nhật trạng thái chuyến và chứng từ điện tử (ảnh POD) trên hệ thống.\n## Điều 5. Quyền và nghĩa vụ của Bên B\n- Cung cấp đúng, đủ thông tin hàng hóa; đóng gói phù hợp; không giao hàng cấm, hàng nguy hiểm khi chưa thỏa thuận.\n- Bố trí bốc xếp, ký nhận tại điểm nhận, điểm giao trong thời gian chờ miễn phí theo phụ lục.\n- Đối soát và thanh toán đúng hạn.\n## Điều 6. Đối soát và thanh toán\nHằng tháng, KHG gửi bảng kê chuyến kèm chứng từ; Bên B xác nhận trong 03 ngày làm việc (quá hạn không phản hồi được hiểu là đồng ý). Bên B thanh toán bằng chuyển khoản trong {{han_tt}} ngày kể từ ngày nhận hóa đơn GTGT. Chậm thanh toán chịu lãi theo Điều 306 Luật Thương mại 2005; công nợ quá hạn trên 15 ngày, KHG được tạm ngừng nhận đơn mới.\n## Điều 7. Trách nhiệm hàng hóa\nKHG bồi thường thiệt hại thực tế do lỗi của KHG. Hàng không khai báo giá trị: mức bồi thường tối đa bằng 10 lần cước chuyến; hàng có khai báo giá trị và mua bảo hiểm: theo giá trị khai báo. Không bồi thường thiệt hại gián tiếp. Khiếu nại ghi trên chứng từ giao hàng hoặc gửi bằng văn bản trong 24 giờ kể từ khi giao.\n## Điều khoản chung\n- Bất khả kháng: thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước và sự kiện khách quan khác không lường trước được theo Điều 156 Bộ luật Dân sự 2015. Bên gặp sự kiện phải thông báo cho bên kia trong vòng 24 giờ và áp dụng mọi biện pháp cần thiết để hạn chế thiệt hại.\n- Bảo mật: mỗi bên giữ bí mật thông tin về giá, khách hàng, hàng hóa và dữ liệu cá nhân nhận được trong quá trình hợp tác; xử lý dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP. Nghĩa vụ bảo mật còn hiệu lực 02 năm sau khi chấm dứt hợp đồng.\n- Thông báo: thông báo chính thức gửi qua email, ứng dụng của KHG hoặc văn bản đến địa chỉ ghi tại phần đầu hợp đồng; thông báo qua tin nhắn Zalo, Telegram của đầu mối được chỉ định có giá trị tham chiếu.\n- Tranh chấp: hai bên ưu tiên thương lượng, hòa giải trong 30 ngày; nếu không thành, tranh chấp được giải quyết tại Tòa án nhân dân có thẩm quyền nơi KHG đặt trụ sở.\n- Hiệu lực: hợp đồng có hiệu lực từ ngày ký, thời hạn {{thoi_han}} và tự động gia hạn từng 12 tháng nếu không bên nào thông báo chấm dứt trước 30 ngày. Mọi sửa đổi, bổ sung lập thành phụ lục có chữ ký hai bên. Hợp đồng lập 02 bản có giá trị như nhau, mỗi bên giữ 01 bản; bản điện tử ký số có giá trị như bản giấy.\n[[KY]]", "sort": 1}, {"object_type": "kh_van_tai", "code": "KHVT-PLGIA", "kind": "phu_luc", "title": "PHỤ LỤC BẢNG GIÁ CƯỚC VẬN CHUYỂN", "body": "Kèm theo Hợp đồng nguyên tắc số {{hd_goc}}.\n[[BEN]]\n## Điều 1. Bảng giá áp dụng\nHai bên thống nhất áp dụng bảng giá cước số {{so_bang_gia}} (đính kèm), hiệu lực từ ngày {{hieu_luc}}. Giá chưa gồm thuế GTGT; giá dầu cơ sở {{gia_dau}} đồng/lít.\n| Hạng mục | Nội dung |\n| Phương thức tính | {{cach_tinh}} |\n| Thời gian chờ miễn phí | 02 giờ tại mỗi điểm nhận, điểm giao |\n| Phụ phí | Theo mục phụ phí của bảng giá |\n## Điều 2. Điều chỉnh theo giá dầu\nĐơn giá mới = Đơn giá hiện hành × [1 + R × (Giá dầu mới ÷ Giá dầu cơ sở − 1)]; R = 35% với xe đến 5 tấn, 40% với xe trên 5 tấn.\n## Điều 3. Hiệu lực\nPhụ lục là phần không tách rời của hợp đồng, giữ nguyên tối thiểu 03 tháng (trừ điều chỉnh theo giá dầu).\n[[KY]]", "sort": 2}, {"object_type": "kh_van_tai", "code": "KHVT-KS", "kind": "khao_sat", "title": "PHIẾU KHẢO SÁT NHU CẦU VẬN CHUYỂN", "body": "Khách hàng: {{ben_b_ten}} · Người cung cấp thông tin: {{ben_b_dai_dien}} · Điện thoại: {{ben_b_dien_thoai}}\n| Nội dung | Thông tin khách hàng |\n| Loại hàng, quy cách đóng gói | |\n| Khối lượng, thể tích bình quân mỗi chuyến | |\n| Tuyến thường xuyên (điểm đi → điểm đến) | |\n| Tần suất (chuyến/ngày, tuần, tháng) | |\n| Loại xe yêu cầu (tải trọng, thùng kín/bạt, nâng hạ) | |\n| Khung giờ nhận, giao; khu vực cấm tải | |\n| Số điểm giao mỗi chuyến | |\n| Yêu cầu chứng từ (phiếu giao, hóa đơn, ký nhận, hoàn trả) | |\n| Yêu cầu bốc xếp, chờ, lưu đêm | |\n| Giá trị hàng, nhu cầu bảo hiểm | |\n| Phương thức, kỳ hạn thanh toán | |\n| Nhà vận tải đang dùng, điểm chưa hài lòng | |\nNgười khảo sát (KHG): {{nguoi_lap}} · Ngày: {{ngay}}", "sort": 3}, {"object_type": "kh_van_tai", "code": "KHVT-BBDS", "kind": "bien_ban", "title": "BIÊN BẢN ĐỐI SOÁT CƯỚC VẬN CHUYỂN", "body": "[[BEN]]\nHai bên cùng đối soát cước vận chuyển kỳ {{ky}} theo Hợp đồng số {{hd_goc}}:\n| Nội dung | Số tiền (đồng) |\n| Số chuyến trong kỳ | {{so_chuyen}} |\n| Cước vận chuyển | {{cuoc}} |\n| Phụ phí | {{phu_phi}} |\n| Thuế GTGT | {{vat}} |\n| Tổng cộng | {{tong}} |\n| Đã thanh toán | {{da_tt}} |\n| Còn phải thanh toán | {{con_lai}} |\nBảng kê chi tiết chuyến kèm theo biên bản này. Hai bên thống nhất số liệu trên làm căn cứ xuất hóa đơn và thanh toán.\n[[KY]]", "sort": 4}, {"object_type": "kh_kho", "code": "KHO-HDNT", "kind": "hop_dong", "title": "HỢP ĐỒNG DỊCH VỤ KHO BÃI, BỐC XẾP VÀ CHO THUÊ THIẾT BỊ NÂNG HẠ", "body": "Căn cứ Bộ luật Dân sự 2015, Luật Thương mại 2005 (Mục 6 – dịch vụ logistics) và nhu cầu của hai bên.\n[[BEN]]\n## Điều 1. Dịch vụ\nKHG cung cấp cho Bên B: {{dich_vu}} tại kho {{kho}}. Diện tích / vị trí, thời gian sử dụng, đơn giá theo phụ lục.\n## Điều 2. Nhập, xuất, kiểm đếm\nHàng nhập – xuất kho theo phiếu có chữ ký hai bên; kiểm đếm theo số kiện, nguyên đai nguyên kiện. Bên B gửi kế hoạch nhập – xuất trước 12 giờ. KHG báo tồn kho định kỳ trên hệ thống.\n## Điều 3. Trách nhiệm bảo quản\nKHG bảo quản hàng đúng điều kiện đã thỏa thuận, bảo đảm an ninh, PCCC. KHG không chịu trách nhiệm với hao hụt tự nhiên, hư hỏng do tính chất hàng, đóng gói không phù hợp hoặc sự kiện bất khả kháng. Bồi thường thiệt hại do lỗi KHG theo giá trị thực tế, tối đa bằng 12 tháng phí lưu kho của lô hàng nếu không mua bảo hiểm.\n## Điều 4. Bốc xếp, thiết bị nâng hạ\nBốc xếp, xe nâng, xe cẩu thực hiện theo yêu cầu; người vận hành có chứng chỉ phù hợp; thiết bị được kiểm định an toàn. Bên B cung cấp thông tin trọng lượng, điểm móc cẩu và sơ đồ xếp hàng.\n## Điều 5. Thanh toán\nPhí tính theo tháng hoặc theo lượt tại phụ lục; thanh toán trong {{han_tt}} ngày kể từ ngày nhận hóa đơn. Quá hạn 30 ngày, KHG được quyền tạm giữ hàng tương ứng giá trị công nợ theo Điều 239 Luật Thương mại 2005 sau khi thông báo.\n## Điều 6. Hàng cấm và PCCC\nBên B cam kết hàng gửi không thuộc danh mục cấm kinh doanh, không phải hàng nguy hiểm khi chưa khai báo; chịu trách nhiệm pháp lý về nguồn gốc hàng hóa.\n## Điều khoản chung\n- Bất khả kháng: thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước và sự kiện khách quan khác không lường trước được theo Điều 156 Bộ luật Dân sự 2015. Bên gặp sự kiện phải thông báo cho bên kia trong vòng 24 giờ và áp dụng mọi biện pháp cần thiết để hạn chế thiệt hại.\n- Bảo mật: mỗi bên giữ bí mật thông tin về giá, khách hàng, hàng hóa và dữ liệu cá nhân nhận được trong quá trình hợp tác; xử lý dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP. Nghĩa vụ bảo mật còn hiệu lực 02 năm sau khi chấm dứt hợp đồng.\n- Thông báo: thông báo chính thức gửi qua email, ứng dụng của KHG hoặc văn bản đến địa chỉ ghi tại phần đầu hợp đồng; thông báo qua tin nhắn Zalo, Telegram của đầu mối được chỉ định có giá trị tham chiếu.\n- Tranh chấp: hai bên ưu tiên thương lượng, hòa giải trong 30 ngày; nếu không thành, tranh chấp được giải quyết tại Tòa án nhân dân có thẩm quyền nơi KHG đặt trụ sở.\n- Hiệu lực: hợp đồng có hiệu lực từ ngày ký, thời hạn {{thoi_han}} và tự động gia hạn từng 12 tháng nếu không bên nào thông báo chấm dứt trước 30 ngày. Mọi sửa đổi, bổ sung lập thành phụ lục có chữ ký hai bên. Hợp đồng lập 02 bản có giá trị như nhau, mỗi bên giữ 01 bản; bản điện tử ký số có giá trị như bản giấy.\n[[KY]]", "sort": 1}, {"object_type": "kh_kho", "code": "KHO-PLGIA", "kind": "phu_luc", "title": "PHỤ LỤC ĐƠN GIÁ DỊCH VỤ KHO BÃI, BỐC XẾP", "body": "Kèm theo Hợp đồng số {{hd_goc}}.\n[[BEN]]\n| Dịch vụ | Đơn vị tính | Đơn giá (đồng, chưa VAT) |\n| Lưu kho | m²/tháng hoặc pallet/tháng | {{gia_luu_kho}} |\n| Bốc xếp | tấn/lượt | {{gia_boc_xep}} |\n| Rút ruột container | container | {{gia_rut_cont}} |\n| Xe nâng | giờ / ca | {{gia_xe_nang}} |\n| Xe cẩu | giờ / ca | {{gia_xe_cau}} |\nThời gian làm việc: {{gio_lam}}. Làm ngoài giờ, ngày lễ cộng thêm theo thỏa thuận.\n[[KY]]", "sort": 2}, {"object_type": "kh_kho", "code": "KHO-BBBG", "kind": "bien_ban", "title": "BIÊN BẢN BÀN GIAO MẶT BẰNG / VỊ TRÍ KHO", "body": "[[BEN]]\nHôm nay, tại kho {{kho}}, hai bên bàn gi eo hạn mức {{han_muc}} đồng và thời hạn {{han_tt}} ngày tại Cam kết công nợ. Quá hạn, KHG được tạm ngừng giao đơn mới.\n## Điều 6. Trách nhiệm bán hàng\nBên B bán đúng giá niêm yết đề xuất, không bán hàng giả, hàng nhái, hàng hết hạn; bảo quản hàng theo hướng dẫn; hỗ trợ trưng bày, tiếp nhận chương trình của KHG và nhãn hàng.\n## Điều khoản chung\n- Bất khả kháng: thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước và sự kiện khách quan khác không lường trước được theo Điều 156 Bộ luật Dân sự 2015. Bên gặp sự kiện phải thông báo cho bên kia trong vòng 24 giờ và áp dụng mọi biện pháp cần thiết để hạn chế thiệt hại.\n- Bảo mật: mỗi bên giữ bí mật thông tin về giá, khách hàng, hàng hóa và dữ liệu cá nhân nhận được trong quá trình hợp tác; xử lý dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP. Nghĩa vụ bảo mật còn hiệu lực 02 năm sau khi chấm dứt hợp đồng.\n- Thông báo: thông báo chính thức gửi qua email, ứng dụng của KHG hoặc văn bản đến địa chỉ ghi tại phần đầu hợp đồng; thông báo qua tin nhắn Zalo, Telegram của đầu mối được chỉ định có giá trị tham chiếu.\n- Tranh chấp: hai bên ưu tiên thương lượng, hòa giải trong 30 ngày; nếu không thành, tranh chấp được giải quyết tại Tòa án nhân dân có thẩm quyền nơi KHG đặt trụ sở.\n- Hiệu lực: hợp đồng có hiệu lực từ ngày ký, thời hạn {{thoi_han}} và tự động gia hạn từng 12 tháng nếu không bên nào thông báo chấm dứt trước 30 ngày. Mọi sửa đổi, bổ sung lập thành phụ lục có chữ ký hai bên. Hợp đồng lập 02 bản có giá trị như nhau, mỗi bên giữ 01 bản; bản điện tử ký số có giá trị như bản giấy.\n[[KY]]", "sort": 1}, {"object_type": "diem_ban", "code": "DB-PLCS", "kind": "phu_luc", "title": "PHỤ LỤC CHÍNH SÁCH GIÁ, CHIẾT KHẤU VÀ TRƯNG BÀY", "body": "Kèm theo Hợp đồng số {{hd_goc}} · Áp dụng từ {{hieu_luc}} đến {{den_ngay}}.\n[[BEN]]\n| Nội dung | Chính sách |\n| Bảng giá áp dụng | {{bang_gia}} |\n| Chiết khấu theo đơn | {{ck_don}} |\n| Thưởng doanh số tháng | {{thuong_ds}} |\n| Hỗ trợ trưng bày | {{trung_bay}} |\n| Khuyến mãi tặng hàng | {{tang_hang}} |\nChiết khấu, thưởng được trừ trực tiếp trên hóa đơn hoặc chi bằng hàng/tiền theo thỏa thuận, khi Bên B thanh toán đúng hạn.\n[[KY]]", "sort": 2}, {"object_type": "diem_ban", "code": "DB-CKCN", "kind": "cam_ket", "title": "CAM KẾT HẠN MỨC CÔNG NỢ VÀ THANH TOÁN", "body": "Tôi là {{ben_b_dai_dien}}, CCCD số {{ben_b_cccd}}, chủ cửa hàng {{ben_b_ten}}, địa chỉ {{ben_b_dia_chi}}.\nĐề nghị Công ty TNHH Kim Hoàng Gia cho mua hàng trả chậm với hạn mức công nợ tối đa {{han_muc}} đồng, thời hạn thanh toán {{han_tt}} ngày kể từ ngày nhận hàng. Tôi cam kết:\n- Thanh toán đầy đủ, đúng hạn theo hóa đơn, phiếu giao hàng đã ký nhận.\n- Không vượt hạn mức; khi vượt, thanh toán bớt trước khi nhận đơn mới.\n- Đối chiếu công nợ khi KHG yêu cầu; thông báo ngay khi thay đổi chủ, địa chỉ, ngừng kinh doanh.\n- Nếu chậm thanh toán quá 30 ngày, đồng ý để KHG thu hồi hàng tồn tương ứng và chịu lãi chậm trả theo quy định.\nNgười cam kết ký, ghi rõ họ tên.\n[[KY]]", "sort": 3}, {"object_type": "diem_ban", "code": "DB-KS", "kind": "khao_sat", "title": "PHIẾU KHẢO SÁT MỞ ĐIỂM BÁN", "body": "Tên cửa hàng: {{ben_b_ten}} · Chủ: {{ben_b_dai_dien}} · Điện thoại: {{ben_b_dien_thoai}} · Địa chỉ: {{ben_b_dia_chi}}\n| Tiêu chí | Đánh giá |\n| Loại hình (tạp hóa, đại lý, siêu thị mini, quán…) | |\n| Diện tích, số kệ, tủ mát | |\n| Vị trí (mặt tiền, hẻm, gần chợ, trường, KCN) | |\n| Lượng khách ước tính/ngày | |\n| Doanh số ước tính/tháng | |\n| Ngành hàng đang bán mạnh | |\n| Nhà phân phối đang lấy hàng | |\n| Nhu cầu bán nợ, hạn mức đề xuất | |\n| Đề xuất phân hạng (A/B/C/D), tuyến, ngày ghé | |\nNhân viên khảo sát: {{nguoi_lap}} · Ngày: {{ngay}} · Ảnh và định vị lưu trên ứng dụng bán hàng.", "sort": 4}, {"object_type": "ncc_hang", "code": "NCC-HDPP", "kind": "hop_dong", "title": "HỢP ĐỒNG PHÂN PHỐI HÀNG HÓA", "body": "Căn cứ Bộ luật Dân sự 2015, Luật Thương mại 2005, Luật An toàn thực phẩm 2010 (với hàng thực phẩm) và nhu cầu của hai bên.\n[[BEN]]\nTrong hợp đồng này, Bên B là nhà cung cấp, KHG là nhà phân phối.\n## Điều 1. Sản phẩm và khu vực\nBên B chỉ định KHG phân phối các sản phẩm {{san_pham}} tại khu vực {{khu_vuc}}, kênh {{kenh}}. Danh mục, quy cách, giá theo Phụ lục bảng giá nhập.\n## Điều 2. Đặt hàng, giao nhận\nKHG đặt hàng theo kế hoạch tháng; Bên B giao tại địa điểm Bên A chỉ định, kèm hóa đơn, phiếu kiểm nghiệm/công bố sản phẩm. Hạn dùng còn lại khi giao tối thiểu {{han_dung}} tổng hạn dùng.\n## Điều 3. Giá và chính sách\nGiá nhập, chiết khấu, thưởng doanh số, hỗ trợ vận chuyển, trưng bày, khuyến mãi theo phụ lục. Thay đổi giá thông báo trước 15 ngày; hàng đã đặt giữ giá cũ.\n## Điều 4. Chất lượng, đổi trả\nBên B chịu trách nhiệm về chất lượng, nguồn gốc, nhãn mác, an toàn sản phẩm; nhận đổi trả hàng lỗi, hàng cận date theo chính sách; bồi thường thiệt hại do sản phẩm không đạt chất lượng.\n## Điều 5. Chỉ tiêu và báo cáo\nKHG cam kết chỉ tiêu {{chi_tieu}}; báo cáo tồn kho, doanh số theo tháng. Bên B hỗ trợ đào tạo sản phẩm và hoạt động thị trường.\n## Điều 6. Thanh toán\nKHG thanh toán trong {{han_tt}} ngày kể từ ngày nhận hàng và hóa đơn hợp lệ.\n## Điều khoản chung\n- Bất khả kháng: thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước và sự kiện khách quan khác không lường trước được theo Điều 156 Bộ luật Dân sự 2015. Bên gặp sự kiện phải thông báo cho bên kia trong vòng 24 giờ và áp dụng mọi biện pháp cần thiết để hạn chế thiệt hại.\n- Bảo mật: mỗi bên giữ bí mật thông tin về giá, khách hàng, hàng hóa và dữ liệu cá nhân nhận được trong quá trình hợp tác; xử lý dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP. Nghĩa vụ bảo mật còn hiệu lực 02 năm sau khi chấm dứt hợp đồng.\n- Thông báo: thông báo chính thức gửi qua email, ứng dụng của KHG hoặc văn bản đến địa chỉ ghi tại phần đầu hợp đồng; thông báo qua tin nhắn Zalo, Telegram của đầu mối được chỉ định có giá trị tham chiếu.\n- Tranh chấp: hai bên ưu tiên thương lượng, hòa giải trong 30 ngày; nếu không thành, tranh chấp được giải quyết tại Tòa án nhân dân có thẩm quyền nơi KHG đặt trụ sở.\n- Hiệu lực: hợp đồng có hiệu lực từ ngày ký, thời hạn {{thoi_han}} và tự động gia hạn từng 12 tháng nếu không bên nào thông báo chấm dứt trước 30 ngày. Mọi sửa đổi, bổ sung lập thành phụ lục có chữ ký hai bên. Hợp đồng lập 02 bản có giá trị như nhau, mỗi bên giữ 01 bản; bản điện tử ký số có giá trị như bản giấy.\n[[KY]]", "sort": 1}, {"object_type": "ncc_hang", "code": "NCC-PLGIA", "kind": "phu_luc", "title": "PHỤ LỤC BẢNG GIÁ NHẬP VÀ CHÍNH SÁCH NHÀ CUNG CẤP", "body": "Kèm theo Hợp đồng số {{hd_goc}} · Áp dụng từ {{hieu_luc}}.\n[[BEN]]\n| Nội dung | Thỏa thuận |\n| Bảng giá nhập (đính kèm) | {{bang_gia}} |\n| Chiết khấu trên hóa đơn | {{ck_hd}} |\n| Thưởng đạt chỉ tiêu | {{thuong}} |\n| Hỗ trợ vận chuyển, kho | {{ho_tro}} |\n| Chính sách hàng cận date, đổi trả | {{doi_tra}} |\n[[KY]]", "sort": 2}, {"object_type": "ncc_hang", "code": "NCC-BBNK", "kind": "bien_ban", "title": "BIÊN BẢN GIAO NHẬN HÀNG NHẬP KHO", "body": "[[BEN]]\nHôm nay, tại kho {{kho}}, hai bên giao nhận hàng theo đơn/hóa đơn số {{so_hd_ban}}:\n| Mã hàng | Tên hàng | ĐVT | Số lượng | Lô / hạn dùng | Tình trạng |\n| | | | | | |\n| | | | | | |\nGhi chú sai lệch, hư hỏng (nếu có): {{ghi_chu}}\n[[KY]]", "sort": 3}, {"object_type": "ncc_hang", "code": "NCC-DG", "kind": "khao_sat", "title": "PHIẾU ĐÁNH GIÁ NHÀ CUNG CẤP", "body": "Nhà cung cấp: {{ben_b_ten}} · Kỳ đánh giá: {{ky}}\n| Tiêu chí | Điểm (1–5) | Nhận xét |\n| Chất lượng sản phẩm, hạn dùng | | |\n| Giao hàng đúng hẹn, đủ số lượng | | |\n| Giá, chính sách cạnh tranh | | |\n| Hỗ trợ thị trường, khuyến mãi | | |\n| Xử lý đổi trả, khiếu nại | | |\n| Hồ sơ pháp lý, hóa đơn đầy đủ | | |\nKết luận: tiếp tục hợp tác / cần cải thiện / ngừng hợp tác. Người đánh giá: {{nguoi_lap}}", "sort": 4}, {"object_type": "doi_tac_xe", "code": "DTX-HD", "kind": "hop_dong", "title": "HỢP ĐỒNG HỢP TÁC VẬN TẢI (XE LIÊN KẾT)", "body": "Căn cứ Bộ luật Dân sự 2015; Luật Thương mại 2005; Luật Đường bộ 2024; Nghị định 158/2024/NĐ-CP và nhu cầu của hai bên.\n[[BEN]]\n## Điều 1. Nội dung hợp tác\nBên B đưa phương tiện thuộc quyền sở hữu/sử dụng hợp pháp tham gia mạng lưới xe liên kết của KHG để thực hiện các chuyến hàng do KHG điều phối. Danh sách xe theo phụ lục; mỗi chuyến được giao, nhận và đối soát trên ứng dụng Đối tác KHG.\n## Điều 2. Điều kiện phương tiện và tài xế\nXe còn hạn đăng kiểm, có phù hiệu, bảo hiểm TNDS, thiết bị giám sát hành trình hoạt động; tài xế có GPLX phù hợp, sức khỏe đạt chuẩn, không sử dụng rượu bia, ma túy. Bên B chịu trách nhiệm pháp lý với phương tiện, tài xế của mình.\n## Điều 3. Cước và thanh toán\nCước chuyến theo phụ lục đơn giá hoặc theo giá từng chuyến được xác nhận trên ứng dụng. KHG đối soát theo chu kỳ {{chu_ky}} và thanh toán trong {{han_tt}} ngày sau khi Bên B gửi đủ chứng từ, hóa đơn (nếu có). Tiền thu hộ (COD) của khách được nộp về KHG trong 24 giờ.\n## Điều 4. Trách nhiệm hàng hóa và an toàn\nBên B chịu trách nhiệm bảo quản hàng từ khi nhận đến khi giao; bồi thường thiệt hại, mất mát do lỗi của mình. Tuân thủ quy định tải trọng, tốc độ, thời gian lái xe. Mọi xử phạt hành chính do lỗi phương tiện, tài xế do Bên B chịu.\n## Điều 5. Không lôi kéo khách hàng\nBên B không tự liên hệ, chào giá trực tiếp cho khách hàng do KHG giới thiệu trong thời gian hợp tác và 12 tháng sau đó; vi phạm bồi thường bằng 3 lần doanh thu phát sinh với khách hàng đó.\n## Điều 6. Đánh giá chất lượng\nKHG đánh giá theo đúng giờ, an toàn, chứng từ, thái độ; đối tác dưới chuẩn có thể bị tạm ngừng điều phối.\n## Điều khoản chung\n- Bất khả kháng: thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước và sự kiện khách quan khác không lường trước được theo Điều 156 Bộ luật Dân sự 2015. Bên gặp sự kiện phải thông báo cho bên kia trong vòng 24 giờ và áp dụng mọi biện pháp cần thiết để hạn chế thiệt hại.\n- Bảo mật: mỗi bên giữ bí mật thông tin về giá, khách hàng, hàng hóa và dữ liệu cá nhân nhận được trong quá trình hợp tác; xử lý dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP. Nghĩa vụ bảo mật còn hiệu lực 02 năm sau khi chấm dứt hợp đồng.\n- Thông báo: thông báo chính thức gửi qua email, ứng dụng của KHG hoặc văn bản đến địa chỉ ghi tại phần đầu hợp đồng; thông báo qua tin nhắn Zalo, Telegram của đầu mối được chỉ định có giá trị tham chiếu.\n- Tranh chấp: hai bên ưu tiên thương lượng, hòa giải trong 30 ngày; nếu không thành, tranh chấp được giải quyết tại Tòa án nhân dân có thẩm quyền nơi KHG đặt trụ sở.\n- Hiệu lực: hợp đồng có hiệu lực từ ngày ký, thời hạn {{thoi_han}} và tự động gia hạn từng 12 tháng nếu không bên nào thông báo chấm dứt trước 30 ngày. Mọi sửa đổi, bổ sung lập thành phụ lục có chữ ký hai bên. Hợp đồng lập 02 bản có giá trị như nhau, mỗi bên giữ 01 bản; bản điện tử ký số có giá trị như bản giấy.\n[[KY]]", "sort": 1}, {"object_type": "doi_tac_xe", "code": "DTX-PLGIA", "kind": "phu_luc", "title": "PHỤ LỤC DANH SÁCH XE VÀ ĐƠN GIÁ THUÊ", "body": "Kèm theo Hợp đồng số {{hd_goc}}.\n[[BEN]]\n| Biển số | Loại xe, tải trọng | Kích thước thùng | Tài xế | Đơn giá / phương thức |\n| | | | | |\n| | | | | |\nĐơn giá đã gồm nhiên liệu, phí cầu đường, lương tài xế; chưa gồm thuế GTGT (nếu có). Phụ phí chờ, lưu đêm, điểm giao thêm theo bảng phụ phí chung của KHG.\n[[KY]]", "sort": 2}, {"object_type": "doi_tac_xe", "code": "DTX-CK", "kind": "cam_ket", "title": "CAM KẾT AN TOÀN VẬN HÀNH VÀ BẢO MẬT KHÁCH HÀNG", "body": "Bên cam kết: {{ben_b_ten}} – đại diện {{ben_b_dai_dien}}.\n- Chỉ bố trí tài xế đủ điều kiện; tuyệt đối không sử dụng rượu bia, ma túy khi lái xe.\n- Tuân thủ tải trọng, tốc độ, thời gian lái xe liên tục không quá 4 giờ, không quá 10 giờ/ngày.\n- Không chở thêm hàng, người ngoài chuyến của KHG khi chưa được đồng ý.\n- Bảo mật thông tin khách hàng, giá cước, tuyến; không chụp, chia sẻ chứng từ ra ngoài.\n- Báo ngay cho điều phối KHG khi có sự cố, tai nạn, kẹt xe kéo dài.\nVi phạm, Bên cam kết chịu toàn bộ trách nhiệm và chấp nhận bị dừng hợp tác.\n[[KY]]", "sort": 3}, {"object_type": "doi_tac_xe", "code": "DTX-BBKT", "kind": "bien_ban", "title": "BIÊN BẢN KIỂM TRA XE ĐẦU VÀO", "body": "Biển số: {{bien_so}} · Chủ xe/đối tác: {{ben_b_ten}} · Ngày kiểm tra: {{ngay}}\n| Hạng mục | Đạt | Không đạt | Ghi chú |\n| Giấy tờ: đăng ký, đăng kiểm, phù hiệu, bảo hiểm | | | |\n| Thiết bị giám sát hành trình, camera | | | |\n| Lốp, phanh, đèn, còi, gương | | | |\n| Thùng hàng: kín nước, sàn, khóa, bạt | | | |\n| Dụng cụ chằng buộc, bình chữa cháy | | | |\n| Vệ sinh, mùi thùng xe | | | |\n| Tài xế: GPLX, đồng phục, thái độ | | | |\nKết luận: Đạt / Không đạt – yêu cầu khắc phục: {{ghi_chu}}\n[[KY]]", "sort": 4}, {"object_type": "tai_xe_khg", "code": "TX-CKAT", "kind": "cam_ket", "title": "CAM KẾT AN TOÀN GIAO THÔNG VÀ KỶ LUẬT LÁI XE", "body": "Tôi là {{ben_b_ten}}, CCCD số {{ben_b_cccd}}, GPLX hạng {{hang_gplx}} số {{so_gplx}}, tài xế của Công ty TNHH Kim Hoàng Gia. Tôi cam kết:\n- Không sử dụng rượu, bia, chất kích thích, ma túy trước và trong khi lái xe; chấp nhận kiểm tra nồng độ cồn đột xuất.\n- Chấp hành Luật Trật tự, an toàn giao thông đường bộ 2024: tốc độ, làn đường, tải trọng, thời gian lái xe liên tục không quá 4 giờ và không quá 10 giờ/ngày.\n- Không dùng điện thoại cầm tay khi lái xe; không cho người khác lái xe được giao.\n- Kiểm tra xe trước mỗi chuyến; báo ngay hư hỏng, sự cố, tai nạn cho điều phối.\n- Tự chịu tiền phạt vi phạm hành chính do lỗi cá nhân; bồi thường thiệt hại do cố ý hoặc vô ý nghiêm trọng theo nội quy công ty.\n[[KY]]", "sort": 1}, {"object_type": "tai_xe_khg", "code": "TX-CKTS", "kind": "cam_ket", "title": "CAM KẾT TRÁCH NHIỆM HÀNG HÓA, TÀI SẢN VÀ NHIÊN LIỆU", "body": "Tôi là {{ben_b_ten}}, tài xế xe {{bien_so}}. Tôi cam kết:\n- Nhận, giao hàng đúng số lượng, đúng chứng từ; chụp ảnh POD trên ứng dụng ngay khi giao.\n- Bảo quản hàng hóa, xe, dụng cụ được giao; không tự ý chở hàng ngoài, người ngoài.\n- Đổ nhiên liệu tại cây xăng được chỉ định, nộp hóa đơn đúng hạn; định mức tiêu hao theo quy định công ty.\n- Nộp đủ tiền thu hộ (COD) về công ty trong 24 giờ.\n- Bồi thường mất mát, hư hỏng, thiếu hụt do lỗi của tôi theo nội quy và quy định pháp luật lao động.\n[[KY]]", "sort": 2}, {"object_type": "tai_xe_khg", "code": "TX-BBXE", "kind": "bien_ban", "title": "BIÊN BẢN BÀN GIAO XE", "body": "Bên giao: {{khg_ten}} · Bên nhận: {{ben_b_ten}} (tài xế)\n| Hạng mục | Tình trạng khi bàn giao |\n| Biển số, loại xe | {{bien_so}} |\n| Số km đồng hồ | |\n| Mức nhiên liệu | |\n| Giấy tờ xe (đăng ký bản sao, đăng kiểm, bảo hiểm, phù hiệu) | |\n| Lốp dự phòng, đồ nghề, bình chữa cháy | |\n| Thân vỏ, thùng xe (trầy, móp) | |\n| Thiết bị GPS, camera | |\nBên nhận đã kiểm tra và chịu trách nhiệm quản lý xe từ thời điểm ký biên bản.\n[[KY]]", "sort": 3}, {"object_type": "tai_xe_fd", "code": "FD-HD", "kind": "hop_dong", "title": "HỢP ĐỒNG CỘNG TÁC DỊCH VỤ LÁI XE (FAST DRIVER)", "body": "Căn cứ Bộ luật Dân sự 2015 (hợp đồng dịch vụ) và nhu cầu của hai bên.\n[[BEN]]\n## Điều 1. Nội dung\nBên B là tài xế độc lập, đăng ký trên nền tảng Fast Driver của KHG để nhận các công việc lái xe (theo chuyến, ngày, ca, tuyến, tuần, tháng) phù hợp hạng giấy phép lái xe. Hợp đồng này không phải hợp đồng lao động.\n## Điều 2. Điều kiện tham gia\nBên B cung cấp hồ sơ thật, xác thực khuôn mặt, GPLX còn hạn, khám sức khỏe đạt, lý lịch tư pháp không có án tích liên quan; hoàn thành bài thi lý thuyết của Fast Driver.\n## Điều 3. Thù lao và phí\nThù lao do khách thuê trả theo thỏa thuận trên ứng dụng. Phí kết nối của KHG (nếu có) theo biểu phí công bố trên ứng dụng tại thời điểm nhận việc. Bên B tự kê khai, nộp thuế thu nhập cá nhân theo quy định (KHG khấu trừ khi pháp luật yêu cầu).\n## Điều 4. Nghĩa vụ của Bên B\nĐến đúng giờ, lái xe an toàn, không rượu bia; giữ gìn xe và tài sản của khách; không tự ý thu thêm tiền; bảo mật thông tin khách hàng; tuân thủ quy tắc ứng xử của Fast Driver.\n## Điều 5. Đánh giá và xử lý vi phạm\nKhách đánh giá sau mỗi việc. Vi phạm quy tắc ứng xử, hủy việc không lý do, gian lận: KHG cảnh cáo, tạm khóa hoặc chấm dứt tài khoản. Thiệt hại do lỗi Bên B gây ra, Bên B tự bồi thường cho khách.\n## Điều khoản chung\n- Bất khả kháng: thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước và sự kiện khách quan khác không lường trước được theo Điều 156 Bộ luật Dân sự 2015. Bên gặp sự kiện phải thông báo cho bên kia trong vòng 24 giờ và áp dụng mọi biện pháp cần thiết để hạn chế thiệt hại.\n- Bảo mật: mỗi bên giữ bí mật thông tin về giá, khách hàng, hàng hóa và dữ liệu cá nhân nhận được trong quá trình hợp tác; xử lý dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP. Nghĩa vụ bảo mật còn hiệu lực 02 năm sau khi chấm dứt hợp đồng.\n- Thông báo: thông báo chính thức gửi qua email, ứng dụng của KHG hoặc văn bản đến địa chỉ ghi tại phần đầu hợp đồng; thông báo qua tin nhắn Zalo, Telegram của đầu mối được chỉ định có giá trị tham chiếu.\n- Tranh chấp: hai bên ưu tiên thương lượng, hòa giải trong 30 ngày; nếu không thành, tranh chấp được giải quyết tại Tòa án nhân dân có thẩm quyền nơi KHG đặt trụ sở.\n- Hiệu lực: hợp đồng có hiệu lực từ ngày ký, thời hạn {{thoi_han}} và tự động gia hạn từng 12 tháng nếu không bên nào thông báo chấm dứt trước 30 ngày. Mọi sửa đổi, bổ sung lập thành phụ lục có chữ ký hai bên. Hợp đồng lập 02 bản có giá trị như nhau, mỗi bên giữ 01 bản; bản điện tử ký số có giá trị như bản giấy.\n[[KY]]", "sort": 1}, {"object_type": "tai_xe_fd", "code": "FD-CK", "kind": "cam_ket", "title": "CAM KẾT QUY TẮC ỨNG XỬ VÀ BẢO MẬT – FAST DRIVER", "body": "Tôi là {{ben_b_ten}}, CCCD {{ben_b_cccd}}, tài xế Fast Driver. Tôi cam kết:\n- Trung thực về hồ sơ, hạng bằng lái; không cho người khác dùng tài khoản.\n- Đúng giờ, trang phục gọn gàng, lịch sự với khách hàng và người đi đường.\n- Không rượu bia, chất kích thích; không lái xe khi mệt mỏi.\n- Không tự thỏa thuận ngoài nền tảng để né phí với khách do Fast Driver kết nối.\n- Không quay phim, chụp ảnh, chia sẻ thông tin, hàng hóa, tài sản của khách.\n- Bồi hoàn thiệt hại do lỗi của tôi và chấp nhận các biện pháp xử lý của Fast Driver.\n[[KY]]", "sort": 2}, {"object_type": "kh_thue_tx", "code": "TTX-HD", "kind": "hop_dong", "title": "HỢP ĐỒNG DỊCH VỤ CUNG ỨNG TÀI XẾ", "body": "Căn cứ Bộ luật Dân sự 2015, Luật Thương mại 2005 và nhu cầu của hai bên.\n[[BEN]]\n## Điều 1. Dịch vụ\nKHG (qua nền tảng Fast Driver) giới thiệu, kết nối tài xế đã xác thực hồ sơ, đúng hạng giấy phép lái xe để lái phương tiện của Bên B theo hình thức {{hinh_thuc}}.\n## Điều 2. Phí và thanh toán\n- Thù lao tài xế: theo thỏa thuận trên ứng dụng, Bên B trả trực tiếp cho tài xế hoặc qua KHG.\n- Phí dịch vụ kết nối của KHG: theo phụ lục đơn giá; KHG xuất hóa đơn điện tử, Bên B thanh toán trong 07 ngày.\n## Điều 3. Trách nhiệm của Bên B\nGiao xe có đủ giấy tờ hợp lệ, còn hạn đăng kiểm, bảo hiểm; tình trạng kỹ thuật an toàn. Bên B chịu trách nhiệm chủ phương tiện theo quy định pháp luật.\n## Điều 4. Trách nhiệm của KHG\nXác thực danh tính, GPLX, sức khỏe, lý lịch tài xế; thay thế tài xế khi tài xế vắng mặt hoặc không đạt yêu cầu; hỗ trợ xử lý khiếu nại trong 24 giờ. KHG không chịu trách nhiệm thay tài xế đối với thiệt hại do lỗi cá nhân của tài xế, nhưng phối hợp xác minh và hỗ trợ Bên B yêu cầu bồi thường.\n## Điều khoản chung\n- Bất khả kháng: thiên tai, dịch bệnh, chiến tranh, quyết định của cơ quan nhà nước và sự kiện khách quan khác không lường trước được theo Điều 156 Bộ luật Dân sự 2015. Bên gặp sự kiện phải thông báo cho bên kia trong vòng 24 giờ và áp dụng mọi biện pháp cần thiết để hạn chế thiệt hại.\n- Bảo mật: mỗi bên giữ bí mật thông tin về giá, khách hàng, hàng hóa và dữ liệu cá nhân nhận được trong quá trình hợp tác; xử lý dữ liệu cá nhân theo Nghị định 13/2023/NĐ-CP. Nghĩa vụ bảo mật còn hiệu lực 02 năm sau khi chấm dứt hợp đồng.\n- Thông báo: thông báo chính thức gửi qua email, ứng dụng của KHG hoặc văn bản đến địa chỉ ghi tại phần đầu hợp đồng; thông báo qua tin nhắn Zalo, Telegram của đầu mối được chỉ định có giá trị tham chiếu.\n- Tranh chấp: hai bên ưu tiên thương lượng, hòa giải trong 30 ngày; nếu không thành, tranh chấp được giải quyết tại Tòa án nhân dân có thẩm quyền nơi KHG đặt trụ sở.\n- Hiệu lực: hợp đồng có hiệu lực từ ngày ký, thời hạn {{thoi_han}} và tự động gia hạn từng 12 tháng nếu không bên nào thông báo chấm dứt trước 30 ngày. Mọi sửa đổi, bổ sung lập thành phụ lục có chữ ký hai bên. Hợp đồng lập 02 bản có giá trị như nhau, mỗi bên giữ 01 bản; bản điện tử ký số có giá trị như bản giấy.\n[[KY]]", "sort": 1}, {"object_type": "kh_thue_tx", "code": "TTX-BBCA", "kind": "bien_ban", "title": "BIÊN BẢN XÁC NHẬN CA / CHUYẾN LÁI XE", "body": "Khách hàng: {{ben_b_ten}} · Tài xế: {{tai_xe}} · Xe: {{bien_so}}\n| Nội dung | Thông tin |\n| Thời gian bắt đầu – kết thúc | |\n| Lộ trình / số km | |\n| Số km đồng hồ đầu – cuối | |\n| Tình trạng xe khi nhận – khi trả | |\n| Chi phí phát sinh (cầu đường, gửi xe…) | |\n| Thù lao đã thỏa thuận | |\n| Đánh giá của khách (1–5 sao) | |\n[[KY]]", "sort": 2}, {"object_type": "nhan_vien", "code": "NV-MTCV", "kind": "quy_dinh", "title": "BẢN MÔ TẢ CÔNG VIỆC VÀ CHỈ TIÊU KPI", "body": "Họ tên: {{ben_b_ten}} · Chức danh: {{chuc_danh}} · Bộ phận: {{bo_phan}} · Báo cáo cho: {{quan_ly}}\n## 1. Mục đích công việc\n{{muc_dich}}\n## 2. Nhiệm vụ chính\n-\n-\n-\n## 3. Chỉ tiêu đánh giá (KPI) hằng tháng\n| Chỉ tiêu | Trọng số | Mục tiêu | Cách đo |\n| | | | |\n| | | | |\n## 4. Quyền hạn trên hệ thống\nTài khoản CRM/ứng dụng được phân quyền theo vai trò {{vai_tro}}; mọi thao tác được ghi nhật ký.\n## 5. Thu nhập\nLương cơ bản, phụ cấp, hoa hồng/thưởng KPI theo quy chế lương thưởng hiện hành của công ty.\n[[KY]]", "sort": 1}, {"object_type": "nhan_vien", "code": "NV-BBTS", "kind": "bien_ban", "title": "BIÊN BẢN BÀN GIAO TÀI SẢN, CÔNG CỤ, TÀI KHOẢN", "body": "Bên giao: {{khg_ten}} · Bên nhận: {{ben_b_ten}}\n| Tài sản / công cụ / tài khoản | Số lượng | Tình trạng | Ghi chú |\n| Điện thoại, máy tính | | | |\n| Tài khoản CRM, ứng dụng | | | |\n| Chìa khóa, thẻ, con dấu (nếu có) | | | |\n| Hồ sơ, tài liệu | | | |\nBên nhận có trách nhiệm bảo quản, sử dụng đúng mục đích và hoàn trả khi nghỉ việc hoặc const XC={red:'FFC8102E',dark:'FF1B1616',head:'FF7A0C1F',band:'FFFBF6F5',line:'FFE7DCDA',soft:'FFF3E9E7',green:'FF15803D',amber:'FFB45309',gray:'FF6B7280',white:'FFFFFFFF',blue:'FF1D4ED8'};

const XJ_TXT=/(sđt|điện thoại|phone|^mã|mã |mst|tài khoản|stk|cccd|cmnd|biển|số hóa đơn|số chứng từ|số hđ|số hợp đồng|giấy phép|bằng lái|gplx|zalo|telegram)/i;

function xjCell(v,hdr){if(v==null||v==='')return null;
  if(v instanceof Date)return v;
  if(typeof v==='object'&&v.t==='n'&&'v' in v){if(v.z&&/yy/.test(v.z))return new Date(Math.round((v.v-25569)*864e5));return Number(v.v)}
  if(typeof v==='number')return isFinite(v)?v:null;if(typeof v==='boolean')return v?'Có':'Không';
  const s=String(v).trim();if(XJ_TXT.test(hdr||''))return s;
  let m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?$/);if(m)return new Date(Date.UTC(+m[3],+m[2]-1,+m[1],m[4]?+m[4]:0,m[5]?+m[5]:0));
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s))return Number(s.replace(/\./g,''));if(/^-?(0|[1-9]\d{0,11})(,\d+)?$/.test(s))return Number(s.replace(',','.'));return s}
const xjName=(wb,n)=>{let s=String(n||'Sheet').replace(/[\\/?*\[\]:]/g,' ').slice(0,31).trim()||'Sheet';let k=2;while(wb.getWorksheet(s))s=s.slice(0,28)+' '+(k++);return s};
const xjBorder=c=>({top:{style:'thin',color:{argb:c||XC.line}},left:{style:'thin',color:{argb:c||XC.line}},bottom:{style:'thin',color:{argb:c||XC.line}},right:{style:'thin',color:{argb:c||XC.line}}});

function xjHead(ws,nc,title,sub){nc=Math.max(nc,6);const now=new Date();const stamp=`Xuất từ CRM KHG lúc ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} ngày ${fmtD(today())}${ME&&ME.full_name?' · Người xuất: '+ME.full_name:''}`;

// 1 sheet dữ liệu chuẩn: tiêu đề công ty, tiêu đề, kỳ, dòng tiêu đề cột màu, số định dạng, dòng tổng có công thức SUM, lọc, cố định tiêu đề, in ngang vừa 1 trang
function xjSheet(wb,name,rows,opt={}){const ws=wb.addWorksheet(xjName(wb,name),{properties:{defaultRowHeight:17},pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.35,right:.35,top:.45,bottom:.5,header:.25,footer:.25},printTitlesRow:'6:6'},headerFooter:{oddFooter:'&L&8Công ty TNHH Kim Hoàng Gia · '+String(opt.title||name).replace(/&/g,'&&')+'&R&8Trang &P / &N'}});
  rows=rows||[];let header=[],body=[],pre=[];
  if(Array.isArray(rows[0])){const ne=r=>(r||[]).filter(x=>x!==''&&x!=null).length;let hi=rows.findIndex(r=>ne(r)>=2);if(hi<0)hi=0;pre=rows.slice(0,hi).map(r=>(r||[]).filter(x=>x!==''&&x!=null).join(' ')).filter(Boolean);header=(rows[hi]||[]).map(x=>x==null?'':String(x));body=rows.slice(hi+1)}
  else{const ks=[];rows.forEach(r=>Object.keys(r||{}).forEach(k=>{if(!ks.includes(k))ks.push(k)}));header=ks.length?ks:['Không có dữ liệu'];body=rows.map(r=>header.map(k=>r[k]))}
  const nc=header.length;const h0=xjHead(ws,nc,opt.title||name,[opt.sub,...pre].filter(Boolean).join(' · '));
  const hr=ws.getRow(h0);header.forEach((h,i)=>{const c=hr.getCell(i+1);c.value=h;c.font={name:'Arial',size:9.5,bold:true,color:{argb:XC.white}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XC.head}};c.alignment={vertical:'middle',horizontal:'center',wrapText:true};c.border=xjBorder('FF5A0716')});hr.height=32;
  const isNum=new Array(nc).fill(false),isInt=new Array(nc).fill(true),width=header.map(h=>Math.min(30,Math.max(8,String(h).length*0.9+2)));
  const isTot=r=>/^(tổng|cộng|total)/i.test(String((r||[]).find(x=>x!==''&&x!=null)??''));
  body.forEach((r,ri)=>{const row=ws.getRow(h0+1+ri);const tot=isTot(r);(r||[]).slice(0,nc).forEach((v,ci)=>{const c=row.getCell(ci+1);const x=xjCell(v,header[ci]);c.value=x;
      if(typeof x==='number'){isNum[ci]=true;if(!Number.isInteger(x))isInt[ci]=false;c.numFmt=Number.isInteger(x)?'#,##0':'#,##0.0#';c.alignment={horizontal:'right',vertical:'middle'}}
      else if(x instanceof Date){c.numFmt=(x.getUTCHours()||x.getUTCMinutes())?'dd/mm/yyyy hh:mm':'dd/mm/yyyy';c.alignment={horizontal:'center',vertical:'middle'}}
      else c.alignment={vertical:'middle',wrapText:String(x??'').length>48};
      c.font={name:'Arial',size:9.5,bold:tot,color:{argb:XC.dark}};c.border=xjBorder();
      if(tot)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XC.soft}};else if(ri%2)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XC.band}};
      const L=x instanceof Date?11:typeof x==='number'?fmtN(x).length+2:Math.min(48,String(x??'').length+2);if(L>width[ci])width[ci]=L});
    for(let ci=(r||[]).length;ci<nc;ci++){const c=row.getCell(ci+1);c.border=xjBorder();if(ri%2)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XC.band}}}});
  const last=h0+body.length;
  if(opt.totals!==false&&body.length>1&&!body.some(isTot)&&isNum.some(Boolean)){const tr=ws.getRow(last+1);let lab=false;
    header.forEach((h,ci)=>{const c=tr.getCell(ci+1);c.border=xjBorder('FFB9A5A2');c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XC.soft}};c.font={name:'Arial',size:10,bold:true,color:{argb:XC.dark}};
      if(isNum[ci]&&!XJ_NOSUM.test(h)&&!XJ_TXT.test(h)){const col=xjCol(ci);let res=0;body.forEach(r=>{const x=xjCell(r[ci],h);if(typeof x==='number')res+=x});c.value={formula:`SUBTOTAL(9,${col}${h0+1}:${col}${last})`,result:res};c.numFmt=isInt[ci]?'#,##0':'#,##0.0#';c.alignment={horizontal:'right'}}

  ws.columns.forEach((col,i)=>{col.width=Math.min(i<nc?50:12,Math.max(9,width[i]||10))});
  ws.views=[{state:'frozen',ySplit:h0,xSplit:0,showGridLines:false}];if(body.length)ws.autoFilter={from:{row:h0,column:1},to:{row:last,column:nc}};

  return ws}

async function xlsx(filename,sheets,opt={}){let EX;try{EX=await xjLib()}catch(e){return xlsxPlain(filename,sheets)}
  try{const wb=new EX.Workbook();wb.creator='CRM Kim Hoàng Gia';wb.created=new Date();
    const sub=opt.sub||String(filename).replace(/_/g,' ').replace(/\s+/g,' ').trim();

  const fillL=l=>{if(!l)return;const e=frm.elements.namedItem('lease_id');if(e){e.value=l.id;e.dispatchEvent(new Event('change',{bubbles:true}))}

const FL_KIND={so_huu:'Xe KHG',xe_thue:'Thuê xác NCC',doi_tac:'Xe đối tác',thue_ngoai:'Xe đối tác'};
async function fleetInto(el){if(!el)return;const to=today(),from=to.slice(0,8)+'01';

  if(error){el.innerHTML=`<h3>🚚 Xe trống cần tìm hàng</h3><div class="sub">${esc(error.message)}</div>`;return}
  F=F||{};const V=Array.isArray(F.vehicles)?F.vehicles:[];const idle=V.filter(v=>!v.running&&!(v.today>0)).sort((a,b)=>(b.idle_days-a.idle_days)||(b.day_cost-a.day_cost));
  const idleCostDay=idle.reduce((s,v)=>s+(+v.day_cost||0),0),idleMonth=V.reduce((s,v)=>s+(+v.idle_cost||0),0);
  const since=v=>v.last_end?`trống từ ${fmtDT(v.last_end)}`:'chưa có chuyến';
  const rows=idle.map(v=>`<tr><td><b>${esc(v.plate)}</b><div class="sub">${esc(FL_KIND[v.kind]||v.kind||'')}${v.load_t?' · '+v.load_t+' tấn':''}</div></td>
    <td class="r"><b style="color:#B91C1C">${fmtM(v.day_cost)}</b></td><td class="r">${v.idle_days}/${v.days} ngày</td><td class="r">${fmtTr(v.idle_cost)}</td>
    <td class="r">${v.util_pct}%</td><td>${since(v)}${v.next_start?`<div class="sub">chuyến tới: ${fmtDT(v.next_start)}</div>`:(v.tomorrow>0?'<div class="sub">mai có chuyến</div>':'')}</td>

  // bản đồ nhiệt 7 x 24
  const H={};let mx=1;(F.heat||[]).forEach(([d,h,n])=>{H[d+'_'+h]=n;mx=Math.max(mx,n)});
  const byH=Array.from({length:24},(_,h)=>[1,2,3,4,5,6,7].reduce((s,d)=>s+(H[d+'_'+h]||0),0));
  const tot=byH.reduce((a,b)=>a+b,0);const order=byH.map((n,h)=>[h,n]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const peak=order.slice(0,3).map(x=>x[0]+'h'),low=Array.from({length:15},(_,i)=>i+6).filter(h=>!byH[h]).map(h=>h+'h');
  const DN=['','T2','T3','T4','T5','T6','T7','CN'];
  const heat=`<div style="overflow-x:auto"><table class="kv" style="border-collapse:separate;border-spacing:2px;font-size:11px"><tr><td></td>${Array.from({length:24},(_,h)=>`<td style="text-align:center;color:#64748B">${h}</td>`).join('')}</tr>
    ${[1,2,3,4,5,6,7].map(d=>`<tr><td style="color:#64748B;padding-right:4px">${DN[d]}</td>${Array.from({length:24},(_,h)=>{const n=H[d+'_'+h]||0,a=n?0.15+0.85*n/mx:0;return `<td title="${DN[d]} ${h}h: ${n} chuyến" style="width:22px;height:18px;border-radius:3px;text-align:center;background:${n?`rgba(29,78,216,${a.toFixed(2)})`:'#F1F5F9'};color:${a>0.55?'#fff':'#1E293B'}">${n||''}</td>`}).join('')}</tr>`).join('')}</table></div>
    <div class="sub" style="margin-top:6px">90 ngày gần nhất · ${tot} chuyến. ${peak.length?`Cao điểm nhận chuyến: <b>${peak.join(', ')}</b>.`:''} ${low.length?`Khung giờ ban ngày ít chuyến (nên chào giá tốt / ghép hàng): <b>${low.slice(0,8).join(', ')}</b>.`:''}</div>`;
  // dải sử dụng theo ngày từng xe
  const days=[];for(let d=from;d<=to;d=addDays(d,1))days.push(d);
  const strip=`<div style="overflow-x:auto"><table class="kv" style="border-collapse:separate;border-spacing:2px;font-size:11px"><tr><td></td>${days.map(d=>`<td style="text-align:center;color:#64748B">${+d.slice(8)}</td>`).join('')}<td class="r" style="color:#64748B;padding-left:6px">Sử dụng</td></tr>
    ${V.map(v=>`<tr><td style="white-space:nowrap;padding-right:6px"><b>${esc(v.plate)}</b></td>${days.map(d=>{const x=(v.daily||{})[d]||[0,0];const h=+x[1]||0,a=x[0]?Math.min(1,0.25+h/12):0;return `<td title="${fmtD(d)}: ${x[0]} chuyến · ${h} giờ" style="width:16px;height:16px;border-radius:3px;background:${x[0]?`rgba(22,163,74,${a.toFixed(2)})`:'#FEE2E2'}"></td>`}).join('')}<td class="r" style="padding-left:6px">${v.util_pct}%</td></tr>`).join('')}</table></div>
    <div class="sub" style="margin-top:4px">🟩 có chuyến (đậm = chạy nhiều giờ) · 🟥 xe nằm trống cả ngày · Sử dụng = số giờ chạy / 10 giờ mỗi ngày.</div>`;
  el.innerHTML=`<h3>🚚 Xe trống cần tìm hàng <span class="sp"></span><span class="sub" style="font-weight:400">${idle.length}/${V.length} xe đang trống · tốn ~<b style="color:#B91C1C">${fmtTr(idleCostDay)}/ngày</b> · tháng này đã mất ${fmtTr(idleMonth)} vì xe nằm</span></h3>
    ${idle.length?`<div class="tw"><table class="t"><thead><tr><th>Xe</th><th class="r">Cost/ngày</th><th class="r">Ngày trống (tháng)</th><th class="r">Tiền mất do trống</th><th class="r">Sử dụng</th><th>Tình trạng</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div style="margin:6px 0 12px"><button class="btn sm" id="flNudgeAll">📣 Nhắc sale tìm hàng cho tất cả xe trống</button> <span class="sub">Cost/ngày gồm khấu hao, lương tài xế, bảo hiểm, phí đường bộ, tiền thuê xác (nếu thuê) — xe đứng yên vẫn tốn khoản này.</span></div>`:'<div class="sub" style="margin-bottom:10px">✅ Tất cả xe đều đang có chuyến hôm nay.</div>'}
    <details><summary style="cursor:pointer;font-weight:600">🗓 Bản đồ giờ nhận chuyến (cao điểm / thấp điểm)</summary>${heat}</details>
    <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">📊 Lịch sử dụng từng xe tháng này</summary>${strip}</details>`;
  const nudge=async(list)=>{const note=prompt('Lời nhắc gửi sale (có thể sửa):',list.length===1?`Xe ${list[0].plate} đang trống, cost ~${fmtM(list[0].day_cost)}/ngày — ưu tiên tìm hàng.`:`${list.length} xe đang trống, tốn ~${fmtTr(idleCostDay)}/ngày — ưu tiên tìm hàng.`);if(note===null)return;
    let n=0;for(const v of list){const {data,error}=await sb.rpc('khg_nudge_sales',{p_vehicle:v.vehicle_id,p_note:note});if(error)return toast(error.message);n=Math.max(n,data||0)}toast(`Đã nhắc ${n} người kinh doanh`)};
  el.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>nudge(idle.filter(v=>v.vehicle_id===b.dataset.nudge)));
  const all=el.querySelector('#flNudgeAll');if(all)all.onclick=()=>nudge(idle);
}

const ktPer=(P)=>{const t=today(),y=+t.slice(0,4),m=+t.slice(5,7),q=Math.ceil(m/3);const mm=(yy,mo)=>`${yy}-${String(mo).padStart(2,'0')}`;const last=(yy,mo)=>isoD(new Date(yy,mo,0));
  const opt={thang:[mm(y,m)+'-01',last(y,m),'Tháng này'],thang_truoc:[m===1?mm(y-1,12)+'-01':mm(y,m-1)+'-01',m===1?last(y-1,12):last(y,m-1),'Tháng trước'],quy:[mm(y,q*3-2)+'-01',last(y,q*3),'Quý '+q],quy_truoc:[q===1?mm(y-1,10)+'-01':mm(y,q*3-5)+'-01',q===1?last(y-1,12):last(y,q*3-3),'Quý trước'],nam:[y+'-01-01',y+'-12-31','Năm '+y]};
  if(P.kind!=='tuy_chon'){const o=opt[P.kind]||opt.thang;P.from=o[0];P.to=o[1]}
  return `<div class="row" style="gap:6px;flex-wrap:wrap;align-items:center">${Object.entries(opt).map(([k,o])=>`<button class="btn sm ${P.kind===k?'p':''}" data-pk="${k}">${o[2]}</button>`).join('')}<span class="sub">hoặc</span><input type="date" data-pf value="${P.from}"> – <input type="date" data-pt value="${P.to}"></div>`};
const ktPerBind=(el,P,redraw)=>{el.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{P.kind=b.dataset.pk;redraw()});
  el.querySelectorAll('[data-pf],[data-pt]').forEach(i=>i.onchange=()=>{P.kind='tuy_chon';P.from=el.querySelector('[data-pf]').value;P.to=el.querySelector('[data-pt]').value;redraw()})};

function taxCalendar(){let per='quy';try{per=localStorage.getItem('khg_vat_per')||'quy'}catch(e){}
  const t=today(),y=+t.slice(0,4),out=[];const L=(yy,mo)=>isoD(new Date(yy,mo,0));
  for(let i=-1;i<=5;i++){const d=new Date(y,+t.slice(5,7)-1+i,1);const yy=d.getFullYear(),mo=d.getMonth()+1;const lab=`${String(mo).padStart(2,'0')}/${yy}`;const nx=new Date(yy,mo,1),ny=nx.getFullYear(),nm=nx.getMonth()+1;
    if(per==='thang')out.push([`${ny}-${String(nm).padStart(2,'0')}-20`,`Khai & nộp thuế GTGT tháng ${lab} (mẫu 01/GTGT) + TNCN khấu trừ (05/KK-TNCN) nếu phát sinh`,'thue']);
    out.push([L(yy,mo),`Đóng BHXH, BHYT, BHTN, KPCĐ tháng ${lab} (hạn cuối tháng)`,'bh']);
    if(mo%3===0){const q=mo/3;const qd=L(ny,nm);
      if(per==='quy')out.push([qd,`Khai & nộp thuế GTGT quý ${q}/${yy} (01/GTGT) + TNCN quý (05/KK-TNCN) nếu phát sinh`,'thue']);
      out.push([`${ny}-${String(nm).padStart(2,'0')}-30`.replace(/-02-30$/,'-02-28'),`Tạm nộp thuế TNDN quý ${q}/${yy} (không nộp tờ khai; 4 quý tạm nộp ≥ 80% số quyết toán)`,'thue'])}}
  [[`${y}-03-31`,`Quyết toán thuế TNDN, TNCN năm ${y-1} + nộp Báo cáo tài chính năm ${y-1}`],[`${y+1}-03-31`,`Quyết toán thuế TNDN, TNCN năm ${y} + nộp Báo cáo tài chính năm ${y}`],[`${y}-12-31`,'Hết hạn áp dụng giảm thuế GTGT 10% → 8% (NQ 204/2025/QH15, NĐ 174/2025/NĐ-CP) — từ 01/01/'+(y+1)+' kiểm tra lại thuế suất']].forEach(x=>out.push([x[0],x[1],'nam']));
  const L2=[...new Map(out.map(x=>[x[0]+x[1],x])).values()].filter(x=>x[0]>=addDays(t,-20)&&x[0]<=addDays(t,200)).sort((a,b)=>a[0].localeCompare(b[0]));
  const dd=s=>Math.round((new Date(s)-new Date(t))/864e5);
  return `<div class="row" style="gap:8px;align-items:center;margin-bottom:8px"><span class="sub">Kỳ khai thuế GTGT của KHG:</span><select id="vatPer"><option value="quy" ${per==='quy'?'selected':''}>Theo quý (doanh thu năm trước ≤ 50 tỷ)</option><option value="thang" ${per==='thang'?'selected':''}>Theo tháng</option></select></div>
   <div class="tw"><table class="t"><thead><tr><th>Hạn</th><th>Còn</th><th>Việc phải làm</th></tr></thead><tbody>${L2.map(x=>{const n=dd(x[0]);return `<tr><td><b>${fmtD(x[0])}</b></td><td><span class="pill ${n<0?'':n<=7?'red':n<=20?'amber':'green'}">${n<0?'đã qua':n===0?'hôm nay':n+' ngày'}</span></td><td>${esc(x[1])}</td></tr>`}).join('')}</tbody></table></div>
   <div class="sub" style="margin-top:8px;line-height:1.7">Căn cứ: Luật Quản lý thuế 2019 (Điều 44 – hạn khai: ngày 20 tháng sau với kỳ tháng, ngày cuối tháng đầu quý sau với kỳ quý, ngày cuối tháng thứ 3 sau năm với quyết toán), NĐ 126/2020/NĐ-CP (tạm nộp TNDN quý). Lệ phí môn bài đã bãi bỏ từ 01/01/2026 (NQ 198/2025/QH15) nên không còn khai, nộp. Hạn rơi vào ngày nghỉ được lùi sang ngày làm việc kế tiếp. Thuế GTGT đầu vào từ 5 triệu đồng phải thanh toán không dùng tiền mặt mới được khấu trừ (Luật Thuế GTGT 2024, hiệu lực 01/7/2025).</div>`}

async function invAI(after){const inp=document.createElement('input');inp.type='file';inp.accept='image/*,application/pdf,.xml,text/xml';inp.onchange=async()=>{const file=inp.files[0];if(!file)return;
  if(file.size>10*1024*1024)return toast('File quá 10MB');toast('AI đang đọc hóa đơn…');
  try{const isX=/xml/i.test(file.type)||/\.xml$/i.test(file.name);const r=await KT(isX?{mode:'invoice',text:await file.text()}:{mode:'invoice',file:{b64:await f2b64(file),mime:file.type||'application/pdf'}});
    const num=v=>v==null||v===''?null:Number(String(v).replace(/[^\d.-]/g,''))||0;
    const row={direction:r.direction==='ra'?'ra':'vao',inv_form:r.inv_form||null,inv_symbol:r.inv_symbol||null,inv_no:r.inv_no||null,inv_date:/^\d{4}-\d{2}-\d{2}$/.test(r.inv_date||'')?r.inv_date:today(),lookup_code:r.lookup_code||null,lookup_url:r.lookup_url||null,
      seller_name:r.seller_name||null,seller_tax:r.seller_tax||null,seller_address:r.seller_address||null,buyer_name:r.buyer_name||null,buyer_tax:r.buyer_tax||null,buyer_address:r.buyer_address||null,content:r.content||null,
      amount_pre:num(r.amount_pre),vat_rate:r.vat_rate==null||r.vat_rate===''?null:num(r.vat_rate),vat_amount:num(r.vat_amount),total:num(r.total),pay_method:['tien_mat','chuyen_khoan','tm_ck','khac'].includes(r.pay_method)?r.pay_method:null,
      source:'ai',ai_raw:r,note:(r.issues||[]).length?'AI lưu ý: '+(r.issues||[]).join('; '):null,created_by:ME?.id||null};
    const {data:ins,error}=await sb.from('khg_invoices').insert(row).select().single();if(error)return toast(error.message);
    try{await upFile('other',ins.id,file,'hoa_don')}catch(e){toast('Đã lưu HĐ nhưng chưa đính kèm được file: '+e.message)}
    const cp=ins.direction==='vao'?ins.seller_tax:ins.buyer_tax;
    modal(`<h3>🤖 AI đã đọc hóa đơn ${esc(ins.inv_symbol||'')} ${esc(ins.inv_no||'')}</h3><div class="sub" style="line-height:1.7">${esc(ins.seller_name||'')} → ${esc(ins.buyer_name||'')}<br>Trước thuế ${fmtM(ins.amount_pre)} · VAT ${ins.vat_rate??'KCT'}% ${fmtM(ins.vat_amount)} · Tổng <b>${fmtM(ins.total)}</b></div>

const HUNT=(()=>{const N=s=>(window.KADDR?KADDR.N(s):String(s||'').toLowerCase());

    KADDR.NEW.forEach(p=>{const k=' '+N(p[0]).replace(/^tp /,'')+' ';if(n.includes(k)&&!out.includes(p[0]))out.push(p[0]);p[4].forEach(o=>{if(n.includes(' '+N(o)+' ')&&!out.includes(p[0]))out.push(p[0])})});
