header.top .sp{flex:1}
header.top .me{font-size:12px;color:#D9CFCC}
header.top button{background:transparent;border:1px solid #5A4F4F;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
nav.tabs{position:sticky;top:54px;z-index:15;background:var(--white);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:thin}
nav.tabs button{border:0;background:transparent;padding:12px 12px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
nav.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
main{padding:18px max(16px,env(safe-area-inset-left)) 60px;max-width:1400px;margin:0 auto}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar input,.bar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}

.btn.p{background:var(--red);border-color:var(--red);color:#fff}
.btn.s{padding:3px 8px;font-size:12px;font-weight:500}

.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--alt);font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0}
tr.rw{cursor:pointer}

td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.kpi .h{font-size:12px;color:var(--muted)}

.hb .fl{height:100%;background:var(--grey)}
.hb .fl.r{background:var(--red)}
.hb .vl{width:120px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.list{display:flex;flex-direction:column;gap:6px}
.list .it{border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

#modal .box{background:#fff;border-radius:14px;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:18px}
#modal h3{margin:0 0 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form label.w{grid-column:1/-1}

.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.acts .sp{flex:1}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:13px}
td:first-child{white-space:nowrap}

</style></head><body>

// ===================== Dữ liệu tham chiếu =====================
const REF={};
async function loadRef(name){
  const cfg=E[name];const lab=cfg.label||'code';
  const sel=name==='orders'?'id,code':name==='leases'?'id,area_m2,kind':'id,'+lab;
  const {data}=await sb.from(cfg.table).select(sel).limit(2000);
  REF[name]=Object.fromEntries((data||[]).map(r=>[r.id,name==='leases'?(O.lease_kind[r.kind]+' '+r.area_m2+'m²'):r[lab]]));
}
async function ensureRefs(cfg){await Promise.all([...new Set(cfg.f.filter(x=>x.t==='fk').map(x=>x.ref))].filter(r=>!REF[r]).map(loadRef))}

function cell(f,v){
  if(v==null||v==='')return '';
  switch(f.t){
    case 'money':return fmtN(v);
    case 'num':return fmtN(v);
    case 'date':return fmtD(v);
    case 'dt':return fmtDT(v);
    case 'sel':return pill(f.o,v);
    case 'fk':return esc((REF[f.ref]||{})[v]||'—');
    case 'bool':return v?'✓':'—';
    case 'arr':return esc((v||[]).join(', '));
    case 'area':return esc(String(v).length>90?String(v).slice(0,90)+'…':v);
    default:return f.k==='url'?`<a href="${esc(v)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Mở</a>`:esc(v);
  }
}

// ===================== Danh sách chung =====================
const STATE={};
async function renderList(name,host,opts={}){
  const cfg=E[name];await ensureRefs(cfg);
  const st=STATE[name]=STATE[name]||{q:'',flt:{}};
  host.innerHTML=`<div class="bar"><input type="search" placeholder="Tìm…" value="${esc(st.q)}" data-q>
    ${(cfg.filters||[]).map(([k,o])=>`<select data-f="${k}"><option value="">${esc(cfg.f.find(x=>x.k===k).l)}: tất cả</option>${Object.entries(O[o]).map(([v,l])=>`<option value="${v}" ${String(st.flt[k]??'')===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`).join('')}
    <span style="flex:1"></span>${opts.extraBtns||''}<button class="btn p" data-new>+ Thêm</button></div><div class="tw"><div class="empty">Đang tải…</div></div>`;
  const tw=host.querySelector('.tw');
  const load=async()=>{
    let q=sb.from(cfg.table).select('*').order(cfg.order[0],{ascending:cfg.order[1],nullsFirst:false}).limit(500);
    for(const [k,v] of Object.entries(st.flt)) if(v!==''&&v!=null) q=q.eq(k,v);
    if(st.q&&cfg.search) q=q.or(cfg.search.map(c=>`${c}.ilike.%${st.q.replace(/[%,()]/g,' ')}%`).join(','));
    if(opts.where) q=opts.where(q);
    const {data,error}=await q;
    if(error){tw.innerHTML=`<div class="empty">Lỗi: ${esc(error.message)}</div>`;return}
    const cols=cfg.f.filter(x=>x.list);
    if(!data.length){tw.innerHTML='<div class="empty">Chưa có dữ liệu.</div>';return}
    tw.innerHTML=`<table><thead><tr>${cols.map(c=>`<th class="${['money','num'].includes(c.t)?'n':''}">${esc(c.l)}</th>`).join('')}${opts.rowActions?'<th></th>':''}</tr></thead><tbody>${
      data.map(r=>`<tr class="rw" data-id="${r.id}">${cols.map(c=>`<td class="${['money','num'].includes(c.t)?'n':''}">${cell(c,r[c.k])}</td>`).join('')}${opts.rowActions?`<td style="white-space:nowrap">${opts.rowActions(r)}</td>`:''}</tr>`).join('')}</tbody></table>`;
    tw.querySelectorAll('tr.rw').forEach(tr=>tr.addEventListener('click',e=>{if(e.target.closest('[data-act]'))return;openForm(name,data.find(r=>r.id===tr.dataset.id),load)}));
    if(opts.onActs) tw.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',async e=>{e.stopPropagation();await opts.onActs(b.dataset.act,b.dataset.id);load()}));
  };
  let t;host.querySelector('[data-q]').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{st.q=e.target.value.trim();load()},300)});
  host.querySelectorAll('[data-f]').forEach(s=>s.addEventListener('change',()=>{st.flt[s.dataset.f]=s.value;load()}));
  host.querySelector('[data-new]').addEventListener('click',()=>openForm(name,null,load,opts.newDefaults));
  if(opts.bind) opts.bind(host,load);
  await load();
  return load;
}

// ===================== Biểu mẫu chung =====================
async function openForm(name,row,after,defaults={}){
  const cfg=E[name];await ensureRefs(cfg);
  const v=k=>row?row[k]:(defaults[k]??cfg.f.find(x=>x.k===k).def);
  const inp=f=>{
    const val=v(f.k);const dis=f.ro?'disabled':'';const rq=f.req?'required':'';
    if(f.t==='sel') return `<select name="${f.k}" ${dis} ${rq}><option value=""></option>${Object.entries(O[f.o]).map(([k,l])=>`<option value="${k}" ${String(val??'')===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    if(f.t==='fk') return `<select name="${f.k}" ${dis} ${rq}><option value=""></option>${Object.entries(REF[f.ref]||{}).sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'vi')).map(([k,l])=>`<option value="${k}" ${val===k?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    if(f.t==='area') return `<textarea name="${f.k}" ${dis} ${rq}>${esc(val??'')}</textarea>`;
    if(f.t==='bool') return `<select name="${f.k}" ${dis}><option value="true" ${val!==false?'selected':''}>Có</option><option value="false" ${val===false?'selected':''}>Không</option></select>`;
    if(f.t==='arr') return `<input name="${f.k}" value="${esc((val||[]).join(', '))}" ${dis}>`;
    const type={num:'number',money:'number',date:'date',dt:'datetime-local'}[f.t]||'text';
    const shown=f.t==='dt'?toLocalInput(val):f.t==='date'?(val?String(val).slice(0,10):''):(val??'');
    return `<input type="${type}" ${['num','money'].includes(f.t)?'step="any"':''} name="${f.k}" value="${esc(shown)}" ${dis} ${rq}>`;
  };
  const fields=cfg.f.filter(f=>!(f.ro&&!row));
  $('#modal-box').innerHTML=`<h3>${row?'Sửa':'Thêm'} · ${esc(cfg.title)}</h3><form class="form" id="frm">${fields.map(f=>`<label class="${['area'].includes(f.t)?'w':''}">${esc(f.l)}${inp(f)}</label>`).join('')}</form>
   <div class="acts">${row?'<button class="btn" id="del" style="color:var(--red)">Xóa</button>':''}<span class="sp"></span><button class="btn" id="cancel">Đóng</button><button class="btn p" id="save">Lưu</button></div>`;
  $('#modal').classList.remove('hidden');
  const close=()=>$('#modal').classList.add('hidden');
  $('#cancel').onclick=close;
  $('#save').onclick=async()=>{
    const frm=$('#frm');if(!frm.reportValidity())return;
    const data={};
    for(const f of fields){ if(f.ro)continue;
      const raw=frm.elements[f.k].value;
      let val=raw===''?null:raw;
      if(val!=null){ if(['num','money'].includes(f.t))val=Number(val); else if(f.t==='dt')val=new Date(val).toISOString(); else if(f.t==='bool')val=raw==='true'; else if(f.t==='arr')val=raw.split(',').map(s=>s.trim()).filter(Boolean); else if(f.t==='sel'&&f.o==='segment')val=Number(val)}
      if(f.t==='arr'&&val==null)val=[];
      data[f.k]=val;
    }
    $('#save').disabled=true;
    const res=row?await sb.from(cfg.table).update(data).eq('id',row.id):await sb.from(cfg.table).insert(data);
    $('#save').disabled=false;
    if(res.error){toast('Lỗi: '+res.error.message);return}
    if(cfg.label||name==='orders'||name==='leases') delete REF[name];
    close();toast('Đã lưu');after&&after();
  };
  if(row) $('#del').onclick=async()=>{if(!confirm('Xóa bản ghi này?'))return;const {error}=await sb.from(cfg.table).delete().eq('id',row.id);if(error){toast('Lỗi: '+error.message);return}delete REF[name];close();toast('Đã xóa');after&&after()};
}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.add('hidden')});

// Bảng lương: lương tháng theo ngày công (26 ngày chuẩn), lương ngày × ngày công, lương chuyến × số chuyến đã giao
async function genPayroll(ym){
  if(!ym) return;
  const ms=ym+'-01';const [y,mo]=ym.split('-').map(Number);const me=new Date(y,mo,1);const meIso=me.getFullYear()+'-'+String(me.getMonth()+1).padStart(2,'0')+'-01';
  const [{data:ppl},{data:att},{data:ord}]=await Promise.all([
    sb.from('khg_people').select('id,base_salary,salary_type,active').eq('active',true),
    sb.from('khg_attendance').select('person_id,status').gte('work_date',ms).lt('work_date',meIso),
    sb.from('khg_orders').select('driver_id,trips,status').gte('scheduled_at',ms+'T00:00:00').lt('scheduled_at',meIso+'T00:00:00').in('status',['da_giao','doi_soat','xuat_hd','da_thu']),
  ]);
  const days={},trips={};
  (att||[]).forEach(a=>days[a.person_id]=(days[a.person_id]||0)+(a.status==='co_mat'?1:a.status==='nua_ngay'?.5:0));
  (ord||[]).forEach(o=>{if(o.driver_id)trips[o.driver_id]=(trips[o.driver_id]||0)+(o.trips||1)});
  const rows=(ppl||[]).filter(p=>Number(p.base_salary)>0).map(p=>{
    const b=Number(p.base_salary),d=days[p.id]||0,t=trips[p.id]||0;
    let base=b,bonus=0;
    if(p.salary_type==='thang') base=Math.round(b*Math.min(d,26)/26);
    else if(p.salary_type==='ngay') base=Math.round(b*d);
    else if(p.salary_type==='chuyen'){base=0;bonus=Math.round(b*t)}
    return {person_id:p.id,month:ms,base,trip_bonus:bonus,note:`Ngày công ${d} · chuyến ${t}`};
  });
  if(!rows.length) return toast('Chưa có nhân sự nào có lương cơ bản');
  const {data:ex}=await sb.from('khg_payroll').select('person_id,status').eq('month',ms);
  const locked=new Set((ex||[]).filter(x=>x.status!=='nhap').map(x=>x.person_id));
  const up=rows.filter(r=>!locked.has(r.person_id));
  const {error}=await sb.from('khg_payroll').upsert(up,{onConflict:'person_id,month'});
  toast(error?('Lỗi: '+error.message):`Đã tính ${up.length} người (bỏ qua ${locked.size} bảng đã duyệt)`);
}

let cur='overview';
function nav(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===cur?'on':''}">${l}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
}
async function go(t){cur=t;nav();history.replaceState(null,'','#'+t);const m=$('#main');m.innerHTML='';try{await VIEWS[t](m)}catch(e){m.innerHTML='<div class="empty">Lỗi: '+esc(e.message)+'</div>'}}
async function start(session){
  const {data:ok}=await sb.rpc('khg_is_staff');
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#me').textContent=session.user.email;
  if(!ok){$('#tabs').innerHTML='';$('#main').innerHTML='<div class="empty">Tài khoản này chưa có quyền vào CRM KHG. Quản trị cần thêm email này vào mục Nhân sự với vai trò quản lý.</div>';return}
  const h=location.hash.slice(1);cur=VIEWS[h]?h:'overview';go(cur);
}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-error').textContent='';$('#login-submit').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$('#login-email').value.trim(),password:$('#login-password').value});
  $('#login-submit').disabled=false;if(error){$('#login-error').textContent='Sai email hoặc mật khẩu.';return}start(data.session)});
$('#logout').onclick=async()=>{await sb.auth.signOut().catch(()=>{});location.hash='';location.reload()};
(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session)start(data.session);else $('#login').classList.remove('hidden')})();
})();
