  const G=NAV_STD.concat(extra.length?[['📌 Khác',extra]]:[]);let col={};try{col=JSON.parse(localStorage.getItem('khg_nav_col')||'{}')}catch(e){}
  $('#tabs').innerHTML=`<input id="navQ" placeholder="🔍 Tìm chức năng…" autocomplete="off" style="width:100%;margin:2px 0 8px;height:34px;border-radius:9px;border:1px solid #2A3140;background:#121722;color:#E5E7EB;padding:0 10px;font-size:13px">`+G.map(([g,ks])=>{const items=ks.filter(k=>ok[k]);if(!items.length)return '';const open=items.includes(cur)||!col[g];
    return `<div class="grp nvg" data-g="${esc(g)}" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none">${g}<span style="opacity:.6;font-size:12px">${open?'▾':'▸'}</span></div><div class="nvi" style="${open?'':'display:none'}">`+items.map(k=>`<button data-t="${k}" class="${k===cur?'on':''}">${ICONS[k]||''}<span>${esc(NAV_LBL[k]||ok[k])}</span></button>`).join('')+'</div>'}).join('');
  $('#tabs').querySelectorAll('.nvg').forEach(h=>h.onclick=()=>{const box=h.nextElementSibling;const show=box.style.display==='none';box.style.display=show?'':'none';h.lastElementChild.textContent=show?'▾':'▸';col[h.dataset.g]=!show;try{localStorage.setItem('khg_nav_col',JSON.stringify(col))}catch(e){}});
  const nq=$('#navQ');nq.oninput=()=>{const q=nq.value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');$('#tabs').querySelectorAll('.nvi').forEach(box=>{let any=0;box.querySelectorAll('button').forEach(b=>{const t=b.innerText.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');const m=!q||t.includes(q);b.style.display=m?'':'none';if(m)any=1});box.style.display=q?(any?'':'none'):(box.previousElementSibling.lastElementChild.textContent==='▾'?'':'none');box.previousElementSibling.style.display=q&&!any?'none':'flex'})};
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#app').classList.remove('open');go(b.dataset.t)});
  const t=allowed().find(x=>x[0]===cur);$('#ptitle').textContent=t?t[1]:'';
}
$('#burger').onclick=()=>$('#app').classList.toggle('open');$('#shade').onclick=()=>$('#app').classList.remove('open');
$('#pdate').textContent=new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
async function go(t){if(typeof RSUB!=='undefined'&&t!=='reports'&&RSUB.some(x=>x[0]===t)&&allowed().some(x=>x[0]==='reports')){RPT.sub=t;t='reports'}const al=allowed();if(!al.find(x=>x[0]===t))t=al.find(x=>x[0]==='overview')?'overview':al[0][0];cur=t;RO=!isAdmin()&&(PERMS[t]==='view'||(!PERMS[t]&&RPERMS[t]==='view'));nav();history.replaceState(null,'','#'+t);const m=$('#main');m.innerHTML='';try{await VIEWS[t](m)}catch(e){console.error(e);m.innerHTML='<div class="empty">Lỗi: '+esc(e.message)+'</div>'}}
async function mustChange(session){
  if(!session?.user?.user_metadata?.must_change)return;
  await new Promise(res=>{modal(`<h3>🔐 Đặt mật khẩu mới</h3><p class="sub">Bạn đang dùng mật khẩu tạm do công ty cấp. Vui lòng đặt mật khẩu riêng (tối thiểu 6 ký tự) để tiếp tục.</p>
    <div class="form" style="grid-template-columns:1fr 1fr"><label>Mật khẩu mới<input id="mc1" type="password" autocomplete="new-password"></label><label>Nhập lại<input id="mc2" type="password" autocomplete="new-password"></label></div><div class="acts"><button class="btn p" id="mcs">Lưu mật khẩu</button></div>`);
    $('#modal').onclick=null;
    $('#mcs').onclick=async()=>{const a=$('#mc1').value,b=$('#mc2').value;if(a.length<6)return toast('Tối thiểu 6 ký tự');if(a!==b)return toast('Hai lần nhập không khớp');
      const {error}=await sb.auth.updateUser({password:a,data:{must_change:false}});if(error)return toast(error.message);closeModal();toast('Đã đặt mật khẩu mới');res()}});
}
async function start(session){
  await mustChange(session);
  const {data:acc}=await sb.rpc('khg_my_access');
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  if(!acc){$('#tabs').innerHTML='';$('#me').textContent=session.user.email;$('#main').innerHTML='<div class="empty">Tài khoản này chưa gắn với hồ sơ nhân sự KHG. Quản trị cấp tài khoản ở mục Nhân sự → 🔐 Tài khoản.</div>';return}
  ROLE=acc.role;ROLES=[acc.role,...(acc.extra_roles||[])];PERMS=acc.perms||{};ME={id:acc.id,full_name:acc.full_name,role:acc.role};
  try{const LV={none:0,view:1,edit:2,full:3};const {data:rp}=await sb.from('khg_role_perms').select('module,level').in('role',ROLES);RPERMS={};(rp||[]).forEach(x=>{if(!RPERMS[x.module]||LV[x.level]>LV[RPERMS[x.module]])RPERMS[x.module]=x.level})}catch(e){}
  if(acc.role==='tai_xe'&&!has(STAFF)&&!location.hash.includes('me')){location.href='tai-xe.html';return}
  $('#me').innerHTML='<b>'+esc(ME?.full_name||session.user.email)+'</b>'+esc(ROLES.map(r=>O.role[r]||r).join(' · '));$('#av').textContent=(ME?.full_name||session.user.email||'K').trim().split(/\s+/).pop().charAt(0).toUpperCase();
  const h=location.hash.slice(1);
  if(h.startsWith('rec/')){const [,ent,id]=h.split('/');const v=ent==='orders'&&has(['admin','dieu_phoi'])?'dispatch':ENT_VIEW[ent]||'overview';await go(v);if(id)openRecord(ent,id)}
  else{cur=VIEWS[h]?h:(has(STAFF)?'overview':'me');go(cur)}loadNotif();
  if(has(['admin','dieu_phoi'])&&'Notification' in window&&Notification.permission==='default')document.addEventListener('click',()=>Notification.requestPermission().catch(()=>{}),{once:true});
  try{sb.channel('khg-crm').on('postgres_changes',{event:'*',schema:'public',table:'khg_orders'},p=>{
      if(p.eventType==='INSERT'){if(p.new.source==='khach_hang'&&has(['admin','dieu_phoi']))ringAlarm(p.new);else toast('🆕 Đơn mới '+(p.new.code||''))}
      if(cur==='dispatch'&&DISPATCH_RELOAD){clearTimeout(window._dr);window._dr=setTimeout(DISPATCH_RELOAD,800)}})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'khg_notifications'},p=>{if(ME&&p.new.person_id===ME.id){toast('🔔 '+p.new.title);loadNotif();if(!/^(Đã|Nhắc)/.test(p.new.title||''))CRing.start(p.new.title,p.new.body,()=>{const t=(p.new.title||'')+' '+(p.new.body||'');if(/thuê tài xế|chọn tài xế|kết nối/i.test(t)){FD_SUB='kn';go('fastdriver')}else if(/xác thực|hồ sơ|vi phạm|ký/i.test(t)&&VIEWS.accounts)go('accounts');else{$('#notif').classList.remove('hidden');loadNotif()}})}}).subscribe()}catch(e){}
}
$('#login-form').addEventListener('submit',async e=>{e.preventDefault();$('#login-error').textContent='';$('#login-submit').disabled=true;
  const lg=$('#login-email').value.trim();const email=lg.includes('@')?lg:lg.replace(/\D/g,'').replace(/^84/,'0')+'@taixe.kimhoanggia.vn';
  const {data,error}=await sb.auth.signInWithPassword({email,password:$('#login-password').value});
  $('#login-submit').disabled=false;if(error){$('#login-error').textContent='Sai tên đăng nhập hoặc mật khẩu.';return}start(data.session)});
const otpCall=async b=>{const r=await fetch(SUPABASE_URL+'/functions/v1/khg-admin',{method:'POST',headers:{'content-type':'application/json',apikey:SUPABASE_ANON_KEY},body:JSON.stringify(b)});return r.json().catch(()=>({error:'Lỗi kết nối'}))};
$('#login-otp').onclick=async()=>{const lg=$('#login-email').value.trim();if(!lg){$('#login-error').textContent='Nhập email hoặc số điện thoại trước';return}
  $('#login-otp').disabled=true;const r=await otpCall({action:'otp_request',login:lg});$('#login-otp').disabled=false;
  if(r.error){$('#login-error').textContent=r.error;return}$('#login-error').textContent='Đã gửi mã 6 số qua bot Telegram KHG.';$('#otp-box').classList.remove('hidden');$('#otp-code').focus()};
$('#otp-ok').onclick=async()=>{const r=await otpCall({action:'otp_verify',login:$('#login-email').value.trim(),code:$('#otp-code').value});if(r.error){$('#login-error').textContent=r.error;return}
  const {data,error}=await sb.auth.verifyOtp({type:'magiclink',token_hash:r.token_hash});if(error){$('#login-error').textContent=error.message;return}start(data.session)};
$('#logout').onclick=async()=>{await sb.auth.signOut().catch(()=>{});location.hash='';location.reload()};
(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session)start(data.session);else $('#login').classList.remove('hidden')})();
})();
</script>
<script>
// ===== KInstall: cài app lên màn hình chính (Android, iPhone, máy tính) =====
(function(){
  const ua=navigator.userAgent||'';
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const inApp=/Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|TikTok|musical_ly|ZaloTheme/i.test(ua);
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  let deferred=null;
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/khg-sw.js',{scope:'/'}).catch(()=>{}));
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;show()});
  window.addEventListener('appinstalled',()=>{try{localStorage.setItem('khg_installed','1')}catch(e){}hide()});
  const css=`#kins{position:fixed;left:10px;right:10px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:120;background:#111827;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:520px;margin:0 auto}
#kins img{width:40px;height:40px;border-radius:10px}#kins b{display:block;font-size:15px}#kins .x{background:none;border:0;color:#9CA3AF;font-size:20px;padding:4px}
#kins .go{background:#C8102E;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;white-space:nowrap}
#kinsg{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#kinsg .bx{background:#fff;color:#111;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#kinsg ol{padding-left:20px;margin:8px 0}#kinsg li{margin:8px 0}#kinsg .k{display:inline-block;border:1px solid #ddd;border-radius:6px;padding:0 6px;background:#f6f6f6}
#kinsg button{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;margin-top:8px}#kinsg .p{background:#C8102E;color:#fff}#kinsg .o{background:#f1f1f1}`;
  const icon=(document.querySelector('link[rel=apple-touch-icon]')||{}).href||'';
  const name=(document.querySelector('meta[name=apple-mobile-web-app-title]')||{}).content||'KHG';
  function ensureCss(){if(!document.getElementById('kins-css')){const s=document.createElement('style');s.id='kins-css';s.textContent=css;document.head.appendChild(s)}}
  function hide(){document.getElementById('kins')?.remove()}
  function show(force){
    if(standalone)return;
    try{if(!force&&(localStorage.getItem('khg_ins_hide')>Date.now()||localStorage.getItem('khg_installed')))return}catch(e){}
    ensureCss();
    hide();const d=document.createElement('div');d.id='kins';
    d.innerHTML=`${icon?`<img src="${icon}" alt="">`:''}<div style="flex:1"><b>Cài “${name}” lên màn hình chính</b>${inApp?'Đang mở trong Zalo/Facebook – mở bằng trình duyệt để cài':'Mở nhanh như app, nhận chuông báo'}</div><button class="go">Cài app</button><button class="x" aria-label="Đóng">✕</button>`;
    document.body.appendChild(d);
    d.querySelector('.x').onclick=()=>{try{localStorage.setItem('khg_ins_hide',Date.now()+3*864e5)}catch(e){}hide()};
    d.querySelector('.go').onclick=()=>KInstall.open();
  }
  function guide(html){ensureCss();document.getElementById('kinsg')?.remove();const g=document.createElement('div');g.id='kinsg';g.innerHTML=`<div class="bx">${html}<button class="o" id="kgc">Đóng</button></div>`;
    document.body.appendChild(g);g.onclick=e=>{if(e.target.id==='kinsg')g.remove()};document.getElementById('kgc').onclick=()=>g.remove()}
  window.KInstall={
    standalone,isIOS,isAndroid,inApp,show:()=>show(true),
    async open(){
      const url=location.href.split('#')[0];
      if(inApp){
        const intent=`intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;end`;
        guide(`<h3 style="margin:0 0 6px">Mở bằng trình duyệt để cài app</h3><p>Zalo / Facebook không cho cài app. Hãy mở link này bằng ${isIOS?'<b>Safari</b>':'<b>Chrome</b>'}:</p>
          <ol><li>Bấm nút <span class="k">⋯</span> hoặc <span class="k">⋮</span> ở góc trên.</li><li>Chọn <b>Mở bằng trình duyệt</b> / <b>Open in ${isIOS?'Safari':'Chrome'}</b>.</li><li>Trong trình duyệt, bấm lại <b>Cài app</b>.</li></ol>
          ${isAndroid?`<a href="${intent}"><button class="p">Mở bằng Chrome</button></a>`:''}<button class="o" id="kcp">📋 Sao chép link</button>`);
        document.getElementById('kcp').onclick=()=>{navigator.clipboard?.writeText(url);document.getElementById('kcp').textContent='Đã sao chép – dán vào '+(isIOS?'Safari':'Chrome')};return}
      if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==='accepted')hide();return}
      if(isIOS){guide(`<h3 style="margin:0 0 6px">Cài lên iPhone / iPad</h3><ol><li>Mở trang này bằng <b>Safari</b>.</li><li>Bấm nút <b>Chia sẻ</b> <span class="k">⬆︎</span> ở thanh dưới (hoặc trên).</li><li>Kéo xuống, chọn <b>Thêm vào MH chính</b> (Add to Home Screen).</li><li>Bấm <b>Thêm</b>. Biểu tượng ${name} xuất hiện trên màn hình chính.</li></ol><p style="font-size:13px;color:#666">Mở app từ biểu tượng để nhận thông báo (iOS 16.4 trở lên).</p>`);return}
      guide(`<h3 style="margin:0 0 6px">Cài lên ${isAndroid?'điện thoại Android':'máy tính'}</h3><ol>${isAndroid?'<li>Mở bằng <b>Chrome</b>.</li><li>Bấm <span class="k">⋮</span> góc phải trên.</li><li>Chọn <b>Cài đặt ứng dụng</b> / <b>Thêm vào màn hình chính</b>.</li><li>Bấm <b>Cài đặt</b>.</li>':'<li>Mở bằng Chrome hoặc Edge.</li><li>Bấm biểu tượng <b>Cài đặt</b> ⊕ ở cuối thanh địa chỉ.</li><li>Bấm <b>Cài đặt</b> – app mở thành cửa sổ riêng, ghim vào thanh tác vụ.</li>'}</ol>`);
    }
  };
  // hiện gợi ý sau 4 giây trên điện thoại
  if(/[?&]install=1/.test(location.search)&&!standalone)setTimeout(()=>KInstall.open(),900);
  else if(!standalone&&(isIOS||isAndroid||inApp))setTimeout(()=>show(false),4000);
})();
</script>
