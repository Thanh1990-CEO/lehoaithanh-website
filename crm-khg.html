<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KHG CRM">
<link rel="manifest" href="/crm-khg.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/crm-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/crm-180.png">
<title>CRM vận tải KHG — Kim Hoàng Gia</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/logo.jpg" type="image/jpeg">
<style>
:root{--red:#C8102E;--red-soft:#FBE6E9;--ink:#1B1616;--muted:#6E6462;--bg:#FAF7F5;--alt:#F2EBE8;--line:#E3D6D2;--white:#FFFFFF;
  --green:#2F7D4F;--amber:#B06A2B;--blue:#0B5C91;--grey:#8A817F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--red)}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login form{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
#login h1{margin:0;font-size:20px}
#login p{margin:0;color:var(--muted)}
.err{color:var(--red);font-size:13px}
header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left))}
header.top .logo{width:34px;height:34px;border-radius:8px;background:var(--red);display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:.5px}
header.top b{font-size:15px}
header.top .sp{flex:1}
header.top .me{font-size:12px;color:#D9CFCC}
header.top button{background:transparent;border:1px solid #5A4F4F;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
#bell{position:relative}
#bell span{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:0 5px;min-width:18px;text-align:center}
nav.tabs{position:sticky;top:54px;z-index:15;background:var(--white);border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:thin}
nav.tabs button{border:0;background:transparent;padding:12px 11px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
nav.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
main{padding:18px max(16px,env(safe-area-inset-left)) 60px;max-width:1440px;margin:0 auto}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar input,.bar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.bar input[type=search]{flex:1 1 200px}
.bar label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.s{padding:3px 8px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:72vh}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--alt);font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0;z-index:1}
tr.rw{cursor:pointer}
tr.rw:hover td{background:#FFF8F8}
tr.tot td{font-weight:800;background:var(--alt)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.neg{color:var(--red)}table.kv td{padding:5px 8px;font-size:13px}table.kv td:first-child{color:var(--muted);white-space:nowrap;width:150px}table.kv{min-width:0}.kgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.kimg{display:block;width:120px;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--muted);font-size:11px;background:#fff}.kimg img{width:100%;height:96px;object-fit:cover;display:block}.kimg.big{width:220px}.kimg.big img{height:200px;object-fit:contain;background:#f5f5f5}.kimg span{display:block;padding:4px 6px}.kimg .pdf{height:96px;display:grid;place-items:center;font-weight:800}tr.lowr td{background:#fff3f3}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--alt);white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)}.pill.green{background:#E3F1E8;color:var(--green)}
.pill.amber{background:#F7EADC;color:var(--amber)}.pill.blue{background:#E1EDF6;color:var(--blue)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.hot{border-color:var(--red);background:#FFF7F8}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0}
.hb .lb{width:140px;font-size:13px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{flex:1;background:var(--alt);border-radius:6px;height:16px;overflow:hidden}
.hb .fl{height:100%;background:var(--grey)}
.hb .fl.r{background:var(--red)}
.hb .vl{width:110px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.list{display:flex;flex-direction:column;gap:6px}
.list .it{border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.newq{border:1.5px solid var(--red);background:#FFF7F8;border-radius:14px;padding:12px;margin-bottom:14px}
.newq h3{margin:0 0 8px;display:flex;align-items:center;gap:8px}.newq .nq{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.nqc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}.nqc .t{display:flex;justify-content:space-between;gap:6px;font-weight:700}
.nqc .m{color:var(--muted);font-size:12.5px;margin-top:2px}.nqc .a{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ring{animation:ring 1s infinite}@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(200,16,46,.5)}50%{box-shadow:0 0 0 8px rgba(200,16,46,0)}}
#alarm{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:300;background:#C8102E;color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 12px 34px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;max-width:92vw;cursor:pointer}
.drl{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px}.drl label{display:flex;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.drl label:hover{background:#F7F7F9}.drl input{accent-color:#C8102E}.drl .bz{margin-left:auto;font-size:12px}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--alt);border-radius:12px;padding:10px;min-height:120px}
.col h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.oc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:8px;font-size:13px;cursor:pointer}
.oc:hover{border-color:var(--red)}
.oc .t{display:flex;justify-content:space-between;gap:6px;font-weight:700}
.oc .m{color:var(--muted);font-size:12px}
.oc.late{border-left:4px solid var(--red)}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:4px 0 8px 14px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--red)}
#modal{position:fixed;inset:0;background:rgba(27,22,22,.45);display:grid;place-items:center;z-index:50;padding:12px}
#modal .box{background:#fff;border-radius:14px;width:100%;max-width:820px;max-height:92vh;overflow:auto;padding:18px}
.cmp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}.cfrm{max-height:64vh;overflow:auto;padding-right:6px}
.cfrm details{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}.cfrm summary{font-weight:700;cursor:pointer}.cfrm .form{grid-template-columns:1fr 1fr;margin-top:8px}
.cchk{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:4px}.cchk input{width:auto!important;margin:0;flex:none}.form .cchk label{flex-direction:row;align-items:center;gap:6px;font-weight:500;color:var(--ink,#222);font-size:13px}
.cpv{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f6f6f6}.cpvh{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line)}.cpvh .sp{flex:1}
.cpv iframe{width:100%;height:64vh;border:0;background:#fff}
@media (max-width:900px){.cmp{grid-template-columns:1fr}.cfrm{max-height:none}.cpv iframe{height:60vh}.cfrm .form,.cchk{grid-template-columns:1fr}}
#modal h3{margin:0 0 12px}
.form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.form label.w{grid-column:1/-1}
.form .hd{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--red);border-bottom:1px solid var(--line);padding-top:6px;text-transform:uppercase;letter-spacing:.4px}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);font-weight:400;font-size:14px;width:100%}
.form textarea{min-height:66px;resize:vertical}
.form .hint{font-weight:400;font-size:11px;color:var(--grey)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.acts .sp{flex:1}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.fi{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.fi img{width:100%;height:96px;object-fit:cover;border-radius:6px;background:var(--alt)}
.fi .ic{height:96px;display:grid;place-items:center;background:var(--alt);border-radius:6px;font-weight:800;color:var(--muted)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:13px;max-width:90vw}
#notif{position:fixed;top:56px;right:12px;width:min(380px,94vw);max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.15)}
#notif .it{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
#notif .it.u{background:#FFF7F8}
td:first-child{white-space:nowrap}
td input[type=checkbox],th input[type=checkbox]{width:16px;height:16px}
@media (max-width:820px){.form{grid-template-columns:1fr 1fr}}
@media (max-width:560px){header.top a{display:none}.form{grid-template-columns:1fr}.hb .lb{width:96px}.hb .vl{width:86px}.board{grid-template-columns:repeat(5,82vw)}}

/* ===== Giao diện điều hành CEO (v3) ===== */
:root{--red:#C8102E;--red-d:#9E0B23;--red-soft:#FDECEF;--ink:#111827;--muted:#6B7280;--bg:#F3F4F7;--alt:#F7F7F9;--line:#E6E8EE;--white:#fff;
  --side:#0F141C;--side2:#171E29;--side-t:#A9B2C1;--green:#15803D;--amber:#B45309;--blue:#1D4ED8;--grey:#9CA3AF;--sh:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05)}
body{background:var(--bg);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
#app{display:block}
#side{position:fixed;inset:0 auto 0 0;width:252px;background:var(--side);color:var(--side-t);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
#side .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid #1F2733}
#side .brand .logo{width:38px;height:38px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:.5px;box-shadow:0 4px 14px rgba(200,16,46,.35)}
#side .brand b{color:#fff;font-size:15px;display:block;line-height:1.2}
#side .brand small{color:#7C8696;font-size:11.5px;letter-spacing:.3px}
nav.tabs{position:static;display:block;background:transparent;border:0;padding:10px 10px 20px;overflow:auto;flex:1}
nav.tabs .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:#5E6878;font-weight:700;padding:14px 10px 6px}
nav.tabs button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:9px;background:transparent;color:var(--side-t);padding:9px 10px;margin:1px 0;font-weight:500;font-size:13.5px;text-align:left;cursor:pointer;border-bottom:0}
nav.tabs button svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
nav.tabs button:hover{background:var(--side2);color:#fff}
nav.tabs button.on{background:linear-gradient(90deg,rgba(200,16,46,.22),rgba(200,16,46,.06));color:#fff;box-shadow:inset 3px 0 0 var(--red)}
nav.tabs button.on svg{opacity:1;color:#FF5A72}
#side .side-foot{padding:12px 18px;border-top:1px solid #1F2733;font-size:12px;color:#7C8696}
#side .side-foot a{color:#C9D1DD;text-decoration:none}
#shade{display:none}
header.top{position:sticky;top:0;z-index:20;margin-left:252px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);color:var(--ink);border-bottom:1px solid var(--line);padding:10px 26px;gap:14px;min-height:62px}
header.top .ttl b{font-size:17px;display:block;letter-spacing:-.2px}
header.top .ttl small{color:var(--muted);font-size:12px}
header.top button,header.top .lnk{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:13px;text-decoration:none}
header.top button:hover{border-color:#CBD0DA}
#burger{display:none}
header.top .user{display:flex;align-items:center;gap:9px}
header.top .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
header.top .me{font-size:12.5px;color:var(--muted);line-height:1.25;max-width:220px}
header.top .me b{display:block;color:var(--ink);font-size:13px}
main{margin-left:252px;max-width:none;padding:24px 26px 70px}
main>h2{font-size:22px;letter-spacing:-.3px;margin:0 0 4px}
.sub{color:var(--muted)}
.btn{border-radius:9px;border-color:var(--line);box-shadow:0 1px 1px rgba(16,24,40,.03)}
.btn:hover{border-color:#C9CED8}
.btn.p{background:var(--red);border-color:var(--red)}.btn.p:hover{background:var(--red-d)}
.bar input,.bar select,.form input,.form select,.form textarea{border-color:var(--line);border-radius:9px}
.bar input:focus,.bar select:focus,.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid rgba(200,16,46,.18);border-color:var(--red)}
.card,.kpi,.tw{border-color:var(--line);border-radius:14px;box-shadow:var(--sh)}
.card{padding:16px 18px}
.card h3{font-size:14.5px;letter-spacing:-.1px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{position:relative;padding:16px 16px 14px;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#D7DBE3}
.kpi.hot::before{background:var(--red)}.kpi.hot{background:#fff;border-color:var(--line)}
.kpi .l{font-size:11.5px;letter-spacing:.5px;font-weight:600}
.kpi .v{font-size:25px;letter-spacing:-.5px}
th{background:#F9FAFB;color:#6B7280;font-size:11.5px;letter-spacing:.4px;border-bottom:1px solid var(--line)}
td{border-bottom-color:#EEF0F4}
tr.rw:hover td{background:#FFF7F8}
.pill{font-weight:600;border-radius:7px;padding:2px 8px}
.pill.green{background:#E7F6EC}.pill.amber{background:#FDF1E3}.pill.blue{background:#E8EEFD}.pill.red{background:var(--red-soft)}
.subtabs button{border-radius:9px}
.subtabs button.on{background:var(--ink);border-color:var(--ink)}
.col{background:#EDEFF3;border-radius:14px}
.oc{border-radius:11px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.hb .tr{background:#EEF0F4;height:12px}.hb .fl{background:#9AA3B2;border-radius:6px}.hb .fl.r{background:var(--red)}
#modal .box{border-radius:16px}
#notif{top:66px;border-radius:14px}
.board{grid-template-columns:repeat(5,minmax(200px,1fr))}
header.top button{white-space:nowrap}
/* CEO hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin:0 0 18px;padding:20px 22px;border-radius:16px;color:#fff;
  background:radial-gradient(1200px 300px at 100% 0,rgba(200,16,46,.55),transparent 60%),linear-gradient(120deg,#111827,#1F2937);box-shadow:var(--sh)}
.hero h1{margin:0;font-size:22px;letter-spacing:-.3px}
.hero p{margin:4px 0 0;color:#C7CEDA;font-size:13px}
.hero .sp{flex:1}
.hero .q{display:flex;gap:8px;flex-wrap:wrap}
.hero .q button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.hero .q button:hover{background:rgba(255,255,255,.18)}
.spark{display:flex;align-items:flex-end;gap:5px;height:130px;padding-top:6px}
.spark div{flex:1;background:linear-gradient(180deg,#E3354F,#C8102E);border-radius:5px 5px 2px 2px;min-height:2px;position:relative}
.spark div.z{background:#E5E7EB}
.spark-x{display:flex;gap:5px;font-size:10.5px;color:var(--muted);margin-top:5px}.spark-x span{flex:1;text-align:center}
/* Nhật ký bot */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:min(720px,88%);padding:9px 12px;border-radius:13px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;box-shadow:var(--sh)}
.msg.in{align-self:flex-start;background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
.msg.out{align-self:flex-end;background:#111827;color:#E5E7EB;border-top-right-radius:4px}
.msg .mh{font-size:11.5px;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;white-space:normal}
.msg.out .mh{color:#9CA3AF}
.day{align-self:center;font-size:11.5px;color:var(--muted);background:#E9EBF0;border-radius:99px;padding:2px 10px;margin:6px 0}
@media (max-width:980px){
  #side{transform:translateX(-100%)}#app.open #side{transform:none}

  if(name==='orders'){const {data}=await sb.from('khg_orders').select('id,code').order('created_at',{ascending:false}).limit(3000);REF.orders=Object.fromEntries((data||[]).map(r=>[r.id,r.code]));return}
  if(name==='leases'){const {data}=await sb.from('khg_leases').select('id,area_m2,kind');REF.leases=Object.fromEntries((data||[]).map(r=>[r.id,(O.lease_kind[r.kind]||'')+' '+r.area_m2+'m²']));return}
  if(name==='advances'){const {data}=await sb.from('khg_advances').select('id,amount,advanced_on,kind,person_id,status');await ensureRef('people');REF.advances=Object.fromEntries((data||[]).map(r=>[r.id,`${REF.people[r.person_id]||''} · ${fmtTr(r.amount)} · ${fmtD(r.advanced_on)}`]));return}
  if(name==='vehicles'){const {data}=await sb.from('khg_vehicles').select('id,plate,load_t,ownership,partner_name');REF.vehicles={};(data||[]).forEach(r=>{REF.vehicles[r.id]=r.plate;VEH[r.id]=r});return}
  const cfg=E[name];const lab=cfg.label;
  const {data}=await sb.from(cfg.table).select('id,'+lab).limit(3000);
  REF[name]=Object.fromEntries((data||[]).map(r=>[r.id,r[lab]]));
}
const ensureRef=async n=>{if(!REF[n])await loadRef(n)};
async function ensureRefs(cfg){await Promise.all([...new Set(fields(cfg).filter(x=>x.t==='fk').map(x=>x.ref).concat((cfg.filters||[]).filter(f=>f[1][0]==='@').map(f=>f[1].slice(1))))].map(ensureRef))}

function cell(f,v){
  if(v==null||v==='')return '';
  switch(f.t){
    case 'money':case 'num':return fmtN(v);
    case 'date':return fmtD(v);
    case 'dt':return fmtDT(v);
    case 'sel':return pill(f.o,v);
    case 'fk':return esc((REF[f.ref]||{})[v]||'—');
    case 'bool':return v?'✓':'—';
    case 'arr':return esc((v||[]).join(', '));
    case 'lines':return esc((v||[]).join(' | '));
    case 'area':return esc(String(v).length>90?String(v).slice(0,90)+'…':v);
    default:return f.k==='url'||f.k==='file_url'?`<a href="${esc(v)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Mở</a>`:esc(v);
  }
}
function plain(f,v){
  if(v==null||v==='')return '';
  switch(f.t){
    case 'money':case 'num':return Number(v);
    case 'lines':return (v||[]).join(' | ');
    case 'date':return fmtD(v);
    case 'dt':return new Date(v).toLocaleString('vi-VN');
    case 'sel':return (O[f.o]||{})[v]??v;
    case 'fk':return (REF[f.ref]||{})[v]||'';
    case 'bool':return v?'Có':'Không';
    case 'arr':return (v||[]).join(', ');
    default:return String(v);
  }
}

// ===================== Xuất Excel =====================
async function xlsx(filename,sheets){
  try{await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js')}catch(e){toast(e.message);return}
  const wb=XLSX.utils.book_new();
  for(const [name,rows] of Object.entries(sheets)){
    const ws=Array.isArray(rows[0])?XLSX.utils.aoa_to_sheet(rows):XLSX.utils.json_to_sheet(rows.length?rows:[{'Không có dữ liệu':''}]);
    const keys=Array.isArray(rows[0])?rows[0]:Object.keys(rows[0]||{});
    ws['!cols']=keys.map((k,i)=>({wch:Math.min(48,Math.max(10,String(k).length+2,...rows.slice(0,200).map(r=>String((Array.isArray(r)?r[i]:r[k])??'').length+1)))}));
    XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31).replace(/[\\/?*\[\]:]/g,' '));
  }
  XLSX.writeFile(wb,filename.replace(/\s+/g,'_')+'_'+today()+'.xlsx');
}
function rowsForExport(cfg,data,extra){
  const fs=fields(cfg);
  return data.map(r=>{const o={};fs.forEach(f=>o[f.l]=plain(f,r[f.k]));if(extra)Object.assign(o,extra(r));return o});
}

// ===================== Kỳ báo cáo =====================
function periodRange(p){
  const ref=p.ref||today();const d=new Date(ref+'T00:00:00');const y=d.getFullYear(),m=d.getMonth();
  const pad=n=>String(n).padStart(2,'0');
  if(p.kind==='ngay')return {from:ref,to:ref,label:'Ngày '+fmtD(ref)};
  if(p.kind==='tuan'){const s=addDays(ref,-((d.getDay()+6)%7));return {from:s,to:addDays(s,6),label:'Tuần '+fmtD(s)+' – '+fmtD(addDays(s,6))}}
  if(p.kind==='quy'){const q=Math.floor(m/3);const s=`${y}-${pad(q*3+1)}-01`;const e=isoD(new Date(y,q*3+3,0));return {from:s,to:e,label:`Quý ${q+1}/${y}`}}
  if(p.kind==='nam')return {from:`${y}-01-01`,to:`${y}-12-31`,label:'Năm '+y};
  if(p.kind==='tuy_chon')return {from:p.from||ref,to:p.to||ref,label:fmtD(p.from)+' – '+fmtD(p.to)};
  return {from:`${y}-${pad(m+1)}-01`,to:isoD(new Date(y,m+1,0)),label:`Tháng ${m+1}/${y}`};
}
function periodPicker(host,st,onChange){
  host.innerHTML=`<select data-k>${[['ngay','Ngày'],['tuan','Tuần'],['thang','Tháng'],['quy','Quý'],['nam','Năm'],['tuy_chon','Tùy chọn']].map(([k,l])=>`<option value="${k}" ${st.kind===k?'selected':''}>${l}</option>`).join('')}</select>
   <input type="date" data-r value="${st.ref||today()}" ${st.kind==='tuy_chon'?'class="hidden"':''}><span data-c class="${st.kind==='tuy_chon'?'':'hidden'}"><input type="date" data-f value="${st.from||addDays(today(),-30)}"> – <input type="date" data-t value="${st.to||today()}"></span><b data-l style="font-size:13px"></b>`;
  const upd=()=>{host.querySelector('[data-l]').textContent=periodRange(st).label;onChange(periodRange(st))};
  host.querySelector('[data-k]').onchange=e=>{st.kind=e.target.value;host.querySelector('[data-r]').classList.toggle('hidden',st.kind==='tuy_chon');host.querySelector('[data-c]').classList.toggle('hidden',st.kind!=='tuy_chon');upd()};
  host.querySelector('[data-r]').onchange=e=>{st.ref=e.target.value;upd()};
  host.querySelector('[data-f]').onchange=e=>{st.from=e.target.value;upd()};
  host.querySelector('[data-t]').onchange=e=>{st.to=e.target.value;upd()};
  host.querySelector('[data-l]').textContent=periodRange(st).label;
}
const tsFrom=d=>d+'T00:00:00+07:00',tsTo=d=>addDays(d,1)+'T00:00:00+07:00';
const orderDay=o=>vnDate(o.delivered_at||o.scheduled_at||o.created_at);

function formHTML(cfg,row,defaults={}){
  const v=f=>row?row[f.k]:(defaults[f.k]!==undefined?defaults[f.k]:(typeof f.def==='function'?f.def():f.def));
  const inp=f=>{
    const val=v(f);const dis=f.ro?'disabled':'';const rq=f.req?'required':'';
    if(f.t==='sel') return `<select name="${f.k}" ${dis} ${rq}><option value=""></option>${Object.entries(O[f.o]).sort((a,b)=>f.o==='bank'?a[1].localeCompare(b[1]):0).map(([k,l])=>`<option value="${k}" ${String(val??'')===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    if(f.t==='fk') return `<select name="${f.k}" ${dis} ${rq}><option value=""></option>${Object.entries(REF[f.ref]||{}).sort((a,b)=>String(a[1]).localeCompare(String(b[1]),'vi')).map(([k,l])=>`<option value="${k}" ${val===k?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
    if(f.t==='area') return `<textarea name="${f.k}" ${dis} ${rq}>${esc(val??'')}</textarea>`;
    if(f.t==='bool') return `<select name="${f.k}" ${dis}><option value="true" ${val===true?'selected':''}>Có</option><option value="false" ${val!==true?'selected':''}>Không</option></select>`;
    if(f.t==='arr') return `<input name="${f.k}" value="${esc((val||[]).join(', '))}" ${dis}>`;
    if(f.t==='lines') return `<textarea name="${f.k}" ${dis} ${rq}>${esc((val||[]).join('\n'))}</textarea>`;
    const type={num:'number',money:'number',date:'date',dt:'datetime-local'}[f.t]||'text';
    const shown=f.t==='dt'?toLocalInput(val):f.t==='date'?(val?String(val).slice(0,10):''):(val??'');
    return `<input type="${type}" ${['num','money'].includes(f.t)?'step="any"':''} name="${f.k}" value="${esc(shown)}" ${dis} ${rq}>`;
  };
  return cfg.f.filter(f=>f.h||!(f.ro&&!row)).map(f=>f.h?`<div class="hd">${esc(f.h)}</div>`:`<label class="${f.t==='area'||f.t==='lines'?'w':''}">${esc(f.l)}${inp(f)}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:''}</label>`).join('');
}
function readForm(cfg,frm,row){
  const data={};
  for(const f of fields(cfg)){ if(f.ro||!frm.elements[f.k])continue;
    const raw=frm.elements[f.k].value;let val=raw===''?null:raw;
    if(val!=null){ if(['num','money'].includes(f.t))val=Number(val); else if(f.t==='dt')val=new Date(val).toISOString(); else if(f.t==='bool')val=raw==='true'; else if(f.t==='arr')val=raw.split(',').map(s=>s.trim()).filter(Boolean); else if(f.t==='lines')val=raw.split('\n').map(s=>s.trim()).filter(Boolean); else if(f.t==='sel'&&f.o==='segment')val=Number(val)}
    if(f.t==='arr'&&val==null)val=[];
    data[f.k]=val;
  }
  return data;
}
function modal(html,wide){const b=$('#modal-box');b.style.maxWidth=wide?'1240px':'';b.innerHTML=html;$('#modal').classList.remove('hidden')}
const closeModal=()=>$('#modal').classList.add('hidden');window.closeModal=closeModal;
async function openForm(name,row,after,defaults={},extraHTML=''){
  const base=E[name];await ensureRefs(base);
  // quản trị sửa được mọi trường (trừ mã và số liệu tự tính)
  const cfg=isAdmin()&&row?{...base,f:base.f.map(f=>f.ro&&!LOCK.includes(f.k)?{...f,ro:false,hint:(f.hint?f.hint+' · ':'')+'Quản trị sửa trực tiếp'}:f)}:base;
  modal(`<h3>${row?(RO?'Xem':'Sửa'):'Thêm'} · ${esc(cfg.title)}${row&&row.code?' · '+esc(row.code):''}</h3><form class="form" id="frm">${formHTML(cfg,row,defaults)}</form>${extraHTML}
   <div class="acts">${row&&!RO?'<button class="btn" id="arc" style="color:var(--red)">🗂 Lưu trữ</button>':''}${row?'<button class="btn" id="lnk">🔗 Sao chép link</button>':''}${row&&cfg.files?'<button class="btn" id="fil">📎 Chứng từ</button>':''}<span class="sp"></span><button class="btn" id="cancel">Đóng</button>${RO?'':'<button class="btn p" id="save">Lưu</button>'}</div>`);
  if(RO)$('#frm').querySelectorAll('input,select,textarea').forEach(x=>x.disabled=true);
  if(row)$('#lnk').onclick=()=>copyText(`${cfg.title} ${row.code||row.full_name||row.name||row.plate||row.party||''}: ${recLink(name,row.id)}`,'Đã sao chép link');
  $('#cancel').onclick=closeModal;
  if(row&&cfg.files) $('#fil').onclick=()=>openFiles(cfg.files,row.id,row.code||row.full_name||row.plate||row.name||'');
  if(!RO)$('#save').onclick=async()=>{
    const frm=$('#frm');if(!frm.reportValidity())return;
    const data=readForm(cfg,frm,row);
    if(name==='expenses'&&!data.category){data.category=EXP_CAT_OF(data.item)}
    if(name==='pay_accounts'){data.bank_name=O.bank[data.bank_bin]||null;if(data.account_name)data.account_name=data.account_name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toUpperCase()}
    $('#save').disabled=true;
    const res=row?await sb.from(cfg.table).update(data).eq('id',row.id).select().single():await sb.from(cfg.table).insert(data).select().single();
    $('#save').disabled=false;
    if(res.error){toast('Lỗi: '+res.error.message);return}
    if(cfg.afterSave) await cfg.afterSave(res.data,row);
    if(cfg.label||['orders','leases','advances'].includes(name)) delete REF[name];
    closeModal();toast('Đã lưu');after&&after();
  };
  if(row&&!RO) $('#arc').onclick=async()=>{if(!confirm('Chuyển bản ghi này vào lưu trữ?\nKhông xóa vĩnh viễn – quản trị khôi phục được trong mục Thùng lưu trữ.'))return;const {error}=await sb.rpc('khg_archive',{p_table:cfg.table,p_id:row.id});if(error){toast('Lỗi: '+error.message);return}delete REF[name];closeModal();toast('Đã chuyển vào lưu trữ');after&&after()};
}
// Sửa hàng loạt: chọn 1 trường, gán 1 giá trị cho mọi dòng đã chọn
function bulkEdit(name,list,after){
  const cfg=E[name];const editable=fields(cfg).filter(f=>(!f.ro||isAdmin())&&!LOCK.includes(f.k)&&f.t!=='arr');
  modal(`<h3>✎ Sửa hàng loạt · ${list.length} dòng · ${esc(cfg.title)}</h3>
   <div class="form"><label>Trường cần sửa<select id="bf">${editable.map(f=>`<option value="${f.k}">${esc(f.l)}</option>`).join('')}</select></label><div id="bv" style="grid-column:span 2"></div></div>
   <p class="sub" style="margin-top:8px">Giá trị mới áp cho tất cả ${list.length} dòng đã chọn. Để trống = xóa giá trị trường đó.</p>
   <div class="acts"><span class="sp"></span><button class="btn" id="bc">Hủy</button><button class="btn p" id="bs">Áp dụng cho ${list.length} dòng</button></div>`);
  const draw=()=>{const f=editable.find(x=>x.k===$('#bf').value);$('#bv').innerHTML=`<form id="bfrm" class="form" style="grid-template-columns:1fr">${formHTML({f:[{...f,req:false,ro:false}]},null,{})}</form>`};
  $('#bf').onchange=draw;draw();$('#bc').onclick=closeModal;
  $('#bs').onclick=async()=>{const f=editable.find(x=>x.k===$('#bf').value);const val=readForm({f:[{...f,ro:false}]},$('#bfrm'))[f.k];
    if(!confirm(`Đặt "${f.l}" = ${val===null?'(trống)':plain(f,val)} cho ${list.length} dòng?`))return;$('#bs').disabled=true;
    const ids=list.map(r=>r.id);let ok=0,err='';
    for(let i=0;i<ids.length;i+=200){const part=ids.slice(i,i+200);const patch={[f.k]:val};if(name==='expenses'&&f.k==='item')patch.category=EXP_CAT_OF(val);
      const {error,count}=await sb.from(cfg.table).update(patch,{count:'exact'}).in('id',part);if(error)err=error.message;else ok+=count??part.length}
    closeModal();toast(err?`Lỗi: ${err}`:`Đã cập nhật ${ok} dòng`);if(cfg.label)delete REF[name];after&&after()};
}

// ===== Soạn hợp đồng từ mẫu (khg-contract): form động, khách CRM, tra MST, xem trước, xuất Word + PDF =====
const cfn=async(body)=>{const {data,error}=await sb.functions.invoke('khg-contract',{body});const msg=error?((await error.context?.json?.().catch(()=>null))?.error||error.message):data?.error;return msg?{error:msg,...(data||{})}:data};
let TPLS=null;
async function loadTpls(){if(TPLS)return TPLS;const r=await cfn({action:'templates'});if(r.error){toast(r.error);return []}TPLS=r.templates;return TPLS}
const TPL_ORDER=['hd_nguyen_tac','phu_luc_dv','phu_luc_sd'];
async function openCompose(tplKey='hd_nguyen_tac',data={},ctx={}){
  const list=await loadTpls();if(!list.length)return;
  const custs=(await sb.from('khg_customers').select('id,name,tax_code,address,phone,email,contact_name,payment_terms_days').is('archived_at',null).order('name').limit(2000)).data||[];
  ctx={...ctx};let tp=list.find(t=>t.key===tplKey)||list[0];
  const sorted=[...list].sort((a,b)=>(TPL_ORDER.indexOf(a.key)+1||99)-(TPL_ORDER.indexOf(b.key)+1||99));
  modal(`<h3>📝 Soạn hợp đồng${ctx.contract_id?' · cập nhật bản đã soạn':''}</h3>
   <div class="form" style="grid-template-columns:2fr 2fr 1.4fr">
    <label>Mẫu<select id="ctpl">${sorted.map(t=>`<option value="${t.key}" ${t.key===tp.key?'selected':''}>${esc(t.title)}</option>`).join('')}</select></label>
    <label>Khách hàng trong CRM (điền sẵn Bên A)<input id="ccus" list="ccusl" placeholder="Gõ tên hoặc MST…" value="${esc(custs.find(c=>c.id===ctx.customer_id)?.name||'')}"><datalist id="ccusl">${custs.map(c=>`<option value="${esc(c.name)}">${esc(c.tax_code||'')}</option>`).join('')}</datalist></label>
    <label>Tra mã số thuế<span style="display:flex;gap:6px"><input id="cmst" placeholder="0312345678" style="flex:1;min-width:0"><button class="btn" id="cmstb" type="button">🔎 Tra</button></span></label>
   </div>
   <p class="sub" id="cdesc" style="margin:8px 0"></p>
   <div class="cmp"><div id="cfrm" class="cfrm"></div><div class="cpv"><div class="cpvh"><b>Xem trước</b><span class="sp"></span><button class="btn s" id="cprev" type="button">↻ Cập nhật</button></div><iframe id="cifr" title="Xem trước hợp đồng"></iframe></div></div>
   <div id="cout"></div>
   <div class="acts"><span class="sub" style="margin-right:auto">Ô để trống in thành dòng chấm để điền tay. Vàng = thông tin đã điền.</span><button class="btn" id="cclose">Đóng</button><button class="btn p" id="cgo">⬇ Xuất Word + PDF</button></div>`,true);
  const box=$('#modal-box');
  const fieldHTML=(f,v)=>{const id='cf_'+f.k,ph=esc(f.hint||'');
    if(f.t==='area')return `<label class="w">${esc(f.l)}<textarea id="${id}" rows="2" placeholder="${ph}">${esc(v??'')}</textarea></label>`;
    if(f.t==='rows'){const val=Array.isArray(v)?v.map(r=>Array.isArray(r)?r.join(' | '):Object.values(r).join(' | ')).join('\n'):(v??'');
      return `<label class="w">${esc(f.l)} <span style="font-weight:400">(${esc((f.cols||[]).join(' | '))})</span><textarea id="${id}" rows="4" placeholder="${ph}" style="font-family:ui-monospace,monospace;font-size:12px">${esc(val)}</textarea></label>`}
    if(f.t==='multi'){const on=Array.isArray(v)?v:String(v||'').split(',');return `<label class="w">${esc(f.l)}<div class="cchk">${Object.entries(f.o||{}).map(([k,l])=>`<label><input type="checkbox" data-m="${f.k}" value="${k}" ${on.includes(k)?'checked':''}> ${esc(l)}</label>`).join('')}</div></label>`}
    if(f.t==='sel')return `<label>${esc(f.l)}<select id="${id}">${Object.entries(f.o||{}).map(([k,l])=>`<option value="${esc(k)}" ${String(v??f.def??'')===k?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`;
    return `<label>${esc(f.l)}${f.req?' *':''}<input id="${id}" type="${f.t==='date'?'date':'text'}" value="${esc(v??'')}" placeholder="${ph}" ${f.t==='money'||f.t==='num'?'inputmode="numeric"':''}></label>`};
  const draw=()=>{
    $('#cdesc').textContent=tp.desc||'';const groups={};
    for(const f of tp.fields)(groups[f.g||'Khác']=groups[f.g||'Khác']||[]).push(f);
    $('#cfrm').innerHTML=Object.entries(groups).map(([g,fs],i)=>`<details open><summary>${esc(g)}</summary><div class="form">${fs.map(f=>fieldHTML(f,data[f.k]??(f.t==='date'||f.t==='multi'||f.t==='rows'?undefined:f.def))).join('')}</div></details>`).join('');
    $('#cfrm').querySelectorAll('input,textarea,select').forEach(x=>x.addEventListener('change',()=>{collect();schedule()}));
  };
  const collect=()=>{for(const f of tp.fields){
      if(f.t==='multi'){data[f.k]=[...box.querySelectorAll(`[data-m="${f.k}"]:checked`)].map(x=>x.value);continue}
      const el=$('#cf_'+f.k);if(el)data[f.k]=el.value.trim()}
    return data};
  let tm=null;const schedule=()=>{clearTimeout(tm);tm=setTimeout(preview,700)};
  async function preview(){collect();const r=await cfn({action:'preview',template:tp.key,data,customer_id:ctx.customer_id});if(r.error)return toast(r.error);const f=$('#cifr');if(f)f.srcdoc=r.html.replace('</head>','<style>body{font-size:11pt;margin:14px auto;padding:0 18px}h1{font-size:13.5pt}</style></head>')}
  const setV=(k,v)=>{if(v==null||v==='')return;data[k]=v;const el=$('#cf_'+k);if(el)el.value=v};
  const useCustomer=async c=>{ctx.customer_id=c.id;$('#ccus').value=c.name;
    setV('b_name',c.name);setV('b_tax',c.tax_code);setV('b_addr',c.address);setV('b_phone',c.phone);setV('b_email',c.email);
    if(c.contact_name)setV('b_contact',c.contact_name+(c.phone?' – '+c.phone:''));
    if(c.payment_terms_days&&!data.tt_han)setV('tt_han',`Trong vòng ${c.payment_terms_days} ngày kể từ ngày Bên A nhận hóa đơn GTGT và bảng kê đã xác nhận`);
    if(tp.key.startsWith('phu_luc')&&!data.hd_goc){const {data:pc}=await sb.from('khg_contracts').select('id,contract_no,signed_on,data,created_at').eq('customer_id',c.id).eq('kind','nguyen_tac').order('created_at',{ascending:false}).limit(1);
      if(pc?.[0]){setV('hd_goc',pc[0].contract_no);setV('ngay_hd_goc',pc[0].signed_on||pc[0].data?.ngay_ky||String(pc[0].created_at).slice(0,10));ctx.parent_id=pc[0].id;
        for(const k of ['b_rep','b_title'])if(!data[k])setV(k,pc[0].data?.[k])}}
    schedule()};
  $('#ccus').onchange=()=>{const v=$('#ccus').value.trim().toLowerCase();const c=custs.find(x=>x.name.toLowerCase()===v)||custs.find(x=>(x.tax_code||'')===v);if(c)useCustomer(c)};
  $('#cmstb').onclick=async()=>{const mst=$('#cmst').value.trim()||$('#cf_b_tax')?.value.trim();if(!mst)return toast('Nhập mã số thuế');const b=$('#cmstb');b.disabled=true;
    const r=await cfn({action:'mst',mst});b.disabled=false;if(r.error)return toast(r.error);
    if(r.customer){const c=custs.find(x=>x.id===r.customer.id)||r.customer;await useCustomer(c);toast('Đã có trong CRM: '+c.name)}
    if(r.registry){setV('b_tax',r.mst);if(!r.customer)setV('b_name',r.registry.name);setV('b_addr',data.b_addr||r.registry.address);toast('Tra MST: '+r.registry.name);schedule()}
    else if(!r.customer)toast('Không tra được MST này, nhập tay giúp')};
  $('#ctpl').onchange=()=>{collect();tp=list.find(t=>t.key===$('#ctpl').value);ctx.contract_id=null;draw();schedule()};
  $('#cprev').onclick=preview;$('#cclose').onclick=closeModal;
  $('#cgo').onclick=async()=>{collect();const miss=tp.fields.filter(f=>f.req&&!String(data[f.k]??'').trim()).map(f=>f.l);if(miss.length)return toast('Cần nhập: '+miss.join(', '));
    const b=$('#cgo');b.disabled=true;b.textContent='Đang xuất…';
    const call=async(formats,d,cid)=>{for(let i=0;i<2;i++){const x=await cfn({action:'render',template:tp.key,data:d,customer_id:ctx.customer_id||null,contract_id:cid,parent_id:ctx.parent_id||null,inline:false,formats});if(!x.error||/Thiếu|quyền|không tồn tại/.test(x.error))return x;await new Promise(o=>setTimeout(o,1200))}return {error:'Máy soạn hợp đồng đang bận, thử lại sau ít phút'}};
    const r=await call(['docx'],data,ctx.contract_id||null);
    if(!r.error){const p=await call(['pdf'],{...data,...(r.data||{})},r.contract_id);if(p.pdf_url)r.pdf_url=p.pdf_url;else toast('Đã có Word, PDF chưa xuất được – bấm Xuất lại')}
    b.disabled=false;b.textContent='⬇ Xuất lại Word + PDF';if(r.error)return toast(r.error);
    ctx.contract_id=r.contract_id;Object.assign(data,{so_hd:r.data?.so_hd||r.so_hd,hd_goc:r.data?.hd_goc||data.hd_goc,ngay_ky:r.data?.ngay_ky||data.ngay_ky});setV('so_hd',data.so_hd);setV('ngay_ky',data.ngay_ky);
    $('#cout').innerHTML=`<div class="card" style="margin-top:12px"><b>✅ Đã xuất ${esc(tp.title)} số ${esc(r.so_hd)}</b> – lưu trong mục Hợp đồng.<div class="acts" style="justify-content:flex-start"><a class="btn p" href="${esc(r.docx_url)}" target="_blank" rel="noopener">⬇ Word (.docx)</a>${r.pdf_url?`<a class="btn p" href="${esc(r.pdf_url)}" target="_blank" rel="noopener">⬇ PDF</a><button class="btn" id="ccpy" type="button">🔗 Sao chép link tải PDF</button>`:''}</div></div>`;
    if($('#ccpy'))$('#ccpy').onclick=()=>copyText(r.pdf_url,'Đã sao chép link PDF (hiệu lực 7 ngày)');preview();if(cur==='contracts')go('contracts')};
  draw();preview();
}
async function contractFile(r,kind){const p=r[kind+'_path'];if(!p)return toast('Chưa có file');const x=await kh({action:'signed_url',path:p});if(x.error)return toast(x.error);window.open(x.url,'_blank')}

async function openRecord(name,id){
  const cfg=E[name];if(!cfg)return;const {data}=await sb.from(cfg.table).select('*').eq('id',id).maybeSingle();
  if(!data)return toast('Không tìm thấy bản ghi (đã lưu trữ hoặc bạn không có quyền xem)');
  if(name==='orders')return (data.driver_id||data.status!=='moi'?openOrder:openAssign)(data,()=>{if(cur==='dispatch'&&DISPATCH_RELOAD)DISPATCH_RELOAD()});
  openForm(name,data,()=>{if(VIEWS[cur])go(cur)});
}

// Chi phí có hạn → cập nhật hạn giấy tờ của xe
E.expenses.afterSave=async(r)=>{
  if(!r.vehicle_id||!r.valid_until)return;
  const k={bao_hiem:'insurance_until',dang_kiem:'inspection_until',phi_duong_bo:'road_fee_until',bao_tri:'next_maintenance_on'}[r.item];
  if(!k)return;const patch={[k]:r.valid_until};if(r.item==='bao_tri')patch.last_maintenance_on=r.spent_on;
  if(r.odometer_km)patch.odometer_km=r.odometer_km;
  await sb.from('khg_vehicles').update(patch).eq('id',r.vehicle_id);toast('Đã cập nhật hạn giấy tờ của xe');
};

// ===================== Chứng từ / hồ sơ đính kèm =====================
const signed=async p=>{const {data}=await sb.storage.from(BUCKET).createSignedUrl(p,900);return data?.signedUrl||''};
async function openFiles(entity,id,title){
  modal(`<h3>📎 Chứng từ · ${esc(O.entity[entity])} ${esc(title)}</h3>
   <div class="bar"><select id="fdt">${DOC_BY[entity].map(k=>`<option value="${k}">${esc(O.doc_type[k])}</option>`).join('')}</select>
   <input type="file" id="ffile" multiple accept="image/*,video/*,application/pdf,.doc,.docx,.xls,.xlsx"><input id="fnote" placeholder="Ghi chú" style="flex:1"><button class="btn p" id="fup">Tải lên</button></div>
   <div id="flist"><div class="empty">Đang tải…</div></div><div class="acts"><span class="sp"></span><button class="btn" id="fclose">Đóng</button></div>`);
  $('#fclose').onclick=closeModal;
  const list=async()=>{
    const {data,error}=await sb.from('khg_files').select('*').eq('entity_type',entity).eq('entity_id',id).order('created_at',{ascending:false});
    if(error){$('#flist').innerHTML='<div class="empty">Lỗi: '+esc(error.message)+'</div>';return}
    let extra='';
    if(entity==='order'){const {data:o}=await sb.from('khg_orders').select('pod_file_ids').eq('id',id).maybeSingle();if(o?.pod_file_ids?.length)extra=`<p class="sub">${o.pod_file_ids.length} ảnh biên bản đã gửi qua Telegram (xem trong cuộc trò chuyện với bot).</p>`}
    if(!data.length){$('#flist').innerHTML=extra+'<div class="empty">Chưa có chứng từ.</div>';return}
    const urls=await Promise.all(data.map(f=>signed(f.file_path)));
    $('#flist').innerHTML=extra+`<div class="files">${data.map((f,i)=>`<div class="fi">${/^image/.test(f.mime||'')?`<a href="${urls[i]}" target="_blank" rel="noopener"><img src="${urls[i]}" alt=""></a>`:`<a href="${urls[i]}" target="_blank" rel="noopener" class="ic">${esc((f.file_name.split('.').pop()||'FILE').toUpperCase())}</a>`}
      <b>${esc(O.doc_type[f.doc_type]||f.doc_type)}</b><span style="word-break:break-all">${esc(f.file_name)}</span><span style="color:var(--muted)">${fmtDT(f.created_at)}${f.note?' · '+esc(f.note):''}</span>
      <span><a href="${urls[i]}" target="_blank" rel="noopener">Mở</a>${has(['admin','ke_toan','dieu_phoi','kinh_doanh'])?` · <a href="#" data-del="${f.id}" style="color:var(--red)">Lưu trữ</a>`:''}</span></div>`).join('')}</div>`;
    $('#flist').querySelectorAll('[data-del]').forEach(a=>a.onclick=async e=>{e.preventDefault();if(!confirm('Chuyển chứng từ này vào lưu trữ? (không xóa file)'))return;const {error}=await sb.rpc('khg_archive',{p_table:'khg_files',p_id:a.dataset.del});if(error)return toast(error.message);list()});
  };
  $('#fup').onclick=async()=>{
    const files=[...$('#ffile').files];if(!files.length)return toast('Chọn file trước');
    $('#fup').disabled=true;let n=0;
    for(const file of files){
      if(file.size>100*1024*1024){toast(file.name+' quá 100MB');continue}
      const safe=file.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_');
      const path=`${entity}/${id}/${Date.now()}_${safe}`;
      const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||'application/octet-stream'});
      if(error){toast('Lỗi tải '+file.name+': '+error.message);continue}
      const dt=$('#fdt').value;
      await sb.from('khg_files').insert({entity_type:entity,entity_id:id,doc_type:dt,file_path:path,file_name:file.name,mime:file.type,size_bytes:file.size,note:$('#fnote').value||null,uploaded_by:ME?.id||null});
      if(entity==='person'&&dt==='anh_dai_dien') await sb.from('khg_people').update({avatar_path:path}).eq('id',id);
      n++;
    }
    $('#fup').disabled=false;$('#ffile').value='';toast('Đã tải '+n+' file');list();
  };
  list();
}

const loadClass=o=>{const v=VEH[o.vehicle_id];if(v&&v.load_t)return Number(v.load_t);const m=String(o.vehicle_req||'').match(/(\d+(?:[.,]\d+)?)\s*(?:t\b|tấn|tan)/i);return m?Number(m[1].replace(',','.')):null};
function monthOverlapFactor(start,end,from,to){
  // tổng phần tháng (theo số ngày của từng tháng) mà [start,end] giao với [from,to]
  const s=start>from?start:from,e=(end&&end<to)?end:to;if(s>e)return 0;
  let f=0,cur=s;
  while(cur<=e){const d=new Date(cur+'T00:00:00');const last=isoD(new Date(d.getFullYear(),d.getMonth()+1,0));const segEnd=last<e?last:e;
    f+=(daysBetween(cur,segEnd)+1)/new Date(d.getFullYear(),d.getMonth()+1,0).getDate();cur=addDays(last,1)}
  return f;
}
async function loadFinance(from,to){
  const [o,l,w,x,s]=await Promise.all([
    sb.from('khg_orders').select('id,code,service,revenue,partner_cost,status,trip_status,trips,customer_id,customer_text,vehicle_id,driver_id,vehicle_req,pickup_province,pickup_district,drop_province,drop_district,scheduled_at,created_at,delivered_at,unit,quantity')
      .neq('status','huy').or(`and(scheduled_at.gte.${tsFrom(from)},scheduled_at.lt.${tsTo(to)}),and(scheduled_at.is.null,created_at.gte.${tsFrom(from)},created_at.lt.${tsTo(to)}),and(delivered_at.gte.${tsFrom(from)},delivered_at.lt.${tsTo(to)})`).limit(10000),
    sb.from('khg_leases').select('*').in('status',['hieu_luc','het_han']),
    sb.from('khg_warehouses').select('*'),
    sb.from('khg_expenses').select('*').gte('spent_on',from).lte('spent_on',to).limit(10000),
    sb.from('khg_salary').select('*').gte('period_start',from).lte('period_start',to),
  ]);
  const orders=(o.data||[]).filter(r=>{const d=orderDay(r);return d>=from&&d<=to});
  return {from,to,orders,leases:l.data||[],whs:w.data||[],exps:x.data||[],sal:s.data||[],err:o.error||x.error};
}
function computePL(D,from,to){
  const os=D.orders.filter(r=>{const d=orderDay(r);return d>=from&&d<=to});
  const ex=D.exps.filter(e=>e.spent_on>=from&&e.spent_on<=to);
  const sal=D.sal.filter(s=>s.period_start>=from&&s.period_start<=to);
  const rev={};os.forEach(r=>rev[r.service]=(rev[r.service]||0)+Number(r.revenue||0));
  const lease=sum(D.leases,r=>Number(r.area_m2)*Number(r.price_per_m2)*monthOverlapFactor(r.start_date,r.end_date,from,to));
  const partner=sum(os,r=>r.partner_cost);
  const expBy={};ex.forEach(e=>{const k=e.item||e.category;expBy[k]=(expBy[k]||0)+Number(e.amount||0)});
  const salGross=sum(sal,s=>Number(s.base_pay||0)+Number(s.ot_pay||0)+Number(s.trip_pay||0)+Number(s.attendance_bonus||0)+Number(s.allowance||0)+Number(s.other_income||0));
  const insEr=sum(sal.filter(s=>s.period_type==='thang'),s=>Number(s.insurance_salary||0)*0.215);
  const whFix=sum(D.whs,w=>Number(w.rent_cost_monthly||0)*monthOverlapFactor(from,to,from,to));
  const lines=[];
  Object.keys(O.service).forEach(k=>{if(rev[k])lines.push(['Doanh thu',O.service[k],rev[k]])});
  if(lease)lines.push(['Doanh thu','Cho thuê kho, bãi',lease]);
  const revTot=sum(Object.values(rev),x=>x)+lease;
  if(partner)lines.push(['Giá vốn','Trả xe liên kết',partner]);
  Object.keys(O.exp_item).forEach(k=>{if(expBy[k])lines.push(['Chi phí',O.exp_item[k],expBy[k]])});
  if(salGross)lines.push(['Chi phí','Lương nhân sự (bảng lương)',salGross]);
  if(insEr)lines.push(['Chi phí','BHXH doanh nghiệp đóng (21,5%)',insEr]);
  if(whFix)lines.push(['Chi phí','Chi phí cố định kho (phân bổ)',whFix]);
  const cost=partner+sum(Object.values(expBy),x=>x)+salGross+insEr+whFix;
  return {lines,rev:revTot,cost,profit:revTot-cost,orders:os,exps:ex,partner,trips:sum(os,r=>r.trips||1)};
}
function groupOrders(orders,keyFn,labelFn){
  const g={};orders.forEach(o=>{const k=keyFn(o);if(k==null)return;const a=g[k]=g[k]||{key:k,label:labelFn(k,o),orders:0,trips:0,revenue:0,partner:0,qty:{}};a.orders++;a.trips+=Number(o.trips||1);a.revenue+=Number(o.revenue||0);a.partner+=Number(o.partner_cost||0);if(o.quantity&&o.unit){a.qty[o.unit]=(a.qty[o.unit]||0)+Number(o.quantity)}});
  return Object.values(g).sort((a,b)=>b.revenue-a.revenue);
}

let ALARM=null;
function ringAlarm(o){
  try{if(!ALARM){const ctx=new (window.AudioContext||window.webkitAudioContext)();let on=true,n=0;
    const beep=()=>{if(!on)return;const t=ctx.currentTime;[880,1175,880,1175].forEach((f,i)=>{const g=ctx.createGain(),os=ctx.createOscillator();os.type='square';os.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.18);g.gain.exponentialRampToValueAtTime(.25,t+i*.18+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.18+.16);os.connect(g).connect(ctx.destination);os.start(t+i*.18);os.stop(t+i*.18+.17)});
      if(++n<40)setTimeout(beep,1500);else stop()};
    const stop=()=>{on=false;ctx.close().catch(()=>{});$('#alarm')?.remove();ALARM=null};ALARM={stop};beep()}}catch(e){}
  $('#alarm')?.remove();const d=document.createElement('div');d.id='alarm';
  d.innerHTML=`<span style="font-size:22px">🔔</span><div><b>Đơn mới ${esc(o.code||'')}</b><div style="font-size:13px;opacity:.9">${esc(o.customer_text||'')} · ${esc(o.pickup||'')}</div></div><b style="background:#fff;color:#C8102E;border-radius:8px;padding:6px 10px">Xem & giao</b>`;
  d.onclick=async()=>{ALARM&&ALARM.stop();d.remove();if(cur!=='dispatch')await go('dispatch');const {data}=await sb.from('khg_orders').select('*').eq('id',o.id).maybeSingle();if(data)openAssign(data,DISPATCH_RELOAD)};
  document.body.appendChild(d);
  try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification('KHG – Đơn mới '+(o.code||''),{body:(o.customer_text||'')+': '+(o.pickup||'')+' → '+(o.dropoff||''),tag:o.id,requireInteraction:true});n.onclick=()=>{window.focus();d.click()}}}catch(e){}
  if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);
}

async function viewAccounting(m){
  m.innerHTML=`<h2>Kế toán & công nợ</h2><p class="sub">Sổ quỹ thu – chi, công nợ phải thu – phải trả theo tuổi nợ, báo cáo kết quả kinh doanh tuần / tháng / quý. Thu chi tự ghi sổ khi: thu tiền khách, chi phí trả ngay, duyệt tạm ứng, trả lương, trả công nợ.</p>
   <div class="subtabs" id="st"><button data-s="report" class="on">Báo cáo KQKD</button><button data-s="cash">Sổ quỹ</button><button data-s="rec">Phải thu</button><button data-s="pay">Phải trả</button></div><div id="h"></div>`;

async function reportView(h){
  const st=PST.report;
  h.innerHTML=`<div class="bar"><select id="rg"><option value="tuan">Theo tuần</option><option value="thang">Theo tháng</option><option value="quy">Theo quý</option></select>
   <select id="ry">${[0,1,2].map(i=>new Date().getFullYear()-i).map(y=>`<option ${y===st.year?'selected':''}>${y}</option>`).join('')}</select><span style="flex:1"></span><button class="btn" id="rx">⬇ Xuất bộ báo cáo Excel</button></div><div id="rb"><div class="empty">Đang tải…</div></div>`;
  $('#rg').value=st.gran;
  let last=null;
  const draw=async()=>{
    st.gran=$('#rg').value;st.year=Number($('#ry').value);const y=st.year;
    $('#rb').innerHTML='<div class="empty">Đang tải…</div>';
    const D=await loadFinance(`${y}-01-01`,`${y}-12-31`);if(D.err){$('#rb').innerHTML='<div class="empty">Lỗi: '+esc(D.err.message)+'</div>';return}
    const pers=[];const pad=n=>String(n).padStart(2,'0');
    if(st.gran==='thang')for(let i=0;i<12;i++)pers.push({l:'T'+(i+1),from:`${y}-${pad(i+1)}-01`,to:isoD(new Date(y,i+1,0))});
    else if(st.gran==='quy')for(let q=0;q<4;q++)pers.push({l:'Quý '+(q+1),from:`${y}-${pad(q*3+1)}-01`,to:isoD(new Date(y,q*3+3,0))});
    else{let s=periodRange({kind:'tuan',ref:`${y}-01-01`}).from;let i=1;while(s<=`${y}-12-31`){const e=addDays(s,6);pers.push({l:'Tuần '+i+' ('+fmtD(s).slice(0,5)+')',from:s<`${y}-01-01`?`${y}-01-01`:s,to:e>`${y}-12-31`?`${y}-12-31`:e});s=addDays(s,7);i++}}
    const res=pers.map(p=>computePL(D,p.from,p.to));const all=computePL(D,`${y}-01-01`,`${y}-12-31`);
    const keys=[];all.lines.forEach(([g,l])=>{if(!keys.find(k=>k[0]===g&&k[1]===l))keys.push([g,l])});
    const val=(r,g,l)=>(r.lines.find(x=>x[0]===g&&x[1]===l)||[0,0,0])[2];
    const show=st.gran==='tuan'?pers.map((p,i)=>i).filter(i=>pers[i].from<=today()).slice(-13):pers.map((p,i)=>i);
    const hdr=`<tr><th>Khoản mục</th>${show.map(i=>`<th class="n">${pers[i].l}</th>`).join('')}<th class="n">Cả năm</th></tr>`;
    const row=(lab,fn,cls='')=>`<tr class="${cls}"><td>${lab}</td>${show.map(i=>{const v=fn(res[i]);return `<td class="n ${v<0?'neg':''}">${fmtN(Math.round(v))}</td>`}).join('')}<td class="n">${fmtN(Math.round(fn(all)))}</td></tr>`;
    let body='';let grp='';
    keys.forEach(([g,l])=>{if(g!==grp){if(grp==='Doanh thu')body+=row('Tổng doanh thu',r=>r.rev,'tot');body+=`<tr><td colspan="${show.length+2}" style="font-weight:800;color:var(--red)">${esc(g)}</td></tr>`;grp=g}body+=row('&nbsp;&nbsp;'+esc(l),r=>val(r,g,l))});
    if(grp==='Doanh thu')body+=row('Tổng doanh thu',r=>r.rev,'tot');
    body+=row('Tổng chi phí',r=>r.cost,'tot')+row('Lãi gộp',r=>r.profit,'tot')+row('Số đơn',r=>r.orders.length)+row('Số chuyến',r=>r.trips);
    $('#rb').innerHTML=`<div class="tw"><table><thead>${hdr}</thead><tbody>${body}</tbody></table></div><p class="sub" style="margin-top:8px">${st.gran==='tuan'?'Đang hiện 13 tuần gần nhất; Excel có đủ các tuần. ':''}Doanh thu ghi nhận theo ngày giao đơn; thuê kho phân bổ theo ngày. Lương lấy từ bảng lương (kỳ bắt đầu trong khoảng). BHXH doanh nghiệp 21,5% trên lương đóng bảo hiểm.</p>`;
    last={pers,res,all,keys,val,y};
  };
  $('#rg').onchange=draw;$('#ry').onchange=draw;
  $('#rx').onclick=async()=>{if(!last)return;const {pers,res,all,keys,val,y}=last;
    const aoa=[['Nhóm','Khoản mục',...pers.map(p=>p.l),'Cả năm']];keys.forEach(([g,l])=>aoa.push([g,l,...res.map(r=>Math.round(val(r,g,l))),Math.round(val(all,g,l))]));
    aoa.push(['','Tổng doanh thu',...res.map(r=>Math.round(r.rev)),Math.round(all.rev)],['','Tổng chi phí',...res.map(r=>Math.round(r.cost)),Math.round(all.cost)],['','Lãi gộp',...res.map(r=>Math.round(r.profit)),Math.round(all.profit)],['','Số đơn',...res.map(r=>r.orders.length),all.orders.length]);
    const [{data:c},{data:rc},{data:pa}]=await Promise.all([sb.from('khg_cash').select('*').gte('txn_date',`${y}-01-01`).lte('txn_date',`${y}-12-31`).order('txn_date').limit(10000),sb.from('khg_receivables').select('*').limit(10000),sb.from('khg_payables').select('*').limit(10000)]);
    await Promise.all(['customers','orders'].map(ensureRef));
    xlsx('Bao_cao_KHG_'+y+'_'+PST.report.gran,{'KQKD':aoa,'Sổ quỹ':rowsForExport(E.cash,c||[]),'Tuổi nợ phải thu':agingRows(rc||[],r=>REF.customers[r.customer_id]||'Khách lẻ'),'Phải thu chi tiết':rowsForExport(E.receivables,rc||[],r=>({'Còn phải thu':Number(r.amount)-Number(r.paid_amount)})),'Phải trả chi tiết':rowsForExport(E.payables,pa||[],r=>({'Còn phải trả':Number(r.amount)-Number(r.paid_amount)}))});
  };
  draw();
}
function aging(r,d0=today()){const left=Number(r.amount)-Number(r.paid_amount);if(left<=0)return null;if(!r.due_on||r.due_on>=d0)return['c',left];const late=daysBetween(r.due_on,d0);return[late<=30?'a':late<=60?'b':'o',left]}
function agingRows(list,nameFn){const g={};list.forEach(r=>{const a=aging(r);if(!a)return;const n=nameFn(r);const x=g[n]=g[n]||{'Đối tượng':n,'Chưa đến hạn':0,'Quá hạn 1–30 ngày':0,'Quá hạn 31–60 ngày':0,'Quá hạn trên 60 ngày':0,'Tổng còn nợ':0};
  x[{c:'Chưa đến hạn',a:'Quá hạn 1–30 ngày',b:'Quá hạn 31–60 ngày',o:'Quá hạn trên 60 ngày'}[a[0]]]+=a[1];x['Tổng còn nợ']+=a[1]});return Object.values(g).sort((a,b)=>b['Tổng còn nợ']-a['Tổng còn nợ'])}
function agingKpis(list){const b={c:0,a:0,b:0,o:0};list.forEach(r=>{const a=aging(r);if(a)b[a[0]]+=a[1]});
  return `<div class="kpis"><div class="kpi"><div class="l">Chưa đến hạn</div><div class="v">${fmtTr(b.c)}</div></div><div class="kpi ${b.a?'hot':''}"><div class="l">Quá hạn 1–30 ngày</div><div class="v">${fmtTr(b.a)}</div></div><div class="kpi ${b.b?'hot':''}"><div class="l">Quá hạn 31–60 ngày</div><div class="v">${fmtTr(b.b)}</div></div><div class="kpi ${b.o?'hot':''}"><div class="l">Quá hạn trên 60 ngày</div><div class="v">${fmtTr(b.o)}</div></div><div class="kpi hot"><div class="l">Tổng còn nợ</div><div class="v">${fmtTr(b.c+b.a+b.b+b.o)}</div></div></div>`}

}

      ${imgs.length?`<h2>Bản scan</h2>${imgs.map(x=>x.src?`<div class="sc"><div>${esc(O.doc_type[x.f.doc_type]||'')}: ${esc(x.f.file_name)}</div><img src="${x.src}" width="${forWord?420:''}" style="max-width:100%;max-height:420px;border:1px solid #ddd"></div>`:'').join('')}`:''}
      <p class="ft">Xuất từ CRM KHG ngày ${fmtD(today())}</p></div>`);
  }
  return `<!doctype html><html><head><meta charset="utf-8"><title>Hồ sơ nhân sự KHG</title><style>

// ===== KCam: chụp ảnh trực tiếp bằng camera (không chọn ảnh cũ), đóng dấu giờ máy chủ + GPS + tên =====
const KCam={offset:0,synced:false,
  async sync(){try{const t0=Date.now();const {data}=await sb.rpc('khg_now');const t1=Date.now();if(data){this.offset=new Date(data).getTime()-(t0+t1)/2;this.synced=true}}catch(e){}},
  now(){return new Date(Date.now()+this.offset)},
  fmt(d){const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`},
  gps(){return new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>r(p.coords),()=>r(null),{enableHighAccuracy:true,timeout:9000,maximumAge:30000})})},
  css(){if(document.getElementById('kcam-css'))return;const st=document.createElement('style');st.id='kcam-css';st.textContent=`
#kcam{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#kcam .top{padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.6)}
#kcam .top b{font-size:16px}#kcam .clk{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;background:#C8102E;border-radius:8px;padding:4px 8px}
#kcam .vw{position:relative;flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center}
#kcam video,#kcam img{max-width:100%;max-height:100%;object-fit:contain}
#kcam .guide{position:absolute;left:8%;right:8%;top:22%;bottom:30%;border:3px dashed rgba(255,255,255,.75);border-radius:14px;pointer-events:none}
#kcam .tip{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:14px;padding:0 16px;text-shadow:0 1px 3px #000}
#kcam .bot{display:flex;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:rgba(0,0,0,.75)}
#kcam .bot button{flex:1;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800}
#kcam .shot{background:#fff;color:#C8102E;flex:2!important}#kcam .sec{background:#2a2a2a;color:#fff}`;document.head.appendChild(st)},
  // Trả về {blob, live, at (Date giờ máy chủ), coords} hoặc null nếu hủy
  shoot({title='Chụp ảnh',hint='',name='',facing='environment'}={}){
    this.css();
    return new Promise(async res=>{
      const box=document.createElement('div');box.id='kcam';document.body.appendChild(box);
      let stream=null,coords=null,tick=null,fac=facing;
      const gp=this.gps().then(c=>coords=c);
      const close=v=>{clearInterval(tick);try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}box.remove();res(v)};
      const header=`<div class="top"><b>${title}</b><span class="clk" id="kclk"></span></div>`;
      const runClock=()=>{const u=()=>{const e=document.getElementById('kclk');if(e)e.textContent=this.fmt(this.now()).slice(-8)};u();tick=setInterval(u,500)};
      const stamp=(src,w,h)=>{const c=document.createElement('canvas');const s=Math.min(1,1600/Math.max(w,h));c.width=Math.round(w*s);c.height=Math.round(h*s);const g=c.getContext('2d');g.drawImage(src,0,0,c.width,c.height);
        const at=this.now();const fs=Math.max(16,Math.round(c.width/38));const lines=[`KHG · ${name} · ${title}`,`${this.fmt(at)} (giờ hệ thống)`,coords?`GPS ${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)} ±${Math.round(coords.accuracy||0)}m`:'GPS: không lấy được vị trí'];
        const bh=fs*1.45*lines.length+fs*.8;g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,c.height-bh,c.width,bh);g.fillStyle='#fff';g.font=`700 ${fs}px Arial`;
        lines.forEach((l,i)=>g.fillText(l,fs*.6,c.height-bh+fs*1.3+i*fs*1.45));g.fillStyle='#C8102E';g.fillRect(0,c.height-bh,8,bh);
        return new Promise(r=>c.toBlob(b=>r({blob:b,at}),'image/jpeg',.85))};
      const review=async(blob,at,live)=>{box.innerHTML=header+`<div class="vw"><img id="kprev"></div><div class="bot"><button class="sec" id="kre">↺ Chụp lại</button><button class="shot" id="kok">✓ Dùng ảnh này</button></div>`;
        runClock();document.getElementById('kprev').src=URL.createObjectURL(blob);
        document.getElementById('kre').onclick=()=>{clearInterval(tick);live?start():fallback()};document.getElementById('kok').onclick=()=>close({blob,live,at,coords})};
      const fallback=()=>{box.innerHTML=header+`<div class="vw" style="flex-direction:column;gap:14px;padding:20px;text-align:center"><div>Thiết bị không mở được camera trực tiếp trong trình duyệt.<br>Bấm nút dưới để chụp bằng camera máy (ảnh sẽ được đánh dấu chờ duyệt).</div>
        <label class="shot" style="display:block;background:#fff;color:#C8102E;border-radius:14px;padding:15px;font-weight:800;width:100%">📷 Mở camera<input type="file" accept="image/*" capture="${fac}" id="kfile" style="display:none"></label></div><div class="bot"><button class="sec" id="kx">Hủy</button></div>`;
        runClock();document.getElementById('kx').onclick=()=>close(null);
        document.getElementById('kfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=async()=>{await gp;const r=await stamp(img,img.naturalWidth,img.naturalHeight);clearInterval(tick);review(r.blob,r.at,false)};img.src=URL.createObjectURL(f)}};
      const start=async()=>{clearInterval(tick);try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}
        box.innerHTML=header+`<div class="vw"><video id="kvid" playsinline autoplay muted></video><div class="guide"></div><div class="tip">${hint}</div></div><div class="bot"><button class="sec" id="kx">✕</button><button class="sec" id="kflip">🔄</button><button class="shot" id="kshot">📸 CHỤP</button></div>`;
        runClock();document.getElementById('kx').onclick=()=>close(null);
        try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:fac},width:{ideal:1920},height:{ideal:1080}},audio:false});const v=document.getElementById('kvid');v.srcObject=stream;await v.play().catch(()=>{});
          document.getElementById('kflip').onclick=()=>{fac=fac==='environment'?'user':'environment';start()};
          document.getElementById('kshot').onclick=async()=>{if(!v.videoWidth)return;await Promise.race([gp,new Promise(r=>setTimeout(r,2500))]);const r=await stamp(v,v.videoWidth,v.videoHeight);clearInterval(tick);try{stream.getTracks().forEach(t=>t.stop())}catch(e){}review(r.blob,r.at,true)};
        }catch(e){fallback()}};
      if(!this.synced)await this.sync();
      if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)start();else fallback();
    });
  }
};

const addDaysA=(d,n)=>{const x=new Date(d+'T12:00:00+07:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};

    const T=x=>x?new Date(x).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'—';const S=x=>x?new Date(x).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'';

// ---- mời đối tác nhận đơn (dùng ở Điều phối và tab Đối tác) ----
async function partnerPicker(host,o){
  const {data:ps}=await sb.from('khg_partners').select('id,code,name,short_name,phone,areas,vehicle_types,trips_done').eq('status','dang_hop_tac').order('trips_done',{ascending:false,nullsFirst:false});
  const {data:vs}=await sb.from('khg_vehicles').select('partner_id,load_t,vehicle_type,status').not('partner_id','is',null).eq('status','san_sang');
  const ready={};(vs||[]).forEach(v=>{(ready[v.partner_id]=ready[v.partner_id]||[]).push(v)});
  const need=Number(o?.weight_t)||0;
  host.innerHTML=(ps||[]).length?`<div class="sub" style="margin:6px 0">Đối tác nhận lời mời trên app Đối tác KHG (thấy tuyến quận/huyện, giá mời; địa chỉ chi tiết chỉ hiện sau khi nhận). Ai nhận trước được giao đơn.</div>
   <label style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><input type="checkbox" id="ptAll"> Chọn tất cả (kể cả đối tác chưa có xe sẵn sàng)</label><div class="drl">${ps.map(p=>{const r=ready[p.id]||[];const fit=!need||r.some(v=>!v.load_t||Number(v.load_t)>=need*0.95);
    return `<label><input type="checkbox" class="ptck" value="${p.id}" ${fit&&r.length?'checked':''}><div><b>${esc(p.short_name||p.name)}</b> <span style="color:var(--muted)">${esc(p.code)} · ${esc(p.phone)}</span><div style="font-size:12px;color:var(--muted)">${r.length} xe sẵn sàng${(p.areas||[]).length?' · '+esc(p.areas.join(', ')):''}${p.trips_done?' · '+p.trips_done+' chuyến':''}${!fit?' · <b style="color:#B5651D">xe có thể nhỏ hơn yêu cầu</b>':''}</div></div></label>`}).join('')}</div>
   <div class="form" style="margin-top:8px"><label>Giá mời đối tác (đ)<input id="ptPr" type="number" value="${Math.round(o?.partner_cost||((o?.revenue||o?.est_fare||0)*0.85))||''}"></label>
   <label>Hạn trả lời<select id="ptH"><option value="1">1 giờ</option><option value="2" selected>2 giờ</option><option value="4">4 giờ</option><option value="12">12 giờ</option><option value="24">24 giờ</option><option value="0">Không giới hạn</option></select></label>
   <label style="grid-column:1/-1">Ghi chú gửi đối tác<input id="ptNo" placeholder="VD: bốc xếp 2 đầu KHG lo, hàng dễ vỡ…"></label></div>`
   :'<div class="empty">Chưa có đối tác đang hợp tác. Gửi link mời ở mục Đối tác xe liên kết và duyệt hồ sơ.</div>';

async function sendOffer(o,v){if(!v.ids.length)return toast('Chọn ít nhất 1 đối tác'),false;
  const {data,error}=await sb.rpc('khg_offer_create',{p_order:o.id,p_partners:v.ids,p_price:v.price,p_hours:v.hours,p_note:v.note});
  if(error){toast(error.message);return false}toast(`Đã mời ${data.sent} đối tác – chờ nhận đơn trên app`);return true}
async function openOffer(o,after){
  modal(`<h3>🤝 Mời đối tác xe chạy đơn ${esc(o.code)}</h3><div class="sub">${esc((o.pickup||'')+' → '+(o.dropoff||''))} · ${o.scheduled_at?fmtDT(o.scheduled_at):'càng sớm càng tốt'}${o.weight_t?' · '+o.weight_t+' tấn':''}</div><div id="ptBox"><div class="empty">Đang tải…</div></div>
   <div class="acts"><span class="sp"></span><button class="btn" id="ptC">Đóng</button><button class="btn p" id="ptGo">Gửi lời mời</button></div>`,true);
  const get=await partnerPicker($('#ptBox'),o);$('#ptC').onclick=closeModal;
  $('#ptGo').onclick=async()=>{$('#ptGo').disabled=true;if(await sendOffer(o,get())){closeModal();after&&after()}else $('#ptGo').disabled=false};
}
async function pickOrderForOffer(after){
  const {data}=await sb.from('khg_orders').select('id,code,pickup,dropoff,scheduled_at,weight_t,revenue,est_fare,partner_cost,customer_text,vehicle_req').is('driver_id',null).in('status',['moi','xac_nhan']).order('scheduled_at',{ascending:true,nullsFirst:false}).limit(80);
  modal(`<h3>Chọn đơn chưa có xe để mời đối tác</h3><div class="drl">${(data||[]).map(o=>`<label><input type="radio" name="pko" value="${o.id}"><div><b>${esc(o.code)}</b> · ${o.scheduled_at?fmtDT(o.scheduled_at):'ASAP'}<div style="font-size:12px;color:var(--muted)">${esc((o.pickup||'')+' → '+(o.dropoff||''))}${o.weight_t?' · '+o.weight_t+'t':''}${o.revenue?' · giá khách '+fmtM(o.revenue):''}</div></div></label>`).join('')||'<div class="empty">Không có đơn nào đang chờ xe.</div>'}</div>
   <div class="acts"><span class="sp"></span><button class="btn" id="pkC">Đóng</button><button class="btn p" id="pkGo">Tiếp tục</button></div>`,true);
  $('#pkC').onclick=closeModal;$('#pkGo').onclick=()=>{const id=document.querySelector('input[name=pko]:checked')?.value;if(!id)return toast('Chọn đơn');openOffer((data||[]).find(o=>o.id===id),after)};
}
async function openPset(id){

  modal(`<h3>Đối soát ${esc(s.code)} · ${esc(s.partner?.name||'')}</h3><div class="sub">Kỳ ${fmtD(s.period_from)} – ${fmtD(s.period_to)} · ${pill('pset_status',s.status)}${s.partner?.bank_no?` · TK ${esc(s.partner.bank_no)} ${esc(s.partner.bank_name||'')} – ${esc(s.partner.bank_holder||'')}`:''}</div>
   <div class="tw" style="max-height:50vh;overflow:auto"><table><thead><tr><th>Đơn</th><th>Ngày giao</th><th>Tuyến</th><th>Xe</th><th class="n">Cước</th><th class="n">COD giữ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.code)}</td><td>${fmtDT(r.date)}</td><td>${esc(r.route)}</td><td>${esc(r.plate||'')}</td><td class="n">${fmtN(r.amount)}</td><td class="n">${fmtN(r.cod)}</td></tr>`).join('')}</tbody></table></div>
   <div class="kpis" style="margin-top:10px"><div class="kpi"><div class="l">Cước ${s.trips} chuyến</div><div class="v">${fmtM(s.amount)}</div></div><div class="kpi"><div class="l">+ Phụ phí / − Khấu trừ</div><div class="v">${fmtN(s.extra)} / ${fmtN(s.deductions)}</div></div><div class="kpi"><div class="l">− COD đối tác giữ</div><div class="v">${fmtM(s.cod_total)}</div></div><div class="kpi hot"><div class="l">KHG phải trả</div><div class="v">${fmtM(s.net)}</div></div></div>
   ${s.partner_note?`<p><b>Ý kiến đối tác:</b> ${esc(s.partner_note)}</p>`:''}
   <div class="acts"><button class="btn" id="psX">⬇ Excel</button><span class="sp"></span><button class="btn" id="psC">Đóng</button></div>`,true);
  $('#psC').onclick=closeModal;
  $('#psX').onclick=()=>xlsx('Doi-soat_'+s.code,{[s.code]:[['Đơn','Ngày giao','Tuyến','Xe','Hàng','Cước','COD đối tác giữ'],...rows.map(r=>[r.code,fmtDT(r.date),r.route,r.plate||'',r.cargo||'',Number(r.amount)||0,Number(r.cod)||0]),[],['Cước',null,null,null,null,Number(s.amount)],['Phụ phí',null,null,null,null,Number(s.extra)],['Khấu trừ',null,null,null,null,-Number(s.deductions)],['COD giữ',null,null,null,null,-Number(s.cod_total)],['KHG phải trả',null,null,null,null,Number(s.net)]]});
}

async function openCands(job,after){
  const [{data:apps},{data:drs}]=await Promise.all([sb.from('khg_driver_job_apps').select('*').eq('job_id',job.id).order('created_at'),sb.from('khg_fd_drivers').select('id,code,full_name,phone,license_class,license_until,certs,province,areas,years_exp,rating,jobs_done,status').in('status',['da_duyet','cho_tap_huan'])]);
  const byId=Object.fromEntries((drs||[]).map(d=>[d.id,d]));
  const missing=(apps||[]).filter(a=>!byId[a.driver_id]).map(a=>a.driver_id);
  if(missing.length){const {data:more}=await sb.from('khg_fd_drivers').select('id,code,full_name,phone,license_class,license_until,certs,province,areas,years_exp,rating,jobs_done,status').in('id',missing);(more||[]).forEach(d=>byId[d.id]=d)}
  const ok=d=>licOk(d.license_class,job.license_req)&&(!job.cert_req||(d.certs||[]).includes(job.cert_req))&&(!d.license_until||d.license_until>=(job.start_date||today()));
  const applied=new Set((apps||[]).map(a=>a.driver_id));
  const sug=(drs||[]).filter(d=>d.status==='da_duyet'&&!applied.has(d.id)&&ok(d)).sort((a,b)=>(b.rating||0)-(a.rating||0)||(b.jobs_done||0)-(a.jobs_done||0)).slice(0,30);
  const card=(d,a)=>`<div class="fi" style="display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px"><div style="flex:1"><b>${esc(d.full_name)}</b> <span style="color:var(--muted)">${esc(d.code)}</span> ${pill('fd_status',d.status)} ${a?pill('app_status',a.status):''}

let FD_SUB=null;
// ===================== CHUÔNG LỚN CRM =====================
const CRing=(()=>{let ac=null,timer=null,el=null,n=0;
  const on=()=>{try{return localStorage.getItem('khg_ring')!=='0'}catch(e){return true}};
  const unlock=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}};
  ['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
  const beep=()=>{if(!ac)return;try{const t=ac.currentTime;[[988,0],[740,.2],[988,.4],[740,.6],[1175,.8]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.7,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.19)})}catch(e){}};
  const stop=()=>{clearInterval(timer);timer=null;if(el){el.remove();el=null}try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}};
  const start=(title,body,onOpen)=>{if(!on())return;stop();unlock();el=document.createElement('div');el.className='cring';
    el.innerHTML=`<div class="cr-bx"><div class="cr-ic">🔔</div><b>${esc(title)}</b><p>${esc(body||'')}</p><div class="acts" style="justify-content:center"><button class="btn" data-x>Tắt chuông</button><button class="btn p" data-o>Xem ngay</button></div></div>`;
    document.body.appendChild(el);el.querySelector('[data-x]').onclick=stop;el.querySelector('[data-o]').onclick=()=>{stop();onOpen&&onOpen()};
    n=0;beep();try{navigator.vibrate&&navigator.vibrate([500,200,500])}catch(e){}timer=setInterval(()=>{beep();if(++n>60)stop()},1500);
    try{if('Notification' in window&&Notification.permission==='granted'&&document.visibilityState!=='visible')new Notification(title,{body:body||'',requireInteraction:true,tag:'khg-crm'})}catch(e){}};
  return {start,stop,on,set:v=>{try{localStorage.setItem('khg_ring',v?'1':'0')}catch(e){}}}})();

VIEWS.trash=async m=>{
  const T=Object.entries(E).filter(([k,c])=>c.table).map(([k,c])=>[k,c.title]);

    rows=(data||[]);const cols=fields(cfg).filter(x=>x.list).slice(0,6);const q=$('#tq').value.toLowerCase();

    $('#tck')&&($('#tck').onchange=e=>$$('#tw [data-id]').forEach(c=>c.checked=e.target.checked));
    $$('#tw [data-r]').forEach(b=>b.onclick=()=>restore([b.dataset.r]))};
  const restore=async ids=>{if(!ids.length)return toast('Chọn dòng cần khôi phục');let ok=0,err='';for(const id of ids){const {error}=await sb.rpc('khg_archive',{p_table:E[st.t].table,p_id:id,p_restore:true});if(error)err=error.message;else ok++}toast(`Đã khôi phục ${ok}`+(err?' · '+err:''));delete REF[st.t];load()};
  await ensureRef('people');
  $('#tt').onchange=e=>{st.t=e.target.value;load()};let tq;$('#tq').oninput=()=>{clearTimeout(tq);tq=setTimeout(load,250)};

const QADDR={
  attach(inp){let box=null,items=[],seq=0,t=null;const wrap=inp.parentElement;wrap.style.position='relative';
    const close=()=>{box&&box.remove();box=null};
    inp.addEventListener('input',()=>{inp._geo=null;clearTimeout(t);const q=inp.value.trim();if(q.length<3){close();return}const my=++seq;
      t=setTimeout(async()=>{try{const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=10.85&lon=106.70&limit=6&bbox=102,8.3,110,23.5`);const j=await r.json();if(my!==seq)return;
        items=(j.features||[]).map(f=>{const p=f.properties||{};const main=[p.name,p.housenumber&&p.street?p.housenumber+' '+p.street:p.street].filter(Boolean).join(', ');const sub=[p.district,p.city||p.county,p.state].filter(Boolean).join(', ');return {main:main||sub,sub,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]}}).filter(x=>x.main);
        close();if(!items.length)return;box=document.createElement('div');box.className='qsug';
        box.innerHTML=items.map((x,i)=>`<div data-i="${i}"><b>${esc(x.main)}</b><small>${esc(x.sub)}</small></div>`).join('')+'<div class="qsrc">Bản đồ © OpenStreetMap</div>';
        box.onmousedown=e=>{const d=e.target.closest('[data-i]');if(!d)return;e.preventDefault();const x=items[+d.dataset.i];inp.value=x.main+(x.sub?', '+x.sub:'');inp._geo={lat:x.lat,lng:x.lng};close();inp.dispatchEvent(new Event('picked'))};wrap.appendChild(box)}catch(e){}},350)});
    inp.addEventListener('blur',()=>setTimeout(close,200));
  },
  async geocode(q){try{const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=10.85&lon=106.70&limit=1&bbox=102,8.3,110,23.5`);const j=await r.json();const f=(j.features||[])[0];return f?{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]}:null}catch(e){return null}},
  async route(inputs){ // inputs: các ô địa chỉ theo thứ tự
    const pts=[];for(const i of inputs){if(!i.value.trim())return null;if(!i._geo)i._geo=await QADDR.geocode(i.value.trim());if(!i._geo)return {error:'Không định vị được: '+i.value}; pts.push(i._geo)}
    try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>p.lng+','+p.lat).join(';')}?overview=false`);const j=await r.json();const rt=j.routes&&j.routes[0];if(rt)return {km:Math.ceil(rt.distance/1000),min:Math.round(rt.duration/60),src:'OSRM'}}catch(e){}
    try{const {data}=await sb.functions.invoke('khg-route',{body:{from:inputs[0].value,via:inputs.slice(1,-1).map(i=>i.value),to:inputs[inputs.length-1].value}});if(data&&data.km)return {km:data.km,min:data.minutes,src:'máy chủ KHG'}}catch(e){}
    return {error:'Không tính được tuyến – nhập km thủ công'};
  }
};
