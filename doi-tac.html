// ảnh: nén trước khi tải lên
async function shrink(file,max=1600){
  if(!/^image\//.test(file.type)||/gif|svg/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file}catch(e){return file}}
const safeName=n=>String(n||'file').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w.-]+/g,'-').slice(-60);
async function putFile(prefix,file){const f=await shrink(file);const path=`${prefix}/${Date.now()}-${safeName(f.name)}`;
  const {error}=await sb.storage.from('khg-files').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(error)throw new Error(error.message);return {path,name:f.name,mime:f.type,size:f.size}}
async function signedMap(paths){if(!paths.length)return {};const {data}=await sb.storage.from('khg-files').createSignedUrls(paths,3600);const m={};(data||[]).forEach(x=>{if(x.signedUrl)m[x.path]=x.signedUrl});return m}
async function fileGrid(files){const u=await signedMap(files.map(f=>f.file_path));return `<div class="files">${files.map(f=>{const url=u[f.file_path]||'#';return `<a href="${url}" target="_blank" rel="noopener">${/^image/.test(f.mime||'')||/\.(jpe?g|png|webp)$/i.test(f.file_path)?`<img src="${url}" alt="" loading="lazy">`:`<div class="x">${esc((f.file_path.split('.').pop()||'').toUpperCase())}</div>`}<span>${esc(DOCT[f.doc_type]||f.doc_type)}</span></a>`}).join('')}</div>`}

const getPos=(ms=8000)=>new Promise(r=>{if(!navigator.geolocation)return r(null);let done=false;const t=setTimeout(()=>{if(!done){done=true;r(null)}},ms);
  navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(t);r(p.coords)},()=>{if(done)return;done=true;clearTimeout(t);r(null)},{enableHighAccuracy:true,timeout:ms,maximumAge:60000})});
const camErr='Không mở được camera. Hãy mở bằng Chrome (Android) hoặc Safari (iPhone), cho phép quyền Camera rồi thử lại. Không mở trong Zalo/Facebook.';

function camSession({facing='user',title='',oval='face'}){
  return new Promise(async(res,rej)=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return rej(new Error(camErr));
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false})}catch(e){return rej(new Error(camErr))}
    const d=document.createElement('div');d.className='kcam';
    d.innerHTML=`<div class="kcam-top"><b>${esc(title)}</b><button class="kx" aria-label="Đóng">✕</button></div><div class="kcam-v"><video playsinline autoplay muted class="${facing==='user'?'mir':''}"></video><div class="kcam-oval ${oval==='doc'?'doc':''}"></div><div class="kcam-msg"></div><div class="kcam-cd"></div><div class="kcam-shots"></div></div><div class="kcam-bot"></div>`;
    document.body.appendChild(d);const video=d.querySelector('video');video.srcObject=stream;
    const close=()=>{stream.getTracks().forEach(t=>t.stop());d.remove()};
    d.querySelector('.kx').onclick=()=>{close();d._cancel&&d._cancel()};
    await new Promise(r=>{video.onloadedmetadata=()=>r();setTimeout(r,2500)});try{await video.play()}catch(e){}
    res({d,video,close,mirror:facing==='user',msg:t=>d.querySelector('.kcam-msg').textContent=t,cd:t=>d.querySelector('.kcam-cd').textContent=t,bot:h=>{d.querySelector('.kcam-bot').innerHTML=h;return d.querySelector('.kcam-bot')}});
  });
}
function grab(S,label){const v=S.video,w=v.videoWidth||640,h=v.videoHeight||480,k=Math.min(1,1280/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  const g=c.getContext('2d');if(S.mirror){g.translate(c.width,0);g.scale(-1,1)}g.drawImage(v,0,0,c.width,c.height);g.setTransform(1,0,0,1,0,0);
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,c.height-30,c.width,30);g.fillStyle='#fff';g.font='15px sans-serif';g.fillText('KHG · '+(label||'')+' · '+new Date().toLocaleString('vi-VN'),10,c.height-10);
  return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.86))}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function countdown(S,n=3){for(let i=n;i>0;i--){S.cd(String(i));await sleep(900)}S.cd('📸');await sleep(250);S.cd('')}

// Xác thực khuôn mặt: chụp trực tiếp theo 4 thao tác ngẫu nhiên (không cho tải ảnh có sẵn)
async function liveness(){
  const P=['Quay mặt sang TRÁI','Quay mặt sang PHẢI','Ngước mặt LÊN','Mỉm cười','Nháy mắt'].sort(()=>Math.random()-.5);
  const steps=['Nhìn thẳng vào camera',P[0],P[1],'Nhìn thẳng – giữ yên'];
  const S=await camSession({facing:'user',title:'Xác thực khuôn mặt'});
  return new Promise(res=>{S.d._cancel=()=>res(null);S.msg('Đưa khuôn mặt vào khung, đủ sáng, không đeo kính râm/khẩu trang');
    const b=S.bot('<button class="btn p">Bắt đầu</button>');b.querySelector('button').onclick=async()=>{b.innerHTML='<span class="note" style="color:#ccc">Làm theo hướng dẫn trên màn hình…</span>';const out=[];
      for(const s of steps){S.msg(s);await countdown(S,3);const bl=await grab(S,'Xác thực: '+s);out.push({blob:bl,label:s});const im=document.createElement('img');im.src=URL.createObjectURL(bl);S.d.querySelector('.kcam-shots').appendChild(im)}
      S.msg('Hoàn tất ✓');await sleep(500);S.close();res(out)}});
}

// Bảng ký tay
function signPad(name){return new Promise(res=>{const d=document.createElement('div');d.className='ksig';
  d.innerHTML=`<div class="hd2">✍️ Ký tên – ${esc(name||'')}<div class="note">Ký bằng ngón tay hoặc bút cảm ứng trong khung bên dưới</div></div><div class="pad"><canvas></canvas><div class="ln"><span>Chữ ký</span></div></div>
   <div class="ft"><button class="btn g" data-c>Xóa ký lại</button><button class="btn g" data-x>Hủy</button><button class="btn p" data-ok style="flex:1">Xác nhận chữ ký</button></div>`;
  document.body.appendChild(d);const pad=d.querySelector('.pad'),c=d.querySelector('canvas');const dpr=window.devicePixelRatio||1;
  const fit=()=>{c.width=pad.clientWidth*dpr;c.height=pad.clientHeight*dpr;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)};fit();
  const g=c.getContext('2d');let drawing=false,last=null,len=0,minX=1e9,minY=1e9,maxX=0,maxY=0;
  const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]};
  c.onpointerdown=e=>{drawing=true;last=pt(e);c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!drawing)return;const p=pt(e);g.strokeStyle='#0B2A6B';g.lineWidth=2.6*dpr;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();
    len+=Math.hypot(p[0]-last[0],p[1]-last[1]);minX=Math.min(minX,p[0]);minY=Math.min(minY,p[1]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1]);last=p};
  c.onpointerup=c.onpointercancel=()=>{drawing=false};
  d.querySelector('[data-c]').onclick=()=>{fit();len=0;minX=minY=1e9;maxX=maxY=0};
  d.querySelector('[data-x]').onclick=()=>{d.remove();res(null)};
  d.querySelector('[data-ok]').onclick=()=>{if(len<120*dpr)return toast('Chữ ký quá ngắn – ký rõ họ tên hoặc chữ ký thường dùng');
    const pd=16*dpr,x=Math.max(0,minX-pd),y=Math.max(0,minY-pd),w=Math.min(c.width,maxX+pd)-x,h=Math.min(c.height,maxY+pd)-y;const o=document.createElement('canvas');o.width=w;o.height=h+26*dpr;
    const og=o.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,o.width,o.height);og.drawImage(c,x,y,w,h,0,0,w,h);og.fillStyle='#555';og.font=(11*dpr)+'px sans-serif';og.fillText((name||'')+' · '+new Date().toLocaleString('vi-VN'),6*dpr,h+18*dpr);
    o.toBlob(b=>{d.remove();res(b)},'image/png')};
})}

const KYC={};

// Danh mục hồ sơ: host = phần tử, ctx = {type,prefix,addFile,actions,docs,onChange,signerName}
KYC.render=async(host,ctx)=>{
  const K=await KYC.load();ctx.K=K;const docs=ctx.docs()||[];const by={};docs.forEach(x=>(by[x.doc_type]=by[x.doc_type]||[]).push(x));
  const thumbs=Object.values(by).flat().filter(x=>/\.(jpe?g|png|webp)$/i.test(x.file_path));const urls=await signedMap(thumbs.map(x=>x.file_path));
  const st=KYC_ST[K.kyc_status]||KYC_ST.chua_nop;const n=K.items.length,ok=n-K.missing;

let TRF='run';
async function trips(){

   <div class="list two">${sh.map(o=>{const nx=NEXT[o.trip_status]||[];const maps=o.route_url||('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent((o.stops.find(s=>s.kind!=='lay')||{}).address||o.dropoff||''));
     return `<div class="it tr"><div class="t"><div><b>${esc(o.code)}</b> ${pill(TRIP,o.trip_status,TRC)}<div class="m">${o.scheduled_at?'🕒 '+fmtDT(o.scheduled_at):''} · 🚚 ${esc(o.plate||'')} · ${esc(o.driver||'')}</div></div><div class="pr">${fmtM(o.partner_cost)}</div></div>
      <div class="m"><div>📍 <b>Lấy:</b> ${esc(o.pickup||'')}${o.pickup_contact||o.pickup_phone?` – ${esc(o.pickup_contact||'')} ${tel(o.pickup_phone)}`:''}</div>
      ${o.stops.filter(s=>s.kind!=='lay').map(s=>`<div>🏁 <b>Giao ${s.seq}:</b> ${esc(s.address||'')}${s.contact||s.phone?` – ${esc(s.contact||'')} ${tel(s.phone)}`:''}${Number(s.cod)?` · <b>thu hộ ${fmtM(s.cod)}</b>`:''}</div>`).join('')||`<div>🏁 <b>Giao:</b> ${esc(o.dropoff||'')}</div>`}
      <div>${[o.cargo&&'📦 '+esc(o.cargo),o.weight_t&&o.weight_t+' t',o.need_loading&&'Cần bốc xếp',Number(o.cod)&&'💵 COD '+fmtM(o.cod)].filter(Boolean).join(' · ')}</div>${o.trip_note?`<div>💬 ${esc(o.trip_note)}</div>`:''}${o.settlement?`<div>🧾 Đối soát ${esc(o.settlement)}</div>`:''}</div>
      ${done(o.trip_status)?'':`<div class="btns">${nx.filter(s=>!['huy_chuyen','su_co','giao_mot_phan','giao_that_bai','luu_dem','tra_hang_ve','thu_hoi'].includes(s)).map(s=>`<button class="btn ${s==='da_giao'?'k':'p'} s" data-st="${s}" data-o="${o.id}">${TRIP[s]}</button>`).join('')}
        ${nx.some(s=>['su_co','giao_mot_phan','giao_that_bai','luu_dem','tra_hang_ve','huy_chuyen','thu_hoi'].includes(s))?`<select class="i" style="width:auto;min-height:36px;padding:6px" data-more="${o.id}"><option value="">Khác…</option>${nx.filter(s=>['su_co','giao_mot_phan','giao_that_bai','luu_dem','tra_hang_ve','huy_chuyen','thu_hoi'].includes(s)).map(s=>`<option value="${s}">${TRIP[s]}</option>`).join('')}</select>`:''}</div>`}
      <div class="btns"><button class="btn g s" data-ph="${o.id}">📷 Ảnh / chứng từ (${o.files})</button><a class="btn g s" href="${esc(maps)}" target="_blank" rel="noopener">🗺 Chỉ đường</a></div></div>`}).join('')||'<div class="card empty">Không có chuyến.</div>'}</div>`;
  $$('.seg button').forEach(b=>b.onclick=()=>{TRF=b.dataset.f;trips()});
  const upd=async(id,st,btn)=>{let note=null;if(NEED_NOTE.includes(st)){note=prompt(`Lý do / ghi chú cho "${TRIP[st]}":`);if(!note)return}
    else if(st==='da_giao'&&!confirm('Xác nhận ĐÃ GIAO XONG? Nhớ chụp biên bản / chứng từ giao hàng.'))return;
    const pos=await new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>r(p.coords),()=>r(null),{timeout:6000,maximumAge:60000})});
    await busy(btn,async()=>{await rpc('khg_partner_trip',{p_order:id,p_status:st,p_note:note,p_lat:pos?.latitude??null,p_lng:pos?.longitude??null});toast('Đã cập nhật: '+TRIP[st]);trips()})};

}

  let deferred=null;

  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;show()});
  window.addEventListener('appinstalled',()=>{try{localStorage.setItem('khg_installed','1')}catch(e){}hide()});
  const css=`#kins{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:120;background:#111827;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:520px;margin:0 auto}
#kins img{width:40px;height:40px;border-radius:10px}#kins b{display:block;font-size:15px}#kins .x{background:none;border:0;color:#9CA3AF;font-size:20px;padding:4px}
#kins .go{background:#C8102E;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;white-space:nowrap}
#kinsg{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#kinsg .bx{background:#fff;color:#111;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#kinsg ol{padding-left:20px;margin:8px 0}#kinsg li{margin:8px 0}#kinsg .k{display:inline-block;border:1px solid #ddd;border-radius:6px;padding:0 6px;background:#f6f6f6}
#kinsg button{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;margin-top:8px}#kinsg .p{background:#C8102E;color:#fff}#kinsg .o{background:#f1f1f1}`;
  const icon=(document.querySelector('link[rel=apple-touch-icon]')||{}).href||'';
  const name=(document.querySelector('meta[name=apple-mobile-web-app-title]')||{}).content||'KHG';
  function ensureCss(){if(!document.getElementById('kins-css')){const s=document.createElement('style');s.id='kins-css';s.textContent=css;document.head.appendChild(s)}}
  function hide(){document.getElementById('kins')?.remove()}
  function show(force){
    if(standalone)return;
    try{if(!force&&(localStorage.getItem('khg_ins_hide')>Date.now()||localStorage.getItem('khg_installed')))return}catch(e){}
    ensureCss();
    hide();const d=document.createElement('div');d.id='kins';
    d.innerHTML=`${icon?`<img src="${icon}" alt="">`:''}<div style="flex:1"><b>Cài “${name}” lên màn hình chính</b>${inApp?'Đang mở trong Zalo/Facebook – mở bằng trình duyệt để cài':'Mở nhanh như app, nhận chuông báo'}</div><button class="go">Cài app</button><button class="x" aria-label="Đóng">✕</button>`;
    document.body.appendChild(d);
    d.querySelector('.x').onclick=()=>{try{localStorage.setItem('khg_ins_hide',Date.now()+3*864e5)}catch(e){}hide()};
    d.querySelector('.go').onclick=()=>KInstall.open();
  }
  function guide(html){ensureCss();document.getElementById('kinsg')?.remove();const g=document.createElement('div');g.id='kinsg';g.innerHTML=`<div class="bx">${html}<button class="o" id="kgc">Đóng</button></div>`;
    document.body.appendChild(g);g.onclick=e=>{if(e.target.id==='kinsg')g.remove()};document.getElementById('kgc').onclick=()=>g.remove()}
  window.KInstall={
    standalone,isIOS,isAndroid,inApp,show:()=>show(true),
    async open(){
      const url=location.href.split('#')[0];
      if(inApp){
        const intent=`intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;end`;
        guide(`<h3 style="margin:0 0 6px">Mở bằng trình duyệt để cài app</h3><p>Zalo / Facebook không cho cài app. Hãy mở link này bằng ${isIOS?'<b>Safari</b>':'<b>Chrome</b>'}:</p>
          <ol><li>Bấm nút <span class="k">⋯</span> hoặc <span class="k">⋮</span> ở góc trên.</li><li>Chọn <b>Mở bằng trình duyệt</b> / <b>Open in ${isIOS?'Safari':'Chrome'}</b>.</li><li>Trong trình duyệt, bấm lại <b>Cài app</b>.</li></ol>
          ${isAndroid?`<a href="${intent}"><button class="p">Mở bằng Chrome</button></a>`:''}<button class="o" id="kcp">📋 Sao chép link</button>`);
        document.getElementById('kcp').onclick=()=>{navigator.clipboard?.writeText(url);document.getElementById('kcp').textContent='Đã sao chép – dán vào '+(isIOS?'Safari':'Chrome')};return}
      if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==='accepted')hide();return}
      if(isIOS){guide(`<h3 style="margin:0 0 6px">Cài lên iPhone / iPad</h3><ol><li>Mở trang này bằng <b>Safari</b>.</li><li>Bấm nút <b>Chia sẻ</b> <span class="k">⬆︎</span> ở thanh dưới (hoặc trên).</li><li>Kéo xuống, chọn <b>Thêm vào MH chính</b> (Add to Home Screen).</li><li>Bấm <b>Thêm</b>. Biểu tượng ${name} xuất hiện trên màn hình chính.</li></ol><p style="font-size:13px;color:#666">Mở app từ biểu tượng để nhận thông báo (iOS 16.4 trở lên).</p>`);return}
      guide(`<h3 style="margin:0 0 6px">Cài lên ${isAndroid?'điện thoại Android':'máy tính'}</h3><ol>${isAndroid?'<li>Mở bằng <b>Chrome</b>.</li><li>Bấm <span class="k">⋮</span> góc phải trên.</li><li>Chọn <b>Cài đặt ứng dụng</b> / <b>Thêm vào màn hình chính</b>.</li><li>Bấm <b>Cài đặt</b>.</li>':'<li>Mở bằng Chrome hoặc Edge.</li><li>Bấm biểu tượng <b>Cài đặt</b> ⊕ ở cuối thanh địa chỉ.</li><li>Bấm <b>Cài đặt</b> – app mở thành cửa sổ riêng, ghim vào thanh tác vụ.</li>'}</ol>`);
    }
  };
  // hiện gợi ý sau 4 giây trên điện thoại
  if(/[?&]install=1/.test(location.search)&&!standalone)setTimeout(()=>KInstall.open(),900);
  else if(!standalone&&(isIOS||isAndroid||inApp))setTimeout(()=>show(false),4000);
})();

// Bắt buộc đổi mật khẩu tạm do KHG cấp
(function(){function chk(){sb.auth.getSession().then(({data})=>{const u=data&&data.session&&data.session.user;if(!u||!(u.user_metadata||{}).must_change||document.getElementById('mcpw'))return;
  const d=document.createElement('div');d.id='mcpw';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px';
  const st='width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px;font:inherit;box-sizing:border-box';
  d.innerHTML=`<div style="background:#fff;color:#111;border-radius:16px;padding:18px;max-width:380px;width:100%;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><h3 style="margin:0 0 6px">🔐 Đặt mật khẩu mới</h3><p style="margin:0 0 12px;color:#666;font-size:13px">Bạn đang dùng mật khẩu tạm do KHG cấp. Hãy đặt mật khẩu riêng để tiếp tục.</p><input id="mc1" type="password" autocomplete="new-password" placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" style="${st}"><input id="mc2" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" style="${st}"><button id="mcok" style="width:100%;padding:12px;border:0;border-radius:10px;background:#C8102E;color:#fff;font-weight:800;font-size:15px">Lưu mật khẩu</button><div id="mce" style="color:#B42318;font-size:13px;margin-top:6px"></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#mcok').onclick=async()=>{const a=d.querySelector('#mc1').value,b=d.querySelector('#mc2').value,e=d.querySelector('#mce');if(a.length<6)return e.textContent='Tối thiểu 6 ký tự';if(a!==b)return e.textContent='Hai mật khẩu chưa khớp';
    const r=await sb.auth.updateUser({password:a,data:{must_change:false}});if(r.error)return e.textContent=r.error.message;d.remove()}})}
  try{sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION')setTimeout(chk,400)})}catch(e){}setTimeout(chk,1200)})();

(async()=>{const {data:{session}}=await sb.auth.getSession();
  if(session&&String(session.user.email||'').endsWith(DOMAIN))boot();else{if(session)await sb.auth.signOut();authView(qs('sdt')||qs('ref')||location.hash==='#dangky'?'up':'in')}})();
</script></body></html>
