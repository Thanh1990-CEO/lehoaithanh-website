let AC=null,RING=null,WAKE=null;
const unlockAudio=()=>{try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}};

function siren(){if(!AC)return;const t=AC.currentTime;for(let i=0;i<6;i++){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(i%2?1400:950,t+i*.22);
  g.gain.setValueAtTime(.0001,t+i*.22);g.gain.exponentialRampToValueAtTime(.6,t+i*.22+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.22+.2);o.connect(g).connect(AC.destination);o.start(t+i*.22);o.stop(t+i*.22+.21)}}

function shrink(file){return new Promise(res=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file)},'image/jpeg',.82)};img.onerror=()=>res(file);img.src=u})}
const mapLink=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s);
const ptOf=s=>s.lat!=null&&s.lng!=null?`${s.lat},${s.lng}`:encodeURIComponent(s.address||'');

function routeUrl(x,stops){if(stops.length>=2){const P=stops.filter(s=>!['xong','that_bai','tra_ve'].includes(s.status));const L=P.length?P:stops;
  return `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${ptOf(L[L.length-1])}`+(L.length>1?`&waypoints=${L.slice(0,-1).map(ptOf).join('%7C')}`:'')}
  return x.route_url||mapLink(x.dropoff||x.pickup||'')}

const truckF=t=>!t?1.2:t<=3.5?1.15:t<=8?1.3:1.45;
const EST={};
async function estimate(x,stops){
  if(EST[x.id]!==undefined)return EST[x.id];
  const P=stops.filter(s=>s.lat!=null&&s.lng!=null);
  if(x.distance_km&&x.duration_min)return EST[x.id]={km:Number(x.distance_km),min:Number(x.duration_min)};
  if(P.length<2)return EST[x.id]=null;
  try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${P.map(s=>s.lng+','+s.lat).join(';')}?overview=false`);const j=await r.json();
    const rt=j.routes&&j.routes[0];return EST[x.id]=rt?{km:rt.distance/1000,min:rt.duration/60*truckF(VEH[x.vehicle_id]?.load_t)}:null}catch(e){return EST[x.id]=null}
}

  m.querySelectorAll('[data-o]').forEach(el=>{const x=active.find(a=>a.id===el.dataset.o);const S=stOf(x.id);
    el.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{b.disabled=true;stopRing();await trip(x,b.dataset.t);b.disabled=false});
    el.querySelector('[data-more]').onclick=()=>otherStatus(x);
    el.querySelector('[data-ph]').onclick=()=>photo(x,['dang_tra_hang','dang_giao','den_diem_giao'].includes(x.trip_status)?'bien_ban_giao_nhan':'hinh_hang');
    el.querySelector('[data-ev]').onclick=()=>events(x);
    el.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>stopUpd(x,S.find(s=>s.id===b.dataset.sp),b.dataset.s));
    el.querySelectorAll('[data-ps]').forEach(b=>b.onclick=()=>{const s=S.find(z=>z.id===b.dataset.ps);photo(x,s.kind==='lay'?'hinh_hang':'pod','Ảnh / video điểm '+(s.kind==='lay'?'lấy hàng':s.seq),s)});
    if(!x.distance_km||!x.duration_min)estimate(x,S).then(e=>{const box=el.querySelector('[data-est]');if(e&&box){box.children[0].querySelector('b').textContent=fmtN(Math.round(e.km*10)/10)+' km';box.children[1].querySelector('b').textContent=hm(e.min)}else if(box){box.children[0].querySelector('b').textContent='—';box.children[1].querySelector('b').textContent='—'}});
  });
  // còn đơn chờ nhận mà chưa xem → đổ chuông lại
  const seen=JSON.parse(localStorage.getItem('khg_seen')||'{}');const unseen=fresh.filter(x=>seen[x.id]!==x.updated_at);
  if(unseen.length&&!$('#ring')){alertNew(unseen.length>1?`Có ${unseen.length} đơn mới`:'Đơn mới '+unseen[0].code,(unseen[0].pickup||'')+' → '+(unseen[0].dropoff||''),unseen[0].id)}
  fresh.forEach(x=>seen[x.id]=x.updated_at);try{localStorage.setItem('khg_seen',JSON.stringify(seen))}catch(e){}
};
async function events(o){
  const {data}=await sb.from('khg_order_events').select('*').eq('order_id',o.id).order('created_at');
  sheet(`<h2>Hành trình ${esc(o.code)}</h2>${(data||[]).map(e=>`<div class="li"><span class="pill ${PILL[e.status]||''}">${TRIP[e.status]||e.status}</span> ${fmtDT(e.created_at)}${e.note?`<div class="small">${esc(e.note)}</div>`:''}</div>`).join('')||'<div class="empty">Chưa có.</div>'}<button class="big o" id="sx" style="margin-top:12px">Đóng</button>`);$('#sx').onclick=closeSheet;
}

V.cong=async m=>{
  const d=today();const ms=d.slice(0,8)+'01';
  const {data}=await sb.from('khg_attendance').select('*').eq('person_id',ME.id).gte('work_date',ms).order('work_date',{ascending:false});
  const cur=(data||[]).find(a=>a.work_date===d);
  const wd=(data||[]).filter(a=>(a.day_type||'thuong')==='thuong').reduce((s,a)=>s+(a.status==='co_mat'?1:a.status==='nua_ngay'?.5:0),0);
  const ot=(data||[]).reduce((s,a)=>s+Number(a.ot_hours||0),0);
  m.innerHTML=`<h2>Chấm công</h2>
   <div class="card"><div class="row"><b>Hôm nay ${fmtD(d)}</b><span style="flex:1"></span>${cur?`<span class="pill green">${cur.status==='co_mat'?'Có mặt':cur.status==='nua_ngay'?'Nửa ngày':cur.status==='nghi_phep'?'Nghỉ phép':'Vắng'}</span>`:'<span class="pill">Chưa chấm</span>'}</div>
    <div class="small" style="margin:6px 0 10px">Vào ca: <b>${fmtT(cur?.check_in)||'—'}</b> · Ra ca: <b>${fmtT(cur?.check_out)||'—'}</b></div>
    <div class="two" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="big g" id="cin" ${cur?.check_in?'disabled':''}>Vào ca</button><button class="big" id="cout" ${!cur?.check_in||cur?.check_out?'disabled':''}>Ra ca</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button class="big o" id="chalf">Nửa ngày</button><button class="big o" id="cleave">Xin nghỉ phép</button></div></div>
   <div class="kpis"><div class="kpi"><div class="l">Công tháng này</div><div class="v">${wd}/26</div><div class="bar"><div style="width:${Math.min(100,wd*100/26)}%"></div></div><div class="small">${wd>=26?'Đạt chuyên cần 🎉':'Còn '+(26-wd)+' công để đạt chuyên cần'}</div></div><div class="kpi"><div class="l">Giờ tăng ca</div><div class="v">${ot}</div></div></div>
   <div class="card"><b>Chi tiết tháng</b>${(data||[]).map(a=>`<div class="li">${fmtD(a.work_date)} · ${a.status==='co_mat'?'Có mặt':a.status==='nua_ngay'?'Nửa ngày':a.status==='nghi_phep'?'Nghỉ phép':'Vắng'}${a.day_type&&a.day_type!=='thuong'?' · '+(a.day_type==='le'?'Lễ':'Ngày nghỉ'):''}<span class="small"> · ${fmtT(a.check_in)||''}${a.check_out?'–'+fmtT(a.check_out):''}${a.ot_hours?' · TC '+a.ot_hours+'h':''}</span></div>`).join('')||'<div class="empty">Chưa có.</div>'}</div>`;
  const up=async(action,btn,note)=>{if(btn){btn.disabled=true;btn.textContent='Đang gửi…'}
    const c=action==='vao_ca'||action==='ra_ca'?await where():null;
    const {error}=await sb.rpc('khg_attendance_self',{p_action:action,p_lat:c?c.latitude:null,p_lng:c?c.longitude:null,p_note:note||null});
    if(error){toast(/fetch|network|Failed/i.test(error.message)?'Mất kết nối mạng – thử lại':error.message);go('cong',true);return}
    toast({vao_ca:'✔ Đã vào ca',ra_ca:'✔ Đã ra ca',nua_ngay:'✔ Đã chấm nửa ngày',nghi_phep:'✔ Đã báo nghỉ phép'}[action]);go('cong',true)};
  $('#cin').onclick=e=>up('vao_ca',e.currentTarget);
  $('#cout').onclick=e=>up('ra_ca',e.currentTarget);
  $('#chalf').onclick=e=>up('nua_ngay',e.currentTarget);
  $('#cleave').onclick=()=>{sheet(`<h2>Xin nghỉ phép hôm nay</h2><label class="f">Lý do<input class="in" id="lvr" placeholder="VD: việc gia đình"></label><div class="acts"><button class="big" id="lvok">Gửi</button><button class="big o" id="lvno">Không</button></div>`);
    $('#lvno').onclick=closeSheet;$('#lvok').onclick=async()=>{closeSheet();await up('nghi_phep',null,$('#lvr')?.value||'')}};
};

V.chi=async m=>{
  const [{data:ex},{data:adv}]=await Promise.all([
    sb.from('khg_expenses').select('*').eq('person_id',ME.id).order('spent_on',{ascending:false}).limit(30),
    sb.from('khg_advances').select('*').eq('person_id',ME.id).order('advanced_on',{ascending:false}).limit(20)]);
  const {data:myo}=await sb.from('khg_orders').select('id,code').eq('driver_id',ME.id).not('status','in','(huy,da_thu)').order('created_at',{ascending:false}).limit(20);
  const ADS={cho_duyet:['Chờ duyệt','red'],mo:['Đã nhận tiền','amber'],da_quyet_toan:['Đã quyết toán','green'],huy:['Không duyệt','']};
  const openAdv=(adv||[]).filter(a=>a.kind==='tam_ung_chi_phi'&&a.status==='mo');
  m.innerHTML=`<h2>Chi phí & ứng tiền</h2>
   <div class="card"><b>Ghi chi phí chuyến</b>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0" id="eit">${Object.entries(EXP).map(([k,l],i)=>`<button class="pill ${i===0?'red':''}" data-i="${k}" style="border:0;padding:8px 12px">${l}</button>`).join('')}</div>
    <label class="f">Số tiền (đ)<input class="in" id="eam" type="number" inputmode="numeric" placeholder="VD 1200000"></label>
    <label class="f">Đơn hàng liên quan<select class="in" id="eor"><option value="">— không gắn đơn —</option></select></label>
    <label class="f">Chứng từ<select class="in" id="eiv"><option value="hd_vat">Hóa đơn VAT</option><option value="hd_ban_le">Hóa đơn bán lẻ / bill</option><option value="phieu_thu">Phiếu thu / vé</option><option value="khong_hd" selected>Không có hóa đơn</option></select></label>
    <label class="big o" style="display:block;text-align:center;margin-bottom:10px">📷 Chụp hóa đơn / vé (<span id="ecn">0</span>)<input id="eph" type="file" accept="image/*" capture="environment" multiple class="hidden"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label class="f">Số lít<input class="in" id="eli" type="number" inputmode="decimal"></label><label class="f">Km đồng hồ<input class="in" id="ekm" type="number" inputmode="numeric"></label></div>
    <label class="f">Xe<select class="in" id="eve">${Object.values(VEH).sort((a,b)=>a.plate.localeCompare(b.plate)).map(v=>`<option value="${v.id}" ${v.id===ME.vehicle_id?'selected':''}>${esc(v.plate)}</option>`).join('')}<option value="">Không gắn xe</option></select></label>
    <label class="f">Cách trả<select class="in" id="epm"><option value="tien_mat">Tiền mặt của tôi / công ty</option><option value="cong_no">Ghi nợ (cây xăng, garage)</option><option value="chuyen_khoan">Công ty chuyển khoản</option><option value="the">Thẻ công ty</option>${openAdv.length?'<option value="tam_ung">Trừ vào tiền tạm ứng</option>':''}</select></label>
    <label class="f">Nơi chi / cây xăng<input class="in" id="esu" placeholder="VD Petrolimex QL13"></label>
    <label class="f">Ghi chú<input class="in" id="eno"></label>
    <button class="big" id="esave">Lưu chi phí</button></div>
   <div class="card"><b>Xin ứng tiền</b>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><label class="f">Loại<select class="in" id="ak"><option value="ung_luong">Ứng lương</option><option value="tam_ung_chi_phi">Tạm ứng chi phí chuyến</option></select></label><label class="f">Số tiền<input class="in" id="aam" type="number" inputmode="numeric"></label></div>
    <label class="f">Lý do<input class="in" id="apu"></label><button class="big o" id="asave">Gửi yêu cầu ứng</button>
    ${(adv||[]).map(a=>`<div class="li">${a.kind==='ung_luong'?'Ứng lương':'Tạm ứng chi phí'} <b>${fmtM(a.amount)}</b> · ${fmtD(a.advanced_on)} <span class="pill ${ADS[a.status][1]}">${ADS[a.status][0]}</span>${a.kind==='tam_ung_chi_phi'&&a.status==='mo'?`<div class="small">Đã quyết toán ${fmtM(a.settled_amount)} / ${fmtM(a.amount)}</div>`:''}</div>`).join('')}</div>
   <div class="card"><b>Chi phí đã ghi</b>${(ex||[]).map(e=>`<div class="li">${fmtD(e.spent_on)} · ${EXP[e.item]||e.item} · <b>${fmtM(e.amount)}</b>${e.liters?' · '+e.liters+' L':''} <span class="pill ${e.status==='da_duyet'?'green':e.status==='tu_choi'?'red':'amber'}">${e.status==='da_duyet'?'Đã duyệt':e.status==='tu_choi'?'Từ chối':'Chờ duyệt'}</span>${e.reject_reason?`<div class="small" style="color:var(--red)">Lý do: ${esc(e.reject_reason)}</div>`:''}<div class="small">${esc(VEH[e.vehicle_id]?.plate||'')} ${e.payment_method==='cong_no'?'· ghi nợ':''} ${esc(e.supplier||'')}</div></div>`).join('')||'<div class="empty">Chưa có.</div>'}</div>`;
  $('#eor').innerHTML+= (myo||[]).map(x=>`<option value="${x.id}">${esc(x.code)}</option>`).join('');
  let ephs=[];$('#eph').onchange=e=>{ephs=[...e.target.files];$('#ecn').textContent=ephs.length};
  let item='nhien_lieu';
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{item=b.dataset.i;m.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('red',x===b))});
  $('#esave').onclick=async()=>{const amt=Number($('#eam').value);if(!amt)return toast('Nhập số tiền');$('#esave').disabled=true;
    const pm=$('#epm').value;
    const {data:ins,error}=await sb.from('khg_expenses').insert({spent_on:today(),item,amount:amt,liters:Number($('#eli').value)||null,odometer_km:Number($('#ekm').value)||null,vehicle_id:$('#eve').value||null,person_id:ME.id,
      order_id:$('#eor').value||null,invoice_type:$('#eiv').value,
      payment_method:pm,advance_id:pm==='tam_ung'?openAdv[0].id:null,supplier:$('#esu').value||null,note:$('#eno').value||null,source:'khac'}).select('id').single();
    if(!error&&ephs.length){for(const f of ephs){const blob=await shrink(f);const path=`person/${ME.id}/chi/${Date.now()}_${Math.random().toString(36).slice(2,6)}.jpg`;
      const {error:ue}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});if(!ue)await sb.from('khg_files').insert({entity_type:'expense',entity_id:ins.id,doc_type:'chung_tu_chi_phi',file_path:path,file_name:f.name||'chung-tu.jpg',mime:'image/jpeg',size_bytes:blob.size,uploaded_by:ME.id})}}
    $('#esave').disabled=false;toast(error?error.message:'Đã gửi chi phí, chờ kế toán duyệt');if(!error)go('chi')};
  $('#asave').onclick=async()=>{const amt=Number($('#aam').value);if(!amt)return toast('Nhập số tiền');
    const {error}=await sb.from('khg_advances').insert({person_id:ME.id,kind:$('#ak').value,amount:amt,purpose:$('#apu').value||null,status:'cho_duyet',source:'app'});
    toast(error?error.message:'Đã gửi, chờ kế toán duyệt');if(!error)go('chi')};
};

V.luong=async m=>{
  const d=today();const ms=d.slice(0,8)+'01';const wk=isoD(new Date(Date.now()-((new Date().getDay()+6)%7)*864e5));
  const [{data:s},{data:o}]=await Promise.all([sb.from('khg_salary').select('*').eq('person_id',ME.id).order('period_start',{ascending:false}).limit(12),
    sb.from('khg_orders').select('id,trips,delivered_at,status').eq('driver_id',ME.id).in('status',['da_giao','doi_soat','xuat_hd','da_thu']).gte('delivered_at',ms+'T00:00:00+07:00')]);
  const tm=(o||[]).reduce((a,x)=>a+(x.trips||1),0),tw=(o||[]).filter(x=>(x.delivered_at||'')>=wk).reduce((a,x)=>a+(x.trips||1),0);
  m.innerHTML=`<h2>Lương & thu nhập</h2><div class="kpis"><div class="kpi"><div class="l">Chuyến tuần này</div><div class="v">${tw}</div></div><div class="kpi"><div class="l">Chuyến tháng này</div><div class="v">${tm}</div></div></div>
   ${(s||[]).map(r=>`<div class="card"><div class="row"><b>Lương ${r.period_type==='tuan'?'tuần':'tháng'} ${fmtD(r.period_start)} – ${fmtD(r.period_end)}</b><span style="flex:1"></span><span class="pill ${r.status==='da_tra'?'green':r.status==='da_duyet'?'blue':''}">${r.status==='da_tra'?'Đã trả':r.status==='da_duyet'?'Đã duyệt':'Đang tính'}</span></div>
    <div class="kv"><b>Ngày công</b><span>${r.work_days}/${r.std_days}</span><b>Lương công</b><span>${fmtM(r.base_pay)}</span><b>Tăng ca</b><span>${fmtM(r.ot_pay)}</span><b>Lương chuyến</b><span>${fmtM(r.trip_pay)} (${r.trips||0} chuyến)</span>
    <b>Chuyên cần</b><span>${fmtM(r.attendance_bonus)}</span><b>Phụ cấp</b><span>${fmtM(r.allowance)}</span>${Number(r.other_income)?`<b>Khác</b><span>${fmtM(r.other_income)}</span>`:''}
    <b>Trừ BH 10,5%</b><span>−${fmtM(r.insurance_employee)}</span><b>Đã ứng</b><span>−${fmtM(r.advance)}</span>${Number(r.deduction)?`<b>Khấu trừ</b><span>−${fmtM(r.deduction)}</span>`:''}</div>
    <div class="row" style="font-size:18px"><b>Thực lĩnh</b><span style="flex:1"></span><b style="color:var(--red)">${fmtM(r.total)}</b></div></div>`).join('')||'<div class="card empty">Chưa có bảng lương.</div>'}`;
};

V.toi=async m=>{
  const p=ME;
  m.innerHTML=`<h2>Thông tin của tôi</h2><div class="card"><div class="kv"><b>Họ tên</b><span>${esc(p.full_name)}</span><b>Điện thoại</b><span>${esc(p.phone||'')}</span>
   <b>Tình trạng</b><span>${({ung_vien:'Ứng viên',thu_viec:'Thử việc',chinh_thuc:'Chính thức',tam_nghi:'Tạm nghỉ',nghi_viec:'Nghỉ việc'})[p.employment_status]||''}</span>
   <b>Nhận việc</b><span>${fmtD(p.hire_date)}</span><b>Chính thức</b><span>${fmtD(p.official_date)}</span><b>Đóng BHXH từ</b><span>${fmtD(p.insurance_start)}</span>
   <b>Bằng lái</b><span>${esc(p.license_class||'')} ${p.license_until?'· hết hạn '+fmtD(p.license_until):''}</span><b>Xe phụ trách</b><span>${esc(VEH[p.vehicle_id]?.plate||'')}</span></div></div>
   <div class="card"><b>Dùng như app</b><div class="small" style="margin-top:6px">Android (Chrome): menu ⋮ → <b>Thêm vào màn hình chính</b>.<br>iPhone (Safari): nút Chia sẻ → <b>Thêm vào MH chính</b>.<br>Bật thông báo để nhận đơn khi app đang mở; Telegram bot @khg_dieuphoi_bot báo cả khi đóng app (gửi <code>/link ${esc(p.phone||'số_điện_thoại')}</code>).</div>
   <button class="big o" id="np" style="margin-top:10px">🔔 Bật thông báo</button></div>
   <div class="card"><b>Đổi mật khẩu</b><label class="f" style="margin-top:8px">Mật khẩu mới<input class="in" id="pw" type="password" minlength="6"></label><button class="big o" id="pws">Đổi mật khẩu</button></div>
   <button class="big d" id="lo">Đăng xuất</button>`;
  $('#np').onclick=async()=>{if(!('Notification' in window))return toast('Trình duyệt không hỗ trợ');const r=await Notification.requestPermission();toast(r==='granted'?'Đã bật thông báo':'Chưa cho phép thông báo')};
  $('#pws').onclick=async()=>{const v=$('#pw').value;if(v.length<6)return toast('Tối thiểu 6 ký tự');const {error}=await sb.auth.updateUser({password:v});toast(error?error.message:'Đã đổi mật khẩu')};
  $('#lo').onclick=async()=>{await sb.auth.signOut();location.reload()};
};

(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session)start();else $('#login').classList.remove('hidden')})();
})();
</script>
