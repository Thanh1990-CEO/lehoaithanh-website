function shrink(file){return new Promise(res=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);res(b||file)},'image/jpeg',.82)};img.onerror=()=>res(file);img.src=u})}
const mapLink=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s);
const ptOf=s=>s.lat!=null&&s.lng!=null?`${s.lat},${s.lng}`:encodeURIComponent(s.address||'');
const navTo=s=>`https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${ptOf(s)}`;
function routeUrl(x,stops){if(stops.length>=2){const P=stops.filter(s=>!['xong','that_bai','tra_ve'].includes(s.status));const L=P.length?P:stops;
  return `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${ptOf(L[L.length-1])}`+(L.length>1?`&waypoints=${L.slice(0,-1).map(ptOf).join('%7C')}`:'')}
  return x.route_url||mapLink(x.dropoff||x.pickup||'')}
// hệ số thời gian theo tải trọng (xe tải chạy chậm hơn xe con)
const truckF=t=>!t?1.2:t<=3.5?1.15:t<=8?1.3:1.45;
const EST={};
async function estimate(x,stops){
  if(EST[x.id]!==undefined)return EST[x.id];
  const P=stops.filter(s=>s.lat!=null&&s.lng!=null);
  if(x.distance_km&&x.duration_min)return EST[x.id]={km:Number(x.distance_km),min:Number(x.duration_min)};
  if(P.length<2)return EST[x.id]=null;
  try{const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${P.map(s=>s.lng+','+s.lat).join(';')}?overview=false`);const j=await r.json();
    const rt=j.routes&&j.routes[0];return EST[x.id]=rt?{km:rt.distance/1000,min:rt.duration/60*truckF(VEH[x.vehicle_id]?.load_t)}:null}catch(e){return EST[x.id]=null}
}
const hm=m=>m>=60?Math.floor(m/60)+'g'+String(Math.round(m%60)).padStart(2,'0'):Math.round(m)+' phút';

// ===== KCam: chụp ảnh trực tiếp bằng camera (không chọn ảnh cũ), đóng dấu giờ máy chủ + GPS + tên =====
const KCam={offset:0,synced:false,
  async sync(){try{const t0=Date.now();const {data}=await sb.rpc('khg_now');const t1=Date.now();if(data){this.offset=new Date(data).getTime()-(t0+t1)/2;this.synced=true}}catch(e){}},
  now(){return new Date(Date.now()+this.offset)},
  fmt(d){const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`},
  gps(){return new Promise(r=>{if(!navigator.geolocation)return r(null);navigator.geolocation.getCurrentPosition(p=>r(p.coords),()=>r(null),{enableHighAccuracy:true,timeout:9000,maximumAge:30000})})},
  css(){if(document.getElementById('kcam-css'))return;const st=document.createElement('style');st.id='kcam-css';st.textContent=`
#kcam{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#kcam .top{padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.6)}
#kcam .top b{font-size:16px}#kcam .clk{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;background:#C8102E;border-radius:8px;padding:4px 8px}
#kcam .vw{position:relative;flex:1;overflow:hidden;display:flex;align-items:center;justify-content:center}
#kcam video,#kcam img{max-width:100%;max-height:100%;object-fit:contain}
#kcam .guide{position:absolute;left:8%;right:8%;top:22%;bottom:30%;border:3px dashed rgba(255,255,255,.75);border-radius:14px;pointer-events:none}
#kcam .tip{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:14px;padding:0 16px;text-shadow:0 1px 3px #000}
#kcam .bot{display:flex;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:rgba(0,0,0,.75)}
#kcam .bot button{flex:1;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800}
#kcam .shot{background:#fff;color:#C8102E;flex:2!important}#kcam .sec{background:#2a2a2a;color:#fff}`;document.head.appendChild(st)},
  // Trả về {blob, live, at (Date giờ máy chủ), coords} hoặc null nếu hủy
  shoot({title='Chụp ảnh',hint='',name='',facing='environment'}={}){
    this.css();
    return new Promise(async res=>{
      const box=document.createElement('div');box.id='kcam';document.body.appendChild(box);
      let stream=null,coords=null,tick=null,fac=facing;
      const gp=this.gps().then(c=>coords=c);
      const close=v=>{clearInterval(tick);try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}box.remove();res(v)};
      const header=`<div class="top"><b>${title}</b><span class="clk" id="kclk"></span></div>`;
      const runClock=()=>{const u=()=>{const e=document.getElementById('kclk');if(e)e.textContent=this.fmt(this.now()).slice(-8)};u();tick=setInterval(u,500)};
      const stamp=(src,w,h)=>{const c=document.createElement('canvas');const s=Math.min(1,1600/Math.max(w,h));c.width=Math.round(w*s);c.height=Math.round(h*s);const g=c.getContext('2d');g.drawImage(src,0,0,c.width,c.height);
        const at=this.now();const fs=Math.max(16,Math.round(c.width/38));const lines=[`KHG · ${name} · ${title}`,`${this.fmt(at)} (giờ hệ thống)`,coords?`GPS ${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)} ±${Math.round(coords.accuracy||0)}m`:'GPS: không lấy được vị trí'];
        const bh=fs*1.45*lines.length+fs*.8;g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,c.height-bh,c.width,bh);g.fillStyle='#fff';g.font=`700 ${fs}px Arial`;
        lines.forEach((l,i)=>g.fillText(l,fs*.6,c.height-bh+fs*1.3+i*fs*1.45));g.fillStyle='#C8102E';g.fillRect(0,c.height-bh,8,bh);
        return new Promise(r=>c.toBlob(b=>r({blob:b,at}),'image/jpeg',.85))};
      const review=async(blob,at,live)=>{box.innerHTML=header+`<div class="vw"><img id="kprev"></div><div class="bot"><button class="sec" id="kre">↺ Chụp lại</button><button class="shot" id="kok">✓ Dùng ảnh này</button></div>`;
        runClock();document.getElementById('kprev').src=URL.createObjectURL(blob);
        document.getElementById('kre').onclick=()=>{clearInterval(tick);live?start():fallback()};document.getElementById('kok').onclick=()=>close({blob,live,at,coords})};
      const fallback=()=>{box.innerHTML=header+`<div class="vw" style="flex-direction:column;gap:14px;padding:20px;text-align:center"><div>Thiết bị không mở được camera trực tiếp trong trình duyệt.<br>Bấm nút dưới để chụp bằng camera máy (ảnh sẽ được đánh dấu chờ duyệt).</div>
        <label class="shot" style="display:block;background:#fff;color:#C8102E;border-radius:14px;padding:15px;font-weight:800;width:100%">📷 Mở camera<input type="file" accept="image/*" capture="${fac}" id="kfile" style="display:none"></label></div><div class="bot"><button class="sec" id="kx">Hủy</button></div>`;
        runClock();document.getElementById('kx').onclick=()=>close(null);
        document.getElementById('kfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=async()=>{await gp;const r=await stamp(img,img.naturalWidth,img.naturalHeight);clearInterval(tick);review(r.blob,r.at,false)};img.src=URL.createObjectURL(f)}};
      const start=async()=>{clearInterval(tick);try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}
        box.innerHTML=header+`<div class="vw"><video id="kvid" playsinline autoplay muted></video><div class="guide"></div><div class="tip">${hint}</div></div><div class="bot"><button class="sec" id="kx">✕</button><button class="sec" id="kflip">🔄</button><button class="shot" id="kshot">📸 CHỤP</button></div>`;
        runClock();document.getElementById('kx').onclick=()=>close(null);
        try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:fac},width:{ideal:1920},height:{ideal:1080}},audio:false});const v=document.getElementById('kvid');v.srcObject=stream;await v.play().catch(()=>{});
          document.getElementById('kflip').onclick=()=>{fac=fac==='environment'?'user':'environment';start()};
          document.getElementById('kshot').onclick=async()=>{if(!v.videoWidth)return;await Promise.race([gp,new Promise(r=>setTimeout(r,2500))]);const r=await stamp(v,v.videoWidth,v.videoHeight);clearInterval(tick);try{stream.getTracks().forEach(t=>t.stop())}catch(e){}review(r.blob,r.at,true)};
        }catch(e){fallback()}};
      if(!this.synced)await this.sync();
      if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)start();else fallback();
    });
  }
};

    <label class="f">Lý do<input class="in" id="apu"></label><button class="big o" id="asave">Gửi yêu cầu ứng</button>
    ${(adv||[]).map(a=>`<div class="li">${a.kind==='ung_luong'?'Ứng lương':'Tạm ứng chi phí'} <b>${fmtM(a.amount)}</b> · ${fmtD(a.advanced_on)} <span class="pill ${ADS[a.status][1]}">${ADS[a.status][0]}</span>${a.kind==='tam_ung_chi_phi'&&a.status==='mo'?`<div class="small">Đã quyết toán ${fmtM(a.settled_amount)} / ${fmtM(a.amount)}</div>`:''}</div>`).join('')}</div>
   <div class="card"><b>Chi phí đã ghi</b>${(ex||[]).map(e=>`<div class="li">${fmtD(e.spent_on)} · ${EXP[e.item]||e.item} · <b>${fmtM(e.amount)}</b>${e.liters?' · '+e.liters+' L':''} <span class="pill ${e.status==='da_duyet'?'green':e.status==='tu_choi'?'red':'amber'}">${e.status==='da_duyet'?'Đã duyệt':e.status==='tu_choi'?'Từ chối':'Chờ duyệt'}</span>${e.reject_reason?`<div class="small" style="color:var(--red)">Lý do: ${esc(e.reject_reason)}</div>`:''}<div class="small">${esc(VEH[e.vehicle_id]?.plate||'')} ${e.payment_method==='cong_no'?'· ghi nợ':''} ${esc(e.supplier||'')}</div></div>`).join('')||'<div class="empty">Chưa có.</div>'}</div>`;
  $('#eor').innerHTML+= (myo||[]).map(x=>`<option value="${x.id}">${esc(x.code)}</option>`).join('');
  let ephs=[];$('#eph').onchange=e=>{ephs=[...e.target.files];$('#ecn').textContent=ephs.length};
  let item='nhien_lieu';
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{item=b.dataset.i;m.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('red',x===b))});
  $('#esave').onclick=async()=>{const amt=Number($('#eam').value);if(!amt)return toast('Nhập số tiền');$('#esave').disabled=true;
    const pm=$('#epm').value;
    const {data:ins,error}=await sb.from('khg_expenses').insert({spent_on:today(),item,amount:amt,liters:Number($('#eli').value)||null,odometer_km:Number($('#ekm').value)||null,vehicle_id:$('#eve').value||null,person_id:ME.id,
      order_id:$('#eor').value||null,invoice_type:$('#eiv').value,
      payment_method:pm,advance_id:pm==='tam_ung'?openAdv[0].id:null,supplier:$('#esu').value||null,note:$('#eno').value||null,source:'khac'}).select('id').single();
    if(!error&&ephs.length){for(const f of ephs){const blob=await shrink(f);const path=`person/${ME.id}/chi/${Date.now()}_${Math.random().toString(36).slice(2,6)}.jpg`;
      const {error:ue}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg'});if(!ue)await sb.from('khg_files').insert({entity_type:'expense',entity_id:ins.id,doc_type:'chung_tu_chi_phi',file_path:path,file_name:f.name||'chung-tu.jpg',mime:'image/jpeg',size_bytes:blob.size,uploaded_by:ME.id})}}
    $('#esave').disabled=false;toast(error?error.message:'Đã gửi chi phí, chờ kế toán duyệt');if(!error)go('chi')};
  $('#asave').onclick=async()=>{const amt=Number($('#aam').value);if(!amt)return toast('Nhập số tiền');
    const {error}=await sb.from('khg_advances').insert({person_id:ME.id,kind:$('#ak').value,amount:amt,purpose:$('#apu').value||null,status:'cho_duyet',source:'app'});
    toast(error?error.message:'Đã gửi, chờ kế toán duyệt');if(!error)go('chi')};
};

V.luong=async m=>{
  const d=today();const ms=d.slice(0,8)+'01';const wk=isoD(new Date(Date.now()-((new Date().getDay()+6)%7)*864e5));
  const [{data:s},{data:o}]=await Promise.all([sb.from('khg_salary').select('*').eq('person_id',ME.id).order('period_start',{ascending:false}).limit(12),
    sb.from('khg_orders').select('id,trips,delivered_at,status').eq('driver_id',ME.id).in('status',['da_giao','doi_soat','xuat_hd','da_thu']).gte('delivered_at',ms+'T00:00:00+07:00')]);
  const tm=(o||[]).reduce((a,x)=>a+(x.trips||1),0),tw=(o||[]).filter(x=>(x.delivered_at||'')>=wk).reduce((a,x)=>a+(x.trips||1),0);
  m.innerHTML=`<h2>Lương & thu nhập</h2><div class="kpis"><div class="kpi"><div class="l">Chuyến tuần này</div><div class="v">${tw}</div></div><div class="kpi"><div class="l">Chuyến tháng này</div><div class="v">${tm}</div></div></div>
   ${(s||[]).map(r=>`<div class="card"><div class="row"><b>Lương ${r.period_type==='tuan'?'tuần':'tháng'} ${fmtD(r.period_start)} – ${fmtD(r.period_end)}</b><span style="flex:1"></span><span class="pill ${r.status==='da_tra'?'green':r.status==='da_duyet'?'blue':''}">${r.status==='da_tra'?'Đã trả':r.status==='da_duyet'?'Đã duyệt':'Đang tính'}</span></div>
    <div class="kv"><b>Ngày công</b><span>${r.work_days}/${r.std_days}</span><b>Lương công</b><span>${fmtM(r.base_pay)}</span><b>Tăng ca</b><span>${fmtM(r.ot_pay)}</span><b>Lương chuyến</b><span>${fmtM(r.trip_pay)} (${r.trips||0} chuyến)</span>
    <b>Chuyên cần</b><span>${fmtM(r.attendance_bonus)}</span><b>Phụ cấp</b><span>${fmtM(r.allowance)}</span>${Number(r.other_income)?`<b>Khác</b><span>${fmtM(r.other_income)}</span>`:''}
    <b>Trừ BH 10,5%</b><span>−${fmtM(r.insurance_employee)}</span><b>Đã ứng</b><span>−${fmtM(r.advance)}</span>${Number(r.deduction)?`<b>Khấu trừ</b><span>−${fmtM(r.deduction)}</span>`:''}</div>
    <div class="row" style="font-size:18px"><b>Thực lĩnh</b><span style="flex:1"></span><b style="color:var(--red)">${fmtM(r.total)}</b></div></div>`).join('')||'<div class="card empty">Chưa có bảng lương.</div>'}`;
};

V.vi=async m=>{
  const [{data:w},{data:tx},{data:mine}]=await Promise.all([sb.rpc('khg_wallet',{p_person:ME.id}),sb.from('khg_wallet_tx').select('*').eq('person_id',ME.id).order('created_at',{ascending:false}).limit(60),
    sb.from('khg_pay_accounts').select('*').eq('owner_type','nhan_su').eq('person_id',ME.id).eq('active',true)]);
  const r=(w||[])[0]||{deposit:0,cod_holding:0,cod_pending:0,cod_limit:0,commit_ok:false,blocked:false};
  const hrs=r.cod_oldest?Math.round((Date.now()-new Date(r.cod_oldest))/36e5):0;const phone=(ME.phone||'').replace(/\D/g,'');
  const K={ky_quy_nop:'Nộp ký quỹ',ky_quy_hoan:'Hoàn ký quỹ',ky_quy_tru:'Trừ ký quỹ',cod_thu:'Thu COD tiền mặt',cod_nop:'Nộp COD',cod_ck_cty:'Khách CK COD',thuong:'Thưởng',phat:'Phạt',khau_tru:'Khấu trừ',dieu_chinh:'Điều chỉnh'};
  const SS={cho_xac_nhan:['Chờ xác nhận','amber'],da_xac_nhan:['Đã xác nhận','green'],tu_choi:['Từ chối','red']};
  m.innerHTML=`<div id="vi"><h2>Ví COD & ký quỹ</h2>
   ${r.blocked?'<div class="warn">⛔ Tài khoản đang bị khóa nhận đơn COD. Liên hệ kế toán.</div>':''}
   ${r.cod_holding>0?`<div class="warn" style="${hrs>24?'background:#FDECEC;border-color:#F3B3B3;color:#9B1C1C':''}">Bạn đang giữ <b>${fmtM(r.cod_holding)}</b> tiền thu hộ ${hrs?`(từ ${hrs} giờ trước)`:''}. Nộp về công ty trong 24 giờ.</div>`:''}
   <div class="kpis"><div class="kpi"><div class="l">Ký quỹ</div><div class="v">${fmtN(r.deposit)}</div></div><div class="kpi"><div class="l">Hạn mức COD</div><div class="v">${fmtN(r.cod_limit)}</div></div>
    <div class="kpi"><div class="l">Đang giữ COD</div><div class="v" style="color:${r.cod_holding>0?'var(--red)':'inherit'}">${fmtN(r.cod_holding)}</div></div><div class="kpi"><div class="l">Chờ xác nhận</div><div class="v">${fmtN(r.cod_pending)}</div></div></div>
   ${r.commit_ok?'':`<div class="card"><b>✍️ Ký cam kết thu hộ COD</b><div class="small" style="margin:8px 0;line-height:1.6">Tôi cam kết: thu đúng, đủ số tiền COD theo đơn; chụp chứng từ mỗi lần thu; nộp toàn bộ tiền thu hộ về tài khoản Công ty TNHH Kim Hoàng Gia trong vòng 24 giờ; không giữ, không dùng tiền thu hộ vào việc riêng; chịu trách nhiệm bồi thường toàn bộ tiền thiếu, mất và đồng ý cho công ty cấn trừ vào ký quỹ, lương, tiền chuyến; chiếm giữ tiền thu hộ sẽ bị xử lý theo quy định pháp luật.</div>
     <label class="f">Họ và tên (gõ đúng như CCCD)<input class="in" id="cmn" value="${esc(ME.full_name||'')}"></label>
     <label class="big o" style="display:block;text-align:center">🤳 Chụp ảnh chân dung<input id="cmf" type="file" accept="image/*" capture="user" class="hidden"></label><div id="cmp" class="thumbs" style="margin:8px 0"></div>
     <label style="display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0"><input type="checkbox" id="cmk" style="width:22px;height:22px"> Tôi đã đọc, hiểu và đồng ý cam kết trên.</label>
     <button class="big" id="cms" disabled>Ký cam kết</button></div>`}
   <div class="big2"><button class="big" id="vcod" ${r.cod_holding>0?'':'style="opacity:.6"'}>💸 Nộp COD về công ty</button><button class="big o" id="vdep">🔐 Nộp ký quỹ</button></div>
   <div class="card" style="margin-top:12px"><b>Lịch sử ví</b>${(tx||[]).map(t=>`<div class="li"><div class="row"><b>${K[t.kind]||t.kind}</b><span style="flex:1"></span><b>${['cod_thu','ky_quy_nop','thuong','cod_ck_cty'].includes(t.kind)?'+':'−'}${fmtN(t.amount)}</b></div><div class="small">${fmtDT(t.created_at)} · ${t.method==='tien_mat'?'Tiền mặt':t.method==='chuyen_khoan'?'Chuyển khoản':''} <span class="pill ${SS[t.status][1]}">${SS[t.status][0]}</span>${t.reject_reason?' · '+esc(t.reject_reason):''}<br>${esc(t.note||'')}</div></div>`).join('')||'<div class="empty">Chưa có giao dịch.</div>'}</div>
   <div class="card"><b>Tài khoản nhận tiền của tôi</b><div class="small" style="margin:6px 0">Dùng để công ty chuyển lương, hoàn ký quỹ, thưởng.</div>
    ${(mine||[]).map(a=>`<div class="li">${esc(BANKS[a.bank_bin]||a.bank_name||'')} · <b>${esc(a.account_no)}</b> · ${esc(a.account_name)}${qrUrl(a)?`<img src="${qrUrl(a,0,'')}" style="width:120px;display:block;margin-top:6px">`:''}</div>`).join('')}
    <label class="f">Ngân hàng<select class="in" id="mbk">${Object.entries(BANKS).sort((a,b)=>a[1].localeCompare(b[1])).map(([k,v])=>`<option value="${k}" ${k==='970436'?'selected':''}>${v}</option>`).join('')}</select></label>
    <label class="f">Số tài khoản<input class="in" id="mac" inputmode="numeric"></label><label class="f">Tên chủ tài khoản<input class="in" id="man" value="${esc((ME.full_name||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toUpperCase())}"></label>
    <button class="big o" id="msv">Lưu tài khoản</button></div></div>`;
  // cam kết
  if(!r.commit_ok){let f=null;const ok=()=>{$('#cms').disabled=!(f&&$('#cmk').checked&&$('#cmn').value.trim())};
    $('#cmf').onchange=e=>{f=e.target.files[0];$('#cmp').innerHTML=f?`<img src="${URL.createObjectURL(f)}">`:'';ok()};$('#cmk').onchange=ok;$('#cmn').oninput=ok;
    $('#cms').onclick=async()=>{$('#cms').disabled=true;try{const u=await upPhoto(f,`person/${ME.id}/cam_ket_cod_${Date.now()}.jpg`);
      await sb.from('khg_files').insert({entity_type:'person',entity_id:ME.id,doc_type:'cam_ket',file_path:u.path,file_name:'cam-ket-cod.jpg',mime:'image/jpeg',size_bytes:u.size,uploaded_by:ME.id,note:'Ảnh chân dung ký cam kết COD'});
      const {error}=await sb.rpc('khg_cod_commit',{p_name:$('#cmn').value.trim(),p_photo:u.path});if(error)throw error;toast('✔ Đã ký cam kết COD');go('vi')}catch(e){toast(e.message);$('#cms').disabled=false}}}
  // nộp tiền
  const pay=(kind)=>{const amt0=kind==='cod_nop'?Number(r.cod_holding)||0:0;const ref=(kind==='cod_nop'?'COD ':'KYQUY ')+phone;let method='chuyen_khoan';
    sheet(`<h2>${kind==='cod_nop'?'💸 Nộp tiền COD về công ty':'🔐 Nộp ký quỹ'}</h2>
     <label class="f">Số tiền<input class="in" id="pa" type="number" inputmode="numeric" value="${amt0||''}"></label>
     <div class="seg2"><button class="on" data-m="chuyen_khoan">🏦 Chuyển khoản (QR)</button><button data-m="tien_mat">💵 Tiền mặt cho kế toán</button></div>
     <div id="pq"></div>
     <label class="big o" style="display:block;text-align:center">📷 Chụp biên lai CK / phiếu thu (bắt buộc)<input id="pf" type="file" accept="image/*" capture="environment" class="hidden"></label><div id="pp" class="thumbs" style="margin:8px 0"></div>
     <label class="f">Ghi chú<input class="in" id="pn" placeholder="VD: nộp COD các đơn ngày 22/10"></label>
     <div class="acts"><button class="big g" id="pok" disabled>Gửi xác nhận</button><button class="big o" id="pno">Đóng</button></div>`);
    let f=null;const drawQ=async()=>{$('#pq').innerHTML=method==='chuyen_khoan'?await qrBlock(kind==='cod_nop'?'cod':'ky_quy',Number($('#pa').value)||0,ref):'<div class="small">Nộp tiền mặt trực tiếp cho kế toán / điều phối, chụp phiếu thu có chữ ký người nhận.</div>'};
    document.querySelectorAll('.seg2 button').forEach(b=>b.onclick=()=>{method=b.dataset.m;document.querySelectorAll('.seg2 button').forEach(x=>x.classList.toggle('on',x===b));drawQ()});
    let t;$('#pa').oninput=()=>{clearTimeout(t);t=setTimeout(drawQ,400)};drawQ();
    $('#pf').onchange=e=>{f=e.target.files[0];$('#pp').innerHTML=f?`<img src="${URL.createObjectURL(f)}">`:'';$('#pok').disabled=!f};$('#pno').onclick=closeSheet;
    $('#pok').onclick=async()=>{const amt=Number($('#pa').value);if(!amt)return toast('Nhập số tiền');$('#pok').disabled=true;
      try{const u=await upPhoto(f,`person/${ME.id}/vi/${kind}_${Date.now()}.jpg`);const {error}=await sb.rpc('khg_wallet_submit',{p_kind:kind,p_amount:amt,p_method:method,p_proof:u.path,p_note:$('#pn').value||null,p_order_ids:null});if(error)throw error;
        toast('Đã gửi, chờ kế toán xác nhận');closeSheet();go('vi')}catch(e){toast(e.message);$('#pok').disabled=false}}};
  $('#vcod').onclick=()=>pay('cod_nop');$('#vdep').onclick=()=>pay('ky_quy_nop');
  $('#msv').onclick=async()=>{const acc=$('#mac').value.replace(/\s/g,'');if(acc.length<6)return toast('Nhập số tài khoản');const {error}=await sb.from('khg_pay_accounts').insert({owner_type:'nhan_su',person_id:ME.id,bank_bin:$('#mbk').value,bank_name:BANKS[$('#mbk').value],account_no:acc,account_name:$('#man').value.trim().toUpperCase(),purpose:'luong',label:'TK của '+ME.full_name});toast(error?error.message:'Đã lưu');if(!error)go('vi')};
};
V.toi=async m=>{
  const p=ME;

   <div class="card"><b>Dùng như app</b><div class="small" style="margin-top:6px">Android (Chrome): menu ⋮ → <b>Thêm vào màn hình chính</b>.<br>iPhone (Safari): nút Chia sẻ → <b>Thêm vào MH chính</b>.<br>Bật thông báo để nhận đơn khi app đang mở; Telegram bot @khg_dieuphoi_bot báo cả khi đóng app (gửi <code>/link ${esc(p.phone||'số_điện_thoại')}</code>).</div>
   <button class="big" style="margin-top:10px" onclick="KInstall.open()">📲 Cài app lên màn hình chính</button><button class="big o" id="np" style="margin-top:8px">🔔 Bật thông báo</button></div>
   <div class="card"><b>Đổi mật khẩu</b><label class="f" style="margin-top:8px">Mật khẩu mới<input class="in" id="pw" type="password" minlength="6"></label><button class="big o" id="pws">Đổi mật khẩu</button></div>
   <button class="big d" id="lo">Đăng xuất</button>`;
  $('#np').onclick=async()=>{if(!('Notification' in window))return toast('Trình duyệt không hỗ trợ');const r=await Notification.requestPermission();toast(r==='granted'?'Đã bật thông báo':'Chưa cho phép thông báo')};
  $('#pws').onclick=async()=>{const v=$('#pw').value;if(v.length<6)return toast('Tối thiểu 6 ký tự');const {error}=await sb.auth.updateUser({password:v});toast(error?error.message:'Đã đổi mật khẩu')};

};

(async()=>{const {data}=await sb.auth.getSession();if(data&&data.session)start();else $('#login').classList.remove('hidden')})();

<script>
// ===== KInstall: cài app lên màn hình chính (Android, iPhone, máy tính) =====
(function(){
  const ua=navigator.userAgent||'';
  const isIOS=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(ua);
  const inApp=/Zalo|FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\/|TikTok|musical_ly|ZaloTheme/i.test(ua);
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  let deferred=null;
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/khg-sw.js',{scope:'/'}).catch(()=>{}));
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;show()});
  window.addEventListener('appinstalled',()=>{try{localStorage.setItem('khg_installed','1')}catch(e){}hide()});
  const css=`#kins{position:fixed;left:10px;right:10px;bottom:calc(132px + env(safe-area-inset-bottom));z-index:120;background:#111827;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:520px;margin:0 auto}
#kins img{width:40px;height:40px;border-radius:10px}#kins b{display:block;font-size:15px}#kins .x{background:none;border:0;color:#9CA3AF;font-size:20px;padding:4px}
#kins .go{background:#C8102E;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800;white-space:nowrap}
#kinsg{position:fixed;inset:0;z-index:130;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#kinsg .bx{background:#fff;color:#111;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#kinsg ol{padding-left:20px;margin:8px 0}#kinsg li{margin:8px 0}#kinsg .k{display:inline-block;border:1px solid #ddd;border-radius:6px;padding:0 6px;background:#f6f6f6}
#kinsg button{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;margin-top:8px}#kinsg .p{background:#C8102E;color:#fff}#kinsg .o{background:#f1f1f1}`;
  const icon=(document.querySelector('link[rel=apple-touch-icon]')||{}).href||'';
  const name=(document.querySelector('meta[name=apple-mobile-web-app-title]')||{}).content||'KHG';
  function ensureCss(){if(!document.getElementById('kins-css')){const s=document.createElement('style');s.id='kins-css';s.textContent=css;document.head.appendChild(s)}}
  function hide(){document.getElementById('kins')?.remove()}
  function show(force){
    if(standalone)return;
    try{if(!force&&(localStorage.getItem('khg_ins_hide')>Date.now()||localStorage.getItem('khg_installed')))return}catch(e){}
    ensureCss();
    hide();const d=document.createElement('div');d.id='kins';
    d.innerHTML=`${icon?`<img src="${icon}" alt="">`:''}<div style="flex:1"><b>Cài “${name}” lên màn hình chính</b>${inApp?'Đang mở trong Zalo/Facebook – mở bằng trình duyệt để cài':'Mở nhanh như app, nhận chuông báo'}</div><button class="go">Cài app</button><button class="x" aria-label="Đóng">✕</button>`;
    document.body.appendChild(d);
    d.querySelector('.x').onclick=()=>{try{localStorage.setItem('khg_ins_hide',Date.now()+3*864e5)}catch(e){}hide()};
    d.querySelector('.go').onclick=()=>KInstall.open();
  }
  function guide(html){ensureCss();document.getElementById('kinsg')?.remove();const g=document.createElement('div');g.id='kinsg';g.innerHTML=`<div class="bx">${html}<button class="o" id="kgc">Đóng</button></div>`;
    document.body.appendChild(g);g.onclick=e=>{if(e.target.id==='kinsg')g.remove()};document.getElementById('kgc').onclick=()=>g.remove()}
  window.KInstall={
    standalone,isIOS,isAndroid,inApp,show:()=>show(true),
    async open(){
      const url=location.href.split('#')[0];
      if(inApp){
        const intent=`intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;end`;
        guide(`<h3 style="margin:0 0 6px">Mở bằng trình duyệt để cài app</h3><p>Zalo / Facebook không cho cài app. Hãy mở link này bằng ${isIOS?'<b>Safari</b>':'<b>Chrome</b>'}:</p>
          <ol><li>Bấm nút <span class="k">⋯</span> hoặc <span class="k">⋮</span> ở góc trên.</li><li>Chọn <b>Mở bằng trình duyệt</b> / <b>Open in ${isIOS?'Safari':'Chrome'}</b>.</li><li>Trong trình duyệt, bấm lại <b>Cài app</b>.</li></ol>
          ${isAndroid?`<a href="${intent}"><button class="p">Mở bằng Chrome</button></a>`:''}<button class="o" id="kcp">📋 Sao chép link</button>`);
        document.getElementById('kcp').onclick=()=>{navigator.clipboard?.writeText(url);document.getElementById('kcp').textContent='Đã sao chép – dán vào '+(isIOS?'Safari':'Chrome')};return}
      if(deferred){deferred.prompt();const r=await deferred.userChoice;deferred=null;if(r.outcome==='accepted')hide();return}
      if(isIOS){guide(`<h3 style="margin:0 0 6px">Cài lên iPhone / iPad</h3><ol><li>Mở trang này bằng <b>Safari</b>.</li><li>Bấm nút <b>Chia sẻ</b> <span class="k">⬆︎</span> ở thanh dưới (hoặc trên).</li><li>Kéo xuống, chọn <b>Thêm vào MH chính</b> (Add to Home Screen).</li><li>Bấm <b>Thêm</b>. Biểu tượng ${name} xuất hiện trên màn hình chính.</li></ol><p style="font-size:13px;color:#666">Mở app từ biểu tượng để nhận thông báo (iOS 16.4 trở lên).</p>`);return}
      guide(`<h3 style="margin:0 0 6px">Cài lên ${isAndroid?'điện thoại Android':'máy tính'}</h3><ol>${isAndroid?'<li>Mở bằng <b>Chrome</b>.</li><li>Bấm <span class="k">⋮</span> góc phải trên.</li><li>Chọn <b>Cài đặt ứng dụng</b> / <b>Thêm vào màn hình chính</b>.</li><li>Bấm <b>Cài đặt</b>.</li>':'<li>Mở bằng Chrome hoặc Edge.</li><li>Bấm biểu tượng <b>Cài đặt</b> ⊕ ở cuối thanh địa chỉ.</li><li>Bấm <b>Cài đặt</b> – app mở thành cửa sổ riêng, ghim vào thanh tác vụ.</li>'}</ol>`);
    }
  };
  // hiện gợi ý sau 4 giây trên điện thoại
  if(/[?&]install=1/.test(location.search)&&!standalone)setTimeout(()=>KInstall.open(),900);
  else if(!standalone&&(isIOS||isAndroid||inApp))setTimeout(()=>show(false),4000);
})();
</script>
</body></html>
