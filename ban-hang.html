async function shrink(file,max=1600){
  if(!/^image\//.test(file.type)||/gif|svg/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file}catch(e){return file}}
const safeName=n=>String(n||'file').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w.-]+/g,'-').slice(-60);
async function putFile(prefix,file){const f=await shrink(file);const path=`${prefix}/${Date.now()}-${safeName(f.name)}`;
  const {error}=await sb.storage.from('khg-files').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(error)throw new Error(error.message);return {path,name:f.name,mime:f.type,size:f.size}}
async function signedMap(paths){if(!paths.length)return {};const {data}=await sb.storage.from('khg-files').createSignedUrls(paths,3600);const m={};(data||[]).forEach(x=>{if(x.signedUrl)m[x.path]=x.signedUrl});return m}
async function fileGrid(files){const u=await signedMap(files.map(f=>f.file_path));return `<div class="files">${files.map(f=>{const url=u[f.file_path]||'#';return `<a href="${url}" target="_blank" rel="noopener">${/^image/.test(f.mime||'')||/\.(jpe?g|png|webp)$/i.test(f.file_path)?`<img src="${url}" alt="" loading="lazy">`:`<div class="x">${esc((f.file_path.split('.').pop()||'').toUpperCase())}</div>`}<span>${esc(DOCT[f.doc_type]||f.doc_type)}</span></a>`}).join('')}</div>`}

// ================= Chuông báo lớn, kêu lặp + rung + thông báo hệ thống =================
const KRing=(()=>{let ac=null,timer=null,el=null,cnt=0;
  const unlock=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}};
  ['touchstart','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
  const beep=()=>{if(!ac)return;try{const t=ac.currentTime;[[988,0],[740,.2],[988,.4],[740,.6],[1175,.8]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.7,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.19)})}catch(e){}};
  function stop(){clearInterval(timer);timer=null;if(el){el.remove();el=null}try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
  function start(title,body,onOpen){stop();unlock();el=document.createElement('div');el.className='kring';
    el.innerHTML=`<div class="kr-bx"><div class="kr-ic">🔔</div><b>${esc(title||'Có thông báo mới')}</b><p>${esc(body||'')}</p><button class="btn p w" data-o>Xem ngay</button><button class="btn g w" data-x style="margin-top:8px">Tắt chuông</button></div>`;
    document.body.appendChild(el);el.querySelector('[data-o]').onclick=()=>{stop();onOpen&&onOpen()};el.querySelector('[data-x]').onclick=stop;
    cnt=0;beep();try{navigator.vibrate&&navigator.vibrate([500,200,500,200,900])}catch(e){}
    timer=setInterval(()=>{beep();cnt++;if(cnt%2===0)try{navigator.vibrate&&navigator.vibrate([500,200,500])}catch(e){}if(cnt>80)stop()},1500);
    try{if('Notification' in window&&Notification.permission==='granted'&&document.visibilityState!=='visible'){const o={body:body||'',vibrate:[500,200,500],requireInteraction:true,tag:'khg-ring',renotify:true};
      (navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration():Promise.resolve(null)).then(r=>r?r.showNotification(title,o):new Notification(title,o)).catch(()=>{})}}catch(e){}}
  function askNotif(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
  // theo dõi tín hiệu mới (khg_ping) và rung chuông khi có thay đổi
  function watch(onOpen,onCount,ms=20000){let last=null;const key='kring_k_'+location.pathname;try{const v=localStorage.getItem(key);last=v?Number(v):null}catch(e){}
    const tick=async()=>{try{const {data:p}=await sb.rpc('khg_ping');if(!p)return;onCount&&onCount(p.n||0);
      if(last!==null&&Number(p.k)>last)start(p.msg||'Có thông báo mới',p.n?('Bạn có '+p.n+' mục cần xem'):'',onOpen);
      last=Number(p.k);try{localStorage.setItem(key,String(last))}catch(e){}}catch(e){}};
    tick();setInterval(tick,ms);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick()});
    document.addEventListener('pointerdown',function f(){askNotif();document.removeEventListener('pointerdown',f)},{once:true})}
  return {start,stop,watch,askNotif,unlock}})();

  const last=p.state||p.city||'';return {main,sub:parts.join(', ')+newOf(last),lat:c[1],lng:c[0],kind:OSMV[p.osm_value]||KIND[p.type]||'Địa điểm',prov:p.type==='state'||(p.type==='city'&&!p.street)}}

  const r=await fetch(u,{signal});const j=await r.json();return (j.features||[]).filter(f=>(f.properties||{}).countrycode==='VN'||!(f.properties||{}).countrycode).map(fromPhoton).filter(x=>x.main)}
async function nomi(q,signal){const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=vn&accept-language=vi&addressdetails=1&q=${encodeURIComponent(q)}`,{signal});const j=await r.json();
  return (j||[]).map(x=>{const a=x.address||{};const nm=x.name||(x.display_name||'').split(',')[0];const st=a.state||a.city||'';return {main:nm,sub:(x.display_name||'').split(',').slice(1,4).join(',').trim()+newOf(st),lat:+x.lat,lng:+x.lon,kind:OSMV[x.type]||'Địa điểm'}})}

async function search(q){const key=N(q);if(cache.has(key))return cache.get(key);if(ctl)ctl.abort();ctl=new AbortController();const sig=ctl.signal;

  if(!R.length&&key.length>=4){try{R=await nomi(q,sig)}catch(e){if(e.name==='AbortError')throw e}}
  const seen=new Set(L.map(x=>N(x.main)));const all=[...L,...R.filter(x=>{const k=N(x.main+' '+x.sub);if(seen.has(k)||(x.prov&&L.some(l=>N(l.main)===N(x.main))))return false;seen.add(k);return true})].slice(0,8);

function camSession({facing='user',title='',oval='face'}){
  return new Promise(async(res,rej)=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return rej(new Error(camErr));
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false})}catch(e){return rej(new Error(camErr))}
    const d=document.createElement('div');d.className='kcam';
    d.innerHTML=`<div class="kcam-top"><b>${esc(title)}</b><button class="kx" aria-label="Đóng">✕</button></div><div class="kcam-v"><video playsinline autoplay muted class="${facing==='user'?'mir':''}"></video><div class="kcam-oval ${oval==='doc'?'doc':''}"></div><div class="kcam-msg"></div><div class="kcam-cd"></div><div class="kcam-shots"></div></div><div class="kcam-bot"></div>`;
    document.body.appendChild(d);const video=d.querySelector('video');video.srcObject=stream;
    const close=()=>{stream.getTracks().forEach(t=>t.stop());d.remove()};
    d.querySelector('.kx').onclick=()=>{close();d._cancel&&d._cancel()};
    await new Promise(r=>{video.onloadedmetadata=()=>r();setTimeout(r,2500)});try{await video.play()}catch(e){}
    res({d,video,close,mirror:facing==='user',msg:t=>d.querySelector('.kcam-msg').textContent=t,cd:t=>d.querySelector('.kcam-cd').textContent=t,bot:h=>{d.querySelector('.kcam-bot').innerHTML=h;return d.querySelector('.kcam-bot')}});
  });
}
function grab(S,label){const v=S.video,w=v.videoWidth||640,h=v.videoHeight||480,k=Math.min(1,1280/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);

  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,c.height-30,c.width,30);g.fillStyle='#fff';g.font='15px sans-serif';g.fillText('KHG · '+(label||'')+' · '+new Date().toLocaleString('vi-VN'),10,c.height-10);

function signPad(name){return new Promise(res=>{const d=document.createElement('div');d.className='ksig';
  d.innerHTML=`<div class="hd2">✍️ Ký tên – ${esc(name||'')}<div class="note">Ký bằng ngón tay hoặc bút cảm ứng trong khung bên dưới</div></div><div class="pad"><canvas></canvas><div class="ln"><span>Chữ ký</span></div></div>
   <div class="ft"><button class="btn g" data-c>Xóa ký lại</button><button class="btn g" data-x>Hủy</button><button class="btn p" data-ok style="flex:1">Xác nhận chữ ký</button></div>`;
  document.body.appendChild(d);const pad=d.querySelector('.pad'),c=d.querySelector('canvas');const dpr=window.devicePixelRatio||1;
  const fit=()=>{c.width=pad.clientWidth*dpr;c.height=pad.clientHeight*dpr;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)};fit();
  const g=c.getContext('2d');let drawing=false,last=null,len=0,minX=1e9,minY=1e9,maxX=0,maxY=0;
  const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]};
  c.onpointerdown=e=>{drawing=true;last=pt(e);c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!drawing)return;const p=pt(e);g.strokeStyle='#0B2A6B';g.lineWidth=2.6*dpr;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();
    len+=Math.hypot(p[0]-last[0],p[1]-last[1]);minX=Math.min(minX,p[0]);minY=Math.min(minY,p[1]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1]);last=p};
  c.onpointerup=c.onpointercancel=()=>{drawing=false};
  d.querySelector('[data-c]').onclick=()=>{fit();len=0;minX=minY=1e9;maxX=maxY=0};
  d.querySelector('[data-x]').onclick=()=>{d.remove();res(null)};
  d.querySelector('[data-ok]').onclick=()=>{if(len<120*dpr)return toast('Chữ ký quá ngắn – ký rõ họ tên hoặc chữ ký thường dùng');
    const pd=16*dpr,x=Math.max(0,minX-pd),y=Math.max(0,minY-pd),w=Math.min(c.width,maxX+pd)-x,h=Math.min(c.height,maxY+pd)-y;const o=document.createElement('canvas');o.width=w;o.height=h+26*dpr;
    const og=o.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,o.width,o.height);og.drawImage(c,x,y,w,h,0,0,w,h);og.fillStyle='#555';og.font=(11*dpr)+'px sans-serif';og.fillText((name||'')+' · '+new Date().toLocaleString('vi-VN'),6*dpr,h+18*dpr);
    o.toBlob(b=>{d.remove();res(b)},'image/png')};
})}

KYC.render=async(host,ctx)=>{

  const thumbs=Object.values(by).flat().filter(x=>/\.(jpe?g|png|webp)$/i.test(x.file_path));const urls=await signedMap(thumbs.map(x=>x.file_path));
  const st=KYC_ST[K.kyc_status]||KYC_ST.chua_nop;const n=K.items.length,ok=n-K.missing;
  const groups={};K.items.forEach(x=>(groups[x.g]=groups[x.g]||[]).push(x));
  const actBtn=x=>{if(x.k==='ky')return x.ok?`<button class="btn g s" data-sign>Ký lại</button>`:`<button class="btn p s" data-sign>✍️ Ký</button>`;
    if(x.k==='selfie_xac_thuc')return `<button class="btn ${x.ok?'g':'p'} s" data-live>🙂 ${x.ok?'Làm lại':'Xác thực'}</button>`;
    if(x.doc)return `<button class="btn ${x.ok?'g':'p'} s" data-cam="${x.k}">📷 Chụp</button><button class="btn g s" data-up="${x.k}">🖼 Tải lên</button>`;
    return ctx.actions[x.k]?`<button class="btn ${x.ok?'g':'p'} s" data-go="${x.k}">${x.ok?'Sửa':'Nhập'}</button>`:''};
  const alias={cccd_truoc:['cccd'],bang_lai_truoc:['bang_lai']};
  const nx=K.items.find(x=>!x.ok);const stepN=K.items.indexOf(nx)+1;
  host.innerHTML=(nx&&['chua_nop','bo_sung',null,undefined].includes(K.kyc_status)?`<div class="next"><small>Bước ${K.items.length-K.missing+1}/${K.items.length} · còn ${K.missing} bước</small><b>${esc(nx.l)}</b><div class="a" style="display:flex;gap:8px;flex-wrap:wrap">${actBtn(nx).replace(/btn g s|btn p s/g,'btn')}</div></div>`:
    K.complete&&['chua_nop','bo_sung',null,undefined].includes(K.kyc_status)?`<div class="next"><small>Đã đủ ${K.items.length}/${K.items.length} bước</small><b>Bấm nộp hồ sơ để KHG duyệt</b><button class="btn" id="kSub2">📨 Nộp hồ sơ ngay</button></div>`:'')+`<div class="card"><h2>🛡️ Hồ sơ pháp lý & xác thực</h2>
    <div class="kst ${st[1]}"><div><b>${st[0]}</b>${K.kyc_note?esc(K.kyc_note):K.kyc_status==='chua_nop'?'Hoàn thiện đủ các mục dưới đây rồi bấm “Nộp hồ sơ”. KHG chỉ duyệt khi hồ sơ đầy đủ.':K.kyc_status==='cho_duyet'?'KHG sẽ kiểm tra ảnh, giấy tờ và gọi xác nhận trong 1–2 ngày làm việc.':''}</div></div>
    <div style="display:flex;justify-content:space-between;font-size:13px"><span>Đã hoàn thành ${ok}/${n} mục</span><b>${Math.round(ok*100/n)}%</b></div><div class="kbar"><i style="width:${ok*100/n}%"></i></div>
    ${Object.entries(groups).map(([g,a])=>`<div class="kg">${esc(g)}</div>`+a.map(x=>{const fs=[...(by[x.k]||[]),...((alias[x.k]||[]).flatMap(k=>by[k]||[]))].filter(f=>urls[f.file_path]).slice(0,6);
      return `<div class="ki"><div class="c ${x.ok?'ok':'no'}">${x.ok?'✓':'!'}</div><div class="t"><b>${esc(x.l)}</b>${fs.length?`<div class="kthumbs">${fs.map(f=>`<a href="${urls[f.file_path]}" target="_blank"><img src="${urls[f.file_path]}" alt=""></a>`).join('')}</div>`:''}</div><div class="a">${actBtn(x)}</div></div>`}).join('')).join('')}
    ${K.signed.length?`<div class="kg">Văn bản đã ký</div>${K.signed.map(s=>`<div class="note">• ${esc(s.title)} (v${esc(s.version)}) – ${fmtDT(s.signed_at)} ${pill({hieu_luc:'Hiệu lực',thay_the:'Đã thay thế',thu_hoi:'Thu hồi'},s.status,{hieu_luc:'green'})}<div class="khash">${esc(s.doc_hash)}</div></div>`).join('')}`:''}
    <div class="btns">${['chua_nop','bo_sung'].includes(K.kyc_status)||!K.kyc_status?`<button class="btn ${K.complete?'p':'g'} w" id="kSub" ${K.complete?'':'disabled'}>${K.complete?'📨 Nộp hồ sơ cho KHG duyệt':'Còn '+K.missing+' mục chưa hoàn thành'}</button>`:''}</div>
    <p class="note">Ảnh xác thực khuôn mặt, chữ ký và chân dung khi ký được chụp trực tiếp, đóng dấu thời gian và không thể xóa/sửa. Thông tin chỉ dùng cho xét duyệt, thanh toán và nghĩa vụ pháp lý (Nghị định 13/2023/NĐ-CP).</p></div>`;
  host.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>ctx.actions[b.dataset.go]());
  host.querySelectorAll('[data-sign]').forEach(b=>b.onclick=()=>KYC.signFlow(ctx,K));
  host.querySelectorAll('[data-live]').forEach(b=>b.onclick=()=>busy(b,async()=>{let fr;try{fr=await liveness()}catch(e){return toast(e.message,6000)}if(!fr)return;
    const pos=await getPos(6000);for(const [i,f] of fr.entries())await KYC.upload(ctx,'selfie_xac_thuc',f.blob,`xac-thuc-${i+1}-${safeName(f.label)}.jpg`,pos);toast('Đã lưu ảnh xác thực khuôn mặt');await ctx.onChange()}));
  host.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>busy(b,async()=>{const k=b.dataset.cam;let bl;try{bl=await docShot(DOCT[k]||k)}catch(e){
      return pickFiles('image/*',false,files=>busy(b,async()=>{const pos=await getPos(5000);for(const f of files)await KYC.upload(ctx,k,f,f.name,pos);toast('Đã lưu '+(DOCT[k]||k));await ctx.onChange()}),true)}
    if(!bl)return;const pos=await getPos(5000);await KYC.upload(ctx,k,bl,k+'.jpg',pos);toast('Đã lưu '+(DOCT[k]||k));await ctx.onChange()}));
  host.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>pickFiles('image/*,application/pdf',true,files=>busy(b,async()=>{const k=b.dataset.up;for(const f of files)await KYC.upload(ctx,k,f,f.name,null);toast('Đã tải lên '+(DOCT[k]||k));await ctx.onChange()})));
  const sb3=host.querySelector('#kSub2');if(sb3)sb3.onclick=()=>busy(sb3,async()=>{await rpc('khg_kyc_submit');toast('Đã nộp hồ sơ – KHG sẽ xét duyệt và báo trên app',4000);await ctx.onChange()});
  const sb2=host.querySelector('#kSub');if(sb2)sb2.onclick=()=>busy(sb2,async()=>{await rpc('khg_kyc_submit');toast('Đã nộp hồ sơ – KHG sẽ xét duyệt và báo trên app',4000);await ctx.onChange()});
  return K;
};

// Hộp thư: thông báo, vi phạm, văn bản đã ký, hợp đồng, quy trình
KYC.badge=async()=>{try{const I=await rpc('khg_ext_inbox');return I.notices.filter(n=>!n.read).length+I.violations.filter(v=>v.status==='moi').length}catch(e){return 0}};
KYC.inbox=async(host,ctx)=>{const I=await rpc('khg_ext_inbox');let tab=ctx.tab||'tb';
  const draw=async()=>{const unread=I.notices.filter(n=>!n.read).length,vopen=I.violations.filter(v=>v.status==='moi').length;
    host.innerHTML=`<h1 class="pg">Thông báo & tuân thủ</h1><div class="seg"><button data-t="tb" class="${tab==='tb'?'on':''}">Thông báo${unread?' ('+unread+')':''}</button><button data-t="vp" class="${tab==='vp'?'on':''}">Vi phạm${vopen?' ('+vopen+')':''}</button><button data-t="hd" class="${tab==='hd'?'on':''}">Hợp đồng</button><button data-t="qt" class="${tab==='qt'?'on':''}">Quy trình</button></div><div id="kib"></div>`;
    host.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});const w=host.querySelector('#kib');
    if(tab==='tb'){w.innerHTML=`<div class="list">${I.notices.map(n=>`<div class="it nt ${n.read?'':'unread'} ${n.kind==='vi_pham'?'vp':''}"><div class="t"><b>${esc(n.title)}</b><span class="note">${fmtDT(n.at)}</span></div>${n.body?`<div class="m">${esc(n.body)}</div>`:''}${n.link?`<div class="m"><a href="${esc(n.link)}">Mở</a></div>`:''}</div>`).join('')||'<div class="empty">Chưa có thông báo.</div>'}</div>`;
      const ids=I.notices.filter(n=>!n.read).map(n=>n.id);if(ids.length){rpc('khg_ext_notice_read',{p_ids:ids}).then(()=>{I.notices.forEach(n=>n.read=true);ctx.onRead&&ctx.onRead()}).catch(()=>{})}}
    if(tab==='vp'){const ev=I.violations.flatMap(v=>v.evidence||[]);const u=await signedMap(ev);
      w.innerHTML=`<p class="note">KHG ghi nhận vi phạm kèm bằng chứng. Bạn có 48 giờ để phản hồi. Khoản phạt đã xử lý được khấu trừ vào kỳ đối soát/thanh toán.</p><div class="list">${I.violations.map(v=>`<div class="it nt vp"><div class="t"><b>${esc(v.code)} · ${esc(VIO_KIND[v.kind]||v.kind)}</b>${pill(Object.fromEntries(Object.entries(VIO_ST).map(([k,a])=>[k,a[0]])),v.status,Object.fromEntries(Object.entries(VIO_ST).map(([k,a])=>[k,a[1]])))}</div>
        <div class="m">${pill(Object.fromEntries(Object.entries(VIO_SEV).map(([k,a])=>[k,a[0]])),v.severity,Object.fromEntries(Object.entries(VIO_SEV).map(([k,a])=>[k,a[1]])))} ${fmtDT(v.at)}${v.plate?' · Xe '+esc(v.plate):''}${v.order_code?' · Đơn '+esc(v.order_code):''}</div><div class="m">${esc(v.description)}</div>
        ${Number(v.amount)>0?`<div class="m"><b style="color:var(--red)">Mức phạt: ${fmtM(v.amount)}</b>${v.deduct?' – khấu trừ khi đối soát':''}</div>`:''}${(v.evidence||[]).length?`<div class="kthumbs">${v.evidence.map(p=>u[p]?`<a href="${u[p]}" target="_blank"><img src="${u[p]}"></a>`:'').join('')}</div>`:''}
        ${v.reply?`<div class="m"><i>Bạn phản hồi:</i> ${esc(v.reply)}</div>`:''}${v.resolution?`<div class="m"><i>KHG kết luận:</i> ${esc(v.resolution)}</div>`:''}
        ${['moi','da_phan_hoi'].includes(v.status)?`<div class="btns"><button class="btn g s" data-rp="${v.id}">💬 ${v.reply?'Bổ sung phản hồi':'Phản hồi / giải trình'}</button></div>`:''}</div>`).join('')||'<div class="empty">Không có vi phạm. Cảm ơn bạn đã tuân thủ quy trình! 👍</div>'}</div>`;
      w.querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{const t=prompt('Nội dung phản hồi / giải trình:');if(!t)return;busy(b,async()=>{await rpc('khg_violation_reply',{p_id:b.dataset.rp,p_text:t});toast('Đã gửi phản hồi cho KHG');const J=await rpc('khg_ext_inbox');Object.assign(I,J);draw()})})}
    if(tab==='hd'){const c=I.contract;w.innerHTML=(c?`<div class="card"><h3>Hợp đồng nguyên tắc</h3><div class="m">Số: <b>${esc(c.contract_no||'–')}</b> · ${esc(c.status||'')}<br>Hiệu lực: ${fmtD(c.start_date)}${c.end_date?' – '+fmtD(c.end_date):''}${c.payment_terms?'<br>Thanh toán: '+esc(c.payment_terms):''}</div>${c.file_url?`<div class="btns"><a class="btn g s" href="${esc(c.file_url)}" target="_blank">📄 Xem hợp đồng</a></div>`:''}</div>`:'<div class="card"><h3>Hợp đồng nguyên tắc</h3><p class="note">KHG sẽ gửi hợp đồng sau khi hồ sơ được duyệt.</p></div>')+
      `<div class="card"><h3>Văn bản đã ký điện tử</h3>${I.agreements.map(a=>`<details style="margin-top:8px"><summary><b>${esc(a.title)}</b> · v${esc(a.version)} · ${fmtDT(a.signed_at)} ${pill({hieu_luc:'Hiệu lực',thay_the:'Đã thay thế',thu_hoi:'Thu hồi'},a.status,{hieu_luc:'green'})}</summary><div class="kdoc" style="margin-top:8px">${esc(a.body)}</div><p class="note">Người ký: ${esc(a.signer_name)} · Mã SHA-256:</p><div class="khash">${esc(a.doc_hash)}</div></details>`).join('')||'<p class="note">Chưa ký văn bản nào.</p>'}</div>`}
    if(tab==='qt'){w.innerHTML=`<div class="list">${I.policies.map(p=>`<details class="it"><summary><b>${esc(p.title)}</b> <span class="note">${esc(p.category||'')}</span></summary><div class="m" style="white-space:pre-wrap">${esc(p.content||'')}</div></details>`).join('')||'<div class="empty">KHG chưa công bố quy trình cho mục này.</div>'}</div>`}
  };await draw();
};

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const ST={nhap:'Nháp',cho_duyet:'Chờ duyệt',da_duyet:'Đã duyệt',dang_giao:'Đang giao',da_giao:'Đã giao',huy:'Hủy',tra_hang:'Trả hàng'};

async function login(msg){$('#nav').classList.add('hidden');$('#main').innerHTML=`<div class="card" style="margin-top:20px"><h2>Đăng nhập</h2>${msg?`<div class="err">${esc(msg)}</div>`:''}<label class="f">Số điện thoại hoặc email</label><input class="i" id="lU" inputmode="tel"><label class="f">Mật khẩu</label><input class="i" type="password" id="lP">
  <button class="btn p w" id="lG" style="margin-top:12px">Đăng nhập</button><p class="note">Dùng tài khoản do quản trị cấp trong CRM (Nhân sự → Tài khoản).</p></div>`;
  $('#lG').onclick=()=>busy($('#lG'),async()=>{const u=$('#lU').value.trim();const {error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:normPhone(u)+DOMAIN,password:$('#lP').value});if(error)return login('Sai tên đăng nhập hoặc mật khẩu');boot()})}
async function boot(){const {data:s}=await sb.auth.getSession();if(!s?.session)return login();const {data:a}=await sb.rpc('khg_my_access');if(!a)return login('Tài khoản chưa gắn hồ sơ nhân sự');ACC=a;
  const [{data:r},{data:pl}]=await Promise.all([sb.from('khg_dms_reps').select('*').eq('person_id',a.id).maybeSingle(),sb.from('khg_dms_price_lists').select('*').eq('active',true).order('priority')]);REP=r;PL=pl||[];
  $('#hN').textContent=(ACC.full_name||'')+(REP?' · '+REP.code:' · chưa gắn mã sale');$('#hOut').classList.remove('hidden');
  $('#nav').classList.remove('hidden');$('#nav').innerHTML=NAVS.map(([k,l,i])=>`<button data-n="${k}"><span style="font-size:18px">${i}</span>${l}</button>`).join('');$$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.n));await loadOut();go('home')}
async function loadOut(){let q=sb.from('khg_dms_outlets').select('*').neq('code','KHACHLE').order('name').limit(1000);if(REP)q=q.eq('rep_id',REP.id);const {data}=await q;OUT=data||[]}

async function home(){const m0=today().slice(0,8)+'01';let q=sb.from('khg_dms_orders').select('id,total,vat,status,outlet_id,order_date').gte('order_date',m0).in('status',['cho_duyet','da_duyet','dang_giao','da_giao']);if(REP)q=q.eq('rep_id',REP.id);

  const tg=Number(REP?.target_month||0);const d=new Date(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),fc=rev/d.getDate()*days;const td=(o||[]).filter(x=>x.order_date===today());
  const wd=['CN','T2','T3','T4','T5','T6','T7'][d.getDay()];const {data:rt}=REP?await sb.from('khg_dms_routes').select('*').eq('rep_id',REP.id):{data:[]};const todayR=(rt||[]).filter(r=>String(r.weekdays||'').toUpperCase().includes(wd));
  $('#main').innerHTML=`<div class="card"><h2 style="margin-top:0">Tháng ${d.getMonth()+1}</h2><div class="kp2"><div><small>Doanh số (chưa VAT)</small><b>${fmtN(rev)}</b></div><div><small>Chỉ tiêu</small><b>${tg?fmtN(tg):'—'}</b></div>
     <div><small>Đạt</small><b style="color:${tg&&rev>=tg?'var(--green)':'var(--acc)'}">${tg?Math.round(rev*100/tg)+'%':'—'}</b></div><div><small>Dự báo cuối tháng</small><b>${fmtN(fc)}</b></div></div>${tg?`<div class="bar2"><i style="width:${Math.min(100,rev*100/tg)}%"></i></div>`:''}
     <p class="note">Hôm nay: ${td.length} đơn · ${(v||[]).filter(x=>String(x.visited_at).slice(0,10)===today()).length} lượt ghé · tháng này ${(v||[]).length} lượt ghé, ${(o||[]).length} đơn, ${new Set((o||[]).map(x=>x.outlet_id)).size} điểm mua.</p></div>
   <div class="card"><h3 style="margin-top:0">Tuyến hôm nay (${wd})</h3>${todayR.length?todayR.map(r=>`<div class="ol"><b>${esc(r.name)}</b><small>${OUT.filter(x=>x.route_id===r.id).length} điểm bán · ${esc(r.area||'')}</small></div>`).join(''):'<div class="note">Chưa có tuyến cho hôm nay.</div>'}

  <label class="f">Địa chỉ *</label><input class="i" id="nA"><label class="f">Tỉnh / thành</label><input class="i" id="nPr" value="TP. Hồ Chí Minh"><label class="f">Kênh</label><select class="i" id="nC">${opt(CH,'tap_hoa')}</select>
  <label class="f">Hạng</label><select class="i" id="nT">${opt({A:'A – doanh số cao',B:'B – khá',C:'C – trung bình',D:'D – nhỏ'},'C')}</select><p class="note">Hệ thống lấy vị trí GPS hiện tại làm vị trí cửa hàng.</p><button class="btn p w" id="nGo">Lưu điểm bán</button>`);
  $('#nGo').onclick=()=>busy($('#nGo'),async()=>{if(!$('#nN').value.trim()||!$('#nP').value.trim()||!$('#nA').value.trim())return toast('Nhập tên, điện thoại, địa chỉ');const g=await gps();
    const {data,error}=await sb.from('khg_dms_outlets').insert({name:$('#nN').value.trim(),owner_name:$('#nO').value.trim(),phone:$('#nP').value.trim(),address:$('#nA').value.trim(),province:$('#nPr').value.trim(),channel:$('#nC').value,tier:$('#nT').value,status:'tiem_nang',rep_id:REP?.id||null,lat:g?.lat,lng:g?.lng}).select().single();
    if(error)throw new Error(error.message);OUT.unshift(data);closeSheet();toast('Đã tạo điểm bán');outlets()})}
function visit(o){sheet(`<h3>Ghé thăm: ${esc(o.name)}</h3><label class="f">Kết quả</label><select class="i" id="vR">${opt(VR,'co_don')}</select><label class="f">Tồn kho tại điểm / trưng bày</label><input class="i" id="vS"><label class="f">Ghi chú</label><textarea class="i" id="vN"></textarea><button class="btn p w" id="vGo" style="margin-top:10px">Check-in (lấy GPS)</button>`);
  $('#vGo').onclick=()=>busy($('#vGo'),async()=>{const g=await gps();const {error}=await sb.from('khg_dms_visits').insert({rep_id:REP?.id||null,outlet_id:o.id,lat:g?.lat,lng:g?.lng,result:$('#vR').value,stock_note:$('#vS').value,note:$('#vN').value,created_by:ACC.id});if(error)throw new Error(error.message);
    closeSheet();toast('Đã check-in'+(g?'':' (không lấy được GPS)'));if($('#vR').value==='co_don'){OSEL=o;CART={};go('order')}})}
async function order(){if(!OSEL){$('#main').innerHTML='<div class="card"><h3>Chọn điểm bán để đặt đơn</h3><button class="btn p w" onclick="go(\'out\')">Mở danh sách điểm bán</button></div>';return}
  const list=OSEL.price_list_id||PL.find(l=>l.kind==='si')?.id||null;CAT=await rpc('khg_pos_catalog',{p_wh:null,p_list:list});const pl=PL.find(l=>l.id===list);
  const draw=()=>{const q=($('#pQ')?.value||'').toLowerCase();const items=CAT.filter(p=>!q||(p.name+' '+p.sku).toLowerCase().includes(q));
    const totalV=Object.entries(CART).reduce((s,[id,qty])=>{const p=CAT.find(x=>x.id===id);return s+(p?Number(p.price)*qty:0)},0);
    $('#main').innerHTML=`<div class="card"><b>${esc(OSEL.name)}</b><div class="note">${esc(OSEL.address||'')} · Bảng giá: ${esc(pl?.name||'Giá sỉ niêm yết')}${pl&&!pl.vat_included?' (chưa VAT)':''}</div><button class="btn g s" onclick="OSEL=null;go('out')">Đổi điểm bán</button></div>
      <input class="i" id="pQ" placeholder="🔎 Tìm sản phẩm" value="${esc(q)}"><div class="card" style="margin-top:8px">${items.map(p=>`<div class="pr"><div><b>${esc(p.name)}</b><div class="note" style="margin:0">${esc(p.sku)} · ${fmtN(p.price)} đ/${esc(p.unit||'')} · tồn ${fmtN(p.stock)}</div></div><input data-q="${p.id}" inputmode="numeric" value="${CART[p.id]||''}" placeholder="0"></div>`).join('')||'<div class="empty">Không có sản phẩm.</div>'}</div>
      <label class="f">Ghi chú đơn</label><input class="i" id="pN" value="${esc(window._on||'')}"><label class="chk" style="margin-top:8px"><input type="checkbox" id="pD" checked> Cần KHG giao hàng</label>
      <div class="stk"><div style="flex:1"><small class="note">Tạm tính (chính sách chiết khấu tự áp khi lưu)</small><b style="display:block;font-size:19px;color:var(--acc)">${fmtN(totalV)} đ</b></div><button class="btn p" id="pGo">Gửi đơn</button></div>`;
    $('#pQ').oninput=()=>{const v=$('#pQ').value;draw();const e=$('#pQ');e.focus();e.setSelectionRange(v.length,v.length)};
    $$('[data-q]').forEach(i=>i.onchange=()=>{const v=parseFloat(i.value.replace(',','.'))||0;if(v>0)CART[i.dataset.q]=v;else delete CART[i.dataset.q];window._on=$('#pN').value;draw()});
    $('#pGo').onclick=()=>busy($('#pGo'),async()=>{const lines=Object.entries(CART).map(([id,qty])=>{const p=CAT.find(x=>x.id===id);const vi=pl?pl.vat_included:false;return {product_id:id,qty,unit_price:vi?Math.round(Number(p.price)/(1+Number(p.vat||0.08))):Number(p.price)}});
      if(!lines.length)return toast('Chưa nhập số lượng');const r=await rpc('khg_dms_order_save',{p:{outlet_id:OSEL.id,rep_id:REP?.id||'',status:'cho_duyet',delivery_requested:$('#pD').checked,note:$('#pN').value,lines}});
      toast(`Đã gửi đơn ${r.code} · ${fmtN(r.total)} đ – chờ duyệt`);CART={};window._on='';OSEL=null;go('orders')})};draw()}
async function orders(){let q=sb.from('khg_dms_orders').select('id,code,order_date,total,paid,status,outlet_id').order('created_at',{ascending:false}).limit(100);if(REP)q=q.eq('rep_id',REP.id);else q=q.eq('created_by',ACC.id);const {data}=await q;
  $('#main').innerHTML=`<h3>Đơn của tôi</h3>${(data||[]).map(o=>`<div class="ol"><b>${esc(o.code)} · ${fmtN(o.total)} đ <span class="pill">${ST[o.status]||o.status}</span></b><small>${esc(OUT.find(x=>x.id===o.outlet_id)?.name||'')} · ${fmtD(o.order_date)} · đã thu ${fmtN(o.paid)}</small></div>`).join('')||'<div class="empty">Chưa có đơn.</div>'}`}
async function debt(){const ids=OUT.map(o=>o.id);const {data}=await sb.from('khg_dms_ar').select('*');const L=(data||[]).filter(a=>ids.includes(a.outlet_id)&&a.sales-a.received>0).sort((a,b)=>(b.sales-b.received)-(a.sales-a.received));
  $('#main').innerHTML=`<h3>Công nợ điểm bán phụ trách</h3><div class="kp2"><div><small>Tổng còn nợ</small><b>${fmtN(L.reduce((s,a)=>s+a.sales-a.received,0))}</b></div><div><small>Quá hạn</small><b style="color:var(--acc)">${fmtN(L.reduce((s,a)=>s+Number(a.overdue||0),0))}</b></div></div>
   ${L.map(a=>`<div class="ol"><b>${esc(a.name)}</b><small>Còn nợ ${fmtN(a.sales-a.received)} đ${a.overdue>0?` · <span style="color:var(--acc)">quá hạn ${fmtN(a.overdue)}</span>`:''} · hạn mức ${fmtN(a.credit_limit)}</small></div>`).join('')||'<div class="empty">Không có công nợ.</div>'}<p class="note">Thu tiền: kế toán ghi phiếu thu trong CRM; tiền vào sổ quỹ và tự trừ công nợ.</p>`}
$('#hOut').onclick=async()=>{await sb.auth.signOut();location.reload()};
boot();
</script></body></html>
