<style>
:root{--red:#C8102E;--ink:#141414;--ink2:#3A3A3A;--muted:#6B6B6B;--bg:#F4F4F2;--card:#fff;--line:#E4E1DE;--green:#1E7A4C;--amber:#B5651D;--blue:#1C5FA8;--r:14px}

button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.hidden{display:none!important}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:50}
.hd{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.hd img{width:38px;height:38px;border-radius:10px;flex:none}

@media(min-width:900px){body{padding-bottom:24px}nav.bot{position:sticky;top:58px;bottom:auto;max-width:1100px;margin:0 auto;border:1px solid var(--line);border-radius:0 0 14px 14px}nav.bot button{flex-direction:row;justify-content:center;font-size:13.5px;padding:11px 6px}}

.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.list{display:grid;gap:10px}

.doc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}

.auth{max-width:460px;margin:0 auto}
.hp{position:absolute;left:-5000px;width:1px;height:1px;opacity:0}
.foot{max-width:1100px;margin:6px auto 0;padding:0 16px 22px;color:var(--muted);font-size:12px;text-align:center}
#nl-badge-frame{bottom:calc(70px + env(safe-area-inset-bottom))!important}
/* chuông */
.kring{position:fixed;inset:0;z-index:400;background:rgba(200,16,46,.92);display:grid;place-items:center;padding:20px;animation:krp 1s infinite}
@keyframes krp{0%,100%{background:rgba(200,16,46,.92)}50%{background:rgba(120,0,20,.95)}}
.kr-bx{background:#fff;border-radius:20px;padding:22px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.kr-bx b{display:block;font-size:19px;margin:6px 0}.kr-bx p{margin:0 0 14px;color:var(--ink2)}
.kr-ic{font-size:54px;animation:krs .5s infinite alternate}@keyframes krs{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
/* điện thoại: chống iOS phóng to khi nhập, nút to dễ bấm */
@media(max-width:900px){.i,select.i,textarea.i,input,select,textarea{font-size:16px!important}.btn{min-height:46px}.btn.s{min-height:40px}}
.next{background:linear-gradient(120deg,var(--acc),#0b3b6b);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.next small{opacity:.85;display:block}.next b{display:block;font-size:18px;margin:4px 0 10px}.next .btn{background:#fff;color:var(--acc)}

/* ===== Hồ sơ xác thực (KYC) ===== */
.kst{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13.5px}
.kst b{display:block;font-size:15px}.kst.amber{background:#FFF7E8;border:1px solid #F3D9A8}.kst.green{background:#E5F4EC;border:1px solid #BFE3CF}.kst.red{background:#FDECEC;border:1px solid #F5C2C2}.kst.blue{background:var(--soft);border:1px solid transparent}
.kbar{height:8px;background:#EEE;border-radius:99px;overflow:hidden;margin:8px 0 2px}.kbar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.kg{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:14px 0 6px}
.ki{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F0EEEC}
.ki .c{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;font-size:14px}
.ki .c.ok{background:#E5F4EC;color:var(--green)}.ki .c.no{background:#FDECEC;color:var(--red)}
.ki .t{flex:1;min-width:0}.ki .t b{display:block;font-size:14px}.ki .t small{color:var(--muted);font-size:12px}

.kthumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.kthumbs img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
/* camera */
.kcam{position:fixed;inset:0;background:#000;z-index:300;display:flex;flex-direction:column;color:#fff}
.kcam-top{display:flex;align-items:center;gap:10px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}.kcam-top b{flex:1;font-size:15px}
.kcam-top button{background:#333;color:#fff;border:0;border-radius:999px;width:36px;height:36px;font-size:16px}
.kcam-v{flex:1;position:relative;overflow:hidden;display:grid;place-items:center}
.kcam-v video{width:100%;height:100%;object-fit:cover}.kcam-v video.mir{transform:scaleX(-1)}
.kcam-oval{position:absolute;width:64vmin;height:82vmin;max-width:340px;max-height:430px;border:3px dashed rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.kcam-oval.doc{border-radius:14px;width:86vmin;height:56vmin;max-width:520px;max-height:340px}
.kcam-msg{position:absolute;top:16px;left:12px;right:12px;text-align:center;font-size:19px;font-weight:800;text-shadow:0 2px 8px #000}
.kcam-cd{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:52px;font-weight:800;text-shadow:0 2px 10px #000}
.kcam-bot{padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;background:#111}
.kcam-bot .btn{min-width:150px}
.kcam-shots{display:flex;gap:6px;position:absolute;bottom:90px;left:10px}.kcam-shots img{width:48px;height:60px;object-fit:cover;border-radius:6px;border:2px solid #fff}
/* chữ ký */
.ksig{position:fixed;inset:0;background:#fff;z-index:300;display:flex;flex-direction:column}
.ksig .hd2{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line);font-weight:700}
.ksig .pad{flex:1;position:relative;margin:12px;border:2px dashed #C9C4BF;border-radius:14px;touch-action:none;background:#FFFEFB}
.ksig canvas{position:absolute;inset:0;width:100%;height:100%}
.ksig .ln{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1.5px solid #D5D0CA;pointer-events:none}
.ksig .ln span{position:absolute;left:0;top:6px;font-size:12px;color:#A39E98}
.ksig .ft{display:flex;gap:10px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.kdoc{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:#FBFAF9;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:46vh;overflow:auto}
.kchk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:13.5px}.kchk input{width:20px;height:20px;margin-top:2px;flex:none}
.khash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all;color:var(--muted)}
.nt{border-left:4px solid var(--acc)}.nt.unread{background:#F5F9FF}.nt.vp{border-left-color:var(--red)}
.locbar{background:#FFF7E8;border:1px solid #F3D9A8;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center}

:root{--acc:#C8102E;--soft:#FDECEC}
body{background:#F2F1EF}main{max-width:none;padding:10px}
.pos{display:grid;grid-template-columns:1fr 400px;gap:10px;height:calc(100vh - 70px)}@media(max-width:900px){.pos{grid-template-columns:1fr;height:auto}}
.pl{display:flex;flex-direction:column;min-height:0}.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start;padding:2px}

.ci{display:grid;grid-template-columns:1fr auto;gap:2px 8px;border-bottom:1px dashed var(--line);padding:8px 0}.ci b{font-size:13.5px}.ci .q{display:flex;gap:4px;align-items:center}.ci .q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:800}.ci .q input{width:52px;text-align:center;border:1px solid var(--line);border-radius:8px;height:30px}
.sum{padding:10px 12px;border-top:1px solid var(--line)}.sum .r{display:flex;justify-content:space-between;font-size:14px;margin:3px 0}.sum .t{font-size:22px;font-weight:800;color:var(--acc)}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.top .i{min-height:42px}.pill{font-size:11px}
.rc{font-family:monospace;font-size:12.5px;width:280px;margin:0 auto;color:#000}.rc h4{text-align:center;margin:4px 0}.rc table{width:100%;border-collapse:collapse}.rc td{padding:2px 0;vertical-align:top}.rc .n{text-align:right}

<header><div class="hd"><svg viewBox="0 0 120 120" width="36" height="36" style="flex:none"><rect width="120" height="120" rx="20" fill="#C8102E"/><path d="M34 46 L38 22 L50 35 L60 16 L70 35 L82 22 L86 46 Z" fill="#fff"/><text x="60" y="92" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="34" fill="#fff">KHG</text></svg>
 <div class="nm"><b>Bán tại quầy</b><span id="hInfo">Kim Hoàng Gia</span></div><div class="sp"></div><button class="hb hidden" id="hRet">↩ Trả hàng</button><button class="hb hidden" id="hClose">Đóng ca</button><button class="hb hidden" id="hOut">Thoát</button></div></header>

<script>
const SUPABASE_URL='https://kbpcmifwplbtggfcnfrx.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_buS_4Iky59zQlMME9dn2NQ_1FqIwlVt';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>(Number(n)||0).toLocaleString('vi-VN');
const fmtM=n=>fmtN(Math.round(Number(n)||0))+' đ';
const fmtD=d=>d?new Date(String(d).length<=10?d+'T00:00:00':d).toLocaleDateString('vi-VN'):'';
const fmtDT=d=>d?new Date(d).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'';
const isoD=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return x.toISOString().slice(0,10)};
const today=()=>isoD(new Date());
const normPhone=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('84'))d='0'+d.slice(2);return d};

function sheet(html){closeSheet();const d=document.createElement('div');d.className='sheet';d.id='sheet';d.innerHTML=`<div class="bx">${html}</div>`;d.onclick=e=>{if(e.target===d)closeSheet()};document.body.appendChild(d);return d}
const closeSheet=()=>$('#sheet')?.remove();
const pill=(map,v,colors)=>v?`<span class="pill ${(colors||{})[v]||''}">${esc((map||{})[v]||v)}</span>`:'';
const chips=(name,opts,sel=[])=>`<div class="chips">${Object.entries(opts).map(([k,l])=>`<label><input type="checkbox" name="${name}" value="${esc(k)}" ${sel.includes(k)?'checked':''}><span>${esc(l)}</span></label>`).join('')}</div>`;

async function shrink(file,max=1600){
  if(!/^image\//.test(file.type)||/gif|svg/.test(file.type))return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file}catch(e){return file}}
const safeName=n=>String(n||'file').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w.-]+/g,'-').slice(-60);
async function putFile(prefix,file){const f=await shrink(file);const path=`${prefix}/${Date.now()}-${safeName(f.name)}`;
  const {error}=await sb.storage.from('khg-files').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(error)throw new Error(error.message);return {path,name:f.name,mime:f.type,size:f.size}}
async function signedMap(paths){if(!paths.length)return {};const {data}=await sb.storage.from('khg-files').createSignedUrls(paths,3600);const m={};(data||[]).forEach(x=>{if(x.signedUrl)m[x.path]=x.signedUrl});return m}
async function fileGrid(files){const u=await signedMap(files.map(f=>f.file_path));return `<div class="files">${files.map(f=>{const url=u[f.file_path]||'#';return `<a href="${url}" target="_blank" rel="noopener">${/^image/.test(f.mime||'')||/\.(jpe?g|png|webp)$/i.test(f.file_path)?`<img src="${url}" alt="" loading="lazy">`:`<div class="x">${esc((f.file_path.split('.').pop()||'').toUpperCase())}</div>`}<span>${esc(DOCT[f.doc_type]||f.doc_type)}</span></a>`}).join('')}</div>`}

// ================= Chuông báo lớn, kêu lặp + rung + thông báo hệ thống =================
const KRing=(()=>{let ac=null,timer=null,el=null,cnt=0;
  const unlock=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}};
  ['touchstart','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
  const beep=()=>{if(!ac)return;try{const t=ac.currentTime;[[988,0],[740,.2],[988,.4],[740,.6],[1175,.8]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.7,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.18);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.19)})}catch(e){}};
  function stop(){clearInterval(timer);timer=null;if(el){el.remove();el=null}try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
  function start(title,body,onOpen){stop();unlock();el=document.createElement('div');el.className='kring';
    el.innerHTML=`<div class="kr-bx"><div class="kr-ic">🔔</div><b>${esc(title||'Có thông báo mới')}</b><p>${esc(body||'')}</p><button class="btn p w" data-o>Xem ngay</button><button class="btn g w" data-x style="margin-top:8px">Tắt chuông</button></div>`;
    document.body.appendChild(el);el.querySelector('[data-o]').onclick=()=>{stop();onOpen&&onOpen()};el.querySelector('[data-x]').onclick=stop;
    cnt=0;beep();try{navigator.vibrate&&navigator.vibrate([500,200,500,200,900])}catch(e){}
    timer=setInterval(()=>{beep();cnt++;if(cnt%2===0)try{navigator.vibrate&&navigator.vibrate([500,200,500])}catch(e){}if(cnt>80)stop()},1500);
    try{if('Notification' in window&&Notification.permission==='granted'&&document.visibilityState!=='visible'){const o={body:body||'',vibrate:[500,200,500],requireInteraction:true,tag:'khg-ring',renotify:true};
      (navigator.serviceWorker&&navigator.serviceWorker.getRegistration?navigator.serviceWorker.getRegistration():Promise.resolve(null)).then(r=>r?r.showNotification(title,o):new Notification(title,o)).catch(()=>{})}}catch(e){}}
  function askNotif(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
  // theo dõi tín hiệu mới (khg_ping) và rung chuông khi có thay đổi
  function watch(onOpen,onCount,ms=20000){let last=null;const key='kring_k_'+location.pathname;try{const v=localStorage.getItem(key);last=v?Number(v):null}catch(e){}
    const tick=async()=>{try{const {data:p}=await sb.rpc('khg_ping');if(!p)return;onCount&&onCount(p.n||0);
      if(last!==null&&Number(p.k)>last)start(p.msg||'Có thông báo mới',p.n?('Bạn có '+p.n+' mục cần xem'):'',onOpen);
      last=Number(p.k);try{localStorage.setItem(key,String(last))}catch(e){}}catch(e){}};
    tick();setInterval(tick,ms);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick()});
    document.addEventListener('pointerdown',function f(){askNotif();document.removeEventListener('pointerdown',f)},{once:true})}
  return {start,stop,watch,askNotif,unlock}})();

const getPos=(ms=8000)=>new Promise(r=>{if(!navigator.geolocation)return r(null);let done=false;const t=setTimeout(()=>{if(!done){done=true;r(null)}},ms);

const camErr='Không mở được camera. Hãy mở bằng Chrome (Android) hoặc Safari (iPhone), cho phép quyền Camera rồi thử lại. Không mở trong Zalo/Facebook.';

function camSession({facing='user',title='',oval='face'}){
  return new Promise(async(res,rej)=>{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return rej(new Error(camErr));
    let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:960}},audio:false})}catch(e){return rej(new Error(camErr))}
    const d=document.createElement('div');d.className='kcam';
    d.innerHTML=`<div class="kcam-top"><b>${esc(title)}</b><button class="kx" aria-label="Đóng">✕</button></div><div class="kcam-v"><video playsinline autoplay muted class="${facing==='user'?'mir':''}"></video><div class="kcam-oval ${oval==='doc'?'doc':''}"></div><div class="kcam-msg"></div><div class="kcam-cd"></div><div class="kcam-shots"></div></div><div class="kcam-bot"></div>`;
    document.body.appendChild(d);const video=d.querySelector('video');video.srcObject=stream;
    const close=()=>{stream.getTracks().forEach(t=>t.stop());d.remove()};
    d.querySelector('.kx').onclick=()=>{close();d._cancel&&d._cancel()};
    await new Promise(r=>{video.onloadedmetadata=()=>r();setTimeout(r,2500)});try{await video.play()}catch(e){}
    res({d,video,close,mirror:facing==='user',msg:t=>d.querySelector('.kcam-msg').textContent=t,cd:t=>d.querySelector('.kcam-cd').textContent=t,bot:h=>{d.querySelector('.kcam-bot').innerHTML=h;return d.querySelector('.kcam-bot')}});
  });
}
function grab(S,label){const v=S.video,w=v.videoWidth||640,h=v.videoHeight||480,k=Math.min(1,1280/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  const g=c.getContext('2d');if(S.mirror){g.translate(c.width,0);g.scale(-1,1)}g.drawImage(v,0,0,c.width,c.height);g.setTransform(1,0,0,1,0,0);
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,c.height-30,c.width,30);g.fillStyle='#fff';g.font='15px sans-serif';g.fillText('KHG · '+(label||'')+' · '+new Date().toLocaleString('vi-VN'),10,c.height-10);
  return new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.86))}

  const g=c.getContext('2d');let drawing=false,last=null,len=0,minX=1e9,minY=1e9,maxX=0,maxY=0;
  const pt=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]};
  c.onpointerdown=e=>{drawing=true;last=pt(e);c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!drawing)return;const p=pt(e);g.strokeStyle='#0B2A6B';g.lineWidth=2.6*dpr;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();
    len+=Math.hypot(p[0]-last[0],p[1]-last[1]);minX=Math.min(minX,p[0]);minY=Math.min(minY,p[1]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1]);last=p};
  c.onpointerup=c.onpointercancel=()=>{drawing=false};
  d.querySelector('[data-c]').onclick=()=>{fit();len=0;minX=minY=1e9;maxX=maxY=0};
  d.querySelector('[data-x]').onclick=()=>{d.remove();res(null)};
  d.querySelector('[data-ok]').onclick=()=>{if(len<120*dpr)return toast('Chữ ký quá ngắn – ký rõ họ tên hoặc chữ ký thường dùng');
    const pd=16*dpr,x=Math.max(0,minX-pd),y=Math.max(0,minY-pd),w=Math.min(c.width,maxX+pd)-x,h=Math.min(c.height,maxY+pd)-y;const o=document.createElement('canvas');o.width=w;o.height=h+26*dpr;
    const og=o.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,o.width,o.height);og.drawImage(c,x,y,w,h,0,0,w,h);og.fillStyle='#555';og.font=(11*dpr)+'px sans-serif';og.fillText((name||'')+' · '+new Date().toLocaleString('vi-VN'),6*dpr,h+18*dpr);
    o.toBlob(b=>{d.remove();res(b)},'image/png')};
})}

  <button class="btn p w" id="oGo" style="margin-top:12px">Mở ca</button></div>`;
  $('#oGo').onclick=()=>busy($('#oGo'),async()=>{SH=await rpc('khg_pos_open',{p:{warehouse_id:$('#oW').value,opening_cash:Number($('#oC').value.replace(/\D/g,''))||0}});await loadCat();sell()})}
async function loadCat(){CAT=await rpc('khg_pos_catalog',{p_wh:SH.warehouse_id,p_list:LIST});$('#hInfo').textContent=`Ca ${SH.code} · ${WH.find(w=>w.id===SH.warehouse_id)?.name||''} · ${ACC.full_name}`;['hRet','hClose'].forEach(i=>$('#'+i).classList.remove('hidden'))}
const priceOf=(p,q)=>{let v=Number(p.price)||0;(p.tiers||[]).forEach(t=>{if(q>=Number(t.q)&&!t.lot)v=Number(t.p)});return v};
function sell(){
  $('#main').innerHTML=`<div class="pos"><div class="pl"><div class="top"><input class="i" id="sQ" placeholder="🔎 Tìm tên, mã hàng hoặc quét mã vạch rồi Enter" style="flex:1;min-width:220px" autofocus>
     <select class="i" id="sL" style="max-width:240px">${PL.map(l=>`<option value="${l.id}" ${l.id===LIST?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="grid" id="sG"></div></div>
   <div class="cart"><div style="padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center"><b style="flex:1">Khách: <span id="cN">${esc(CUS?.name||'Khách lẻ')}</span></b><button class="btn g s" id="cPick">Chọn khách</button></div>
    <div class="cl" id="cL"></div><div class="sum" id="cS"></div><div style="padding:0 12px 12px;display:flex;gap:8px"><button class="btn g" id="cClr">Xóa</button><button class="btn p" style="flex:1;font-size:17px" id="cPay">Thanh toán (F9)</button></div></div></div>`;
  const grid=()=>{const q=$('#sQ').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');const L=CAT.filter(p=>!q||(p.name+' '+p.sku+' '+(p.barcode||'')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(q)).slice(0,120);
    $('#sG').innerHTML=L.map(p=>`<div class="pd ${p.stock<=0?'out':''}" data-p="${p.id}"><b>${esc(p.name)}</b><small>${esc(p.sku)} · ${esc(p.unit||'')}</small><span class="pr">${fmtN(p.price)} đ</span><small>Tồn ${fmtN(p.stock)}</small></div>`).join('')||'<div class="empty">Không có hàng phù hợp.</div>';
    $$('#sG [data-p]').forEach(e=>e.onclick=()=>add(e.dataset.p))};
  $('#sQ').oninput=grid;$('#sQ').onkeydown=e=>{if(e.key==='Enter'){const v=$('#sQ').value.trim();const p=CAT.find(x=>x.barcode===v||x.sku===v);if(p){add(p.id);$('#sQ').value='';grid()}}};
  $('#sL').onchange=async()=>{LIST=$('#sL').value;await loadCat();CART.forEach(c=>{const p=CAT.find(x=>x.id===c.id);if(p){c.p=p;c.price=priceOf(p,c.qty)}});grid();draw()};
  $('#cPick').onclick=pickCus;$('#cClr').onclick=()=>{CART=[];CUS=null;sell()};$('#cPay').onclick=pay;
  document.onkeydown=e=>{if(e.key==='F9'){e.preventDefault();pay()}};grid();draw()}
function add(id){const p=CAT.find(x=>x.id===id);if(!p)return;const c=CART.find(x=>x.id===id);if(c){c.qty++;c.price=c.manual?c.price:priceOf(p,c.qty)}else CART.push({id,p,qty:1,price:priceOf(p,1),disc:0});draw()}
const tot=()=>{const sub=CART.reduce((s,c)=>s+c.qty*c.price,0),ld=CART.reduce((s,c)=>s+Number(c.disc||0),0);return {sub,ld,od:Number(window._od||0),total:sub-ld-Number(window._od||0)}};
function draw(){const L=$('#cL');if(!L)return;L.innerHTML=CART.map((c,i)=>`<div class="ci"><div><b>${esc(c.p.name)}</b><div class="note" style="margin:0">${fmtN(c.price)} đ × ${c.qty}${c.disc?` − ${fmtN(c.disc)}`:''}${c.qty>c.p.stock?' <span class="pill red">vượt tồn</span>':''}</div></div>
   <b>${fmtN(c.qty*c.price-c.disc)}</b><div class="q"><button data-m="${i}">−</button><input data-q="${i}" value="${c.qty}" inputmode="decimal"><button data-a="${i}">+</button></div><div style="text-align:right"><button class="btn g s" data-e="${i}">Giá/giảm</button> <button class="btn g s" data-x="${i}">✕</button></div></div>`).join('')||'<div class="empty">Chọn hàng ở bên trái hoặc quét mã vạch.</div>';
  const T=tot();$('#cS').innerHTML=`<div class="r"><span>Tiền hàng (${CART.reduce((s,c)=>s+c.qty,0)} sp)</span><span>${fmtN(T.sub)}</span></div>${T.ld?`<div class="r"><span>Giảm theo dòng</span><span>−${fmtN(T.ld)}</span></div>`:''}<div class="r"><span>Giảm trên hóa đơn <a href="#" id="cOd">sửa</a></span><span>−${fmtN(T.od)}</span></div><div class="r"><b>Khách cần trả</b><span class="t">${fmtN(T.total)} đ</span></div>`;
  $$('[data-m]').forEach(b=>b.onclick=()=>{const c=CART[b.dataset.m];c.qty=Math.max(1,c.qty-1);if(!c.manual)c.price=priceOf(c.p,c.qty);draw()});$$('[data-a]').forEach(b=>b.onclick=()=>{const c=CART[b.dataset.a];c.qty++;if(!c.manual)c.price=priceOf(c.p,c.qty);draw()});
  $$('[data-q]').forEach(i=>i.onchange=()=>{const c=CART[i.dataset.q];c.qty=Math.max(0.001,parseFloat(i.value.replace(',','.'))||1);if(!c.manual)c.price=priceOf(c.p,c.qty);draw()});$$('[data-x]').forEach(b=>b.onclick=()=>{CART.splice(b.dataset.x,1);draw()});
  $$('[data-e]').forEach(b=>b.onclick=()=>{const c=CART[b.dataset.e];sheet(`<h3>${esc(c.p.name)}</h3><label class="f">Đơn giá</label><input class="i" id="eP" value="${c.price}" inputmode="numeric"><label class="f">Giảm tiền trên dòng</label><input class="i" id="eD" value="${c.disc||0}" inputmode="numeric">
    ${c.p.min_price?`<p class="note">Giá sàn ${fmtN(c.p.min_price)} đ – bán thấp hơn cần quyền quản lý.</p>`:''}<button class="btn p w" id="eOk" style="margin-top:10px">Áp dụng</button>`);$('#eOk').onclick=()=>{c.price=Number($('#eP').value.replace(/\D/g,''))||0;c.disc=Number($('#eD').value.replace(/\D/g,''))||0;c.manual=true;closeSheet();draw()}});
  const od=$('#cOd');if(od)od.onclick=e=>{e.preventDefault();const v=prompt('Giảm trên hóa đơn (đ):',String(window._od||0));if(v!==null){window._od=Number(v.replace(/\D/g,''))||0;draw()}}}
async function pickCus(){sheet(`<h3>Chọn khách hàng</h3><input class="i" id="kQ" placeholder="Tìm tên, số điện thoại điểm bán"><div id="kL" class="list" style="max-height:50vh;overflow:auto;margin-top:8px"></div><button class="btn g w" id="kLe" style="margin-top:8px">Khách lẻ</button>`);
  const f=async()=>{const q=$('#kQ').value.trim();let qq=sb.from('khg_dms_outlets').select('id,code,name,phone,address,price_list_id,credit_limit').neq('code','KHACHLE').limit(30);if(q)qq=qq.or(`name.ilike.%${q}%,phone.ilike.%${q}%,code.ilike.%${q}%`);const {data}=await qq;
    $('#kL').innerHTML=(data||[]).map(c=>`<div class="it" data-k="${c.id}" style="cursor:pointer"><b>${esc(c.name)}</b> · ${esc(c.phone||'')}<br><small>${esc(c.address||'')}</small></div>`).join('')||'<div class="empty">Không tìm thấy.</div>';
    $$('#kL [data-k]').forEach(e=>e.onclick=async()=>{CUS=(data||[]).find(c=>c.id===e.dataset.k);if(CUS.price_list_id&&CUS.price_list_id!==LIST){LIST=CUS.price_list_id;await loadCat();CART.forEach(c=>{const p=CAT.find(x=>x.id===c.id);if(p&&!c.manual){c.p=p;c.price=priceOf(p,c.qty)}})}closeSheet();sell()})};
  let t;$('#kQ').oninput=()=>{clearTimeout(t);t=setTimeout(f,250)};$('#kLe').onclick=()=>{CUS=null;closeSheet();sell()};f()}
function pay(){if(!CART.length)return toast('Giỏ hàng trống');const T=tot();
  sheet(`<h3>Thanh toán · ${fmtN(T.total)} đ</h3><div class="row"><div><label class="f">Chuyển khoản</label><input class="i" id="pCk" inputmode="numeric" value="0"></div><div><label class="f">Quẹt thẻ</label><input class="i" id="pTh" inputmode="numeric" value="0"></div></div>
   ${CUS?`<label class="f">Ghi nợ (khách ${esc(CUS.name)})</label><input class="i" id="pCn" inputmode="numeric" value="0">`:''}
   <label class="f">Tiền mặt khách đưa</label><input class="i" id="pTk" inputmode="numeric" value="${T.total}" style="font-size:20px;font-weight:800"><div class="note" id="pChg"></div>
   <div class="chips" style="margin-top:6px">${[T.total,Math.ceil(T.total/50000)*50000,Math.ceil(T.total/100000)*100000,Math.ceil(T.total/500000)*500000].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<button class="btn g s" data-tk="${v}">${fmtN(v)}</button>`).join('')}</div>
   <label class="f">Ghi chú</label><input class="i" id="pNote"><div class="err hidden" id="pErr"></div><button class="btn p w" id="pGo" style="margin-top:12px;font-size:17px">Hoàn tất & in hóa đơn</button>`);
  const n=id=>Number(($('#'+id)?.value||'0').replace(/\D/g,''))||0;const chg=()=>{const due=T.total-n('pCk')-n('pTh')-n('pCn');$('#pChg').innerHTML=`Tiền mặt cần thu: <b>${fmtN(Math.max(0,due))} đ</b> · Tiền thối: <b>${fmtN(Math.max(0,n('pTk')-Math.max(0,due)))} đ</b>`};
  ['pCk','pTh','pCn','pTk'].forEach(id=>{const e=$('#'+id);if(e)e.oninput=chg});$$('[data-tk]').forEach(b=>b.onclick=()=>{$('#pTk').value=b.dataset.tk;chg()});chg();
  $('#pGo').onclick=()=>busy($('#pGo'),async()=>{const due=Math.max(0,T.total-n('pCk')-n('pTh')-n('pCn'));
    const {data,error}=await sb.rpc('khg_pos_sale',{p:{shift_id:SH.id,outlet_id:CUS?.id||'',customer_name:CUS?.name||'',price_list_id:LIST,order_discount:T.od,note:$('#pNote').value,
      lines:CART.map(c=>({product_id:c.id,qty:c.qty,price:c.price,discount:c.disc||0})),pay:{chuyen_khoan:n('pCk'),the:n('pTh'),cong_no:n('pCn'),tien_khach:Math.max(n('pTk'),due)}}});
    if(error){$('#pErr').textContent=error.message;$('#pErr').classList.remove('hidden');return}
    receipt(data,T);CART=[];CUS=null;window._od=0;closeSheet();await loadCat();sell();toast('Đã bán '+data.code+(data.change?` · thối ${fmtN(data.change)} đ`:''))})}
function receipt(r,T){const html=`<div class="rc"><h4>KIM HOÀNG GIA</h4><div style="text-align:center">${esc(WH.find(w=>w.id===SH.warehouse_id)?.name||'')}<br>HÓA ĐƠN BÁN HÀNG ${esc(r.code)}<br>${new Date().toLocaleString('vi-VN')}</div><hr>
  <table>${CART.map(c=>`<tr><td colspan="2">${esc(c.p.name)}</td></tr><tr><td>${c.qty} × ${fmtN(c.price)}${c.disc?' −'+fmtN(c.disc):''}</td><td class="n">${fmtN(c.qty*c.price-c.disc)}</td></tr>`).join('')}</table><hr>
  <table><tr><td>Tiền hàng</td><td class="n">${fmtN(T.sub)}</td></tr>${T.ld+T.od?`<tr><td>Giảm giá</td><td class="n">−${fmtN(T.ld+T.od)}</td></tr>`:''}<tr><td><b>TỔNG</b></td><td class="n"><b>${fmtN(r.total)}</b></td></tr><tr><td>Tiền mặt</td><td class="n">${fmtN(r.cash)}</td></tr>${r.transfer?`<tr><td>CK/thẻ</td><td class="n">${fmtN(r.transfer)}</td></tr>`:''}${r.debt?`<tr><td>Ghi nợ</td><td class="n">${fmtN(r.debt)}</td></tr>`:''}${r.change?`<tr><td>Tiền thối</td><td class="n">${fmtN(r.change)}</td></tr>`:''}<tr><td>Trong đó VAT</td><td class="n">${fmtN(r.vat)}</td></tr></table><hr>
  <div style="text-align:center">Cảm ơn quý khách!<br>Thu ngân: ${esc(ACC.full_name)}</div></div>`;const p=$('#prt');p.innerHTML=html;p.style.display='block';setTimeout(()=>{window.print();p.style.display='none'},200)}
$('#hRet').onclick=()=>{sheet(`<h3>Khách trả hàng</h3><label class="f">Mã hóa đơn</label><input class="i" id="rC" placeholder="VD: BL261031-0012"><button class="btn g w" id="rF" style="margin-top:8px">Tìm hóa đơn</button><div id="rL"></div>`);
  $('#rF').onclick=()=>busy($('#rF'),async()=>{const {data:o}=await sb.from('khg_dms_orders').select('id,code,total,status').eq('code',$('#rC').value.trim()).maybeSingle();if(!o)return toast('Không tìm thấy hóa đơn');const {data:L}=await sb.from('khg_dms_order_lines').select('product_id,qty,amount').eq('order_id',o.id).gt('qty',0);
    $('#rL').innerHTML=`<p class="note">${esc(o.code)} · ${fmtN(o.total)} đ</p>${(L||[]).map(l=>`<div class="row"><div>${esc(CAT.find(p=>p.id===l.product_id)?.name||l.product_id)} (đã mua ${l.qty})</div><div><input class="i" data-r="${l.product_id}" placeholder="SL trả" inputmode="decimal"></div></div>`).join('')}
     <label class="f">Hoàn tiền</label><select class="i" id="rM"><option value="tien_mat">Tiền mặt</option><option value="chuyen_khoan">Chuyển khoản</option><option value="cong_no">Trừ công nợ</option></select><input class="i" id="rN" placeholder="Lý do trả" style="margin-top:8px"><button class="btn p w" id="rGo" style="margin-top:10px">Nhận trả hàng</button>`;
    $('#rGo').onclick=()=>busy($('#rGo'),async()=>{const r=await rpc('khg_pos_return',{p:{shift_id:SH.id,order_id:o.id,refund_method:$('#rM').value,note:$('#rN').value,lines:$$('[data-r]').filter(i=>+i.value>0).map(i=>({product_id:i.dataset.r,qty:+i.value.replace(',','.')}))}});toast(`Đã nhận trả ${r.code} · hoàn ${fmtN(r.amount)} đ`);closeSheet();await loadCat();sell()})})};
$('#hClose').onclick=async()=>{const {data:s}=await sb.from('khg_pos_shifts').select('*').eq('id',SH.id).maybeSingle();const ex=Number(s.opening_cash)+Number(s.cash_total);
  sheet(`<h3>Đóng ca ${esc(s.code)}</h3><div class="list"><div class="it">Số hóa đơn: <b>${s.orders}</b> · Doanh thu: <b>${fmtN(s.sales_total)} đ</b></div><div class="it">Tiền mặt bán: ${fmtN(s.cash_total)} · CK/thẻ: ${fmtN(s.transfer_total)} · Ghi nợ: ${fmtN(s.debt_total)} · Trả hàng: ${fmtN(s.returns_total)}</div><div class="it">Tiền mặt phải có trong két: <b>${fmtN(ex)} đ</b> (gồm ${fmtN(s.opening_cash)} đầu ca)</div></div>
   <label class="f">Tiền mặt kiểm đếm thực tế</label><input class="i" id="zC" inputmode="numeric" value="${ex}"><label class="f">Ghi chú</label><input class="i" id="zN"><button class="btn p w" id="zGo" style="margin-top:10px">Đóng ca</button>`);
  $('#zGo').onclick=()=>busy($('#zGo'),async()=>{const r=await rpc('khg_pos_close',{p:{shift_id:SH.id,counted_cash:Number($('#zC').value.replace(/\D/g,''))||0,note:$('#zN').value}});closeSheet();toast('Đã đóng ca · chênh lệch '+fmtN(r.diff)+' đ');SH=null;CART=[];boot()})};
$('#hOut').onclick=async()=>{await sb.auth.signOut();location.reload()};
boot();
</script></body></html>
